# === STOW-PRO-019 ===
  - id: STOW-PRO-019
    ordinal: '19'
    record_class: primary
    category: prose-integrity
    title: No fabricated attributions
    wording:
      baseline_kind: verbatim
      baseline_text: "**No fabricated attributions.** Never claim a person, organization, or company said something unless it is real and verifiable. Writing \"Senator X stated...\" or \"the company argued...\" without a real source is a fabrication and a defamation risk. Every attributed quote or position must trace to a real document, transcript, public statement, or report. Do not assume what someone's position is based on their party, role, or reputation."
