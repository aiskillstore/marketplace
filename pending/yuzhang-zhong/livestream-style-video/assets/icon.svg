<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Livestream Style Video Skill icon</title>
  <desc id="desc">A 9:16 livestream viewfinder frame with a glowing red LIVE pill, autofocus brackets, a studio streamer silhouette with headphones and boom mic, a corner PiP facecam box, and floating chat and heart pills.</desc>
  <defs>
    <linearGradient id="bg" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D16"/>
      <stop offset="0.52" stop-color="#131C2E"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="rim" x1="80" y1="56" x2="432" y2="456" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EF4444"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="phoneScreen" x1="126" y1="64" x2="354" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="liveRed" x1="146" y1="86" x2="226" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB7185"/>
      <stop offset="1" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="hostHoodie" x1="184" y1="258" x2="316" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="pipBg" x1="300" y1="106" x2="418" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#312E81"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="48" y="36" width="416" height="448" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="94" stroke="url(#rim)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- 9:16 Livestream Viewport -->
  <g filter="url(#shadow)">
    <rect x="108" y="54" width="268" height="404" rx="34" fill="url(#phoneScreen)" stroke="#475569" stroke-width="4"/>

    <!-- Neon Studio RGB Wall Strips -->
    <path d="M134 156L134 320" stroke="#F43F5E" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
    <path d="M350 176L350 332" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.75"/>

    <!-- LIVE Badge + Viewer Counter -->
    <rect x="130" y="78" width="76" height="30" rx="15" fill="url(#liveRed)"/>
    <circle cx="147" cy="93" r="5" fill="#FFFFFF"/>
    <text x="158" y="99" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="800">LIVE</text>
    <rect x="214" y="78" width="68" height="30" rx="15" fill="#0F172A" fill-opacity="0.78" stroke="#334155" stroke-width="1.5"/>
    <text x="228" y="98" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700">24.8K</text>

    <!-- Autofocus Viewfinder Corners -->
    <path d="M174 152H160V166" stroke="#FACC15" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M310 152H324V166" stroke="#FACC15" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M174 282H160V268" stroke="#FACC15" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M310 282H324V268" stroke="#FACC15" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Streamer Host with Headset & Ring-Light Catchlights -->
    <path d="M192 214C192 178 214 158 242 158C270 158 292 178 292 214" stroke="#A855F7" stroke-width="12" stroke-linecap="round"/>
    <rect x="180" y="202" width="18" height="34" rx="9" fill="#C084FC"/>
    <rect x="286" y="202" width="18" height="34" rx="9" fill="#C084FC"/>
    <rect x="200" y="172" width="84" height="84" rx="28" fill="#FDE68A" stroke="#FEF3C7" stroke-width="3"/>
    <!-- Ring-light eye catchlights -->
    <circle cx="226" cy="210" r="8" fill="#0F172A"/>
    <circle cx="258" cy="210" r="8" fill="#0F172A"/>
    <circle cx="226" cy="210" r="4.2" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="258" cy="210" r="4.2" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M228 233C236 242 248 242 256 233" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>

    <!-- Torso + Condenser Boom Mic -->
    <rect x="180" y="264" width="124" height="106" rx="22" fill="url(#hostHoodie)" stroke="#BAE6FD" stroke-width="3"/>
    <path d="M128 344L198 294" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <rect x="190" y="272" width="28" height="42" rx="14" fill="#334155" stroke="#CBD5E1" stroke-width="2.5"/>

    <!-- Clean Post-HUD Chat Pills (Bottom-Left) -->
    <rect x="128" y="362" width="142" height="24" rx="12" fill="#0F172A" fill-opacity="0.84" stroke="#334155"/>
    <circle cx="142" cy="374" r="5" fill="#38BDF8"/>
    <rect x="154" y="370" width="96" height="8" rx="4" fill="#E2E8F0"/>

    <rect x="128" y="394" width="166" height="24" rx="12" fill="#0F172A" fill-opacity="0.84" stroke="#334155"/>
    <circle cx="142" cy="406" r="5" fill="#F43F5E"/>
    <rect x="154" y="402" width="120" height="8" rx="4" fill="#F8FAFC"/>

    <!-- Floating Heart Particles (Right Column) -->
    <circle cx="340" cy="398" r="15" fill="#F43F5E"/>
    <path d="M340 405C340 405 331 399 331 394C331 391.5 333 390 335.5 390C337.5 390 339 391 340 392.5C341 391 342.5 390 344.5 390C347 390 349 391.5 349 394C349 399 340 405 340 405Z" fill="#FFFFFF"/>
  </g>

  <!-- Detached Roblox / Multi-Style PiP Corner Card -->
  <g filter="url(#shadow)">
    <rect x="304" y="106" width="124" height="142" rx="20" fill="url(#pipBg)" stroke="#38BDF8" stroke-width="3.5"/>
    <!-- Blocky R6 Mini Streamer inside PiP -->
    <rect x="344" y="132" width="44" height="40" rx="12" fill="#FACC15" stroke="#FEF9C3" stroke-width="2"/>
    <circle cx="358" cy="150" r="3" fill="#0F172A"/>
    <circle cx="374" cy="150" r="3" fill="#0F172A"/>
    <path d="M357 160H375" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
    <rect x="334" y="176" width="64" height="44" rx="6" fill="#0EA5E9"/>
    <polygon points="366,186 377,206 355,206" fill="#F8FAFC"/>
    <rect x="316" y="224" width="100" height="14" rx="7" fill="#020617" fill-opacity="0.75"/>
    <text x="334" y="234" fill="#7DD3FC" font-family="Consolas, monospace" font-size="9.5" font-weight="700">PiP · R6 CAM</text>
  </g>
</svg>
