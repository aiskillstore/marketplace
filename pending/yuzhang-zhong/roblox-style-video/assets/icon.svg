<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Roblox Style Video Skill icon</title>
  <desc id="desc">A blocky R6-style avatar with a 1:1 barrel-beveled yellow head, 2x2x1 blue torso with a white geometric triangle emblem, flush 1x2x1 solid rectangular arms and green legs, overhead chat bubble, and play badge.</desc>
  <defs>
    <linearGradient id="bg" x1="56" y1="40" x2="456" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.52" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="glow" x1="96" y1="72" x2="416" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F43F5E"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="headYellow" x1="196" y1="110" x2="316" y2="218" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FEF08A"/>
      <stop offset="0.3" stop-color="#F5CD30"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="torsoBlue" x1="168" y1="220" x2="344" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00AAE4"/>
      <stop offset="1" stop-color="#0D69AC"/>
    </linearGradient>
    <linearGradient id="armYellow" x1="92" y1="220" x2="164" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE047"/>
      <stop offset="1" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="legGreen" x1="168" y1="382" x2="344" y2="456" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A4BD47"/>
      <stop offset="1" stop-color="#65A30D"/>
    </linearGradient>
    <linearGradient id="badgeRed" x1="332" y1="322" x2="452" y2="442" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB7185"/>
      <stop offset="1" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="drop" x="60" y="48" width="400" height="420" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020617" flood-opacity="0.48"/>
    </filter>
  </defs>

  <!-- Outer rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="94" stroke="url(#glow)" stroke-width="4" stroke-opacity="0.55"/>

  <!-- Smooth Studio Stage Horizon Line (Zero Raised Studs) -->
  <path d="M64 442H448" stroke="#475569" stroke-width="3" opacity="0.45"/>

  <!-- Canonical Roblox R6 Avatar (2x2x1 Torso + Flush 1x2x1 Solid Block Limbs + 1:1 Barrel Head) -->
  <g filter="url(#drop)">
    <!-- Flush 1x2x1 Left & Right Legs (matching exact 2x2x1 torso width = 168..344) -->
    <rect x="168" y="378" width="86" height="72" rx="7" fill="url(#legGreen)" stroke="#BEF264" stroke-width="2.5"/>
    <rect x="258" y="378" width="86" height="72" rx="7" fill="url(#legGreen)" stroke="#BEF264" stroke-width="2.5"/>

    <!-- Flush 1x2x1 Left Arm (solid rectangular block raised at shoulder Motor6D hinge) -->
    <rect x="86" y="212" width="76" height="160" rx="8" transform="rotate(-12 162 224)" fill="url(#armYellow)" stroke="#FEF08A" stroke-width="3"/>
    <!-- Flush 1x2x1 Right Arm (solid rectangular block with Red Speed Coil rings) -->
    <g transform="rotate(6 350 224)">
      <rect x="348" y="220" width="76" height="160" rx="8" fill="url(#armYellow)" stroke="#FEF08A" stroke-width="3"/>
      <rect x="342" y="264" width="88" height="14" rx="7" fill="#F43F5E" stroke="#FFE4E6" stroke-width="2"/>
      <rect x="342" y="294" width="88" height="14" rx="7" fill="#F43F5E" stroke="#FFE4E6" stroke-width="2"/>
      <rect x="342" y="324" width="88" height="14" rx="7" fill="#F43F5E" stroke="#FFE4E6" stroke-width="2"/>
    </g>

    <!-- Canonical 2x2x1 Torso Block -->
    <rect x="168" y="220" width="176" height="160" rx="10" fill="url(#torsoBlue)" stroke="#7DD3FC" stroke-width="3.5"/>
    <path d="M184 234H328" stroke="#E0F2FE" stroke-width="5" stroke-linecap="round" opacity="0.65"/>

    <!-- Original Trademark-Free Geometric Triangle Emblem on Chest -->
    <polygon points="256,266 290,326 222,326" fill="#F8FAFC" stroke="#BAE6FD" stroke-width="3" stroke-linejoin="round"/>

    <!-- Canonical 1:1 Barrel-Beveled Cylindrical Head (1.2x1.2x1.2 studs) -->
    <rect x="196" y="108" width="120" height="108" rx="34" fill="url(#headYellow)" stroke="#FEF9C3" stroke-width="3.5"/>
    <path d="M224 122H288" stroke="#FFFBEB" stroke-width="7" stroke-linecap="round" opacity="0.85"/>

    <!-- Classic Roblox 2D Default Smile Decal -->
    <ellipse cx="236" cy="156" rx="7" ry="10" fill="#0F172A"/>
    <ellipse cx="276" cy="156" rx="7" ry="10" fill="#0F172A"/>
    <circle cx="234" cy="152" r="2.5" fill="#FFFFFF"/>
    <circle cx="274" cy="152" r="2.5" fill="#FFFFFF"/>
    <path d="M232 180C242 194 270 194 280 180" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>

    <!-- Classic Roblox Overhead BillboardGui Chat Bubble -->
    <rect x="284" y="42" width="144" height="46" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <path d="M332 86L344 102L356 86H332Z" fill="#FFFFFF"/>
    <text x="318" y="72" fill="#0F172A" font-family="Segoe UI, Inter, sans-serif" font-size="22" font-weight="800">oof!</text>
  </g>

  <!-- Video Play Badge -->
  <g filter="url(#drop)">
    <circle cx="394" cy="388" r="56" fill="url(#badgeRed)" stroke="#FFE4E6" stroke-width="5"/>
    <path d="M380 364L420 388L380 412V364Z" fill="#FFFFFF"/>
  </g>
</svg>
