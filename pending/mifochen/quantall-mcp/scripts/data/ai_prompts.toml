new_layer_from_code = """
【触发场景】创建图层 / 画图 / 绘制 / 画出 / 生成图层 / 标记买点 / 标记卖点 / 标记事件

【功能说明】在活动画布上新建图层，本质是标记一批 (股票, 关键日期) 的**散点**。软件端对每个散点往后绘制 N 天行情（默认 5 天，GUI 可调），但那是给用户看的视觉呈现——AI 分析的是散点截面数据。

【双视角关键理解】
- AI 视角：每个 True = 一个离散的 (股票, 日期) 散点。散点本身只定位到标记日，但 move/weight/select 代码中可用 .shift() 将标记日前后任意天的数据拉到散点上计算。
- 用户视角：GUI 端以标记日为起点自动绘制 N 天 K 线，方便直观观察形态。绘制模式只影响视觉呈现。

【Shift 机制】AI 分析散点的核心能力
  .shift(N)  → 取标记日**之前**第 N 天数据（如标记前估值水位、量能累积）
  .shift(-N) → 取标记日**之后**第 N 天数据（如未来收益、最大回撤）
示例：weight_by_code(code="adj_close.shift(-5)/adj_close - 1") → 以"标记后第5天收益"为权重

【图层机制】单图层，新替旧
软件只维护一个活动图层：new_layer_from_code / strategy_backtest / factor_analysis(scatter) 都会创建图层，新图层替换旧图层。
设计意图："聚焦"——换条件 = 焦点转移，旧图层不再需要。不要同时维护多个图层。

【默认状态】无平移 + 无权重（数量等权）

【完整分析管道】
new_layer_from_code（标记散点）
→ move_by_code(x)（X轴映射）→ move_by_code(y)（Y轴映射）
→ weight_by_code（可选：调整权重）→ select_by_code（可选：筛选子集，支持集合运算）
→ heat_map（获取二维统计矩阵）

【三大场景模板】
1. 买点分析：标记买入信号 → Y轴=未来收益
2. 卖点分析：标记卖出信号 → Y轴=未来收益
3. 因子视觉化：标记全日期 → X=因子, Y=未来收益 → 替代/补充 factor_analysis

【输出规则】out = 布尔DataFrame，True位置绘制短线并标记为后续分析的数据点
【关键规则】new_layer_from_code 之后必须跟上后续分析（move/weight/select/heat_map），单独的图层没有意义
