factor_analysis = """
【触发场景】因子分析、评估因子、因子有效性、IC分析、因子IC

【功能说明】
评估因子与未来收益的关系。每个时间截面上，将因子值和未来收益分别转为截面排名百分位（0~1），再计算Spearman秩相关系数作为IC。

【三种模式】

| mode | 返回内容 | 软件端绘图 | 后续分析 | 用在哪 |
|------|---------|-----------|----------|--------|
| summary | 聚合统计（IC均值/IR/正占比/多空差） | 散点图：X=收益排序，Y=因子排序 | ✅ move+heat_map+select | 第一步，判断有没有效 |
| daily | 每日IC序列 + 前/后10%IC | 三条时序曲线（蓝/红/绿） | ❌ 只读 | 看稳定性，看时段特征 |
| scatter | 同summary统计 | 时序散点（每天独立排列） | ✅ 时间维度分析 | 看因子随时间演变 |

关键区别：
- summary=全局截面（所有日期混一起），scatter=时序截面（每天独立）
- daily=纯时序曲线，只看IC波动，不能做后续操作

标准流程：summary（判断有效）→ daily（看稳定性）→ scatter（看演变）→ move+heat_map（交叉验证）

参数：
- feature_days：评估未来第N天的收益，默认1。长周期（20d）通常比短周期IC更强

⚠️【关键排名规则（必须遵守！）】
- 单因子：工具内部已自动做排名转换，代码中直接输出原始值即可：
  out = d['换手率']          ← 正确，不要加 row_rank
  out = row_rank(d['换手率'])  ← 错误！工具会重复排名
- 复合因子：多个子因子必须各自 row_rank 排名后再加权组合（确保量纲一致）：
  f1 = row_rank(d['因子A'])
  f2 = row_rank(1 - d['因子B'])   ← 反向因子用 1-rank
  out = 0.5 * f1 + 0.5 * f2      ← 排名后再加权

⚠️【每股因子必须除以股价（实测验证！）】
每股类因子（EPS/BPS/每股资本公积/每股未分配利润等）是绝对值，受股价规模影响极大。
必须除以 d['close']（非复权价）转换为比率，否则 IC 被价格规模噪声淹没：
  out = d['每股收益'] / d['close']           ← 正确！E/P（盈利收益率）
  out = d['每股净资产'] / d['close']          ← 正确！B/P（账面市值比）
  out = d['每股资本公积'] / d['close']         ← 正确！IR 从 0.05→0.59（实测最强因子）
  out = d['每股收益']                         ← 错误！IR≈0，绝对值无预测力
- 比率类/增长率类因子（换手率、ROE、营收增速等）不需要除以 close
- 规则：因子值是"每股X元"这种绝对值 → 除以 close → 变成"每元股价含X元"的比率

【核心函数】
row_rank(df) — 按行截面排名，返回百分位值（0~1）
用于构建复合因子：多个子因子各自排名后按比例加权组合。
单因子无需调用，工具外部会自动排名。

【实战代码模板】

# 单因子（最简单）
out = d['换手率']

# 动量因子
adj_close = d['close'] * d['adj_factor']
out = adj_close.pct_change(20)

# 复合因子：低换手 + 小市值
t = row_rank(d['换手率'])
s = row_rank(d['总市值'])
out = (1 - t) + (1 - s)

# 复合因子：动量 + 小市值（加权）
adj_close = d['close'] * d['adj_factor']
m = row_rank(adj_close.pct_change(20))
s = row_rank(d['总市值'])
out = 0.6 * m + 0.4 * (1 - s)

【返回字段】
- IC均值/IC标准差/IC_IR：全样本IC统计，IC_IR=均值/标准差。|IR|>0.3 视为有效
- IC正占比：IC为正的天数占比，偏离50%越多方向越稳定
- 多空排名差：因子值最高组与最低组的收益排名差，越大区分度越好
- 前10%平均排名/后10%平均排名：因子极端分组在收益排名上的表现（0.5为平均）
- 前10%IC/后10%IC：仅保留极端10%因子值后计算的IC，评估尾部信号集中度
- 极端IC差：前10%IC与后10%IC之差

【daily 模式返回格式】
每日IC信息字段返回三列TSV：每日IC  每日前10%IC  每日后10%IC
- 每日IC：当天的 Rank IC
- 前/后10%IC：仅保留极端10%因子值的IC
- 最后 feature_days 行全为NaN（无足够未来数据）

【输出规则】
out = 数值 DataFrame，作为因子值输入。
"""

batch_factor_analysis = """
【触发场景】批量因子分析、同时分析多个因子、批量评估因子有效性、批量IC分析、把多个因子都分析一下、逐个分析这些因子

【功能说明】
factor_analysis 的批量版本。一次传入多个因子（factor_dict: 因子名称→因子代码），逐个计算IC，每完成一个因子立即报告该因子的IC指标（增量流式），全部完成后输出汇总对比表。

与 factor_analysis 的区别：
- factor_analysis：单因子，每次传一个 name+code
- batch_factor_analysis：多因子，一次传 factor_dict（name→code 字典），自动逐个分析并逐个报告

【参数说明】
- feature_days：未来多少天后的收益，≥1，默认1。对所有因子统一生效
- factor_dict：因子名称→因子代码 的字典。key 为因子名称（用于报告标识），value 为因子代码（Python exec 表达式）
  示例：{"换手率": "out = d['换手率']", "动量20日": "out = adj_close.pct_change(20)", "低换手+小市值": "t=row_rank(d['换手率']);s=row_rank(d['总市值']);out=(1-t)+(1-s)"}

【返回机制】
引擎逐个因子计算，GUI端可看到中间进度（1/3、2/3等），但 AI 层只收到最终完整结果——一个 list，包含所有因子的结果字典。

⚠️ AI 行为要求：
- 收到完整结果后，逐个向用户报告每个因子的有效性结论（不要只报综合结论）
- 重点标注有效因子（|IR|>0.3）和无效因子
- 全部报告完毕后，给出综合对比结论

【Python exec 环境】（与 factor_analysis 完全一致）
- 默认字段：close, open, high, low, vol, amount, adj_factor
- 复权价格：adj_close = d['close'] * d['adj_factor']
- 内置：np, pd；禁止：import / 循环 / apply / lambda / 递归 / axis=1

⚠️【关键排名规则（与 factor_analysis 一致）】
- 单因子：工具内部已自动做排名转换，代码中直接输出原始值即可：
  out = d['换手率']          ← 正确
  out = row_rank(d['换手率'])  ← 错误！重复排名
- 复合因子：多个子因子必须各自 row_rank 排名后再加权组合：
  f1 = row_rank(d['因子A'])
  f2 = row_rank(1 - d['因子B'])
  out = 0.5 * f1 + 0.5 * f2

⚠️【每股因子必须除以股价（实测验证！）】
每股类因子（EPS/BPS/每股资本公积/每股未分配利润等）是绝对值，必须除以 d['close']（非复权价）：
  "每股收益": "out = d['每股收益'] / d['close']"        ← 正确
  "每股资本公积": "out = d['每股资本公积'] / d['close']" ← 正确（IR=0.59最强）
  "每股收益": "out = d['每股收益']"                      ← 错误（IR≈0）
比率类/增长率类因子不需要除以 close。

【代码模板（factor_dict 值的写法）】

# 单因子（最简单）
"换手率": "out = d['换手率']"
"市盈率": "out = d['市盈率TTM']"
"总市值": "out = d['总市值']"

# 动量因子
"动量20日": "adj_close = d['close'] * d['adj_factor']; out = adj_close.pct_change(20)"

# 复合因子
"低换手+小市值": "t=row_rank(d['换手率']);s=row_rank(d['总市值']);out=(1-t)+(1-s)"

# 批量调用示例
batch_factor_analysis(feature_days=20, factor_dict={
    "换手率": "out = d['换手率']",
    "动量20日": "adj_close = d['close'] * d['adj_factor']; out = adj_close.pct_change(20)",
    "低换手+小市值": "t=row_rank(d['换手率']);s=row_rank(d['总市值']);out=(1-t)+(1-s)"
})

【返回格式】
返回 list，每个元素是一个单因子结果字典（与 factor_analysis summary 模式返回结构完全一致）。
示例：[
  {"name": "换手率", "code": "out = d['换手率']", "feature_days": 20, "IC": -0.0684, "IR": -0.4064, ...},
  {"name": "动量20日", "code": "...", "feature_days": 20, "IC": -0.0587, "IR": -0.4329, ...}
]

⚠️ 与 save_factor_result 的对接：
batch_factor_analysis 的 result 可以直接传给 save_factor_result 的 result 参数（无需格式转换）。
典型流程：batch_factor_analysis → 拿到 result list → 逐个向用户报告结论 → save_factor_result(result=result, note="备注")
AI 也可以选择性保存——从 result list 中筛选有效因子（|IR|>0.3），只保存有意义的因子。

【返回字段】
（每个元素与 factor_analysis summary 模式一致）
- IC均值/IC标准差/IC_IR：IC_IR=均值/标准差。|IR|>0.3 视为有效
- IC正占比：偏离50%越多方向越稳定
- 多空排名差：越大区分度越好
- 前10%平均排名/后10%平均排名：0.5为平均线
- 前10%IC/后10%IC/极端IC差
- time_potential：时间维度潜力，越接近1越稳定
- top10%/bottom10% 子指标：极端分组的IC/IR/time_potential
- error_code：0=成功，非0=失败（含 names 列表追踪失败因子）

【输出规则】
factor_dict 中每个 value 的代码必须以 out = 数值 DataFrame 结尾，作为因子值输入。
"""

save_factor_result = """
【触发场景】保存因子结果、保存因子分析结果、保存IC数据、批量保存因子

【功能说明】
把因子分析结果保存到数据库中。支持单因子和批量保存。
保存技能和分析技能相互独立，保存技能间会相互阻塞。

【参数说明】
- result：接受两种格式，无需格式转换：
  1. 单因子结果字典（factor_analysis 的返回值）
  2. 多因子结果列表（batch_factor_analysis 的返回值）
- note：备注。批量保存时此备注将在所有结果中添加

【典型用法】
# 单因子保存
factor_analysis(name="换手率", code="out = d['换手率']", feature_days=20)
→ save_factor_result(result=<返回值>, note="测试")

# 批量保存
batch_factor_analysis(factor_dict={...}, feature_days=20)
→ save_factor_result(result=<返回值>, note="批量测试")

# 选择性保存（只保存有效因子）
result_list = batch_factor_analysis(...)
effective = [r for r in result_list if abs(r["IR"]) > 0.3]
→ save_factor_result(result=effective, note="有效因子")

【AI 行为建议】
- 批量分析后先逐个向用户报告因子有效性结论，再保存
- 用户未明确要求时，可只保存有效因子（|IR|>0.3）
"""

batch_weight = """
【触发场景】批量切换权重、同时分析多个统计权重、对比不同权重方案、多种加权方式对比

【功能说明】
weight_by_code 的批量版本。一次传入多个权重（code_dict: 权重名称→权重代码），同时计算每个权重的热力图权重矩阵，用于对比不同加权方案的效果。不改变当前活动权重——纯对比工具。

与 weight_by_code 的区别：
- weight_by_code：单权重，每次传一个 name+code，设置为当前活动权重
- batch_weight：多权重，一次传 code_dict（名称→代码字典），同时计算所有权重矩阵供对比

【参数说明】
- code_dict：权重名称→权重代码 的字典。key 为权重名称（用于报告标识），value 为权重代码（Python exec 表达式）
  示例：{"成交量加权": "out = d['vol']", "市值加权": "out = d['总市值']"}
- 代码禁止：import / 循环 / apply / lambda / 递归 / axis=1
- to_percentile：所有权重统一转排序值(0~1)，默认 true。消除不同权重间的量纲差异
- target：统计目标，默认 "All"
  - "All"：对所有散点计算权重矩阵
  - "Select"：仅对当前选中的散点计算权重矩阵（需先用 select_by_code 或 batch_select 设置选中）
- view：返回数据类型，默认 "summary"
  - "summary"：返回热力图评估参数（精简模式，适合快速对比多个权重的效果）
  - "heatmap"：返回完整 10×10 权重矩阵+数量矩阵（详细模式，适合深入研究单个权重）

【关键行为】
- 不改变活动权重：batch_weight 是只读对比工具，计算后当前活动权重不变
- 统一百分位：to_percentile 对所有权重统一生效，无法单独设置
- target="Select" 时 statistic_count < total，仅统计选中散点
- view="summary" 返回精简评估参数，view="heatmap" 返回完整矩阵

【summary 评估参数解读】（view="summary" 时返回）
每个权重返回以下参数：
- slope_x：X方向斜率，Y均值随X档位的变化率。正值=Y随X增大而增大。这是最关键的参数——slope_x 绝对值越大，说明该权重下 X→Y 的预测关系越强
- slope_y：Y方向斜率，X均值随Y档位的变化率
- burst：突发度，热力图中是否有局部突发区域
- spike：尖峰度，热力图分布的尖峰程度
- validity：有效性得分，综合评估该权重下热力图的信号强度
- gini：权重分布的基尼系数（负值表示方向性偏斜）
- weighted_mean：加权均值
- valid_count：有效数据点数量

【代码模板】
# 快速对比多个权重的效果（summary 模式）
batch_weight(code_dict={
    "成交量加权": "out = d['vol']",
    "市值加权": "out = d['总市值']"
}, target="All", to_percentile=true, view="summary")

# 深入研究单个权重的完整矩阵（heatmap 模式）
batch_weight(code_dict={
    "成交量加权": "out = d['vol']"
}, target="All", to_percentile=true, view="heatmap")

# 仅对选中散点对比权重
batch_weight(code_dict={
    "成交量加权": "out = d['vol']",
    "未来收益加权": "adj_close = d['close'] * d['adj_factor']; out = adj_close.shift(-20) / adj_close - 1"
}, target="Select")

【返回结构】
- base_info：图层上下文（layer_name, total, statistic_count, X/Y 名称和代码, statistic_mode, Note）
  - Note 字段提示"当前活动权重未改变，如需应用请调用 weight_by_code"
- result：
  - view="summary"：dict，key=权重名称，value=评估参数 dict（slope_x/slope_y/burst/spike/validity/gini/weighted_mean/valid_count）
  - view="heatmap"：dict，key=权重名称，value={weighted_mean, valid_count, values(10×10权重矩阵), counts(10×10数量矩阵)}
    - values[i][j]: i=Y行, j=X列, origin=bottom-left
- error_code：{"names": []}，空列表=全部成功，非空=失败的权重名称列表

【输出规则】
code_dict 中每个 value 的代码必须以 out = 数值 DataFrame 结尾，作为权重值输入。
"""

batch_select = """
【触发场景】批量选中、同时分析多个选择、批量切片分析、对比多个筛选条件

【功能说明】
select_by_code 的批量版本。一次传入多个筛选条件（code_dict: 名称→代码），根据 mode 进行独立计算或集合运算，返回各条件的热力图统计或评估参数。

与 select_by_code 的区别：
- select_by_code：单条件，每次传一个 code，6种集合模式（A/AB/A+B/A-B/B-A/A+B-AB）
- batch_select：多条件，一次传 code_dict（名称→代码字典），4种模式
- batch_select 的 independent 模式：各自独立计算并返回多个结果（用于对比），不改变选中状态
- select_by_code 的 mode "A"：替换当前选中。两者语义不同，注意区分

【参数说明】
- code_dict：名称→筛选代码 的字典。key 为筛选名称（用于报告标识），value 为筛选代码（Python exec 表达式，out=bool DataFrame）
  示例：{"高市值": "out = d['总市值'] > d['总市值'].median()", "高换手": "out = d['换手率'] > d['换手率'].rolling(60).mean()"}
- 代码禁止：import / 循环 / apply / lambda / 递归 / axis=1
- mode：集合运算模式，4种：
  - "independent_summary"（默认）：每个条件独立筛选，返回各自的热力图评估参数（精简模式，快速对比各切片效果）
  - "independent_heatmap"：每个条件独立筛选，返回各自完整热力图统计（详细模式，含10×10矩阵）
  - "intersect"：所有条件求交集，返回单个完整热力图统计（用于多条件收窄）
  - "union"：所有条件求并集，返回单个完整热力图统计（用于扩大范围）

【关键行为】
- ⚠️ independent 模式前置条件：图层必须先设置 X/Y 轴平移（move_by_code）和权重（weight_by_code），否则散点集中在一个位置无法统计。base_info 中 weight_name 为空代表无权重，X/Y 无细分代表未散开
- independent 模式：返回多个独立结果，用于对比不同筛选条件各自的效果。不改变选中状态。使用全局细分（X/Y全局细分）评估各条件子集的分布
- intersect 模式：交集结果，有效数量 ≤ 各单独条件数量，自动调整细分
- union 模式：并集结果，有效数量 ≥ 各单独条件数量，自动调整细分
- 无差集模式（A-B/B-A/A+B-AB），差集操作用 select_by_code
- independent_summary 返回全局细分下的分布评估参数（cv/gini/entropy_ratio/max_min_ratio/edge_burst/edge_density_ratio）

【summary 评估参数解读】（independent_summary 模式返回）
每个条件返回以下分布评估参数：
- cv：变异系数，各档样本量的离散度。越小越均匀
- gini：基尼系数，分布不均匀程度。0=完全均匀
- entropy_ratio：熵比率，信息分布均匀度。接近1=均匀
- max_min_ratio：最大档/最小档样本量比
- edge_burst：边缘突发。正值=尾部集中，负值=中间集中
- edge_density_ratio：边缘/中心密度比。>1=边缘密，<1=中心密
- valid_count：有效数据点数量

【代码模板】
# 快速对比两个筛选条件各自的效果（summary 模式）
batch_select(code_dict={
    "高市值": "out = d['总市值'] > d['总市值'].median()",
    "高换手": "out = d['换手率'] > d['换手率'].rolling(60).mean()"
}, mode="independent_summary")

# 获取各条件完整热力图（heatmap 模式）
batch_select(code_dict={
    "高市值": "out = d['总市值'] > d['总市值'].median()",
    "高换手": "out = d['换手率'] > d['换手率'].rolling(60).mean()"
}, mode="independent_heatmap")

# 多条件交集
batch_select(code_dict={
    "高市值": "out = d['总市值'] > d['总市值'].median()",
    "高换手": "out = d['换手率'] > d['换手率'].rolling(60).mean()"
}, mode="intersect")

# 多条件并集
batch_select(code_dict={
    "高市值": "out = d['总市值'] > d['总市值'].median()",
    "高换手": "out = d['换手率'] > d['换手率'].rolling(60).mean()"
}, mode="union")

【返回结构】
- base_info：图层上下文（layer_name, total, X/Y 名称, weight_name, mode）
  - independent 模式额外包含：X/Y全局细分（用于评估各条件子集分布的全局参考框架）
  - intersect/union 模式：无全局细分（自动调整细分）
  - ⚠️ weight_name 为空或 X/Y 无细分时，independent 模式无法统计
- result：
  - independent_summary：dict，key=筛选名称，value=分布评估参数（cv/gini/entropy_ratio/max_min_ratio/edge_burst/edge_density_ratio/valid_count）
  - independent_heatmap：dict，key=筛选名称，value=完整热力图统计（valid_count + 10×10 counts矩阵）
  - intersect/union：单个完整热力图统计（交集/并集结果，含 summary 评估参数）
- error_code：{"names": []}，空列表=全部成功，非空=失败的筛选名称列表

【输出规则】
code_dict 中每个 value 的代码必须以 out = 布尔 DataFrame 结尾，True 位置为选中。
"""

batch_factor_corr = """
【触发场景】因子间相关性分析、因子冗余度检查、因子筛选前的去相关、基准因子对比

【功能说明】
批量计算多个因子与一个基准因子之间的相关性。一次传入一个基准因子(benchmark)和多个待评估因子(factor_dict)，
返回每个因子与基准因子的 IC（信息系数）、IR（信息比率）、time_potential（时间潜力），以及基准因子极端档位下的分层 IC。

与 batch_factor_analysis 的区别：
- batch_factor_analysis：基准固定为未来收益（feature_days 期），评估因子对未来收益的预测力
- batch_factor_corr：基准因子可自定义，评估因子之间的相关性/冗余度
- 典型用途：用市值作为基准，检查成交量/换手率/振幅等因子与市值的相关性，发现冗余因子

【参数说明】
- benchmark_name：基准因子名称（用于报告标识），默认"未命名"
- benchmark_code：基准因子代码（Python exec 表达式，out=数值 DataFrame）
  示例："out = d['总市值']"
- factor_dict：因子名称→因子代码 的字典。key 为因子名称，value 为因子代码
  示例：{"成交量": "out = d['vol']", "换手率": "out = d['换手率']"}
- 代码禁止：import / 循环 / apply / lambda / 递归 / axis=1
- 每股类因子无需除以 close（与 factor_analysis 不同，这里只算相关性，不做因子标准化）

【返回结构】
返回列表，每个因子一个 dict：
- name：因子名称
- code：因子代码
- start_date / end_date：数据时间范围
- universe：股票池（"全市场"）
- stock_count：参与计算的股票数量
- IC：与基准因子的整体 Spearman 秩相关系数（-1~1）
- IR：IC 的信息比率（IC均值/IC标准差），衡量 IC 的稳定性。|IR|>0.3 较稳定
- time_potential：时间潜力（0~1），IC 的时间一致性。越接近 1 表示因子相关性在时间上越稳定
- top10%_IC：基准因子 top10% 档位下的 IC（揭示非线性关系）
- top10%_IR：top10% 档位下的 IR
- top10%_time_potential：top10% 的时间潜力
- bottom10%_IC：基准因子 bottom10% 档位下的 IC
- bottom10%_IR：bottom10% 档位下的 IR
- bottom10%_time_potential：bottom10% 的时间潜力
- benchmark_name：基准因子名称
- error_code：{"names": []}，空列表=全部成功，非空=失败的因子名称列表

【评估参数解读】
- |IC| > 0.03：因子间有显著相关性。IC > 0 = 正相关，IC < 0 = 负相关
- |IR| > 0.3：相关性稳定（不是偶尔出现的相关）
- time_potential > 0.8：相关性在时间上高度一致
- top10%/bottom10% IC 差异大：因子关系是非线性的（极端档位下行为不同）
- 用途1（去冗余）：如果两个因子 IC > 0.8，说明高度冗余，保留一个即可
- 用途2（找互补）：IC 接近 0 的因子提供独立信息，适合组合使用
- 用途3（分层分析）：top10%/bottom10% IC 差异大时，因子在不同市值区间表现不同

【代码模板】
# 检查因子与市值的相关性（去冗余）
batch_factor_corr(
    benchmark_name="市值",
    benchmark_code="out = d['总市值']",
    factor_dict={
        "成交量": "out = d['vol']",
        "换手率": "out = d['换手率']",
        "振幅": "out = (d['high'] - d['low']) / d['close']"
    }
)

# 用未来收益作为基准（等价于 batch_factor_analysis 的 IC 部分）
batch_factor_corr(
    benchmark_name="20日收益",
    benchmark_code="adj_close = d['close'] * d['adj_factor']; out = adj_close.shift(-20) / adj_close - 1",
    factor_dict={
        "换手率": "out = d['换手率']",
        "动量": "adj_close = d['close'] * d['adj_factor']; out = adj_close.pct_change(20)"
    }
)

【输出规则】
benchmark_code 和 factor_dict 中每个 value 的代码必须以 out = 数值 DataFrame 结尾。
因子值和基准值都自动做排名转换（Spearman），不需要手动 row_rank。
"""

how_code = """
【背景】代码在python的exec环境中运行，常用的数据和函数已经配置好了，不需要额外的数据读取和import，直接写算法代码。
数据是pd.DataFrame，每一列是一只股票的数据，为避免停牌问题，计算数据的nan置底处理了，行时间不对齐禁止axis=1的计算。
结果由out=***带出，会自动恢复行时间对齐结构。所有技能使用同一代码环境。
【Python exec环境】
- d 是字典，key=字段名，value=pd.DataFrame,默认数据：close, open, high, low, vol, amount, adj_factor
- col_attrs 是字典，key=属性名，value=pd.Series,数据为和股票属性相关的，是数值或字符串
- 可用字段：由用户数据库决定，使用available_data查询
- 复权价格 = d['close'] * d['adj_factor']
- 可用自定义函数：hold_until, time_at, time_between, time_in, row_rank, row_top_n, row_bottom_n
- 禁止：import / for/while循环 / df.apply() / lambda / 递归/ axis=1/ df.loc/df.iloc
- 内置：np, pd
【输出规则】
out = 布尔DataFrame → True位置绘制短线/回测
out = 数值DataFrame → 用于颜色/权重/平移控制/因子

【自定义函数】
1. hold_until(buy, sell) — 生成持仓矩阵
   从买入信号开始持仓，直到遇到卖出信号。买卖同日则放弃该买点。
   - buy: bool DataFrame，买入信号（仅取每段第一个）
   - sell: bool DataFrame，或 list/tuple of DataFrame（多个卖点自动 OR 合并）
   - 返回: bool DataFrame
   示例：
     # 单卖点
     buy = (D.shift(1) <= 20) & (D > 20)
     sell = (D.shift(1) >= 80) & (D < 80)
     out = hold_until(buy, sell)
     # 多卖点
     out = hold_until(buy, [sell1, sell2])

2. entry_check(window, conditions, mode="keep") — 买入窗口条件检测
   在连续窗口内检测条件信号，输出指定区域。用于过滤买入机会。
   - window: bool DataFrame，连续评估区间
   - conditions: bool DataFrame 或 list，要检测的信号（多个自动 OR）
   - mode: keep / discard / left / right / start / end / next
   示例：
     # 买入前10天内是否出现过放量，只保留末尾有效买点
     window = buy.shift(10, fill_value=False).rolling(11).max().astype(bool)
     volume_spike = d['vol'] > d['vol'].rolling(20).mean() * 2
     out = entry_check(window, volume_spike, mode="end")

【时间函数】

3. get_time() — 返回 DataFrame，每个单元格为时间datetime64[us]
4. get_time_id() — 返回 DataFrame，每个单元格为数据库内时间序号，需要按时间排序使用这个函数
5. time_at(rq) — 匹配指定时间，rq 为整数或负数（如 time_at(-1) 最后一天）
6. time_between(srq, erq) — 匹配时间区间（左闭右开）
7. time_in(rqs) — 匹配多个指定时间

【排名函数】

8. row_rank(df, split=[]) — 按行截面排名，返回百分位值（0~1）
   - split: 板块切分点，如 split=[400000, 700000] 按代码切为三组独立排名
   示例：
     rank_all = row_rank(d['vol'])
     rank_by_board = row_rank(d['vol'], split=[400000, 700000])

9. row_top_n(df, n) — 每行（同一时间截面）最大的 n 个为 True
   - df: 数值 DataFrame
   - n: 每行取前 n 个最大值
   - 返回: bool DataFrame，True 位置为该时间截面值最大的 n 只股票
   示例：
     out = row_top_n(d['vol'], 3)       # 每天成交量最大的3只股票
     out = row_top_n(d['总市值'], 10)    # 每天市值最大的10只股票

10. row_bottom_n(df, n) — 每行（同一时间截面）最小的 n 个为 True
    - df: 数值 DataFrame
    - n: 每行取前 n 个最小值
    - 返回: bool DataFrame，True 位置为该时间截面值最小的 n 只股票
    示例：
      out = row_bottom_n(d['vol'], 3)       # 每天成交量最小的3只股票
      out = row_bottom_n(d['总市值'], 10)    # 每天市值最小的10只股票
"""