new_layer_from_code = """
【触发场景】创建图层 / 画图 / 绘制 / 画出 / 生成图层 / 标记买点 / 标记卖点 / 标记事件

【功能说明】在活动画布上新建图层，本质是标记一批 (股票, 关键日期) 的**散点**。软件端对每个散点往后绘制 N 天行情（默认 5 天，GUI 可调），但那是给用户看的视觉呈现——AI 分析的是散点截面数据。

【双视角关键理解】
- AI 视角：每个 True = 一个离散的 (股票, 日期) 散点。散点本身只定位到标记日，但 move/weight/select 代码中可用 .shift() 将标记日前后任意天的数据拉到散点上计算。
- 用户视角：GUI 端以标记日为起点自动绘制 N 天 K 线，方便直观观察形态。绘制模式只影响视觉呈现。

【Shift 机制】AI 分析散点的核心能力
  .shift(N)  → 取标记日**之前**第 N 天数据（如标记前估值水位、量能累积）
  .shift(-N) → 取标记日**之后**第 N 天数据（如未来收益、最大回撤）
示例：weight_by_code(code="adj_close.shift(-5)/adj_close - 1") → 以"标记后第5天收益"为权重

【图层机制】单图层，新替旧
软件只维护一个活动图层：new_layer_from_code / strategy_backtest / factor_analysis(scatter) 都会创建图层，新图层替换旧图层。
设计意图："聚焦"——换条件 = 焦点转移，旧图层不再需要。不要同时维护多个图层。

【默认状态】无平移 + 无权重（数量等权）

【完整分析管道】
new_layer_from_code（标记散点）
→ move_by_code(x)（X轴映射）→ move_by_code(y)（Y轴映射）
→ weight_by_code（可选：调整权重）→ select_by_code（可选：筛选子集，支持集合运算）
→ heat_map（获取二维统计矩阵）

【三大场景模板】
1. 买点分析：标记买入信号 → Y轴=未来收益
2. 卖点分析：标记卖出信号 → Y轴=未来收益
3. 因子视觉化：标记全日期 → X=因子, Y=未来收益 → 替代/补充 factor_analysis

【输出规则】out = 布尔DataFrame，True位置绘制短线并标记为后续分析的数据点
【关键规则】new_layer_from_code 之后必须跟上后续分析（move/weight/select/heat_map），单独的图层没有意义
"""

select_by_code = """
【触发场景】找出 / 查询 / 筛选 / 标记 / 选择

【功能说明】在当前图层中按条件筛选散点。6种集合运算。筛选后自动重新统计所有维度。
在 move/weight 之后使用——继承 X/Y 轴映射和权重配置，筛选后自动重新分桶。

【6种集合模式】
  A       → 替换当前选中（初始筛选/切换视角）
  AB      → 当前选中 ∩ 新条件（多条件收窄）
  A+B     → 当前选中 ∪ 新条件（追加）
  A-B     → 当前选中 - 新条件（移除）
  B-A     → 新条件 - 当前选中（找不在已知集合中的）
  A+B-AB  → 对称差（两集合不同部分）

【关键规则】
- select 不回测：只影响 GUI 图层统计，不影响 strategy_backtest 数据范围
- select 后所有维度自动重新统计
- 不需要 name 参数

【输出规则】out = 布尔DataFrame → True位置选中
"""

move_by_code = """
【触发场景】x轴映射/ y轴映射 / 平移 / 偏移/ 散开 / 移动 / X轴 / Y轴 / 分组 / 分布

【功能说明】将散点的额外维度映射到坐标轴位置。new_layer 之后的核心步骤——没有 move，图层只是散点；有了 move，散点才有分析维度。

【关键行为】
- 同方向覆盖：第二次 direction="x" 替换第一次的 X 映射（不叠加）
- 双方向独立：X/Y 各自维护，互不干扰
- shift 时效：.shift(-N) 有效，但尾部 NaN 会被丢弃导致有效数量减少
- 返回完整热力图数据：有效数量、X/Y轴统计（10等分）、XY热力图数量+权重矩阵

【to_percentile】
- true（默认）：转排名值0~1，看"高/中/低"分段关联
- false：保留原始值，⚠️ 金融数据天然偏态，分布不均是正常现象
- 建议：先用 true 确认因子有效，再切 false 看真实值分布

【optimized_display】大数据量（>10万点）或准备交互框选时开启，聚合优化显示不影响核心统计

【与 shift 配合】move 中 .shift() 是分析"标记后表现"的核心手段
  code="adj_close.shift(-N)/adj_close - 1" → 未来 N 日收益（最常用）

【代码模板】
# X=市值排名, Y=未来20日收益
move_by_code(code="out = d['总市值']", direction="x")
move_by_code(code="adj_close.shift(-20)/adj_close - 1", direction="y", name="20日收益")

# 混合：X=标记前量比, Y=标记后最大涨幅
move_by_code(code="d['vol']/d['vol'].rolling(20).mean()", direction="x", name="量比")
move_by_code(code="(adj_close.shift(-5)/adj_close).rolling(5,min_periods=1).max()-1", direction="y", name="5日最大涨幅")

【输出规则】out = 数值DataFrame → 用于控制平移分布
【返回数据】matrix[i][j]: i=Y行, j=X列, origin=bottom-left
"""

