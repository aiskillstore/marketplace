factor_analysis = """
【触发场景】因子分析、评估因子、因子有效性、IC分析、因子IC

【功能说明】
评估因子与未来收益的关系。每个时间截面上，将因子值和未来收益分别转为截面排名百分位（0~1），再计算Spearman秩相关系数作为IC。

【三种模式】

| mode | 返回内容 | 软件端绘图 | 后续分析 | 用在哪 |
|------|---------|-----------|----------|--------|
| summary | 聚合统计（IC均值/IR/正占比/多空差） | 散点图：X=收益排序，Y=因子排序 | ✅ move+heat_map+select | 第一步，判断有没有效 |
| daily | 每日IC序列 + 前/后10%IC | 三条时序曲线（蓝/红/绿） | ❌ 只读 | 看稳定性，看时段特征 |
| scatter | 同summary统计 | 时序散点（每天独立排列） | ✅ 时间维度分析 | 看因子随时间演变 |

关键区别：
- summary=全局截面（所有日期混一起），scatter=时序截面（每天独立）
- daily=纯时序曲线，只看IC波动，不能做后续操作

标准流程：summary（判断有效）→ daily（看稳定性）→ scatter（看演变）→ move+heat_map（交叉验证）

参数：
- feature_days：评估未来第N天的收益，默认1。长周期（20d）通常比短周期IC更强

⚠️【关键排名规则（必须遵守！）】
- 单因子：工具内部已自动做排名转换，代码中直接输出原始值即可：
  out = d['换手率']          ← 正确，不要加 row_rank
  out = row_rank(d['换手率'])  ← 错误！工具会重复排名
- 复合因子：多个子因子必须各自 row_rank 排名后再加权组合（确保量纲一致）：
  f1 = row_rank(d['因子A'])
  f2 = row_rank(1 - d['因子B'])   ← 反向因子用 1-rank
  out = 0.5 * f1 + 0.5 * f2      ← 排名后再加权

⚠️【每股因子必须除以股价（实测验证！）】
每股类因子（EPS/BPS/每股资本公积/每股未分配利润等）是绝对值，受股价规模影响极大。
必须除以 d['close']（非复权价）转换为比率，否则 IC 被价格规模噪声淹没：
  out = d['每股收益'] / d['close']           ← 正确！E/P（盈利收益率）
  out = d['每股净资产'] / d['close']          ← 正确！B/P（账面市值比）
  out = d['每股资本公积'] / d['close']         ← 正确！IR 从 0.05→0.59（实测最强因子）
  out = d['每股收益']                         ← 错误！IR≈0，绝对值无预测力
- 比率类/增长率类因子（换手率、ROE、营收增速等）不需要除以 close
- 规则：因子值是"每股X元"这种绝对值 → 除以 close → 变成"每元股价含X元"的比率

【核心函数】
row_rank(df) — 按行截面排名，返回百分位值（0~1）
用于构建复合因子：多个子因子各自排名后按比例加权组合。
单因子无需调用，工具外部会自动排名。

【实战代码模板】

# 单因子（最简单）
out = d['换手率']

# 动量因子
adj_close = d['close'] * d['adj_factor']
out = adj_close.pct_change(20)

# 复合因子：低换手 + 小市值
t = row_rank(d['换手率'])
s = row_rank(d['总市值'])
out = (1 - t) + (1 - s)

# 复合因子：动量 + 小市值（加权）
adj_close = d['close'] * d['adj_factor']
m = row_rank(adj_close.pct_change(20))
s = row_rank(d['总市值'])
out = 0.6 * m + 0.4 * (1 - s)

【返回字段】
- IC均值/IC标准差/IC_IR：全样本IC统计，IC_IR=均值/标准差。|IR|>0.3 视为有效
- IC正占比：IC为正的天数占比，偏离50%越多方向越稳定
- 多空排名差：因子值最高组与最低组的收益排名差，越大区分度越好
- 前10%平均排名/后10%平均排名：因子极端分组在收益排名上的表现（0.5为平均）
- 前10%IC/后10%IC：仅保留极端10%因子值后计算的IC，评估尾部信号集中度
- 极端IC差：前10%IC与后10%IC之差

【daily 模式返回格式】
每日IC信息字段返回三列TSV：每日IC  每日前10%IC  每日后10%IC
- 每日IC：当天的 Rank IC
- 前/后10%IC：仅保留极端10%因子值的IC
- 最后 feature_days 行全为NaN（无足够未来数据）

【输出规则】
out = 数值 DataFrame，作为因子值输入。
"""

batch_factor_analysis = """
【触发场景】批量因子分析、同时分析多个因子、批量评估因子有效性、批量IC分析、把多个因子都分析一下、逐个分析这些因子

【功能说明】
factor_analysis 的批量版本。一次传入多个因子（factor_dict: 因子名称→因子代码），逐个计算IC，每完成一个因子立即报告进度，全部完成后输出汇总对比表。

与 factor_analysis 的区别：
- factor_analysis：单因子，每次传一个 name+code
- batch_factor_analysis：多因子，一次传 factor_dict（name→code 字典），自动逐个分析并逐个报告

【参数说明】
- feature_days：未来多少天后的收益，≥1，默认1。对所有因子统一生效
- factor_dict：因子名称→因子代码 的字典。key 为因子名称（用于报告标识），value 为因子代码（Python exec 表达式）
  示例：{"换手率": "out = d['换手率']", "动量20日": "out = adj_close.pct_change(20)", "低换手+小市值": "t=row_rank(d['换手率']);s=row_rank(d['总市值']);out=(1-t)+(1-s)"}

【返回机制】
引擎逐个因子计算，GUI端可看到中间进度（1/3、2/3等），但 AI 层只收到最终完整结果——一个 list，包含所有因子的结果字典。

⚠️ AI 行为要求：
- 收到完整结果后，逐个向用户报告每个因子的有效性结论（不要只报综合结论）
- 重点标注有效因子（|IR|>0.3）和无效因子
- 全部报告完毕后，给出综合对比结论

【Python exec 环境】（与 factor_analysis 完全一致）
- 默认字段：close, open, high, low, vol, amount, adj_factor
- 复权价格：adj_close = d['close'] * d['adj_factor']
- 内置：np, pd；禁止：import / 循环 / apply / lambda / 递归 / axis=1

⚠️【关键排名规则（与 factor_analysis 一致）】
- 单因子：工具内部已自动做排名转换，代码中直接输出原始值即可：
  out = d['换手率']          ← 正确
  out = row_rank(d['换手率'])  ← 错误！重复排名
- 复合因子：多个子因子必须各自 row_rank 排名后再加权组合：
  f1 = row_rank(d['因子A'])
  f2 = row_rank(1 - d['因子B'])
  out = 0.5 * f1 + 0.5 * f2

⚠️【每股因子必须除以股价（实测验证！）】
每股类因子（EPS/BPS/每股资本公积/每股未分配利润等）是绝对值，必须除以 d['close']（非复权价）：
  "每股收益": "out = d['每股收益'] / d['close']"        ← 正确
  "每股资本公积": "out = d['每股资本公积'] / d['close']" ← 正确（IR=0.59最强）
  "每股收益": "out = d['每股收益']"                      ← 错误（IR≈0）
比率类/增长率类因子不需要除以 close。

【代码模板（factor_dict 值的写法）】

# 单因子（最简单）
"换手率": "out = d['换手率']"
"市盈率": "out = d['市盈率TTM']"
"总市值": "out = d['总市值']"

# 动量因子
"动量20日": "adj_close = d['close'] * d['adj_factor']; out = adj_close.pct_change(20)"

# 复合因子
"低换手+小市值": "t=row_rank(d['换手率']);s=row_rank(d['总市值']);out=(1-t)+(1-s)"

# 批量调用示例
batch_factor_analysis(feature_days=20, factor_dict={
    "换手率": "out = d['换手率']",
    "动量20日": "adj_close = d['close'] * d['adj_factor']; out = adj_close.pct_change(20)",
    "低换手+小市值": "t=row_rank(d['换手率']);s=row_rank(d['总市值']);out=(1-t)+(1-s)"
})

【返回格式】
返回 list，每个元素是一个单因子结果字典（与 factor_analysis summary 模式返回结构完全一致）。
示例：[
  {"name": "换手率", "code": "out = d['换手率']", "feature_days": 20, "IC": -0.0684, "IR": -0.4064, ...},
  {"name": "动量20日", "code": "...", "feature_days": 20, "IC": -0.0587, "IR": -0.4329, ...}
]

⚠️ 与 save_factor_result 的对接：
batch_factor_analysis 的 result 可以直接传给 save_factor_result 的 result 参数（无需格式转换）。
典型流程：batch_factor_analysis → 拿到 result list → 逐个向用户报告结论 → save_factor_result(result=result, note="备注")
AI 也可以选择性保存——从 result list 中筛选有效因子（|IR|>0.3），只保存有意义的因子。

【返回字段】
（每个元素与 factor_analysis summary 模式一致）
- IC均值/IC标准差/IC_IR：IC_IR=均值/标准差。|IR|>0.3 视为有效
- IC正占比：偏离50%越多方向越稳定
- 多空排名差：越大区分度越好
- 前10%平均排名/后10%平均排名：0.5为平均线
- 前10%IC/后10%IC/极端IC差
- time_potential：时间维度潜力，越接近1越稳定
- top10%/bottom10% 子指标：极端分组的IC/IR/time_potential
- error_code：0=成功，非0=失败（含 names 列表追踪失败因子）

【输出规则】
factor_dict 中每个 value 的代码必须以 out = 数值 DataFrame 结尾，作为因子值输入。
"""

save_factor_result = """
【触发场景】保存因子结果、保存因子分析结果、保存IC数据、批量保存因子

【功能说明】
把因子分析结果保存到数据库中。支持单因子和批量保存。
保存技能和分析技能相互独立，保存技能间会相互阻塞。

【参数说明】
- result：接受两种格式，无需格式转换：
  1. 单因子结果字典（factor_analysis 的返回值）
  2. 多因子结果列表（batch_factor_analysis 的返回值）
- note：备注。批量保存时此备注将在所有结果中添加

【典型用法】
# 单因子保存
factor_analysis(name="换手率", code="out = d['换手率']", feature_days=20)
→ save_factor_result(result=<返回值>, note="测试")

# 批量保存
batch_factor_analysis(factor_dict={...}, feature_days=20)
→ save_factor_result(result=<返回值>, note="批量测试")

# 选择性保存（只保存有效因子）
result_list = batch_factor_analysis(...)
effective = [r for r in result_list if abs(r["IR"]) > 0.3]
→ save_factor_result(result=effective, note="有效因子")

【AI 行为建议】
- 批量分析后先逐个向用户报告因子有效性结论，再保存
- 用户未明确要求时，可只保存有效因子（|IR|>0.3）
"""