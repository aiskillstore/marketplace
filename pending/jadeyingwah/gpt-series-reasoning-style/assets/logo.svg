<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#171233"/>
    </linearGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <ellipse cx="120" cy="120" rx="220" ry="160" fill="url(#glowP)"/>
  <ellipse cx="400" cy="400" rx="220" ry="160" fill="url(#glowC)"/>

  <circle cx="440" cy="80" r="2" fill="#22D3EE" opacity="0.4"/>
  <circle cx="60" cy="100" r="1.5" fill="#A78BFA" opacity="0.5"/>
  <circle cx="60" cy="400" r="2" fill="#A78BFA" opacity="0.4"/>
  <circle cx="450" cy="430" r="1.5" fill="#22D3EE" opacity="0.3"/>

  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" transform="translate(0, 14)">

    <!-- 五角星连线 -->
    <polygon points="256,40 398,130 344,310 168,310 114,130"
             fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

    <!-- 节点1：顶部 -->
    <g transform="translate(256, 40)">
      <circle cx="0" cy="0" r="28" fill="#131A31" stroke="#64748B" stroke-width="2" stroke-dasharray="4 3"/>
      <path d="M 0,-10 C -6,-10 -10,-5 -10,0 C -10,4 -7,7 -5,9 L -5,12 L 5,12 L 5,9 C 7,7 10,4 10,0 C 10,-5 6,-10 0,-10 Z"
            fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="-4" y1="15" x2="4" y2="15" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- 节点2：右上 -->
    <g transform="translate(398, 130)">
      <circle cx="0" cy="0" r="28" fill="#131A31" stroke="#8B5CF6" stroke-width="2.5"/>
      <rect x="-9" y="-9" width="18" height="18" rx="2" fill="none" stroke="#C4B5FD" stroke-width="1.8"/>
      <path d="M -5,-3 L -2,0 L 4,-5" fill="none" stroke="#C4B5FD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-5" y1="5" x2="5" y2="5" stroke="#C4B5FD" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- 节点3：右下 -->
    <g transform="translate(344, 310)">
      <circle cx="0" cy="0" r="28" fill="#131A31" stroke="#64748B" stroke-width="2"/>
      <path d="M 8,-8 C 10,-6 10,-2 8,0 L 4,4 L 0,8 C -2,10 -6,10 -8,8 L -4,4 L 4,-4 Z"
            fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-6" cy="6" r="3" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    </g>

    <!-- 节点4：左下 -->
    <g transform="translate(168, 310)">
      <circle cx="0" cy="0" r="28" fill="#131A31" stroke="#06B6D4" stroke-width="2.5"/>
      <path d="M -10,0 C -6,-6 6,-6 10,0 C 6,6 -6,6 -10,0 Z" fill="none" stroke="#67E8F9" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="3" fill="#67E8F9"/>
    </g>

    <!-- 节点5：左上 -->
    <g transform="translate(114, 130)">
      <circle cx="0" cy="0" r="28" fill="#131A31" stroke="#10B981" stroke-width="2.5"/>
      <path d="M -8,0 L -2,6 L 9,-7" fill="none" stroke="#6EE7B7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 中心节点 -->
    <g transform="translate(256, 190)">
      <circle cx="0" cy="0" r="60" fill="#8B5CF6" opacity="0.15"/>
      <circle cx="0" cy="0" r="48" fill="#131A31" stroke="#8B5CF6" stroke-width="3.5"/>
      <rect x="-12" y="-16" width="24" height="32" rx="2" fill="none" stroke="#C4B5FD" stroke-width="2.2"/>
      <circle cx="6" cy="0" r="2" fill="#C4B5FD"/>
      <line x1="-16" y1="-20" x2="-16" y2="20" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round"/>
      <line x1="16" y1="-20" x2="16" y2="20" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- 标题（上下空白相等） -->
    <text x="256" y="410" text-anchor="middle" font-size="26" font-weight="800" fill="#F1F5F9" letter-spacing="0.5">
      GPT-Series Reasoning Style
    </text>
    <text x="256" y="445" text-anchor="middle" font-size="15" font-weight="600" fill="#C4B5FD">
      交付纪律层 · 防假完成
    </text>

