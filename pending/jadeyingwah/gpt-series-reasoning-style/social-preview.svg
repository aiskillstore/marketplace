<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">GPT-Series Reasoning Style · Delivery discipline layer</title>
  <desc id="banner-desc">Bilingual banner: three stages (Planning / Execution / Review) driven by a shield icon in two states — a dashed shield with a slash means the rules are not in context while you work; a solid shield with a check means the rules are loaded from file to verify the delivery. Rules load by stage, and the rule files carry their own exit conditions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#171233"/>
    </linearGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <ellipse cx="200" cy="90" rx="480" ry="290" fill="url(#glowP)"/>
  <ellipse cx="1090" cy="575" rx="500" ry="310" fill="url(#glowC)"/>
  <circle cx="1096" cy="86" r="2.5" fill="#22D3EE" opacity="0.40"/>
  <circle cx="1204" cy="176" r="2" fill="#A78BFA" opacity="0.50"/>
  <circle cx="66" cy="548" r="2.5" fill="#A78BFA" opacity="0.40"/>
  <circle cx="372" cy="606" r="2" fill="#22D3EE" opacity="0.30"/>

  <g font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">

    <text x="640" y="72" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="5" fill="#22D3EE" opacity="0.92">AGENT SKILL · DELIVERY DISCIPLINE</text>

    <text x="640" y="152" text-anchor="middle" font-size="58" font-weight="800" fill="#F1F5F9" letter-spacing="0.5">GPT-Series Reasoning Style</text>
    <text x="640" y="204" text-anchor="middle" font-size="30" font-weight="700" fill="#C4B5FD">GPT 系列推理风格</text>

    <text x="640" y="262" text-anchor="middle" font-size="23" font-weight="600" fill="#E2E8F0">Rules load by stage — absent while working, full at delivery</text>
    <text x="640" y="298" text-anchor="middle" font-size="19" fill="#8FA3BF">规则按阶段读入 · 干活时不在场 · 交付时零妥协</text>

    <!-- ===== 卡片 1 · 规划（紫） ===== -->
    <rect x="80" y="336" width="340" height="172" rx="20" fill="#131A31" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.85"/>
    <g transform="translate(206,378)">
      <path d="M -13,-17 L 13,-17 L 13,-3 C 13,8 6,16 0,20 C -6,16 -13,8 -13,-3 Z"
            fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="4 3.5"/>
      <path d="M -8,6 L 8,-6" stroke="#64748B" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <line x1="240" y1="378" x2="260" y2="378" stroke="#64748B" stroke-width="1.8" opacity="0.85"/>
    <polygon points="260,373 267,378 260,383" fill="#64748B" opacity="0.85"/>
    <g transform="translate(294,378)">
      <path d="M -13,-17 L 13,-17 L 13,-3 C 13,8 6,16 0,20 C -6,16 -13,8 -13,-3 Z"
            fill="#8B5CF6" fill-opacity="0.20" stroke="#8B5CF6" stroke-width="2.2"/>
      <path d="M -6,1 L -1,6 L 7,-5" fill="none" stroke="#C4B5FD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="206" y="412" text-anchor="middle" font-size="12" letter-spacing="1" fill="#64748B">RULES OFF</text>
    <text x="294" y="412" text-anchor="middle" font-size="12" letter-spacing="1" fill="#C4B5FD">RULES ON</text>
    <text x="250" y="440" text-anchor="middle" font-size="21" font-weight="700" fill="#C4B5FD">规划 Planning</text>
    <text x="250" y="470" text-anchor="middle" font-size="15" fill="#8FA3BF">先自由构想，再落成计划</text>
    <text x="250" y="490" text-anchor="middle" font-size="13" fill="#64748B">Free-form first, then a plan</text>

    <!-- ===== 卡片 2 · 执行（青） ===== -->
    <rect x="470" y="336" width="340" height="172" rx="20" fill="#131A31" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.85"/>
    <g transform="translate(640,378)">
      <path d="M -13,-17 L 13,-17 L 13,-3 C 13,8 6,16 0,20 C -6,16 -13,8 -13,-3 Z"
            fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="4 3.5"/>
      <path d="M -8,6 L 8,-6" stroke="#64748B" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <text x="640" y="412" text-anchor="middle" font-size="12" letter-spacing="1" fill="#64748B">RULES OFF</text>
    <text x="640" y="440" text-anchor="middle" font-size="21" font-weight="700" fill="#22D3EE">执行 Execution</text>
    <text x="640" y="470" text-anchor="middle" font-size="15" fill="#8FA3BF">不受规则束缚，专心把事做完</text>
    <text x="640" y="490" text-anchor="middle" font-size="13" fill="#64748B">Build without the checklist</text>

    <!-- ===== 卡片 3 · 审查（金） ===== -->
    <rect x="860" y="336" width="340" height="172" rx="20" fill="#131A31" stroke="#FBBF24" stroke-width="2" stroke-opacity="0.85"/>
    <g transform="translate(986,378)">
      <path d="M -13,-17 L 13,-17 L 13,-3 C 13,8 6,16 0,20 C -6,16 -13,8 -13,-3 Z"
            fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="4 3.5"/>
      <path d="M -8,6 L 8,-6" stroke="#64748B" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <line x1="1020" y1="378" x2="1040" y2="378" stroke="#64748B" stroke-width="1.8" opacity="0.85"/>
    <polygon points="1040,373 1047,378 1040,383" fill="#64748B" opacity="0.85"/>
    <g transform="translate(1074,378)">
      <path d="M -13,-17 L 13,-17 L 13,-3 C 13,8 6,16 0,20 C -6,16 -13,8 -13,-3 Z"
            fill="#FBBF24" fill-opacity="0.20" stroke="#FBBF24" stroke-width="2.2"/>
      <path d="M -6,1 L -1,6 L 7,-5" fill="none" stroke="#FDE68A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="986" y="412" text-anchor="middle" font-size="12" letter-spacing="1" fill="#64748B">RULES OFF</text>
    <text x="1074" y="412" text-anchor="middle" font-size="12" letter-spacing="1" fill="#FBBF24">RULES ON</text>
    <text x="1030" y="440" text-anchor="middle" font-size="21" font-weight="700" fill="#FBBF24">审查 Review</text>
    <text x="1030" y="470" text-anchor="middle" font-size="15" fill="#8FA3BF">先直觉挑漏，再过一遍纪律</text>
    <text x="1030" y="490" text-anchor="middle" font-size="13" fill="#64748B">Gut check first, rules second</text>

    <!-- ===== 图例 ===== -->
    <g transform="translate(96,586)">
      <g transform="scale(0.6)">
        <path d="M -13,-17 L 13,-17 L 13,-3 C 13,8 6,16 0,20 C -6,16 -13,8 -13,-3 Z"
              fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="4 3.5"/>
        <path d="M -8,6 L 8,-6" stroke="#64748B" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <text x="20" y="4" font-size="13" fill="#64748B">Rules aside while working</text>
      <text x="192" y="4" font-size="13" fill="#64748B">&#8594;</text>
      <g transform="translate(218,0) scale(0.6)">
        <path d="M -13,-17 L 13,-17 L 13,-3 C 13,8 6,16 0,20 C -6,16 -13,8 -13,-3 Z"
              fill="#22D3EE" fill-opacity="0.20" stroke="#22D3EE" stroke-width="2.2"/>
        <path d="M -6,1 L -1,6 L 7,-5" fill="none" stroke="#67E8F9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="238" y="4" font-size="13" fill="#64748B">Rules loaded from file, stage by stage · five-stage timeline</text>
    </g>
    <text x="1200" y="590" text-anchor="end" font-size="15" fill="#64748B">v1.5.0 · MIT</text>
  </g>
</svg>
