<!doctype html>
<html lang="zh" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Birdview · Constraints</title>
<style>html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#141617;color:#dce5e2}.bv-standalone-header{height:60px;box-sizing:border-box;border-bottom:1px solid #82928b30;display:flex;align-items:center;gap:12px;padding:0 24px}.bv-standalone-header strong{font-size:14px;font-weight:500;flex:1}.bv-standalone-header select,.bv-standalone-header button{font:12px system-ui;padding:6px 10px;background:transparent;color:inherit;border:1px solid #82928b50;border-radius:5px}html[data-theme="light"] body{background:#fff;color:#30473e}#native-constraints{height:calc(100% - 60px)}
/* CONSTRAINT_CSS */</style></head>
<body><header class="bv-standalone-header"><strong id="constraint-project"></strong><select aria-label="Language" id="constraint-language"><option value="zh">中文</option><option value="en">English</option></select><button id="constraint-theme" type="button">◐</button></header><div id="native-constraints"></div>
<script type="application/json" id="birdview-constraint-data">/* CONSTRAINT_DATA */</script>
<script>/* CONSTRAINT_JS */
const graphData = JSON.parse(document.getElementById('birdview-constraint-data').textContent);
document.getElementById('constraint-project').textContent = graphData.title;
const params = new URLSearchParams(location.hash.slice(1));
document.documentElement.lang = params.get('lang') === 'en' ? 'en' : 'zh';
document.getElementById('constraint-language').value = document.documentElement.lang;
const graphView = BirdviewConstraintCanvas.mountConstraintCanvas(document.getElementById('native-constraints'), graphData);
document.getElementById('constraint-language').onchange = event => { document.documentElement.lang = event.target.value; graphView.refresh(); };
document.getElementById('constraint-theme').ariaLabel = '切换主题 / Toggle theme';
document.getElementById('constraint-theme').onclick = () => { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; };
</script></body></html>
