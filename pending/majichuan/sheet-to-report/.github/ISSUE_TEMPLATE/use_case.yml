name: New use case
description: Suggest a business-data scenario that should be evaluated or supported.
title: "[Use case]: "
labels: ["use-case", "needs-triage"]
body:
  - type: input
    id: audience
    attributes:
      label: Audience and decision
      description: Who reads the report, and what decision should it support?
    validations:
      required: true
  - type: textarea
    id: table
    attributes:
      label: Table structure
      description: Describe the row grain, time field, metrics, and useful dimensions without sharing real data.
    validations:
      required: true
  - type: textarea
    id: outputs
    attributes:
      label: Expected outputs
      description: HTML, standard PPT, optional refined PPT, or another clearly scoped result.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Acceptance criteria
      description: What would make the output useful and trustworthy?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I described the scenario without private or confidential data.
          required: true