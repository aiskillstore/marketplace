name: Feature request
description: Propose a focused improvement to analysis, evidence, charts, portability, or presentation.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the business task and the current limitation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should the user be able to do or understand?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Synthetic example or evidence
      description: Use anonymized or synthetic material only.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request does not include private data or credentials.
          required: true