name: New check or compatibility request
description: Propose a deterministic check, target-profile improvement, or documented compatibility change.
title: "[Enhancement]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Strong proposals include authoritative documentation and paired synthetic examples that should pass and fail. Do not include secrets, private Skill packages, or sensitive data.
  - type: dropdown
    id: request_type
    attributes:
      label: Request type
      options:
        - New deterministic inspector check
        - Existing check improvement
        - Target-profile or host compatibility
        - JSON output or schema change
        - Documentation or workflow guidance
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target, host, or tool
      description: Name the affected profile, platform, validator, or workflow and its version when known.
      placeholder: "Example: OpenAI Agent Skills, current documented format"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user-visible gap and why existing checks or guidance do not cover it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Authoritative evidence
      description: Link official specifications, validator documentation, or reproducible platform behavior. Distinguish verified facts from inferences.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Synthetic examples
      description: Provide minimal non-sensitive examples that should pass and fail, including likely false-positive cases.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Proposed acceptance criteria
      description: State the observable behavior and regression coverage that would make this request complete.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Proposal checks
      options:
        - label: I searched existing issues and current repository documentation.
          required: true
        - label: I separated official evidence from assumptions or preferences.
          required: true
        - label: I used only public, synthetic, or redacted material.
          required: true
