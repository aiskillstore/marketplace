name: Bug or false positive
description: Report incorrect inspection behavior, a missed detection, or an inaccurate finding.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Skill Forge. Use synthetic, redacted inputs only.

        **Security:** Do not disclose vulnerability details, exploit payloads, secrets, private Skill packages, or sensitive logs here. Follow [SECURITY.md](https://github.com/zztimur/skill-forge/security/policy).
  - type: dropdown
    id: report_type
    attributes:
      label: Report type
      options:
        - Incorrect finding (false positive)
        - Missed finding (false negative)
        - Crash or unreadable input
        - Output or documentation problem
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skill Forge version
      description: Provide a release tag or commit SHA.
      placeholder: "Example: v2.0.2 or 8560400"
    validations:
      required: true
  - type: dropdown
    id: target_profile
    attributes:
      label: Target profile
      options:
        - Portable
        - OpenAI
        - Both
        - Not sure or not applicable
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or workflow
      description: Provide the exact command or prompt after removing sensitive paths and values.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Describe the smallest non-sensitive fixture and steps that reproduce the behavior. Do not attach private packages.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include finding codes or redacted output when useful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain the result and evidence you expected.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version, if relevant.
      placeholder: "Example: Windows 11, Python 3.12"
  - type: checkboxes
    id: confirmations
    attributes:
      label: Public-report safety checks
      options:
        - label: I searched existing issues for the same behavior.
          required: true
        - label: I used only synthetic or redacted reproduction material.
          required: true
        - label: I did not include secrets, private packages, customer data, sensitive logs, or vulnerability details.
          required: true
