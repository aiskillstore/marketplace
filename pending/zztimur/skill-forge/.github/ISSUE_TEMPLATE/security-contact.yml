name: Security contact request
description: Ask the maintainers for a private reporting channel without disclosing vulnerability details.
title: "[Security contact request]: "
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not include vulnerability details, exploit payloads, secrets, private Skill packages, or sensitive logs.

        If the repository's **Report a vulnerability** button is available, use that private route instead. Submit this form only to ask the maintainers to provide or enable a private reporting channel.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Safety confirmation
      options:
        - label: I have not included vulnerability details or sensitive information in this public issue.
          required: true
        - label: I understand that this issue only asks the maintainers to provide or enable a private reporting channel.
          required: true
