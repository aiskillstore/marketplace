name: Capture Release Receipt

on:
  workflow_dispatch:
    inputs:
      receipt_base64:
        description: Base64 of reviewed receipt.json (no secrets or private source paths)
        required: true
        type: string
      evaluator_report_base64:
        description: Base64 of independent evaluator report JSON (review before upload)
        required: true
        type: string

permissions:
  contents: read

jobs:
  capture:
    name: Store reviewer-supplied evidence without executing it
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decode bounded JSON evidence as data
        env:
          RECEIPT_BASE64: ${{ inputs.receipt_base64 }}
          EVALUATOR_REPORT_BASE64: ${{ inputs.evaluator_report_base64 }}
        run: |
          python3 -B -S - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          Path('receipt').mkdir()
          for variable, filename in [('RECEIPT_BASE64', 'receipt.json'),
                                     ('EVALUATOR_REPORT_BASE64', 'independent-evaluator.json')]:
              encoded = os.environ[variable]
              if not 0 < len(encoded) <= 60000:
                  raise SystemExit('Receipt input outside size limit')
              try:
                  data = base64.b64decode(encoded, validate=True)
                  if not isinstance(json.loads(data), dict):
                      raise ValueError('JSON object required')
              except (ValueError, UnicodeError):
                  raise SystemExit('Invalid encoded JSON evidence') from None
              Path('receipt', filename).write_bytes(data)
              if filename == 'receipt.json':
                  print('receipt_sha256=' + hashlib.sha256(data).hexdigest())
          PY

      - name: Upload exact reviewer evidence bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-review-receipt
          path: |
            receipt/receipt.json
            receipt/independent-evaluator.json
          if-no-files-found: error
          retention-days: 30
