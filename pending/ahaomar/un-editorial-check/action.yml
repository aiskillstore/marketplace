name: un-editorial-check
description: Read the changed copy the way a UN editor would and fail the job on error-severity editorial findings.
inputs:
  path:
    description: Path to scan, relative to the repository root.
    default: '.'
  config:
    description: Alternative configuration file, relative to the repository root.
    default: ''
  baseline:
    description: Committed baseline snapshot; later runs fail only on new findings.
    default: ''
runs:
  using: node20
  main: action/main.mjs
branding:
  icon: check-circle
  color: green
