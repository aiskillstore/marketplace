name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # No dependencies and therefore no lockfile are required.
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check:syntax
      - run: npm test
      # Source-registry validation runs as its own step so a broken registry
      # fails visibly here rather than only inside the test chain.
      - run: node tests/audit-registry.mjs
      # No suite may write into the working tree: the checkout must stay clean.
      - run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "tests wrote into the working tree:"
            git status --porcelain
            exit 1
          fi
      - run: npm run check:portability
      # Every git-tracked JSON file must parse (the gitignored local .un-editorial.json is intentionally excluded).
      - run: node -e "const fs=require('fs'),cp=require('child_process');const files=cp.execSync('git ls-files').toString().trim().split('\n').filter(f=>f.endsWith('.json')&&fs.existsSync(f));for(const f of files){JSON.parse(fs.readFileSync(f,'utf8'));}console.log('json ok ('+files.length+' files)')"
      - run: npm pack --dry-run
      # Release gate: self-scan must exit 0 (bash -e fails the step on any non-zero exit).
      - run: node bin/check.mjs --self-scan --quiet
      - run: |
          tarball=$(npm pack --silent)
          prefix=$(mktemp -d)
          npm install --prefix "$prefix" --ignore-scripts --no-audit --no-fund "./$tarball"
          "$prefix/node_modules/.bin/un-editorial-check" --self-scan --quiet
          rm -rf "$prefix" "$tarball"
