[tools]
python = "3.12"

[tasks.test]
description = "Run the always-current-datetime unit tests"
run = "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -v"

[tasks.validate]
description = "Validate the skill package structure"
run = "python3 scripts/validate_skill.py ."

[tasks.lint-writing]
description = "Check Markdown writing rules"
run = "python3 scripts/lint_writing.py ."

[tasks.lint-code]
description = "Check Python and shell size, nesting, and marker rules"
run = "python3 scripts/check_code_rules.py ."

[tasks.evals]
description = "Validate the behavior and trigger eval files"
run = "python3 scripts/check_evals.py . --min-cases 10 --min-queries 10"

[tasks.ci]
description = "Run the complete always-current-datetime quality gate"
run = [
  "mise run test",
  "mise run validate",
  "mise run lint-writing",
  "mise run lint-code",
  "mise run evals",
]
