[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharextract"
version = "0.23.0"
description = "Protocol-first public share content extractor for AI chats, social posts, media, and web pages."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "wuaishare" }]
keywords = ["agent-skills", "content-extraction", "share-links", "web", "ai", "oembed", "rss", "webvtt", "subtitles", "zhihu", "weibo", "tiktok", "douyin", "xiaohongshu", "kuaishou", "telegram", "pinterest", "threads", "instagram", "facebook", "linkedin"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
web = ["trafilatura>=2.0"]
media = ["yt-dlp"]
service = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
mcp = ["mcp>=2,<3"]
browser = ["playwright>=1.50,<2"]
all = ["trafilatura>=2.0", "yt-dlp", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "mcp>=2,<3", "playwright>=1.50,<2"]

[project.scripts]
sharextract = "sharextract.cli:main"
sharextract-api = "sharextract.http_api:main"
sharextract-mcp = "sharextract.mcp_server:main"

[project.urls]
Homepage = "https://github.com/wuaishare/sharextract"
Repository = "https://github.com/wuaishare/sharextract"
Issues = "https://github.com/wuaishare/sharextract/issues"

[tool.setuptools.packages.find]
include = ["sharextract*"]

[tool.setuptools.package-data]
sharextract = ["fixtures/*.json"]
