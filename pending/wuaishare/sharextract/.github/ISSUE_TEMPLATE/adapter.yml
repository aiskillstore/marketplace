name: Platform adapter request
description: Request or propose support for a public share/content URL
title: "[adapter] "
labels: ["adapter"]
body:
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "Gemini, Claude, Xiaohongshu, ..."
    validations:
      required: true
  - type: textarea
    id: urls
    attributes:
      label: Public URL patterns
      description: Use sanitized/example URLs. Do not post private share links.
      placeholder: "https://example.com/share/{id}"
    validations:
      required: true
  - type: textarea
    id: public-source
    attributes:
      label: Known public extraction source
      description: Documented API, oEmbed, public JSON, JSON-LD, public HTML, or existing OSS tool.
  - type: checkboxes
    id: boundary
    attributes:
      label: Public-content boundary
      options:
        - label: "This request does not require bypassing login, CAPTCHA, paywalls, WAF/access controls, or private sharing."
          required: true
