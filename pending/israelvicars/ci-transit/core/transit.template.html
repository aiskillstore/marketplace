<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%9A%87%3C/text%3E%3C/svg%3E">
<!-- Transit: self-contained subway-map view of one trace. No network. Every frame is a pure
     function of t via window.renderAt(t): no Date.now, no timers, no randomness. -->
<style>
  /*__FONTS__*/
  html, body { margin: 0; background: #FFFFFF; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { font-family: "Transit Sans", Arial, sans-serif; color: #111; }
  #stage { display: block; width: 1200px; height: 900px; }
  #controls { width: 1200px; box-sizing: border-box; padding: 10px 24px 8px; display: flex; gap: 14px; align-items: center; font-size: 13px; }
  #controls button { font: inherit; padding: 6px 14px; border: 2px solid #111; background: #fff; border-radius: 18px; cursor: pointer; min-width: 76px; font-weight: 700; }
  #controls input[type=range] { flex: 1; accent-color: #111; }
  #controls .t { font-variant-numeric: tabular-nums; min-width: 190px; text-align: right; color: #555; }
  #hops { width: 1200px; box-sizing: border-box; padding: 4px 24px 24px; font-size: 13px; }
  #hops table { border-collapse: collapse; width: 100%; }
  #hops td, #hops th { text-align: left; padding: 3px 8px; border-bottom: 1px solid #eee; }
  #hops td:first-child { white-space: nowrap; }   /* start times like "1.5 ms" never wrap (narrow windows, long service names) */
  #wrap { display: flex; align-items: flex-start; }
  #main { width: 1200px; flex: none; }
  #panel { width: 400px; flex: none; box-sizing: border-box; border-left: 2px solid #111; font-size: 13px; }
  /* interactive layout: page never scrolls; map scales to fit above a reserved 180px list area; hop table and panel body scroll on their own. #main needs an explicit height because #wrap uses align-items: flex-start (render mode), otherwise the list grows instead of scrolling. */
  html:not(.render), html:not(.render) body { height: 100%; overflow: hidden; }
  html:not(.render) #wrap { display: flex; height: 100vh; }
  /* the map keeps its 4:3 aspect inside the height left above the list, so #main takes exactly the map's width and the panel takes the rest: header, map, controls and hop list share one right edge and there is no blank strip before the panel */
  html:not(.render) #main { flex: none; width: min(calc(100vw - 400px), calc((100vh - 56px - 180px) * 4 / 3)); min-width: 0; height: 100vh; min-height: 0; align-self: stretch; display: flex; flex-direction: column; overflow: hidden; }
  html:not(.render) #stage { flex: none; width: 100%; height: auto; aspect-ratio: 1200 / 900; }
  html:not(.render) #panel { flex: 1; width: auto; min-width: 400px; }
  #panel .pbody { container-type: inline-size; }
  html:not(.render) #controls { width: 100%; flex: none; }
  html:not(.render) #hops { width: 100%; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  #panel { display: flex; flex-direction: column; overflow: hidden; height: 100vh; }

  #panel .pbody::-webkit-scrollbar { width: 8px; } #panel .pbody::-webkit-scrollbar-thumb { background: #C4C4C4; border-radius: 4px; } #panel .pbody::-webkit-scrollbar-track { background: transparent; }
  #panel .sign { flex: none; position: sticky; top: 0; z-index: 1; }
  #panel .sign .sub .bul { vertical-align: -2px; margin: 0 2px; }
  #panel .trow { margin: 8px 0 0; } #panel .trow .tl { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: #4A4A4A; } #panel .trow .stats { margin: 3px 0 0; }
  #panel .crumbs .sd.sq { border-radius: 3px; }
  #panel details.client-attrs > summary { font-size: 11px; font-weight: 700; color: #4A4A4A; margin: 4px 0; }

  #panel .sign { background: #111; color: #fff; margin: 0 0 12px; padding: 12px 18px 10px; }

  #panel .sign .sn { font-weight: 700; font-size: 22px; flex: 1; word-break: break-word; }
  #panel .sign::after { content: ""; display: block; width: 40px; height: 4px; background: #fff; margin-top: 8px; }

  #panel .card .cb { padding: 6px 10px 8px; }
  #panel .card .f { display: flex; gap: 6px; align-items: baseline; padding: 1px 0; font-size: 12px; }
  #panel .card .req { width: 10px; font-size: 9px; color: #111; flex: none; }
  #panel .card .fn { font-family: ui-monospace, monospace; }
  #panel .card .ft { color: #2A62C9; font-family: ui-monospace, monospace; font-size: 11px; }

  #verdict { flex: none; box-sizing: border-box; height: 34px; line-height: 34px; padding: 0 24px 0 18px; border-left: 6px solid #D42A1E; background: #F4F4F4; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  @media (max-width: 700px) {
    html:not(.render), html:not(.render) body { height: auto; overflow: visible; }

    html:not(.render) { --sheet: max(42vh, calc(100vh - 75vw - 70px)); }

    #panel .sign { padding: 10px 12px 8px 16px; }
    #panel .sign button { min-width: 44px; min-height: 44px; font-size: 28px; }
    #panel .pbody { padding: 0 16px 24px; }

    #panel .crumbs .stop { padding: 6px 0; min-height: 40px; min-width: 44px; }

    html:not(.render) #main, html.share:not(.render) #main { width: min(100vw, calc((100vh - var(--vh, 0px)) * 4 / 3)); height: auto; overflow: visible; }
    html.share:not(.render) { --vh: 34px; }
    html:not(.render) #verdict { height: auto; line-height: 1.3; padding: 6px 14px 6px 12px; white-space: normal; }
    html:not(.render) #controls button { min-height: 44px; }
    html:not(.render) #controls input[type=range] { height: 44px; }
    html:not(.render) #hops { flex: none; overflow: visible; }
    html:not(.render) #panel { display: none; }

    #panel .sign button { min-width: 44px; min-height: 44px; font-size: 28px; }
    #panel a { padding: 12px 0; }
    #panel .crumbs .stop { padding: 6px 0; min-height: 40px; min-width: 44px; }
    #panel details summary { padding: 12px 0; }
  }
</style>

<div id="verdict" hidden></div>
<canvas id="stage" width="1200" height="900"></canvas>
<div id="controls">
  <button id="play"></button>
  <input id="scrub" type="range" min="0" max="1" step="0.0001" value="0">
  <span id="speed"><button data-s="0.5">0.5x</button><button data-s="1" class="on">1x</button><button data-s="2">2x</button></span>

</div><aside id="panel"></aside></div>

<tr><td><kbd>N</kbd> <kbd>↓</kbd> <kbd>Shift</kbd>+<kbd>→</kbd></td><td data-vocab="nextHop"></td></tr>
<tr><td><kbd>P</kbd> <kbd>↑</kbd> <kbd>Shift</kbd>+<kbd>←</kbd></td><td data-vocab="previousHop"></td></tr>

<tr><td><kbd>?</kbd></td><td data-vocab="help"></td></tr></table></div></div>
<script>
/*__TRACE_DATA__*/
</script>
<script>
(function () {
'use strict';
const STAGE = window.STAGE = { width: 1200, height: 900 };
const FPS = 24;
// Design tokens. NYC-subway-style palette; colours are original.
const C = {
  paper: '#FFFFFF', ink: '#111111', ink2: '#4A4A4A', ink3: '#9A9A9A', faint: '#E7E7E7',
  band: '#111111', bandInk: '#FFFFFF',

};
const LINE_COLORS = ['#2A62C9', '#1C8F5A', '#8B46C1', '#0B8A99', '#C23A7C', '#6F8A17', '#2C3F7E', '#9A5B26', '#4D7FA6', '#6A3B78', '#2F7A4C', '#B4572F'];
const F = { ui: '"Transit Sans", Arial, sans-serif' };
const font = (w, px) => `${w} ${px}px ${F.ui}`;
const INTRO = 0.75, OUTRO = 1.75;
const MIN_TRAVEL = 0.3;
const easeInOut = (p) => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
if (document.fonts && document.fonts.load) { document.fonts.load(font(400, 14)); document.fonts.load(font(700, 14)); }

// ------------------------------------------------------------------ model
const D = window.TRACE, OPT = window.VIZ_OPTS || {};
const REQUEST_VOCAB = { lineNoun: 'service', stationNoun: 'hop', hopNoun: 'hop', hopNounPlural: 'hops', play: 'Play', pause: 'Pause', helpTitle: 'Keyboard shortcuts', space: 'play / pause', nextHop: 'next hop', previousHop: 'previous hop', seek: 'seek 0.5 s', frame: 'step one frame', startEnd: 'start / end', speed: 'speed 0.5x / 1x / 2x', click: 'click', clickHelp: 'station, train or line: select that hop', inspectClick: 'click a station, train or line', pauseHelp: 'selects the hop in progress', escape: 'deselect / close', help: 'this help', of: 'of', video: '1 s of video', trace: 'trace', infrastructure: 'infrastructure', delay: 'DELAY', serviceAlert: 'SERVICE ALERT', request: 'request', response: 'response', legendDelay: 'delay: self time ≥', legendAlert: 'service alert: error starts here', legendInfra: 'dotted: infrastructure (no spans of its own)', synthetic: 'SYNTHETIC sample data', renderedLocally: 'rendered locally by Transit', unmatched: 'unmatched', matched: 'matched', contracts: 'contracts', noContractIndex: 'no contract index', error: 'error', slow: 'slow', ok: 'ok', tableTitle: 'Hops', tableStart: 'start', tableFrom: 'from', tableTo: 'to', tableSpan: 'span', tableStatus: 'status', tableContract: 'contract', infrastructureHop: 'infrastructure hop', infrastructureHopTitle: 'Infrastructure hop', unmatchedContracts: 'unmatched (contracts not indexed)', unmatchedShort: 'unmatched', noHopSelected: 'no hop selected', inspectHop: 'Pause, press', or: 'or', inspectTail: 'to inspect a hop.', shortcuts: 'Shortcuts', transit: 'Transit', hop: 'HOP', span: 'SPAN', from: 'from', client: 'client', server: 'server', noServerSpan: 'no server span', notInstrumented: 'is not instrumented', status: 'status', unset: 'unset', resource: 'resource', attributes: 'Attributes', serverSpan: 'server span', children: 'Children', none: 'none', sensitiveRedacted: 'Sensitive-looking keys are redacted at build time.', redactedAcross: 'attribute(s) redacted across this trace before rendering.', expectedRequestResponse: 'Expected request / response', contractsNotIndexed: 'Contracts not indexed. The contract layer is optional: build an index with', thenBuildWith: 'then build the page with', noHopContract: 'No hop contract for this span', internalWorkInside: 'internal work inside', noContractExpected: 'No contract expected', fallback: 'FALLBACK', matchedTag: 'MATCHED', message: 'Message', noRequestSchema: 'No request schema found', noResponseType: 'No response type found', responseBody: 'no body (void)', unknown: 'unknown', unresolved: 'unresolved', deeperFields: '… deeper fields not shown', optional: 'optional', required: 'required', sharedPackage: 'shared package', declared: 'declared', clientCallFrom: 'client call from', in: 'in', wholeTrace: 'of the whole trace', spanInsideClient: 'server span inside the client call', spanInsideParent: 'span inside its parent', deselect: 'Deselect (Esc)', more: 'more', confidenceHigh: 'high confidence', confidenceMedium: 'medium confidence', confidenceLow: 'low confidence', validator: 'validator', type: 'type', spec: 'spec', schema: 'schema', kind: 'kind', start: 'start', duration: 'duration', self: 'self', groups: { http: 'HTTP', db: 'DB', messaging: 'Messaging', rpc: 'RPC', other: 'Other' } };
const V = Object.assign({}, REQUEST_VOCAB, OPT.vocab || {});
if (V.skipped == null) V.skipped = 'skipped';

document.querySelectorAll('[data-vocab]').forEach((el) => { el.textContent = V[el.dataset.vocab] ?? el.dataset.vocab; });

const playButton = document.getElementById('play');
playButton.textContent = V.play;
const spans = D.spans.map((s) => Object.assign({}, s, { end: s.start + s.duration }));
const byId = new Map(spans.map((s) => [s.spanId, s]));

for (const s of spans) if (s.parentId && byId.has(s.parentId)) kids.get(s.parentId).push(s);

// self time = duration minus the union of child intervals
for (const s of spans) {

  if (k === '?' || (k === '/' && ev.shiftKey)) toggleHelp();
  else if (k === 'Escape') { if (!help.hidden) toggleHelp(false); else select(null, false); }
  else if (ev.code === 'Space') setPlaying(!playing, true);
  else if (k === 'n' || k === 'N' || k === 'ArrowDown' || (ev.shiftKey && k === 'ArrowRight')) stepHop(1);
  else if (k === 'p' || k === 'P' || k === 'ArrowUp' || (ev.shiftKey && k === 'ArrowLeft')) stepHop(-1);
  else if (k === 'ArrowRight') { setPlaying(false); show(T + 0.5); }
  else if (k === 'ArrowLeft') { setPlaying(false); show(T - 0.5); }
  else if (k === '.') { setPlaying(false); show(Math.round(T * FPS + 1) / FPS); }
  else if (k === ',') { setPlaying(false); show(Math.round(T * FPS - 1) / FPS); }
  else if (k === 'Home') { setPlaying(false); show(0); }
  else if (k === 'End') { setPlaying(false); show(SECONDS - 1 / FPS); }
  else if (k === '1') setSpeed(0.5);
  else if (k === '2') setSpeed(1);
  else if (k === '3') setSpeed(2);
  else handled = false;
  if (handled) ev.preventDefault();
});
// test hook for the Playwright interaction tests
window.TRANSIT_UI = {
  state: () => ({ t: T, playing, speed: SPEED, selected: sel && sel.spanId, hop: sel && hopOfSpan(sel) ? hops.indexOf(hopOfSpan(sel)) : -1, help: !help.hidden }),
  hops: hops.map((c) => ({ spanId: c.span.spanId, from: c.from, to: c.to, start: c.start, t: tOfMs(c.start) })),
  stations: order.map((n) => ({ id: n.id, x: n.x, y: n.y })),
  trainPoints: () => calls.map((c) => trainFor(c, traceMsAt(T))).filter(Boolean).map((r) => { const p = at(r.e.path, r.p * r.e.path.len); return { x: p.x, y: p.y, spanId: r.c.span.spanId }; }),
  edgePoint: (i) => { const c = hops[i], e = edgeOf(c), p = e.path.pts[Math.floor(e.path.pts.length / 2)]; return { x: p[0], y: p[1] }; },
};
const want = !RENDER && (q.get('span') || q.get('pin') || (location.hash.match(/span=([^&]+)/) || [])[1]);
renderPanel();
// --share: open paused on the first SERVICE ALERT with its hop in the panel, under a one-line verdict
const SHARE = !RENDER && OPT.share ? OPT.share : null;
if (SHARE) { document.documentElement.classList.add('share'); const vb = document.getElementById('verdict'); vb.textContent = SHARE.verdict; vb.title = SHARE.message ? `${SHARE.verdict}\n${SHARE.message}` : SHARE.verdict; vb.hidden = false; }
const shareOrigin = SHARE && !want && !q.has('t') && SHARE.origin && byId.get(SHARE.origin);
if (want && byId.has(decodeURIComponent(want))) select(byId.get(decodeURIComponent(want)), !q.has('t'));
else if (shareOrigin) { const h = hops.find((c) => c.callee === shareOrigin || c.span === shareOrigin); setPlaying(false); select(h ? h.span : shareOrigin, false); show(tOfMs(shareOrigin.end)); }
else show(T);
if (document.fonts) document.fonts.ready.then(() => show(T));
if (!RENDER && !q.has('t') && !q.has('paused') && !want && !shareOrigin) setPlaying(true);
})();
