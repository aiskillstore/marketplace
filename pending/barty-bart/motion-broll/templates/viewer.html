<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>/*TITLE*/ B-roll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#E9E7E2; --panel:#FFFFFF; --ink:#0B0B0B; --muted:#7D7A74; --line:#DEDAD3; --soft:#F3F1ED; --acc:#FF5A1F; --stage:#D9D6D0;
  --sans:'Geist',system-ui,-apple-system,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141412;--panel:#1D1C1A;--ink:#F2F0EC;--muted:#9C9891;--line:#34322E;--soft:#262522;--stage:#0B0B0A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141412;--panel:#1D1C1A;--ink:#F2F0EC;--muted:#9C9891;--line:#34322E;--soft:#262522;--stage:#0B0B0A;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 48px;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}}
.player{background:var(--panel);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05),0 12px 32px -14px rgba(0,0,0,.18)}
.screen{position:relative;aspect-ratio:16/9;background:var(--stage);max-width:100%}
video{position:absolute;inset:0;width:100%;height:100%;display:block}
.info{padding:16px 18px 18px;display:grid;gap:10px}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.tc{font-family:var(--mono);font-size:13px;background:var(--soft);border-radius:8px;padding:3px 9px;font-variant-numeric:tabular-nums}
.tag{font-size:12px;font-weight:500;color:#fff;background:var(--acc);border-radius:999px;padding:2px 9px}
.title{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0}
.quote{margin:0;color:var(--muted);font-size:15px;max-width:65ch}
.file{font-family:var(--mono);font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:7px 13px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.spacer{flex:1}
.hint{font-size:12.5px;color:var(--muted)}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.item button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--panel);border:1px solid transparent;border-radius:14px;padding:11px 12px}
.item button[aria-current="true"]{border-color:var(--ink)}
.num{font-family:var(--mono);font-size:13px;width:34px;height:34px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.item button[aria-current="true"] .num{background:var(--acc);color:#fff}
.it{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.iq{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.itc{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.foot{font-size:13px;color:var(--muted);max-width:75ch}
@media (prefers-reduced-motion: reduce){video{animation:none}}
</style>

<div class="wrap">
  <header>
    <h1>/*TITLE*/ · B-roll</h1>
    <span class="sub">/*SUB*/</span>
  </header>
  <div class="main">
    <section class="player" aria-label="Clip player">
      <div class="screen"><video id="vid" playsinline muted autoplay loop preload="auto"></video></div>
      <div class="info">
        <div class="meta"><span class="tc" id="tc"></span><button type="button" id="snd" style="padding:3px 10px;font-size:13px">Sound on</button><span class="tag" id="tag" hidden>Transparent overlay</span></div>
        <h2 class="title" id="title"></h2>
        <p class="quote" id="quote"></p>
        <div class="file" id="file"></div>
        <div class="controls">
          <button id="prev" type="button">← Prev</button>
          <button id="play" type="button" class="primary">Pause</button>
          <button id="next" type="button">Next →</button>
          <span class="spacer"></span>
          <label class="hint"><input type="checkbox" id="auto"> Play all in order</label>
        </div>
      </div>
    </section>
    <ol class="list" id="list"></ol>
  </div>
  <p class="foot">The timecode is where each clip goes in your edit. Transparent panel clips are shown here on black; in your edit they sit in the empty area of the shot. Arrow keys switch clips and space pauses.</p>
</div>

<script>
const CLIPS=/*CLIPS*/[];
const $=id=>document.getElementById(id);
const vid=$('vid'), list=$('list');
let cur=0, touched=false; addEventListener('pointerdown',()=>{touched=true;},{capture:true}); addEventListener('keydown',()=>{touched=true;},{capture:true});
list.innerHTML=CLIPS.map((c,i)=>`<li class="item"><button type="button" data-i="${i}"><span class="num">${c.n}</span><span><div class="it">${c.t}</div><div class="itc">${c.tc}</div><div class="iq">${c.q}</div></span></button></li>`).join('');
function show(i){
  cur=(i+CLIPS.length)%CLIPS.length; const c=CLIPS[cur];
  $('tc').textContent=c.tc; $('title').textContent=c.n+' · '+c.t; $('quote').textContent=c.q; $('file').textContent=c.f; $('tag').hidden=!c.alpha;
  vid.loop=!$('auto').checked; vid.muted=!(c.full&&touched); vid.src=c.src; vid.play().catch(()=>{}); $('play').textContent='Pause'; $('snd').hidden=!c.full; $('snd').textContent=vid.muted?'Sound on':'Sound off';
  list.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',String(+b.dataset.i===cur)));
}
list.addEventListener('click',e=>{const b=e.target.closest('button[data-i]'); if(b) show(+b.dataset.i);});
$('snd').onclick=()=>{vid.muted=!vid.muted;$('snd').textContent=vid.muted?'Sound on':'Sound off';};
$('prev').onclick=()=>show(cur-1); $('next').onclick=()=>show(cur+1);
$('play').onclick=()=>{if(vid.paused){vid.play();$('play').textContent='Pause';}else{vid.pause();$('play').textContent='Play';}};
$('auto').onchange=()=>{vid.loop=!$('auto').checked; if($('auto').checked){vid.currentTime=0;vid.play();}};
vid.addEventListener('ended',()=>{if($('auto').checked) show(cur+1);});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return; if(e.key==='ArrowRight'){show(cur+1);e.preventDefault();} else if(e.key==='ArrowLeft'){show(cur-1);e.preventDefault();} else if(e.key===' '){$('play').click();e.preventDefault();}});
show(0);
</script>

</html>
