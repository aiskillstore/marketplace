<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>/*TITLE*/ before and after</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#E9E7E2;--panel:#FFFFFF;--ink:#0B0B0B;--muted:#7D7A74;--line:#DAD6CF;--soft:#F3F1ED;--acc:#FF5A1F;--stage:#0B0B0B;
 --sans:'Geist',system-ui,-apple-system,sans-serif;--mono:'Geist Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141412;--panel:#1D1C1A;--ink:#F2F0EC;--muted:#9C9891;--line:#34322E;--soft:#262522;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141412;--panel:#1D1C1A;--ink:#F2F0EC;--muted:#9C9891;--line:#34322E;--soft:#262522;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1400px;margin:0 auto;padding-inline:20px;padding-block:24px 44px;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:transparent;border:0;border-radius:9px;padding:6px 13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.views{display:grid;gap:14px}
.views.side{grid-template-columns:1fr 1fr}
.views.stack{grid-template-columns:minmax(0,960px);justify-content:center}
@media (max-width:760px){.views.side{grid-template-columns:1fr}}
.card{background:var(--panel);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05),0 12px 30px -14px rgba(0,0,0,.2)}
.lab{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:14px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.card.after .dot{background:var(--acc)}
.screen{position:relative;aspect-ratio:16/9;background:var(--stage);max-width:100%}
video{position:absolute;inset:0;width:100%;height:100%;display:block}
.wipe{display:none}
.views.wipe-mode .card.before,.views.wipe-mode .card.after{display:none}
.views.wipe-mode{grid-template-columns:minmax(0,1100px);justify-content:center}
.views.wipe-mode .wipe{display:block}
#wTop{clip-path:inset(0 0 0 50%)}
.handle{position:absolute;top:0;bottom:0;width:3px;background:#fff;left:50%;transform:translateX(-1.5px);box-shadow:0 0 0 1px rgba(0,0,0,.2);pointer-events:none}
.handle::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.wl{position:absolute;top:10px;font-size:12px;font-weight:600;color:#fff;background:rgba(0,0,0,.55);border-radius:999px;padding:3px 10px}
.bar{background:var(--panel);border-radius:16px;padding:14px 16px;display:grid;gap:12px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.btn{font:inherit;font-size:14px;font-weight:500;color:var(--bg);background:var(--ink);border:0;border-radius:10px;padding:8px 16px;cursor:pointer;min-width:84px}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.time{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.now{font-size:14px;font-weight:500}
.now b{color:var(--acc);font-weight:600}
.track{position:relative;height:44px;cursor:pointer;touch-action:none}
.rail{position:absolute;left:0;right:0;top:26px;height:6px;border-radius:3px;background:var(--soft)}
.fill{position:absolute;left:0;top:26px;height:6px;border-radius:3px;background:var(--ink)}
.mk{position:absolute;top:0;height:20px;border-radius:6px;background:color-mix(in srgb,var(--acc) 18%,transparent);border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);font-family:var(--mono);font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--ink);overflow:hidden;box-sizing:border-box}
.mk.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.knob{position:absolute;top:20px;width:18px;height:18px;border-radius:50%;background:var(--ink);transform:translateX(-9px);box-shadow:0 0 0 3px var(--panel)}
.foot{font-size:13px;color:var(--muted);max-width:80ch;margin:0}
</style>

<div class="wrap">
  <header>
    <div><h1>Before and after · motion B-roll</h1><div class="sub">/*SUB*/</div></div>
    <div class="seg" role="group" aria-label="Layout">
      <button type="button" data-mode="side" aria-pressed="true">Side by side</button>
      <button type="button" data-mode="stack" aria-pressed="false">Stacked</button>
      <button type="button" data-mode="wipe-mode" aria-pressed="false">Wipe</button>
    </div>
  </header>

  <div class="views side" id="views">
    <div class="card before"><div class="lab"><span class="dot"></span>Original</div><div class="screen"><video id="vA" src="/*ORIG*/" muted playsinline preload="auto"></video></div></div>
    <div class="card after"><div class="lab"><span class="dot"></span>With motion B-roll</div><div class="screen"><video id="vB" src="/*BROLL*/" muted playsinline preload="auto"></video></div></div>
    <div class="card wipe"><div class="lab"><span class="dot"></span>Drag across the picture to compare</div>
      <div class="screen" id="wScreen" style="touch-action:none;cursor:ew-resize">
        <video id="wBot" src="/*ORIG*/" muted playsinline preload="auto"></video>
        <video id="wTop" src="/*BROLL*/" muted playsinline preload="auto"></video>
        <span class="wl" style="left:10px">Original</span><span class="wl" style="right:10px">B-roll</span>
        <div class="handle" id="handle"></div>
      </div>
    </div>
  </div>

  <div class="bar">
    <div class="ctl">
      <button class="btn" id="play" type="button">Play</button>
      <button class="btn ghost" id="snd" type="button">Sound on</button>
      <span class="time" id="time">0:00.0</span>
      <span class="now" id="now">Speaker only</span>
    </div>
    <div class="track" id="track" role="slider" aria-label="Seek" tabindex="0" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
      <div class="rail"></div><div class="fill" id="fill"></div><div id="marks"></div><div class="knob" id="knob"></div>
    </div>
  </div>
  <p class="foot">Orange blocks on the timeline are where an animation is on screen. Click one to jump to it. Arrow keys skip 2 seconds, space plays and pauses.</p>
</div>

<script>
const D=/*DUR*/0;
const CL=/*MARKS*/[];
const $=id=>document.getElementById(id);
const views=$('views'); let mode='side';
const master=()=>mode==='wipe-mode'?$('wTop'):$('vB');
const followers=()=>mode==='wipe-mode'?[$('wBot')]:[$('vA')];
const all=['vA','vB','wBot','wTop'].map($);
$('marks').innerHTML=CL.map((c,i)=>`<div class="mk" data-i="${i}" style="left:${c[0]/D*100}%;width:${(c[1]-c[0])/D*100}%">${c[2]}</div>`).join('');
function fmt(t){const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1);}
function seek(t){t=Math.max(0,Math.min(D-0.05,t));all.forEach(v=>{try{v.currentTime=t}catch(e){}});paint(t);}
function paint(t){
  $('fill').style.width=(t/D*100)+'%';$('knob').style.left=(t/D*100)+'%';$('time').textContent=fmt(t)+' / '+fmt(D);$('track').setAttribute('aria-valuenow',t.toFixed(1));
  const c=CL.findIndex(c=>t>=c[0]&&t<c[1]);$('now').innerHTML=c<0?'Speaker only':`<b>${CL[c][2]}</b> · ${CL[c][3]}`;
  document.querySelectorAll('.mk').forEach(m=>m.classList.toggle('on',+m.dataset.i===c));
}
function tick(){const m=master();const t=m.currentTime;for(const f of followers()){if(Math.abs(f.currentTime-t)>0.08){try{f.currentTime=t}catch(e){}} if(m.paused!==f.paused){m.paused?f.pause():f.play().catch(()=>{});}}paint(t);requestAnimationFrame(tick);}
requestAnimationFrame(tick);
function setPlay(p){const m=master();if(p){m.play().catch(()=>{});followers().forEach(f=>f.play().catch(()=>{}));}else{all.forEach(v=>v.pause());}$('play').textContent=p?'Pause':'Play';}
$('play').onclick=()=>setPlay(master().paused);
master().addEventListener('ended',()=>setPlay(false));
all.forEach(v=>v.addEventListener('ended',()=>{if(v===master()){setPlay(false);seek(0);}}));
let sound=false;function applySound(){all.forEach(v=>v.muted=true);master().muted=!sound;$('snd').textContent=sound?'Sound off':'Sound on';}
$('snd').onclick=()=>{sound=!sound;applySound();};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  const t=master().currentTime, playing=!master().paused; all.forEach(v=>v.pause());
  mode=b.dataset.mode; views.className='views '+mode; document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  seek(t); applySound(); if(playing) setPlay(true);
});
// scrubbing
const tr=$('track');let drag=false;
const tAt=e=>{const r=tr.getBoundingClientRect();return (e.clientX-r.left)/r.width*D;};
tr.addEventListener('pointerdown',e=>{const mk=e.target.closest('.mk');if(mk){seek(CL[+mk.dataset.i][0]+0.05);return;}drag=true;tr.setPointerCapture(e.pointerId);seek(tAt(e));});
tr.addEventListener('pointermove',e=>{if(drag)seek(tAt(e));});
tr.addEventListener('pointerup',()=>drag=false);
document.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();$('play').click();}else if(e.key==='ArrowRight'){seek(master().currentTime+2);}else if(e.key==='ArrowLeft'){seek(master().currentTime-2);}});
// wipe
const ws=$('wScreen');let wd=false;
function setWipe(e){const r=ws.getBoundingClientRect();const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));$('wTop').style.clipPath=`inset(0 0 0 ${p*100}%)`;$('handle').style.left=(p*100)+'%';}
ws.addEventListener('pointerdown',e=>{wd=true;ws.setPointerCapture(e.pointerId);setWipe(e);});
ws.addEventListener('pointermove',e=>{if(wd)setWipe(e);});
ws.addEventListener('pointerup',()=>wd=false);
applySound();paint(0);
</script>

</html>
