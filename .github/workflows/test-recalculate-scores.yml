name: Test recalculate-scores wrapper

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/check-cache-invalidation-aggregate.sh"
      - "scripts/detect-changed-skills.mjs"
      - "scripts/materialize-changed-skills.mjs"
      - "scripts/resolve-manual-skills.mjs"
      - "scripts/invalidate-cache.sh"
      - "scripts/plan-cache-invalidation.mjs"
      - "scripts/pack-production.mjs"
      - "scripts/pack-production-manual-publish.mjs"
      - "scripts/recalculate-scores.sh"
      - "scripts/score-cache-closure.mjs"
      - "scripts/refresh-security-research-stats.sh"
      - "scripts/runner-disk-guard.sh"
      - "scripts/tests/**"
      - "governance/fresh-canonical-audit/**"
      - "ops/systemd/**"
      - "schemas/skill-report.schema.json"
      - ".github/workflows/refresh-security-research-stats.yml"
      - ".github/workflows/reconcile-security-events.yml"
      - ".github/workflows/sync-audit-compute.yml"
      - ".github/workflows/sync-to-supabase.yml"
      - ".github/workflows/scrape-skills-sh.yml"
      - ".github/workflows/warm-cache.yml"
      - ".github/workflows/recalculate-scores.yml"
      - ".github/workflows/recover-score-cache-closure.yml"
      - ".github/workflows/cleanup-runners.yml"
      - ".github/workflows/generate-packs.yml"
      - ".github/workflows/govern-fresh-canonical-audits.yml"
      - ".github/workflows/pack-review.yml"
      - ".github/workflows/publish-pack-production-v4.yml"
      - ".github/actions/invalidate-cache/action.yml"
      - ".github/workflows/test-recalculate-scores.yml"
  push:
    branches: [main]
    paths:
      - "scripts/check-cache-invalidation-aggregate.sh"
      - "scripts/detect-changed-skills.mjs"
      - "scripts/materialize-changed-skills.mjs"
      - "scripts/resolve-manual-skills.mjs"
      - "scripts/invalidate-cache.sh"
      - "scripts/plan-cache-invalidation.mjs"
      - "scripts/pack-production.mjs"
      - "scripts/pack-production-manual-publish.mjs"
      - "scripts/recalculate-scores.sh"
      - "scripts/score-cache-closure.mjs"
      - "scripts/refresh-security-research-stats.sh"
      - "scripts/runner-disk-guard.sh"
      - "scripts/tests/**"
      - "governance/fresh-canonical-audit/**"
      - "ops/systemd/**"
      - "schemas/skill-report.schema.json"
      - ".github/workflows/refresh-security-research-stats.yml"
      - ".github/workflows/reconcile-security-events.yml"
      - ".github/workflows/sync-audit-compute.yml"
      - ".github/workflows/sync-to-supabase.yml"
      - ".github/workflows/scrape-skills-sh.yml"
      - ".github/workflows/warm-cache.yml"
      - ".github/workflows/recalculate-scores.yml"
      - ".github/workflows/recover-score-cache-closure.yml"
      - ".github/workflows/cleanup-runners.yml"
      - ".github/workflows/generate-packs.yml"
      - ".github/workflows/govern-fresh-canonical-audits.yml"
      - ".github/workflows/pack-review.yml"
      - ".github/workflows/publish-pack-production-v4.yml"
      - ".github/actions/invalidate-cache/action.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Fork head code runs only on a fresh GitHub-hosted runner.
          # Tests read workflow fixtures as well as the complete scripts tree.
          sparse-checkout: |
            .github
            governance/fresh-canonical-audit
            ops/systemd
            scripts
            package.json
            package-lock.json
            schemas

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run script unit tests
        run: |
          set -euo pipefail
          chmod +x scripts/check-cache-invalidation-aggregate.sh scripts/detect-changed-skills.mjs scripts/materialize-changed-skills.mjs scripts/resolve-manual-skills.mjs scripts/invalidate-cache.sh scripts/plan-cache-invalidation.mjs scripts/recalculate-scores.sh scripts/refresh-security-research-stats.sh scripts/tests/fake-cli.sh
          bash -n scripts/check-cache-invalidation-aggregate.sh
          bash -n scripts/invalidate-cache.sh
          bash -n scripts/recalculate-scores.sh
          bash -n scripts/refresh-security-research-stats.sh
          bash -n scripts/tests/fake-cli.sh
          node --check scripts/detect-changed-skills.mjs
          node --check scripts/materialize-changed-skills.mjs
          node --check scripts/resolve-manual-skills.mjs
          node --check scripts/plan-cache-invalidation.mjs
          node --check scripts/score-cache-closure.mjs
          node --check scripts/pack-production-manual-publish.mjs
          CI=true node --test scripts/tests/*.test.mjs
