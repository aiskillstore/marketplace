name: Sync to Supabase (Incremental)
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.correlation_id != '' && format('Provider sync {0}', inputs.correlation_id) || 'Sync to Supabase (Incremental)' }}

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Specific skill slugs to sync (comma or space separated, optional)'
        type: string
        default: ''
      skip_cache_warm:
        description: 'Skip cache warming after sync'
        type: boolean
        default: false
      correlation_id:
        description: 'Optional exact idempotency correlation for trusted automation'
        type: string
        default: ''
      merge_commit_sha:
        description: 'Exact marker-bound merge commit for correlated source-monitor recovery'
        type: string
        default: ''

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: sync-supabase
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message || '', 'AgentCrew-Recovery:')
    runs-on: self-hosted
    timeout-minutes: 240
    outputs:
      synced_skill_count: ${{ steps.synced-plan.outputs.skill_count }}
      skip_sync: ${{ steps.changes.outputs.skip_sync }}
    steps:
      - name: Clear inherited sync checkout
        run: |
          set -euo pipefail
          EXPECTED_WORKSPACE="${RUNNER_WORKSPACE:?}/${GITHUB_REPOSITORY#*/}"
          if [ "${GITHUB_WORKSPACE:?}" != "$EXPECTED_WORKSPACE" ]; then
            echo "::error::Refusing to clear unexpected workspace: $GITHUB_WORKSPACE"
            exit 1
          fi
          cd "${RUNNER_TEMP:?}"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"

      - name: Checkout immutable sync runtime
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PATTERNS_FILE="${RUNNER_TEMP:?}/sync-runtime-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}.patterns"
          trap 'rm -f "$PATTERNS_FILE"' EXIT
          cat > "$PATTERNS_FILE" <<'EOF'
          /scripts/resolve-manual-skills.mjs
          /scripts/detect-changed-skills.mjs
          /scripts/materialize-changed-skills.mjs
          /scripts/validate-correlated-sync-roots.mjs
          /scripts/refresh-security-research-stats.sh
          /.github/actions/download-skillstore-cli/
          EOF

          CHECKOUT_SUCCEEDED=false
          for CHECKOUT_ATTEMPT in 1 2 3; do
            cd "${RUNNER_TEMP:?}"
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            git init "$GITHUB_WORKSPACE"
            git -C "$GITHUB_WORKSPACE" remote add origin "${GITHUB_SERVER_URL:?}/${GITHUB_REPOSITORY:?}.git"
            git -C "$GITHUB_WORKSPACE" config gc.auto 0
            git -C "$GITHUB_WORKSPACE" sparse-checkout init --no-cone
            git -C "$GITHUB_WORKSPACE" sparse-checkout set --no-cone --stdin < "$PATTERNS_FILE"
            if git -C "$GITHUB_WORKSPACE" -c protocol.version=2 fetch \
                --no-tags --prune --no-recurse-submodules --filter=blob:none \
                origin '+refs/heads/main:refs/remotes/origin/main' \
              && git -C "$GITHUB_WORKSPACE" cat-file -e "$EXPECTED_SHA^{commit}" \
              && git -C "$GITHUB_WORKSPACE" checkout --detach --force "$EXPECTED_SHA"; then
              CHECKOUT_SUCCEEDED=true
              break
            fi
            if [ "$CHECKOUT_ATTEMPT" -lt 3 ]; then
              echo "::warning::Immutable sync checkout failed; retrying attempt $((CHECKOUT_ATTEMPT + 1))/3"
              sleep "$((CHECKOUT_ATTEMPT * 5))"
            fi
          done
          test "$CHECKOUT_SUCCEEDED" = true || {
            echo "::error::Immutable sync checkout failed after 3 attempts"
            exit 1
          }

      - name: Normalize pinned sync runtime checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::workflow SHA is not an exact 40-character commit"
            exit 1
          fi
          checked_out_sha=$(git rev-parse HEAD)
          if [ "$checked_out_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::checkout SHA mismatch: expected=$EXPECTED_SHA actual=$checked_out_sha"
            exit 1
          fi
          test "$(git config --bool core.sparseCheckout)" = true
          test -f "$(git rev-parse --git-path info/sparse-checkout)"
          for required_path in \
            scripts/resolve-manual-skills.mjs \
            scripts/detect-changed-skills.mjs \
            scripts/materialize-changed-skills.mjs \
            scripts/validate-correlated-sync-roots.mjs \
            scripts/refresh-security-research-stats.sh \
            .github/actions/download-skillstore-cli/action.yml; do
            if git ls-files -v -- "$required_path" | awk '$1 ~ /^S/ { found=1 } END { exit !found }'; then
              echo "::error::required pinned runtime file was not materialized: $required_path"
              exit 1
            fi
            if [ ! -f "$required_path" ] || [ -L "$required_path" ]; then
              echo "::error::required pinned runtime file is missing or not regular: $required_path"
              exit 1
            fi
            expected_blob=$(git rev-parse "$EXPECTED_SHA:$required_path")
            actual_blob=$(git hash-object "$required_path")
            if [ "$actual_blob" != "$expected_blob" ]; then
              echo "::error::runtime file does not match workflow commit: $required_path"
              exit 1
            fi
          done

      - name: Validate trusted sync correlation
        id: trusted-correlation
        env:
          CORRELATION_ID: ${{ inputs.correlation_id }}
          INPUT_SLUGS: ${{ inputs.slugs }}
          MERGE_COMMIT_SHA: ${{ inputs.merge_commit_sha }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          CURRENT_MAIN_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$CORRELATION_ID" ]; then
            echo "sync_commit_sha=$CURRENT_MAIN_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" != 'workflow_dispatch' ] || [ "$GIT_REF" != 'refs/heads/main' ]; then
            echo "::error::A correlated provider sync must be dispatched on main"
            exit 1
          fi
          if ! [[ "$CORRELATION_ID" =~ ^source-monitor-pr-([1-9][0-9]*)-([0-9a-f]{40})-([0-9a-f]{40})-([0-9a-f]{64})$ ]]; then
            echo "::error::Invalid provider sync correlation"
            exit 1
          fi
          PR_NUMBER="${BASH_REMATCH[1]}"
          HEAD_SHA="${BASH_REMATCH[2]}"
          CORRELATED_MERGE_SHA="${BASH_REMATCH[3]}"
          CORRELATED_ROOTS_DIGEST="${BASH_REMATCH[4]}"
          if [ "$MERGE_COMMIT_SHA" != "$CORRELATED_MERGE_SHA" ] || [ -z "$INPUT_SLUGS" ]; then
            echo "::error::A correlated provider sync requires exact merge identity and Skill slugs"
            exit 1
          fi

          PR=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")
          jq -e --arg repository "$REPOSITORY" --arg head_sha "$HEAD_SHA" --arg merge_sha "$MERGE_COMMIT_SHA" '
            .merged == true and
            .base.ref == "main" and
            .user.id == 254047988 and
            .user.login == "ai-skill-store[bot]" and
            .head.repo.full_name == $repository and
            (.head.ref | test("^skill-source-monitor/run-[1-9][0-9]*$")) and
            .head.sha == $head_sha and
            .merge_commit_sha == $merge_sha
          ' <<< "$PR" >/dev/null || {
            echo "::error::Provider sync correlation does not match the authoritative merged source-monitor PR"
            exit 1
          }
          COMPARE=$(gh api "repos/$REPOSITORY/compare/${MERGE_COMMIT_SHA}...${CURRENT_MAIN_SHA}")
          jq -e --arg merge_sha "$MERGE_COMMIT_SHA" '
            .merge_base_commit.sha == $merge_sha and (.status == "ahead" or .status == "identical")
          ' <<< "$COMPARE" >/dev/null || {
            echo "::error::Correlated merge is not on the current main lineage"
            exit 1
          }

          mapfile -t EXPECTED_SLUGS < <(tr ', ' '\n\n' <<< "$INPUT_SLUGS" | sed '/^$/d' | LC_ALL=C sort -u)
          mapfile -t CHANGED_FILES < <(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')
          TREE=$(gh api "repos/$REPOSITORY/git/trees/$HEAD_SHA?recursive=1")
          jq -e '.truncated == false and (.tree | type == "array")' <<< "$TREE" >/dev/null
          mapfile -t CANDIDATE_ROOTS < <(jq -r '
            [.tree[] | select(.type == "blob") | .path] as $blobs
            | $blobs[]
            | select(endswith("/skill-report.json"))
            | sub("/skill-report.json$"; "")
            | select((split("/") | length) == 2 or (split("/") | length) == 3)
            | select(split("/")[1:] | all(test("^[A-Za-z0-9][A-Za-z0-9._-]*$")))
            | select(. as $root | $blobs | index($root + "/SKILL.md"))
          ' <<< "$TREE" | LC_ALL=C sort -u)
          [ "${#EXPECTED_SLUGS[@]}" -gt 0 ] && [ "${#EXPECTED_SLUGS[@]}" -le 25 ]
          ACTUAL_ROOTS=()
          for file in "${CHANGED_FILES[@]}"; do
            matched_root=''
            for root in "${CANDIDATE_ROOTS[@]}"; do
              if [[ "$file" == "$root" || "$file" == "$root/"* ]] \
                && [ "${#root}" -gt "${#matched_root}" ]; then
                matched_root="$root"
              fi
            done
            [ -n "$matched_root" ] || {
              echo "::error::Changed file is outside an exact canonical provider sync root: $file"
              exit 1
            }
            ACTUAL_ROOTS+=("${matched_root#skills/}")
          done
          mapfile -t ACTUAL_SLUGS < <(printf '%s\n' "${ACTUAL_ROOTS[@]}" | LC_ALL=C sort -u)
          [ "${#ACTUAL_SLUGS[@]}" -eq "${#EXPECTED_SLUGS[@]}" ] \
            && diff -u <(printf '%s\n' "${EXPECTED_SLUGS[@]}") <(printf '%s\n' "${ACTUAL_SLUGS[@]}") || {
              echo "::error::Correlated provider sync roots do not exactly match the merged PR"
              exit 1
            }
          ROOTS_CANONICAL=$(IFS=$'\n'; printf '%s' "${ACTUAL_SLUGS[*]}")
          ROOTS_DIGEST=$(printf '%s' "$ROOTS_CANONICAL" | sha256sum | awk '{print $1}')
          [ "$ROOTS_DIGEST" = "$CORRELATED_ROOTS_DIGEST" ] \
            && [ "$CORRELATION_ID" = "source-monitor-pr-${PR_NUMBER}-${HEAD_SHA}-${MERGE_COMMIT_SHA}-${ROOTS_DIGEST}" ] || {
            echo "::error::Provider sync correlation is not bound to the exact canonical root set"
            exit 1
          }
          node ./scripts/validate-correlated-sync-roots.mjs \
            --merge "$MERGE_COMMIT_SHA" \
            --current "$CURRENT_MAIN_SHA" \
            --slugs "${ACTUAL_SLUGS[*]}"
          echo "sync_commit_sha=$MERGE_COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify durable provider sync dispatch outbox
        id: provider_sync_claim
        if: inputs.correlation_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          MERGE_COMMIT_SHA: ${{ inputs.merge_commit_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          DIGEST=$(printf '%s' "$CORRELATION_ID" | sha256sum | awk '{print $1}')
          OUTBOX_PREFIX="tags/agentcrew-dispatch-outbox/provider-sync/$DIGEST/"
          CONTEXT="agentcrew/provider-sync/$DIGEST"
          OUTBOX=$(gh api "repos/$REPOSITORY/git/matching-refs/$OUTBOX_PREFIX")
          jq -e --arg prefix "refs/$OUTBOX_PREFIX" --arg merge_sha "$MERGE_COMMIT_SHA" '
            length > 0 and length <= 8 and
            all(.[];
              (.ref | startswith($prefix)) and
              ((.ref | ltrimstr($prefix)) | test("^[0-9]{13}-[1-9][0-9]*$")) and
              .object.type == "commit" and
              .object.sha == $merge_sha)
          ' <<< "$OUTBOX" >/dev/null || {
            echo "::error::Durable provider sync dispatch outbox does not bind the exact merge commit"
            exit 1
          }
          STATUSES=$(gh api --paginate "repos/$REPOSITORY/commits/$MERGE_COMMIT_SHA/statuses?per_page=100" | jq -s 'add')
          if jq -e --arg context "$CONTEXT" 'any(.[]; .context == $context)' <<< "$STATUSES" >/dev/null; then
            echo "::error::Existing durable provider sync status refuses duplicate execution"
            exit 1
          fi
          gh api --method POST "repos/$REPOSITORY/statuses/$MERGE_COMMIT_SHA" \
            -f state=pending -f context="$CONTEXT" \
            -f description='Correlated provider sync is running' \
            -f target_url="https://github.com/$REPOSITORY/actions/runs/${{ github.run_id }}"
          echo "owns_reservation=true" >> "$GITHUB_OUTPUT"

      - name: Wait for authoritative publication completion
        id: publication-correlation
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t CORRELATIONS < <(
            sed -nE 's/^AgentCrew-Publication: (submission-pr-[1-9][0-9]*-[0-9a-f]{40}-[0-9a-f]{40})$/\1/p' <<< "$PUSH_MESSAGE"
          )
          if [ "${#CORRELATIONS[@]}" -eq 0 ]; then
            exit 0
          fi
          [ "${#CORRELATIONS[@]}" -eq 1 ] || {
            echo "::error::Publication push has multiple correlation trailers"
            exit 1
          }
          CORRELATION_ID="${CORRELATIONS[0]}"
          [[ "$CORRELATION_ID" =~ ^submission-pr-([1-9][0-9]*)-([0-9a-f]{40})-([0-9a-f]{40})$ ]]
          MERGE_COMMIT_SHA="${BASH_REMATCH[3]}"
          echo "correlation_id=$CORRELATION_ID" >> "$GITHUB_OUTPUT"
          echo "merge_commit_sha=$MERGE_COMMIT_SHA" >> "$GITHUB_OUTPUT"
          PUBLICATION_RUN=''
          for attempt in {1..60}; do
            RUNS=$(gh api "repos/$REPOSITORY/actions/workflows/on-pr-merge.yml/runs?event=workflow_dispatch&per_page=100")
            PUBLICATION_RUN=$(jq -c --arg title "Publication $CORRELATION_ID" --arg repository "$REPOSITORY" '
              [.workflow_runs[]
                | select(.display_title == $title)
                | select(.head_branch == "main")
                | select(.head_repository.full_name == $repository)][0] // {}
            ' <<< "$RUNS")
            if [ "$(jq -r '.status // ""' <<< "$PUBLICATION_RUN")" = completed ]; then
              break
            fi
            [ "$attempt" -eq 60 ] || sleep 5
          done
          [ "$(jq -r '.status // ""' <<< "$PUBLICATION_RUN")" = completed ] \
            && [ "$(jq -r '.conclusion // ""' <<< "$PUBLICATION_RUN")" = success ] || {
              echo "::error::Correlated publication failed or completion is unknown"
              exit 1
            }

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: marketplace,skillstore

      - name: Find last successful sync commit
        if: inputs.slugs == ''
        id: last_sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Advance the baseline when the provider step itself succeeded, even if a
          # later callback/status step failed. Conversely, a failed provider step is
          # an unknown partial effect and blocks automatic replay for inspection.
          RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/sync-to-supabase.yml/runs?status=completed&event=push&per_page=100")
          LAST_SHA=''
          LAST_CREATED_AT=''
          while IFS=$'\t' read -r run_id head_sha created_at run_conclusion; do
            [ -n "$run_id" ] || continue
            JOBS=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/jobs?per_page=100")
            PUBLICATION_CONCLUSION=$(jq -r '[.jobs[].steps[]? | select(.name == "Wait for authoritative publication completion")][0].conclusion // ""' <<< "$JOBS")
            SYNC_CONCLUSION=$(jq -r '[.jobs[].steps[]? | select(.name == "Sync skills to Supabase")][0].conclusion // ""' <<< "$JOBS")
            if [ "$PUBLICATION_CONCLUSION" = failure ] || [ "$PUBLICATION_CONCLUSION" = cancelled ]; then
              echo "::error::Previous publication push run $run_id did not establish authoritative publication success; inspection is required"
              exit 1
            fi
            if [ "$SYNC_CONCLUSION" = success ] \
              || { [ "$SYNC_CONCLUSION" = skipped ] && [ "$run_conclusion" = success ]; }; then
              LAST_SHA="$head_sha"
              LAST_CREATED_AT="$created_at"
              break
            fi
            if [ "$run_conclusion" = skipped ]; then
              continue
            fi
            echo "::error::Previous provider sync run $run_id lacks closed provider evidence ($SYNC_CONCLUSION); inspection is required before replay"
            exit 1
          done < <(jq -r '.workflow_runs[] | [.id, .head_sha, .created_at, .conclusion] | @tsv' <<< "$RUNS")

          if [ -z "$LAST_SHA" ] || [ -z "$LAST_CREATED_AT" ]; then
            echo "::error::No provider-complete push sync baseline found; refusing an incomplete fallback"
            exit 1
          fi
          if ! git cat-file -e "$LAST_SHA^{commit}" 2>/dev/null \
            || ! git merge-base --is-ancestor "$LAST_SHA" "${{ github.sha }}"; then
            echo "::error::Last successful sync $LAST_SHA is not an ancestor of ${{ github.sha }}"
            exit 1
          fi

          echo "Last successful sync at: $LAST_SHA"
          echo "base_sha=$LAST_SHA" >> "$GITHUB_OUTPUT"
          echo "base_run_created_at=$LAST_CREATED_AT" >> "$GITHUB_OUTPUT"

      - name: Detect changed skills
        id: changes
        env:
          BASE_SHA: ${{ steps.last_sync.outputs.base_sha }}
          BASE_RUN_CREATED_AT: ${{ steps.last_sync.outputs.base_run_created_at }}
          HEAD_SHA: ${{ github.sha }}
          SYNC_COMMIT_SHA: ${{ steps.trusted-correlation.outputs.sync_commit_sha }}
          INPUT_SLUGS: ${{ inputs.slugs }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_SLUGS" ]; then
            echo "Specific slugs requested: $INPUT_SLUGS"
            # Resolve against the immutable workflow commit. A mutable self-hosted
            # checkout may not have a skills/ directory at all.
            CHANGED=$(node ./scripts/resolve-manual-skills.mjs \
              --commit "$SYNC_COMMIT_SHA" \
              --skills "$INPUT_SLUGS")
            echo "Resolved manual skill paths: $CHANGED"
            echo "mode=manual-slugs" >> $GITHUB_OUTPUT
          else
            echo "Comparing HEAD against: $BASE_SHA"
            # Resolve both the diff and the published-skill inventory from pinned
            # Git trees. A self-hosted runner checkout may be sparse or mutable;
            # it must never turn a real commit diff into an empty sync plan. A
            # successful bounded manual recovery can subtract only its verified
            # artifact slugs whose entire pinned skill tree is still unchanged.
            MAX_RECOVERY_RUNS=100
            RECOVERIES_FILE="$RUNNER_TEMP/recovered-syncs.json"
            jq -n '[]' > "$RECOVERIES_FILE"

            if [ -n "$BASE_RUN_CREATED_AT" ]; then
              RUNS_RESPONSE=$(gh api "repos/${{ github.repository }}/actions/workflows/sync-to-supabase.yml/runs?status=completed&event=workflow_dispatch&per_page=$MAX_RECOVERY_RUNS")
              PAGE_COUNT=$(jq '.workflow_runs | length' <<< "$RUNS_RESPONSE")
              OLDEST_CREATED_AT=$(jq -r '.workflow_runs[-1].created_at // ""' <<< "$RUNS_RESPONSE")
              if [ "$PAGE_COUNT" -eq "$MAX_RECOVERY_RUNS" ] && [[ "$OLDEST_CREATED_AT" > "$BASE_RUN_CREATED_AT" ]]; then
                echo "::error::More than $MAX_RECOVERY_RUNS completed manual recoveries exist after the push baseline"
                exit 1
              fi

              RECOVERY_RUNS=$(jq --arg baseline "$BASE_RUN_CREATED_AT" --arg repository "${{ github.repository }}" '
                [.workflow_runs[]
                  | select(.created_at > $baseline)
                  | select(.head_branch == "main")
                  | select(.head_repository.full_name == $repository)
                  | select(.display_title | startswith("Provider sync source-monitor-pr-"))
                  | {runId: .id, headSha: .head_sha}]
              ' <<< "$RUNS_RESPONSE")

              while IFS=$'\t' read -r run_id run_head; do
                [ -n "$run_id" ] || continue
                JOBS=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/jobs?per_page=100")
                SYNC_CONCLUSION=$(jq -r '[.jobs[].steps[]? | select(.name == "Sync skills to Supabase")][0].conclusion // ""' <<< "$JOBS")
                if [ "$SYNC_CONCLUSION" != success ]; then
                  echo "::error::Correlated provider sync run $run_id lacks proven provider completion; refusing generic replay"
                  exit 1
                fi
                ARTIFACTS=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts?per_page=100")
                ARTIFACT_COUNT=$(jq '[.artifacts[] | select(.name == "synced-slugs" and .expired == false)] | length' <<< "$ARTIFACTS")
                if [ "$ARTIFACT_COUNT" -ne 1 ]; then
                  echo "::error::Recovery run $run_id must have exactly one provider-complete synced-slugs artifact"
                  exit 1
                fi

                ARTIFACT=$(jq -c '[.artifacts[] | select(.name == "synced-slugs" and .expired == false)][0]' <<< "$ARTIFACTS")
                artifact_id=$(jq -r '.id' <<< "$ARTIFACT")
                artifact_digest=$(jq -r '.digest // ""' <<< "$ARTIFACT")
                artifact_size=$(jq -r '.size_in_bytes // 0' <<< "$ARTIFACT")
                if [ "$artifact_size" -le 0 ] || [ "$artifact_size" -gt 1048576 ]; then
                  echo "::error::Recovery artifact $artifact_id has invalid bounded size: $artifact_size"
                  exit 1
                fi

                ZIP_PATH="$RUNNER_TEMP/recovered-sync-$run_id.zip"
                gh api "repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" > "$ZIP_PATH"
                actual_digest="sha256:$(sha256sum "$ZIP_PATH" | cut -d' ' -f1)"
                if [ "$actual_digest" != "$artifact_digest" ]; then
                  echo "::error::Recovery artifact $artifact_id digest mismatch"
                  exit 1
                fi
                if [ "$(unzip -Z1 "$ZIP_PATH")" != "synced-slugs.txt" ]; then
                  echo "::error::Recovery artifact $artifact_id has an unexpected archive manifest"
                  exit 1
                fi

                SLUGS_JSON=$(unzip -p "$ZIP_PATH" synced-slugs.txt | jq -Rs '
                  split("\n") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))
                ')
                NEXT_RECOVERIES=$(mktemp "$RUNNER_TEMP/recovered-syncs.XXXXXX")
                jq \
                  --argjson runId "$run_id" \
                  --arg headSha "$run_head" \
                  --argjson artifactId "$artifact_id" \
                  --arg digest "$artifact_digest" \
                  --argjson slugs "$SLUGS_JSON" \
                  '. + [{runId: $runId, headSha: $headSha, artifactId: $artifactId, digest: $digest, slugs: $slugs}]' \
                  "$RECOVERIES_FILE" > "$NEXT_RECOVERIES"
                mv "$NEXT_RECOVERIES" "$RECOVERIES_FILE"
              done < <(jq -r '.[] | [.runId, .headSha] | @tsv' <<< "$RECOVERY_RUNS")
            fi

            CHANGED=$(node ./scripts/detect-changed-skills.mjs \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --recoveries "$RECOVERIES_FILE")
            echo "mode=incremental" >> $GITHUB_OUTPUT
            echo "Diff range: $BASE_SHA..$HEAD_SHA"
          fi
          
          TARGET_COUNT=$(printf '%s\n' "$CHANGED" | tr ' ' '\n' | sed '/^$/d' | sort -u | wc -l | tr -d ' ')
          echo "target_count=$TARGET_COUNT" >> $GITHUB_OUTPUT
          if [ "$TARGET_COUNT" -le 25 ]; then
            echo "changed_skills=$CHANGED" >> $GITHUB_OUTPUT
          fi
          
          if [ -z "$CHANGED" ]; then
            echo "No skills to sync"
            echo "skip_sync=true" >> $GITHUB_OUTPUT
          else
            echo "Skills to sync: $CHANGED"
            echo "skip_sync=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate bounded sync admission
        if: steps.changes.outputs.skip_sync != 'true'
        env:
          TARGET_COUNT: ${{ steps.changes.outputs.target_count }}
        run: |
          set -euo pipefail
          MAX_SYNC_SKILLS=25
          if [ "$TARGET_COUNT" -gt "$MAX_SYNC_SKILLS" ]; then
            echo "::error::Sync target count $TARGET_COUNT exceeds the production limit $MAX_SYNC_SKILLS; split the sync before any Supabase write"
            exit 1
          fi
          echo "Bounded sync admission: $TARGET_COUNT target(s) within the $MAX_SYNC_SKILLS-Skill limit"

      - name: Download skillstore-cli
        id: download-cli
        if: steps.changes.outputs.skip_sync != 'true'
        uses: ./.github/actions/download-skillstore-cli
        with:
          version: '2.4.4'
          token: ${{ steps.app-token.outputs.token }}
          cache-dir: /home/runner/_work/_cache/skillstore-cli
          minimum-version: '2.4.4'

      - name: Materialize changed skills
        if: steps.changes.outputs.skip_sync != 'true'
        env:
          CHANGED_SKILLS: ${{ steps.changes.outputs.changed_skills }}
          SYNC_COMMIT_SHA: ${{ steps.trusted-correlation.outputs.sync_commit_sha }}
        run: |
          set -euo pipefail
          node ./scripts/materialize-changed-skills.mjs \
            --commit "$SYNC_COMMIT_SHA" \
            --skills "$CHANGED_SKILLS"

      - name: Sync skills to Supabase
        id: sync
        if: steps.changes.outputs.skip_sync != 'true'
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CHANGED_SKILLS: ${{ steps.changes.outputs.changed_skills }}
          SYNC_MODE: ${{ steps.changes.outputs.mode }}
          SECURITY_PASSPORT_MODE: ${{ vars.SECURITY_PASSPORT_MODE || 'off' }}
          SECURITY_NOTIFICATIONS_ENABLED: ${{ vars.SECURITY_NOTIFICATIONS_ENABLED || 'false' }}
          PUBLIC_SITE_URL: https://skillstore.io
          AUTOMATION_API_KEY: ${{ secrets.SECURITY_ATTESTATION_AUTOMATION_KEY }}
          SYNC_COMMIT_SHA: ${{ steps.trusted-correlation.outputs.sync_commit_sha }}
        run: |
          echo "Sync mode: $SYNC_MODE"
          echo "Syncing skills: $CHANGED_SKILLS"

          # Transform space-separated relative paths to comma-separated full paths
          # Input:  "author1/skill1 author2/skill2"
          # Output: "skills/author1/skill1,skills/author2/skill2"
          # Filter empty lines to prevent trailing "skills/" from spaces
          SKILL_PATHS=$(echo "$CHANGED_SKILLS" | tr ' ' '\n' | grep -v '^$' | sed 's|^|skills/|' | tr '\n' ',' | sed 's/,$//')

          echo "Skill paths: $SKILL_PATHS"

          set -o pipefail

          configure_tls() {
            if [ ! -s /etc/ssl/certs/ca-certificates.crt ] && command -v apt-get >/dev/null 2>&1; then
              echo "CA bundle missing; attempting to install ca-certificates"
              if command -v sudo >/dev/null 2>&1; then
                sudo apt-get update -y && sudo apt-get install -y ca-certificates || true
              else
                apt-get update -y && apt-get install -y ca-certificates || true
              fi
            fi

            if command -v update-ca-certificates >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1; then
                sudo update-ca-certificates || true
              else
                update-ca-certificates || true
              fi
            fi

            if [ -s /etc/ssl/certs/ca-certificates.crt ]; then
              export NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt
              export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
              export REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
              export GIT_SSL_CAINFO=/etc/ssl/certs/ca-certificates.crt
            fi
            export NODE_OPTIONS="${NODE_OPTIONS:-} --use-openssl-ca"
          }

          sync_error_count() {
            local output_file="$1"
            local summary
            summary=$(grep -E 'Sync complete: [0-9]+ synced, [0-9]+ errors' "$output_file" | tail -1 || true)
            echo "$summary" | sed -n 's/.*Sync complete: [0-9][0-9]* synced, \([0-9][0-9]*\) errors.*/\1/p'
          }

          sync_success_count() {
            local output_file="$1"
            local summary
            summary=$(grep -E 'Sync complete: [0-9]+ synced, [0-9]+ errors' "$output_file" | tail -1 || true)
            echo "$summary" | sed -n 's/.*Sync complete: \([0-9][0-9]*\) synced, [0-9][0-9]* errors.*/\1/p'
          }

          run_sync_once() {
            local paths="$1"
            local concurrency="$2"
            local output_file="$3"

            set +e
            timeout --signal=TERM --kill-after=30s 60m \
              "$GITHUB_WORKSPACE/skillstore-cli" skill sync \
                --slugs "$paths" \
                --concurrency "$concurrency" \
                --marketplace-commit "$SYNC_COMMIT_SHA" 2>&1 | tee "$output_file"
            local rc=${PIPESTATUS[0]}
            # Keep errexit disabled until the caller captures rc. Returning a
            # non-zero status with errexit enabled exits before retry handling.
            return "$rc"
          }

          # One bounded attempt avoids multiplying database writes when the
          # production host or TLS path is unhealthy. A failed run is retried
          # only by a new workflow after operators inspect the cause.
          : > sync-output.log
          configure_tls
          OUTPUT_FILE="sync-output-attempt-1.log"
          CURRENT_COUNT=$(awk -F, '{ print NF }' <<< "$SKILL_PATHS")
          echo "=== Sync attempt 1/1 (${CURRENT_COUNT} skill paths, concurrency=1) ===" | tee -a sync-output.log
          set +e
          run_sync_once "$SKILL_PATHS" 1 "$OUTPUT_FILE"
          SYNC_RC=$?
          set -e
          cat "$OUTPUT_FILE" >> sync-output.log

          ERROR_COUNT=$(sync_error_count "$OUTPUT_FILE")
          ERROR_COUNT=${ERROR_COUNT:-0}
          SYNCED_COUNT=$(sync_success_count "$OUTPUT_FILE")
          SYNCED_COUNT=${SYNCED_COUNT:-0}
          if [ "$SYNC_RC" -ne 0 ] || [ "$ERROR_COUNT" -ne 0 ] || [ "$SYNCED_COUNT" -lt "$CURRENT_COUNT" ]; then
            SUMMARY=$(grep -E 'Sync complete: [0-9]+ synced, [0-9]+ errors' "$OUTPUT_FILE" | tail -1 || true)
            echo "::error::skillstore-cli sync failed in its single bounded attempt: ${SUMMARY:-exit $SYNC_RC with no summary}"
            exit 1
          fi

          SYNCED_SLUGS=$(grep -E 'Synced:' sync-output.log | sed -E 's/.*Synced: //' | sort -u | paste -sd, -)
          if [ -z "$SYNCED_SLUGS" ]; then
            SYNCED_SLUGS=$(tail -1 sync-output.log)
          fi
          if [ -z "$SYNCED_SLUGS" ] || echo "$SYNCED_SLUGS" | grep -q 'Sync complete:'; then
            echo "::error::skillstore-cli did not return synced slugs. Last line: $SYNCED_SLUGS"
            exit 1
          fi

          printf '%s\n' "$SYNCED_SLUGS" | tr ',' '\n' | sed '/^$/d' | LC_ALL=C sort -u > synced-slugs.txt
          : > expected-synced-slugs.txt
          for skill_path in $CHANGED_SKILLS; do
            report_path="skills/$skill_path/skill-report.json"
            test -f "$report_path" && test ! -L "$report_path" || {
              echo "::error::materialized Skill report is missing or unsafe: $report_path"
              exit 1
            }
            jq -er '.meta.slug | select(type == "string" and test("^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"))' \
              "$report_path" >> expected-synced-slugs.txt
          done
          LC_ALL=C sort -u -o expected-synced-slugs.txt expected-synced-slugs.txt
          diff -u expected-synced-slugs.txt synced-slugs.txt || {
            echo "::error::skillstore-cli reported a different synced slug set than requested"
            exit 1
          }
          SYNCED_COUNT=$(wc -l < synced-slugs.txt | tr -d ' ')
          echo "synced_count=$SYNCED_COUNT" >> "$GITHUB_OUTPUT"
          echo "::notice::Synced $SYNCED_COUNT skill(s); slug payload saved to artifact input"

      - name: Upload provider-complete synced slugs artifact
        if: steps.sync.outputs.synced_count != '0'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: synced-slugs
          path: synced-slugs.txt
          retention-days: 30

      - name: Reconcile durable security change events
        id: reconcile-security-events
        if: ${{ !cancelled() && steps.download-cli.outcome == 'success' }}
        continue-on-error: true
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SECURITY_NOTIFICATIONS_ENABLED: ${{ vars.SECURITY_NOTIFICATIONS_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 15m \
            "$GITHUB_WORKSPACE/skillstore-cli" skill reconcile-security-events --batch-size 100

      - name: Report security event reconciliation failure
        if: ${{ always() && steps.reconcile-security-events.outcome == 'failure' }}
        run: |
          echo "::warning::Durable security event reconciliation failed; queued jobs remain retryable"
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Security event reconciliation warning

          The bounded audit and attestation projection drain failed. Skill sync results remain committed, and the durable jobs will be retried by the next scheduled or sync-triggered run.
          EOF

      - name: Remove generated report evidence from synced audits
        if: steps.changes.outputs.skip_sync != 'true' && steps.sync.outputs.synced_count != '0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          SYNCED_SLUGS=$(paste -sd, synced-slugs.txt)
          SANITIZED_COUNT=0
          SANITIZE_ERRORS=0

          rest_call() {
            local method="$1"
            local url="$2"
            local body_file="$3"
            local out_file="$4"
            local description="$5"
            local tmp_file="${out_file}.tmp"
            local status
            local curl_rc

            for attempt in 1 2 3 4; do
              rm -f "$tmp_file"

              if [ -n "$body_file" ]; then
                set +e
                status=$(curl -sS -o "$tmp_file" -w "%{http_code}" -X "$method" "$url" \
                  -H "apikey: ${SUPABASE_SERVICE_KEY}" \
                  -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
                  -H "Content-Type: application/json" \
                  -H "Accept-Profile: skillstore" \
                  -H "Content-Profile: skillstore" \
                  --connect-timeout 15 \
                  --max-time 60 \
                  -d @"$body_file")
                curl_rc=$?
                set -e
              else
                set +e
                status=$(curl -sS -o "$tmp_file" -w "%{http_code}" -X "$method" "$url" \
                  -H "apikey: ${SUPABASE_SERVICE_KEY}" \
                  -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
                  -H "Accept-Profile: skillstore" \
                  --connect-timeout 15 \
                  --max-time 60)
                curl_rc=$?
                set -e
              fi

              if [ "$curl_rc" -eq 0 ] && [[ "$status" =~ ^2 ]]; then
                mv "$tmp_file" "$out_file"
                return 0
              fi

              echo "::warning::${description} failed (attempt ${attempt}/4, curl=${curl_rc}, http=${status:-000})"
              if [ -s "$tmp_file" ]; then
                echo "::warning::Response preview: $(head -c 500 "$tmp_file" | tr '\n' ' ')"
              fi

              sleep $((attempt * 5))
            done

            return 1
          }

          patch_audit_evidence() {
            local audit_id="$1"
            local sanitized="$2"
            local body_file="patch-body-${audit_id}.json"
            local out_file="patch-response-${audit_id}.json"

            jq -n --argjson evidence "$sanitized" '{risk_factor_evidence: $evidence}' > "$body_file"
            rest_call PATCH "${SUPABASE_URL}/rest/v1/skill_security_audit?id=eq.${audit_id}" \
              "$body_file" "$out_file" "Patch audit evidence ${audit_id}"
          }

          sanitize_slug() {
            local slug="$1"
            local encoded_slug
            local skill_id
            local audits
            local safe_slug
            local skills_response
            local audits_response

            safe_slug=$(printf '%s' "$slug" | tr -c 'A-Za-z0-9_.-' '_')
            skills_response="skills-${safe_slug}.json"
            audits_response="audits-${safe_slug}.json"
            encoded_slug=$(printf '%s' "$slug" | jq -sRr @uri)
            if ! rest_call GET "${SUPABASE_URL}/rest/v1/skills?select=id&slug=eq.${encoded_slug}" \
              "" "$skills_response" "Fetch skill id for ${slug}"; then
              SANITIZE_ERRORS=$((SANITIZE_ERRORS + 1))
              return 0
            fi

            if ! skill_id=$(jq -r '.[0].id // empty' "$skills_response"); then
              echo "::warning::Invalid skill lookup response while sanitizing generated report evidence: $slug"
              SANITIZE_ERRORS=$((SANITIZE_ERRORS + 1))
              return 0
            fi

            if [ -z "$skill_id" ]; then
              echo "::warning::Skill not found while sanitizing generated report evidence: $slug"
              return 0
            fi

            if ! rest_call GET "${SUPABASE_URL}/rest/v1/skill_security_audit?select=id,risk_factor_evidence&skill_id=eq.${skill_id}" \
              "" "$audits_response" "Fetch audit evidence for ${slug}"; then
              SANITIZE_ERRORS=$((SANITIZE_ERRORS + 1))
              return 0
            fi

            if ! audits=$(jq -c '.' "$audits_response"); then
              echo "::warning::Invalid audit evidence response while sanitizing generated report evidence: $slug"
              SANITIZE_ERRORS=$((SANITIZE_ERRORS + 1))
              return 0
            fi
            while IFS= read -r audit; do
              local audit_id
              local original
              local sanitized

              audit_id=$(echo "$audit" | jq -r '.id')
              original=$(echo "$audit" | jq -c '.risk_factor_evidence // []')
              if ! sanitized=$(echo "$audit" | jq -c '
                [
                  (.risk_factor_evidence // [])[]
                  | {
                      factor,
                      evidence: ((.evidence // []) | map(select(.file != "skill-report.json")))
                    }
                  | select((.evidence | length) > 0)
                ]
              '); then
                SANITIZE_ERRORS=$((SANITIZE_ERRORS + 1))
                echo "::warning::Could not parse generated report evidence for ${slug} audit ${audit_id}; continuing sync workflow"
                continue
              fi

              if [ "$sanitized" != "$original" ]; then
                if patch_audit_evidence "$audit_id" "$sanitized"; then
                  SANITIZED_COUNT=$((SANITIZED_COUNT + 1))
                  echo "Sanitized generated report evidence for ${slug} audit ${audit_id}"
                else
                  SANITIZE_ERRORS=$((SANITIZE_ERRORS + 1))
                  echo "::warning::Could not sanitize generated report evidence for ${slug} audit ${audit_id}; continuing sync workflow"
                fi
              fi
            done < <(echo "$audits" | jq -c '.[]')
          }

          while IFS= read -r slug; do
            slug=$(echo "$slug" | sed 's|^skills/||' | xargs)
            [ -z "$slug" ] && continue
            sanitize_slug "$slug"
          done < <(echo "$SYNCED_SLUGS" | tr ',' '\n')

          echo "::notice::Generated report evidence cleanup complete: sanitized=${SANITIZED_COUNT}, errors=${SANITIZE_ERRORS}"
          if [ "$SANITIZE_ERRORS" -gt 0 ]; then
            echo "::warning::Generated report evidence cleanup had ${SANITIZE_ERRORS} error(s); sync succeeded and downstream jobs will continue"
            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## Generated Report Evidence Cleanup Warning

          Sync succeeded, but cleanup of generated \`skill-report.json\` audit evidence had **${SANITIZE_ERRORS}** error(s).

          This cleanup is non-critical for publishing. Downstream scoring, translation, and cache jobs continued.
          EOF
          fi

      - name: Report sync status
        run: |
          echo "::notice::Sync completed - Mode: ${{ steps.changes.outputs.mode }}, Skills: ${{ steps.changes.outputs.changed_skills }}"

      - name: Refresh security research snapshot
        id: security-research-refresh
        if: steps.changes.outputs.skip_sync != 'true' && steps.sync.outputs.synced_count != '0'
        continue-on-error: true
        env:
          SKILLSTORE_API_URL: https://skillstore.io
          SECURITY_RESEARCH_AUTOMATION_KEY: ${{ secrets.SECURITY_RESEARCH_AUTOMATION_KEY }}
        run: ./scripts/refresh-security-research-stats.sh

      - name: Report security research refresh failure
        if: steps.security-research-refresh.outcome == 'failure'
        run: |
          echo "::warning::Skill sync succeeded, but the security research snapshot refresh failed"
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Security Research Refresh Warning

          The Skill sync remains committed. The dedicated refresh endpoint failed after bounded retries; the stale-only safety-net workflow will retry without replaying the core sync.
          EOF

      - name: Save synced slugs to artifact
        id: synced-plan
        if: steps.changes.outputs.skip_sync != 'true' && steps.sync.outputs.synced_count != '0'
        run: |
          SLUG_COUNT=$(wc -l < synced-slugs.txt | tr -d ' ')
          echo "skill_count=$SLUG_COUNT" >> "$GITHUB_OUTPUT"
          echo "📦 Saved $SLUG_COUNT slugs to artifact"

      - name: Resolve published submissions
        id: published_submissions
        if: steps.changes.outputs.skip_sync != 'true' && steps.sync.outputs.synced_count != '0' && !startsWith(inputs.correlation_id, 'source-monitor-pr-')
        env:
          BASE_SHA: ${{ steps.last_sync.outputs.base_sha }}
          SYNC_MODE: ${{ steps.changes.outputs.mode }}
          CHANGED_SKILLS: ${{ steps.changes.outputs.changed_skills }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          const baseSha = process.env.BASE_SHA;
          const syncMode = process.env.SYNC_MODE;
          const changedSkills = (process.env.CHANGED_SKILLS || '').split(/\s+/).filter(Boolean);
          const syncedSlugs = new Set(
            fs.readFileSync('synced-slugs.txt', 'utf8')
              .split(/\r?\n/)
              .map((slug) => slug.trim())
              .filter(Boolean),
          );

          function git(args) {
            return execFileSync('git', args, { encoding: 'utf8' }).trim();
          }

          function safeGit(args) {
            try {
              return git(args);
            } catch {
              return '';
            }
          }

          function resolveSkillPath(changedPath) {
            if (!changedPath.startsWith('skills/')) return null;
            const parts = changedPath.split('/');
            if (parts.length < 3) return null;

            const flatPath = parts[1];
            const namespacedPath = `${parts[1]}/${parts[2]}`;

            if (fs.existsSync(`skills/${namespacedPath}/skill-report.json`)) {
              return namespacedPath;
            }
            if (fs.existsSync(`skills/${flatPath}/skill-report.json`)) {
              return flatPath;
            }
            return null;
          }

          function resolveSlug(skillPath) {
            const reportPath = `skills/${skillPath}/skill-report.json`;
            try {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              if (typeof report?.meta?.slug === 'string' && report.meta.slug.trim()) {
                return report.meta.slug.trim();
              }
            } catch {
              // Fall back to path-derived slug below.
            }

            return skillPath.replace(/\//g, '-');
          }

          const commits = syncMode === 'manual-slugs'
            ? [...new Set(changedSkills
                .map((skillPath) => safeGit(['log', '-1', '--format=%H', '--grep=\\[submission:', '--', `skills/${skillPath}`]))
                .filter(Boolean))]
            : safeGit(['rev-list', '--reverse', `${baseSha}..HEAD`])
                .split('\n')
                .map((commit) => commit.trim())
                .filter(Boolean);

          const bySubmission = new Map();

          for (const commit of commits) {
            const body = safeGit(['log', '-1', '--format=%B', commit]);
            const match = body.match(/\[submission:\s*([0-9a-f-]{36})\]/i);
            if (!match) continue;

            const submissionId = match[1].toLowerCase();
            const changedPaths = safeGit(['diff-tree', '--no-commit-id', '--name-only', '-r', commit])
              .split('\n')
              .map((item) => item.trim())
              .filter(Boolean);

            for (const changedPath of changedPaths) {
              const skillPath = resolveSkillPath(changedPath);
              if (!skillPath) continue;

              const slug = resolveSlug(skillPath);
              if (syncedSlugs.size > 0 && !syncedSlugs.has(slug)) continue;

              if (!bySubmission.has(submissionId)) {
                bySubmission.set(submissionId, new Set());
              }
              bySubmission.get(submissionId).add(slug);
            }
          }

          const payload = [...bySubmission.entries()]
            .map(([submission_id, slugs]) => ({
              submission_id,
              skill_slugs: [...slugs].sort(),
            }))
            .filter((entry) => entry.skill_slugs.length > 0);

          fs.writeFileSync('published-submissions.json', JSON.stringify(payload, null, 2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `count=${payload.length}\n`);
          console.log(`Resolved ${payload.length} published submission callback(s)`);
          NODE

      - name: Notify skillstore - Published submissions
        if: steps.published_submissions.outputs.count != '' && steps.published_submissions.outputs.count != '0'
        env:
          SKILLSTORE_API_URL: ${{ secrets.SKILLSTORE_API_URL }}
          SKILLSTORE_CALLBACK_TOKEN: ${{ secrets.SKILLSTORE_CALLBACK_TOKEN }}
          WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "$SKILLSTORE_API_URL" ] || [ -z "$SKILLSTORE_CALLBACK_TOKEN" ]; then
            echo "::error::Skillstore callback secrets are not configured"
            exit 1
          fi

          jq -c '.[]' published-submissions.json | while read -r row; do
            SUBMISSION_ID=$(echo "$row" | jq -r '.submission_id')
            SKILL_SLUGS=$(echo "$row" | jq -c '.skill_slugs')

            PAYLOAD=$(jq -n \
              --arg submission_id "$SUBMISSION_ID" \
              --argjson skill_slugs "$SKILL_SLUGS" \
              --arg workflow_run_id "$WORKFLOW_RUN_ID" \
              --arg workflow_run_url "$WORKFLOW_RUN_URL" \
              '{
                submission_id: $submission_id,
                event: "published",
                skill_slugs: $skill_slugs,
                published_count: ($skill_slugs | length),
                workflow_run_id: ($workflow_run_id | tonumber),
                workflow_run_url: $workflow_run_url
              }')

            echo "📤 Notifying skillstore: submission $SUBMISSION_ID published ($SKILL_SLUGS)"
            curl --fail-with-body -sS -X POST "$SKILLSTORE_API_URL/api/submit/callback" \
              -H "Authorization: Bearer $SKILLSTORE_CALLBACK_TOKEN" \
              -H "Content-Type: application/json" \
              -H "User-Agent: GitHub-Actions/SkillstoreBot" \
              -H "X-Skillstore-Callback: true" \
              -d "$PAYLOAD"
          done

      - name: Record durable publication provider result
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          CORRELATION_ID: ${{ steps.publication-correlation.outputs.correlation_id }}
          MERGE_COMMIT_SHA: ${{ steps.publication-correlation.outputs.merge_commit_sha }}
          REPOSITORY: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -z "$CORRELATION_ID" ] || [ -z "$MERGE_COMMIT_SHA" ]; then
            exit 0
          fi
          CONTEXT="agentcrew/publication/$(printf '%s' "$CORRELATION_ID" | sha256sum | awk '{print $1}')"
          STATUSES=$(gh api --paginate "repos/$REPOSITORY/commits/$MERGE_COMMIT_SHA/statuses?per_page=100" | jq -s 'add')
          CURRENT=$(jq -c --arg context "$CONTEXT" '[.[] | select(.context == $context)][0] // {}' <<< "$STATUSES")
          CURRENT_STATE=$(jq -r '.state // ""' <<< "$CURRENT")
          CURRENT_DESCRIPTION=$(jq -r '.description // ""' <<< "$CURRENT")
          if [ "$CURRENT_STATE" = failure ] \
            && [ "$CURRENT_DESCRIPTION" = 'Correlated publication failed; inspection required' ]; then
            echo "::notice::Upstream publication failure is authoritative; refusing to overwrite it"
            exit 0
          fi
          STATE=failure
          DESCRIPTION='Correlated provider sync failed; inspection required'
          if [ "$JOB_STATUS" = success ]; then
            STATE=success
            DESCRIPTION='Correlated provider sync completed'
          fi
          gh api --method POST "repos/$REPOSITORY/statuses/$MERGE_COMMIT_SHA" \
            -f state="$STATE" -f context="$CONTEXT" -f description="$DESCRIPTION" \
            -f target_url="https://github.com/$REPOSITORY/actions/runs/${{ github.run_id }}"

      - name: Record durable correlated manual sync result
        if: >-
          always() &&
          inputs.correlation_id != '' &&
          inputs.merge_commit_sha != '' &&
          steps.provider_sync_claim.outputs.owns_reservation == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          MERGE_COMMIT_SHA: ${{ inputs.merge_commit_sha }}
          REPOSITORY: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          STATE=failure
          DESCRIPTION='Correlated provider sync failed; inspection required'
          if [ "$JOB_STATUS" = success ]; then
            STATE=success
            DESCRIPTION='Correlated provider sync completed'
          fi
          CONTEXT="agentcrew/provider-sync/$(printf '%s' "$CORRELATION_ID" | sha256sum | awk '{print $1}')"
          gh api --method POST "repos/$REPOSITORY/statuses/$MERGE_COMMIT_SHA" \
            -f state="$STATE" -f context="$CONTEXT" -f description="$DESCRIPTION" \
            -f target_url="https://github.com/$REPOSITORY/actions/runs/${{ github.run_id }}"

  # ============================================================
  # CALCULATE QUALITY SCORES
  # Calculates quality scores for synced skills using skillstore-cli
  # ============================================================
  calculate-scores:
    needs: sync
    if: needs.sync.outputs.skip_sync != 'true' && needs.sync.outputs.synced_skill_count != '0'
    runs-on: self-hosted
    timeout-minutes: 120
    concurrency:
      group: production-skill-score-writes
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # Self-hosted workspaces can retain sparse-checkout state from an
          # earlier job. Declare both runtime dependencies explicitly instead
          # of assuming a previous checkout left a full working tree.
          sparse-checkout: |
            .github/actions/download-skillstore-cli
            scripts/recalculate-scores.sh
          sparse-checkout-cone-mode: false

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: marketplace,skillstore

      - name: Download skillstore-cli
        uses: ./.github/actions/download-skillstore-cli
        with:
          token: ${{ steps.app-token.outputs.token }}
          cache-dir: /home/runner/_work/_cache/skillstore-cli

      - name: Download synced slug plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: synced-slugs
          path: ./score-plan

      - name: Calculate quality scores for synced skills
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          echo "🎯 Calculating quality scores (per-slug with retry)"
          SCORE_SLUGS_FILE="$RUNNER_TEMP/synced-score-slugs.txt"
          tr ',[:space:]' '\n' < ./score-plan/synced-slugs.txt | sed '/^$/d' | sort -u > "$SCORE_SLUGS_FILE"
          SCORE_SLUG_COUNT=$(wc -l < "$SCORE_SLUGS_FILE" | tr -d ' ')
          test "$SCORE_SLUG_COUNT" -gt 0
          test "$SCORE_SLUG_COUNT" -le 25 || {
            echo "::error::Synced score plan exceeds the 25-Skill production limit: $SCORE_SLUG_COUNT"
            exit 2
          }
          while IFS= read -r slug; do
            [[ "$slug" =~ ^[a-z0-9][a-z0-9-]*$ ]] || {
              echo "::error::Invalid canonical slug in synced score plan: $slug"
              exit 2
            }
          done < "$SCORE_SLUGS_FILE"

          # Delegate to the per-slug wrapper so a single breakdown update
          # failure (e.g. transient Supabase TimeoutError) is logged and
          # retried without aborting the whole sync. If every slug fails,
          # keep the job red instead of masking a global scoring failure.
          # GitHub Actions runs bash with `-e`; disable it while running
          # the wrapper so we can decide whether to continue after
          # partial failures.
          set +e
          bash scripts/recalculate-scores.sh \
            --cli "$GITHUB_WORKSPACE/skillstore-cli" \
            --slugs-file "$SCORE_SLUGS_FILE" \
            --concurrency 1 \
            --max-attempts 1 \
            --retry-base-seconds 5 2>&1 | tee score-output.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          PROCESSED=$(grep -oP 'Processed:\s*\K\d+' score-output.log | tail -n1 || echo "0")
          UPDATED=$(grep -oP 'Updated:\s*\K\d+' score-output.log | tail -n1 || echo "0")
          ERRORS=$(grep -oP 'Errors:\s*\K\d+' score-output.log | tail -n1 || echo "0")
          SUCCESSFUL=$(( ${PROCESSED:-0} - ${ERRORS:-0} ))

          echo ""
          if [ $EXIT_CODE -ne 0 ]; then
            if [ "${PROCESSED:-0}" -eq 0 ] || [ "$SUCCESSFUL" -le 0 ]; then
              echo "::error::Quality scoring failed: no synced skills were scored successfully."
              exit "$EXIT_CODE"
            fi

            echo "::warning::Quality scoring reported $ERRORS error(s) after $PROCESSED processed / $UPDATED updated skill(s); continuing because it made progress."
          elif [ "${ERRORS:-0}" -gt 0 ]; then
            echo "::warning::Quality scoring completed with $ERRORS error(s) after $PROCESSED processed / $UPDATED updated skill(s)."
          else
            echo "✅ Quality score calculation complete"
          fi

  # ============================================================
  # CACHE INVALIDATION PLAN
  # Builds an id-only matrix from the synced-slugs artifact. Slug payloads
  # stay in the artifact and never enter job outputs or matrix entries.
  # ============================================================
  plan-cache-invalidation:
    needs: sync
    if: needs.sync.outputs.skip_sync != 'true' && needs.sync.outputs.synced_skill_count != '0'
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      slug_count: ${{ steps.plan.outputs.slug_count }}
    steps:
      - name: Checkout cache invalidation planner
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: scripts/plan-cache-invalidation.mjs
          sparse-checkout-cone-mode: false

      - name: Download synced slug artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: synced-slugs
          path: ./cache-invalidation-plan

      - name: Plan bounded cache invalidation shards
        id: plan
        run: node ./scripts/plan-cache-invalidation.mjs plan --slugs-file ./cache-invalidation-plan/synced-slugs.txt --shard-size 1 --max-shards 25

  # ============================================================
  # CACHE INVALIDATION SHARDS
  # Every child handles exactly one Skill. Serial execution protects the
  # production database and keeps each invalidation below the endpoint budget.
  # ============================================================
  cache-invalidate-shard:
    needs: [sync, calculate-scores, plan-cache-invalidation]
    if: needs.sync.outputs.skip_sync != 'true' && needs.plan-cache-invalidation.outputs.shard_count != '0'
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan-cache-invalidation.outputs.matrix) }}
    steps:
      - name: Checkout cache invalidation scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/invalidate-cache.sh
            scripts/plan-cache-invalidation.mjs
          sparse-checkout-cone-mode: false

      - name: Download synced slug artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: synced-slugs
          path: ./cache-invalidation-plan

      - name: Extract bounded shard ${{ matrix.shard }}
        run: node ./scripts/plan-cache-invalidation.mjs extract --slugs-file ./cache-invalidation-plan/synced-slugs.txt --shard-size 1 --shard-id "${{ matrix.shard }}" --output "$RUNNER_TEMP/cache-invalidation-shard.txt"

      - name: Invalidate cache for shard ${{ matrix.shard }}
        id: invalidate
        env:
          BATCH_SIZE: '1'
          CACHE_SECRET: ${{ secrets.CACHE_INVALIDATE_SECRET }}
          CONTENT_TYPE: skills
          CURL_MAX_TIME: '30'
          FALLBACK_CONCURRENCY: '1'
          FALLBACK_CURL_MAX_TIME: '30'
          FALLBACK_MAX_ATTEMPTS: '1'
          FALLBACK_RETRY_BASE_SECONDS: '2'
          MAX_ATTEMPTS: '2'
          MAX_ITEMS: '1'
          MAX_RUNTIME_SECONDS: '240'
          RETRY_BASE_SECONDS: '5'
          SITE_URL: https://skillstore.io
          SLUGS_FILE: ${{ runner.temp }}/cache-invalidation-shard.txt
        run: ./scripts/invalidate-cache.sh

      - name: Report shard failure
        if: failure() && steps.invalidate.outcome == 'failure'
        run: echo "::error::Cache invalidation shard ${{ matrix.shard }} failed"

  # ============================================================
  # CACHE INVALIDATION AGGREGATE
  # Always evaluates the matrix result. Any failed/cancelled/skipped child
  # keeps this job non-success and blocks all downstream cache consumers.
  # ============================================================
  cache-invalidate:
    needs: [sync, calculate-scores, plan-cache-invalidation, cache-invalidate-shard]
    if: always() && needs.sync.result == 'success' && needs.sync.outputs.skip_sync != 'true'
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout cache invalidation aggregate guard
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: scripts/check-cache-invalidation-aggregate.sh
          sparse-checkout-cone-mode: false

      - name: Require every cache invalidation shard to succeed
        env:
          CACHE_PLAN_RESULT: ${{ needs.plan-cache-invalidation.result }}
          CACHE_SHARD_RESULT: ${{ needs.cache-invalidate-shard.result }}
          SCORE_RESULT: ${{ needs.calculate-scores.result }}
        run: ./scripts/check-cache-invalidation-aggregate.sh

      - name: Report cache invalidation failure
        if: failure()
        run: |
          echo "::error::Cache invalidation failed; cache warming is blocked; translation is blocked"
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## ❌ Cache invalidation failed

          Skill data was synced, but at least one bounded cache invalidation shard did not succeed. Detail API entries can live for **365 days**, so downstream cache finalization and translation remain blocked.

          **Action required**: fix the failed shard, rerun cache invalidation for the synced artifact, then rerun the scoped warm workflow.
          EOF

  # ============================================================
  # ENGLISH CACHE FINALIZER
  # Runs exact invalidation + API/page verification before translation is
  # dispatched. A failure is reported but does not block content translation.
  # ============================================================
  finalize-english-cache:
    needs: [sync, calculate-scores, cache-invalidate]
    if: >-
      needs.cache-invalidate.result == 'success' &&
      needs.sync.outputs.skip_sync != 'true' &&
      inputs.skip_cache_warm != true &&
      vars.CACHE_FINALIZER_AUTOMATION_ENABLED == 'true' &&
      fromJSON(vars.CACHE_FINALIZER_MAX_SKILLS || '5') >= 1 &&
      fromJSON(vars.CACHE_FINALIZER_MAX_SKILLS || '5') <= 25 &&
      fromJSON(needs.sync.outputs.synced_skill_count || '0') <= fromJSON(vars.CACHE_FINALIZER_MAX_SKILLS || '5') &&
      !contains(github.event.head_commit.message || '', '[bulk-source-monitor]')
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - name: Checkout cache finalizer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: scripts

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Download synced Skill plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: synced-slugs
          path: ./english-cache-finalizer

      - name: Finalize English cache targets
        env:
          CACHE_INVALIDATE_SECRET: ${{ secrets.CACHE_INVALIDATE_SECRET }}
          SITE_URL: https://skillstore.io
          CACHE_FINALIZER_MAX_SKILLS: ${{ vars.CACHE_FINALIZER_MAX_SKILLS || '5' }}
        run: |
          set -euo pipefail
          node scripts/finalize-translation-cache.mjs \
            --slugs-file ./english-cache-finalizer/synced-slugs.txt \
            --locales en \
            --site-url "$SITE_URL" \
            --concurrency 1 \
            --max-skills "$CACHE_FINALIZER_MAX_SKILLS" \
            --max-packs 100 \
            --max-targets 250 \
            --request-budget 5000 \
            --byte-budget 536870912 \
            --plan "$RUNNER_TEMP/english-cache-plan.json" \
            --report "$RUNNER_TEMP/english-cache-report.jsonl" \
            --summary "$RUNNER_TEMP/english-cache-summary.json"

      - name: Upload English cache evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: english-cache-finalizer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/english-cache-plan.json
            ${{ runner.temp }}/english-cache-report.jsonl
            ${{ runner.temp }}/english-cache-summary.json
          if-no-files-found: warn
          retention-days: 14

  # ============================================================
  # TRIGGER TRANSLATION (Async - Fire and Forget)
  # Uses repository_dispatch to start translation as a separate workflow run
  # This decouples sync from slow translation, completing sync faster
  # Translation only needs synced content, doesn't require scores
  # ============================================================
  trigger-translate:
    needs: [sync, cache-invalidate, finalize-english-cache]
    if: always() && vars.CACHE_FINALIZER_AUTOMATION_ENABLED == 'true' && needs.sync.result == 'success' && needs.cache-invalidate.result == 'success' && needs.sync.outputs.skip_sync != 'true' && needs.sync.outputs.synced_skill_count != '0' && !contains(github.event.head_commit.message || '', '[bulk-source-monitor]')
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Download synced slug plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: synced-slugs
          path: ./translation-plan

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Trigger translation workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SYNCED_SKILL_COUNT: ${{ needs.sync.outputs.synced_skill_count }}
          ENGLISH_CACHE_FINALIZER_RESULT: ${{ needs.finalize-english-cache.result }}
          CACHE_FINALIZER_MAX_SKILLS: ${{ vars.CACHE_FINALIZER_MAX_SKILLS || '5' }}
        run: |
          set -euo pipefail

          SLUG_FILE=./translation-plan/synced-slugs.txt
          if [[ ! "$SYNCED_SKILL_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid synced skill count: $SYNCED_SKILL_COUNT"
            exit 1
          fi
          if [[ ! "$CACHE_FINALIZER_MAX_SKILLS" =~ ^[1-9][0-9]*$ ]] ||
             [ "$CACHE_FINALIZER_MAX_SKILLS" -gt 25 ]; then
            echo "::error::CACHE_FINALIZER_MAX_SKILLS must be an integer from 1 to 25"
            exit 1
          fi
          if [ ! -f "$SLUG_FILE" ]; then
            echo "::error::Synced slug plan not found: $SLUG_FILE"
            exit 1
          fi

          SYNCED_SLUGS=()
          while IFS= read -r SLUG || [ -n "$SLUG" ]; do
            SYNCED_SLUGS+=("$SLUG")
          done < "$SLUG_FILE"
          if [ "${#SYNCED_SLUGS[@]}" -ne "$SYNCED_SKILL_COUNT" ]; then
            echo "::error::Synced slug plan has ${#SYNCED_SLUGS[@]} entries; expected $SYNCED_SKILL_COUNT"
            exit 1
          fi

          SEEN_SLUGS=$'\n'
          for SLUG in "${SYNCED_SLUGS[@]}"; do
            if [[ ! "$SLUG" =~ ^[a-z0-9/_-]+$ ]]; then
              echo "::error::Invalid slug in synced plan: $SLUG"
              exit 1
            fi
            if [[ "$SEEN_SLUGS" == *$'\n'"$SLUG"$'\n'* ]]; then
              echo "::error::Duplicate slug in synced plan: $SLUG"
              exit 1
            fi
            SEEN_SLUGS="${SEEN_SLUGS}${SLUG}"$'\n'
          done

          BATCH_COUNT=$(( (SYNCED_SKILL_COUNT + CACHE_FINALIZER_MAX_SKILLS - 1) / CACHE_FINALIZER_MAX_SKILLS ))
          ENGLISH_CACHE_FAILED=$([ "$ENGLISH_CACHE_FINALIZER_RESULT" = success ] && echo false || echo true)
          FIRST_BATCH=("${SYNCED_SLUGS[@]:0:CACHE_FINALIZER_MAX_SKILLS}")
          printf -v BATCH_SLUGS '%s,' "${FIRST_BATCH[@]}"
          BATCH_SLUGS=${BATCH_SLUGS%,}

          REMAINING_SLUGS=""
          if [ "$SYNCED_SKILL_COUNT" -gt "$CACHE_FINALIZER_MAX_SKILLS" ]; then
            REMAINING=("${SYNCED_SLUGS[@]:CACHE_FINALIZER_MAX_SKILLS}")
            printf -v REMAINING_SLUGS '%s,' "${REMAINING[@]}"
            REMAINING_SLUGS=${REMAINING_SLUGS%,}
          fi

          echo "🌍 Triggering batch 1/$BATCH_COUNT with ${#FIRST_BATCH[@]} skill(s)"
          gh api repos/${{ github.repository }}/dispatches \
            --method POST \
            -f event_type=translate-skills \
            -f "client_payload[skill_slugs]=$BATCH_SLUGS" \
            -f "client_payload[remaining_skill_slugs]=$REMAINING_SLUGS" \
            -f "client_payload[triggered_by]=sync-to-supabase" \
            -f "client_payload[english_cache_finalizer_failed]=$ENGLISH_CACHE_FAILED"

          echo "✅ Triggered the first of $BATCH_COUNT bounded translation workflow run(s); each successful run dispatches the next batch"
          echo "   Monitor at: https://github.com/${{ github.repository }}/actions/workflows/translate-skills.yml"
