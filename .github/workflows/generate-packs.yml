name: Generate Pack

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Optional exact production scenario id/slug; blank uses the dynamic queue'
        type: string
        required: false
      auto_publish:
        description: 'Request auto-publish; repository rollout gate must also be enabled'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: generate-pack-production-v3
  cancel-in-progress: false

env:
  # Immutable release required by the v3 evaluator/API contract. Bump only
  # together with a Skillstore CLI release and its checksums.txt asset.
  PACK_PRODUCTION_CLI_VERSION: '2.11.0'

jobs:
  plan:
    name: Plan bounded scenario queue
    runs-on: self-hosted
    timeout-minutes: 20
    outputs:
      has_scenarios: ${{ steps.queue.outputs.has_scenarios }}
      scenario_count: ${{ steps.queue.outputs.scenario_count }}
    steps:
      - name: Generate read-only cross-repository CLI token
        id: cli-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: marketplace,skillstore

      - name: Prepare isolated checkout
        run: rm -rf "$GITHUB_WORKSPACE/marketplace-plan" "$GITHUB_WORKSPACE/pack-plan" "$GITHUB_WORKSPACE/pack-cli"

      - name: Checkout immutable workflow revision
        uses: actions/checkout@v5
        with:
          path: marketplace-plan
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: ''
          clean: true
          persist-credentials: false

      - name: Download pinned Skillstore CLI
        id: cli
        uses: ./marketplace-plan/.github/actions/download-skillstore-cli
        with:
          version: ${{ env.PACK_PRODUCTION_CLI_VERSION }}
          minimum-version: ${{ env.PACK_PRODUCTION_CLI_VERSION }}
          require-checksum: 'true'
          token: ${{ steps.cli-app-token.outputs.token }}
          cache-dir: /home/runner/_work/_cache/skillstore-cli

      - name: Stage verified CLI handoff evidence
        env:
          CLI: ${{ steps.cli.outputs.cli-path }}
          CLI_SHA256: ${{ steps.cli.outputs.cli-sha256 }}
          CLI_VERSION: ${{ env.PACK_PRODUCTION_CLI_VERSION }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pack-plan" "$GITHUB_WORKSPACE/pack-cli"
          install -m 0555 "$CLI" "$GITHUB_WORKSPACE/pack-cli/skillstore-cli-linux-x64"
          printf '%s  skillstore-cli-linux-x64\n' "$CLI_SHA256" > "$GITHUB_WORKSPACE/pack-cli/checksums.txt"
          jq -n \
            --arg version "$CLI_VERSION" \
            --arg sha256 "$CLI_SHA256" \
            '{version: $version, sha256: $sha256}' \
            > "$GITHUB_WORKSPACE/pack-plan/cli-identity.json"

      - name: Select up to three scenarios
        id: queue
        env:
          CLI: ${{ steps.cli.outputs.cli-path }}
          SCENARIO: ${{ inputs.scenario }}
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        working-directory: marketplace-plan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pack-plan"
          ARGS=(pack scenario-queue --limit 3 --lookback-days 30 --cooldown-days 7 --json)
          if [ -n "$SCENARIO" ]; then
            ARGS+=(--scenario "$SCENARIO")
          fi
          "$CLI" "${ARGS[@]}" > "$GITHUB_WORKSPACE/pack-plan/plan.json"
          jq -e '
            .schemaVersion == "pack-production-queue/v1" and
            (.scenarios | type == "array" and length <= 3) and
            ((.scenarios | length) > 0 or .source == "signals") and
            (all(.scenarios[]; (.capabilitySlots | length >= 1) and (.requiredArtifacts | length >= 1)))
          ' "$GITHUB_WORKSPACE/pack-plan/plan.json"
          SCENARIO_COUNT=$(jq -r '.scenarios | length' "$GITHUB_WORKSPACE/pack-plan/plan.json")
          echo "scenario_count=$SCENARIO_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$SCENARIO_COUNT" -eq 0 ]; then
            echo "has_scenarios=false" >> "$GITHUB_OUTPUT"
            jq \
              --arg runId "${{ github.run_id }}" \
              --argjson runAttempt "${{ github.run_attempt }}" \
              --arg commitSha "${{ github.sha }}" \
              '{
              schemaVersion: "marketplace.pack-production-noop/v1",
              outcome: "no_op",
              reason: "no_eligible_scenarios",
              workflow: {
                repository: "aiskillstore/marketplace",
                runId: $runId,
                runAttempt: $runAttempt,
                commitSha: $commitSha
              },
              planSchemaVersion: .schemaVersion,
              source,
              generatedAt,
              lookbackDays,
              scenarioCount: (.scenarios | length)
            }' "$GITHUB_WORKSPACE/pack-plan/plan.json" > "$GITHUB_WORKSPACE/pack-plan/no-op.json"
            echo "No eligible scenario is due; recording an audited no-op." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_scenarios=true" >> "$GITHUB_OUTPUT"
          fi
          jq '{source, scenarios: [.scenarios[] | {id, version, queueScore, reasons}]}' \
            "$GITHUB_WORKSPACE/pack-plan/plan.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable plan
        uses: actions/upload-artifact@v6
        with:
          name: pack-production-plan
          path: pack-plan/
          if-no-files-found: error
          retention-days: 90

      - name: Upload verified evaluator CLI
        if: steps.queue.outputs.has_scenarios == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: pack-production-cli
          path: pack-cli/
          if-no-files-found: error
          retention-days: 1

  evaluate:
    name: Evaluate without production credentials
    needs: plan
    if: needs.plan.outputs.has_scenarios == 'true'
    # GitHub-hosted runners are single-use VMs. The evaluator never reuses the
    # persistent OAuth HOME or sibling workspaces from our self-hosted pool.
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout immutable skills and orchestrator
        uses: actions/checkout@v5
        with:
          path: marketplace-evaluate
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: ''
          clean: true
          persist-credentials: false

      - name: Download plan
        uses: actions/download-artifact@v6
        with:
          name: pack-production-plan
          path: pack-production-input

      - name: Download verified CLI handoff
        uses: actions/download-artifact@v6
        with:
          name: pack-production-cli
          path: pack-production-cli

      - name: Verify Plan CLI handoff before execution
        run: |
          (cd pack-production-cli && sha256sum -c checksums.txt)
          chmod +x pack-production-cli/skillstore-cli-linux-x64
          VERSION=$(pack-production-cli/skillstore-cli-linux-x64 --version | grep -Eo '[0-9]+([.][0-9]+){2}' | head -n1)
          test "$VERSION" = "$PACK_PRODUCTION_CLI_VERSION"

      - name: Install evaluator runtimes before secrets are available
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg poppler-utils ripgrep
          sudo install -d -o root -g root -m 0755 \
            /opt/pack-evaluator \
            /opt/pack-evaluator/runtime
          sudo npm install --global --prefix /opt/pack-evaluator/runtime \
            @anthropic-ai/claude-code@2.1.210 \
            @openai/codex@0.139.0
          sudo chown -R root:root /opt/pack-evaluator/runtime
          sudo chmod -R a=rX /opt/pack-evaluator/runtime
          command -v ffprobe
          command -v pdfinfo
          command -v pdftotext
          command -v rg
          test "$(/opt/pack-evaluator/runtime/bin/claude --version | awk '{print $1}')" = '2.1.210'
          test "$(/opt/pack-evaluator/runtime/bin/codex --version | awk '{print $2}')" = '0.139.0'

      - name: Prepare disposable evaluator identities and filesystem
        env:
          CLI: ${{ github.workspace }}/pack-production-cli/skillstore-cli-linux-x64
        run: |
          sudo useradd --system --create-home --home-dir /home/packproxy --shell /usr/sbin/nologin packproxy
          sudo useradd --create-home --home-dir /home/packeval --shell /bin/bash packeval
          NODE_SOURCE=$(command -v node)
          test -x "$NODE_SOURCE"
          sudo install -d -o root -g root -m 0555 \
            /opt/pack-evaluator \
            /opt/pack-evaluator/bin \
            /opt/pack-evaluator/lib \
            /opt/pack-evaluator/input
          sudo install -o root -g root -m 0555 "$CLI" /opt/pack-evaluator/bin/skillstore-cli
          sudo install -o root -g root -m 0555 "$NODE_SOURCE" /opt/pack-evaluator/bin/node
          sudo install -o root -g root -m 0555 \
            "$GITHUB_WORKSPACE/marketplace-evaluate/scripts/pack-evaluator-proxy.mjs" \
            /opt/pack-evaluator/lib/pack-evaluator-proxy.mjs
          sudo install -o root -g root -m 0555 \
            "$GITHUB_WORKSPACE/marketplace-evaluate/scripts/pack-production.mjs" \
            /opt/pack-evaluator/lib/pack-production.mjs
          sudo install -o root -g root -m 0444 \
            "$GITHUB_WORKSPACE/pack-production-input/plan.json" \
            /opt/pack-evaluator/input/plan.json
          if find "$GITHUB_WORKSPACE/marketplace-evaluate/skills" -type l -print -quit | grep -q .; then
            echo '::error::Evaluator skill input contains a symbolic link'
            exit 1
          fi
          sudo cp -a \
            "$GITHUB_WORKSPACE/marketplace-evaluate/skills" \
            /opt/pack-evaluator/input/skills
          sudo chown -R root:root /opt/pack-evaluator/input/skills
          sudo chmod -R a=rX /opt/pack-evaluator/input/skills
          test "$(sha256sum "$CLI" | awk '{print $1}')" = \
            "$(sha256sum /opt/pack-evaluator/bin/skillstore-cli | awk '{print $1}')"
          test "$(sha256sum "$NODE_SOURCE" | awk '{print $1}')" = \
            "$(sha256sum /opt/pack-evaluator/bin/node | awk '{print $1}')"
          sudo chown -R root:root \
            "$GITHUB_WORKSPACE/marketplace-evaluate" \
            "$GITHUB_WORKSPACE/pack-production-input"
          sudo chmod -R a=rX,u+w \
            "$GITHUB_WORKSPACE/marketplace-evaluate" \
            "$GITHUB_WORKSPACE/pack-production-input"
          sudo install -d -o packeval -g packeval -m 0700 \
            /home/packeval/tmp
          # Codex 0.139 creates ephemeral state files directly under CODEX_HOME.
          # A root-owned sticky directory lets packeval create only its own state
          # while preventing it from replacing the root-owned immutable config.
          sudo install -d -o root -g root -m 1777 \
            /opt/pack-evaluator/codex-home
          sudo install -d -o packeval -g packeval -m 0700 \
            /opt/pack-evaluator/codex-home/log \
            /opt/pack-evaluator/codex-home/sessions
          sudo install -d -o root -g root -m 0700 /opt/pack-evaluator/results
          sudo install -d -o root -g root -m 0711 /opt/pack-evaluator/generations
          mkdir -p \
            "$GITHUB_WORKSPACE/pack-diagnostics" \
            "$GITHUB_WORKSPACE/pack-harvest"
          printf '%s\n' \
            'model_provider = "pack_evaluator_proxy"' \
            '[model_providers.pack_evaluator_proxy]' \
            'name = "Job-local Pack evaluator proxy"' \
            'base_url = "http://127.0.0.1:18765/v1"' \
            'env_key = "PACK_EVALUATOR_PROXY_TOKEN"' \
            'wire_api = "responses"' \
            'supports_websockets = false' \
            | sudo tee /opt/pack-evaluator/codex-home/config.toml >/dev/null
          sudo chown root:root /opt/pack-evaluator/codex-home/config.toml
          sudo chmod 0444 /opt/pack-evaluator/codex-home/config.toml

      # The real Helm credential exists only in this runner-owned shell and the
      # separate packproxy process. Agent commands run as a different, non-sudo
      # user with an empty environment and receive only a localhost-scoped token.
      - name: Evaluate queue until one candidate is ready
        env:
          PACK_EVALUATOR_HELM_API_KEY: ${{ secrets.PACK_EVALUATOR_HELM_API_KEY }}
        run: |
          set -euo pipefail
          LOCAL_TOKEN=$(openssl rand -hex 32)
          NODE_BIN=/opt/pack-evaluator/bin/node
          test -x "$NODE_BIN"
          PROXY_LOG=$(mktemp)
          PROXY_ACTIVITY=$(mktemp)
          CLAUDE_PREFLIGHT_STDOUT=$(mktemp)
          CLAUDE_PREFLIGHT_STDERR=$(mktemp)
          CODEX_PREFLIGHT_STDOUT=$(mktemp)
          CODEX_PREFLIGHT_STDERR=$(mktemp)
          chmod 0600 "$PROXY_ACTIVITY"
          sudo chown packproxy:packproxy "$PROXY_ACTIVITY"
          chmod 0600 "$PROXY_LOG"
          CHECKPOINT_LOCK="$RUNNER_TEMP/pack-production-checkpoint.lock"
          EVALUATOR_RESULTS_DIR=/opt/pack-evaluator/results
          CHECKPOINT_PID=''
          EVALUATOR_PID=''
          EVALUATOR_FINISHED=false
          CLEANUP_DONE=false
          checkpoint_progress() {
            (
              flock -x 9
              for name in evaluate-progress.ndjson evaluate-checkpoint.json evaluate-summary.json; do
                if sudo test -f "$EVALUATOR_RESULTS_DIR/$name"; then
                  temporary="$GITHUB_WORKSPACE/pack-diagnostics/.${name}.tmp.${BASHPID}"
                  sudo cp "$EVALUATOR_RESULTS_DIR/$name" "$temporary"
                  sudo chown "$(id -u):$(id -g)" "$temporary"
                  chmod 0600 "$temporary"
                  mv -f "$temporary" "$GITHUB_WORKSPACE/pack-diagnostics/$name"
                fi
              done
            ) 9>"$CHECKPOINT_LOCK"
          }
          checkpoint_loop() {
            trap - EXIT INT TERM
            while true; do
              sleep 30
              checkpoint_progress || true
            done
          }
          write_interrupted_marker() {
            if [ "$EVALUATOR_FINISHED" = "true" ]; then
              return 0
            fi
            local temporary
            temporary=$(mktemp "$GITHUB_WORKSPACE/pack-diagnostics/.evaluator-interrupted.XXXXXX")
            printf 'evaluator_interrupted=true\n' > "$temporary"
            chmod 0600 "$temporary"
            mv -f "$temporary" "$GITHUB_WORKSPACE/pack-diagnostics/evaluator-interrupted.txt"
          }
          bounded_checkpoint_progress() {
            export -f checkpoint_progress
            export CHECKPOINT_LOCK EVALUATOR_RESULTS_DIR GITHUB_WORKSPACE
            timeout --signal=TERM --kill-after=0.2s 1s bash -c 'checkpoint_progress' \
              >/dev/null 2>&1 || true
          }
          cleanup() {
            local exit_code="${1:-$?}"
            if [ "$CLEANUP_DONE" = "true" ]; then
              return "$exit_code"
            fi
            CLEANUP_DONE=true
            set +e
            write_interrupted_marker
            bounded_checkpoint_progress
            evaluator_group_alive() {
              sudo ps -o stat= -g "$EVALUATOR_PID" 2>/dev/null | grep -qv '^[[:space:]]*Z'
            }
            if [ -n "$EVALUATOR_PID" ] && [ "$EVALUATOR_FINISHED" != "true" ]; then
              sudo kill -TERM -- "-$EVALUATOR_PID" 2>/dev/null || true
              for _ in $(seq 1 40); do
                if ! evaluator_group_alive; then
                  break
                fi
                sleep 0.1
              done
              sudo kill -KILL -- "-$EVALUATOR_PID" 2>/dev/null || true
              sleep 0.1
              if evaluator_group_alive; then
                echo 'root evaluator survived TERM and KILL' \
                  > "$GITHUB_WORKSPACE/pack-diagnostics/root-termination-failure.txt"
              fi
            fi
            if [ -n "$CHECKPOINT_PID" ]; then
              kill "$CHECKPOINT_PID" 2>/dev/null || true
              wait "$CHECKPOINT_PID" 2>/dev/null || true
            fi
            sudo pkill -TERM -u packeval 2>/dev/null || true
            for _ in $(seq 1 10); do
              if ! sudo pgrep -u packeval >/dev/null 2>&1; then
                break
              fi
              sleep 0.1
            done
            sudo pkill -KILL -u packeval 2>/dev/null || true
            sleep 0.1
            if sudo pgrep -u packeval >/dev/null 2>&1; then
              echo 'packeval processes survived TERM and KILL' \
                > "$GITHUB_WORKSPACE/pack-diagnostics/process-termination-failure.txt"
            fi
            sudo pkill -u packproxy -f pack-evaluator-proxy.mjs 2>/dev/null || true
            rm -f \
              "$PROXY_LOG" \
              "$CLAUDE_PREFLIGHT_STDOUT" \
              "$CLAUDE_PREFLIGHT_STDERR" \
              "$CODEX_PREFLIGHT_STDOUT" \
              "$CODEX_PREFLIGHT_STDERR"
            sudo rm -f "$PROXY_ACTIVITY"
            return "$exit_code"
          }
          terminate_step() {
            local exit_code="$1"
            cleanup "$exit_code"
            trap - EXIT
            exit "$exit_code"
          }
          trap 'terminate_step 143' TERM
          trap 'terminate_step 130' INT
          trap 'terminate_step 129' HUP
          trap 'cleanup $?' EXIT

          sudo -u packproxy env -i \
            PATH=/opt/pack-evaluator/bin:/usr/bin:/bin \
            PACK_EVALUATOR_LOCAL_TOKEN="$LOCAL_TOKEN" \
            PACK_EVALUATOR_UPSTREAM_KEY="$PACK_EVALUATOR_HELM_API_KEY" \
            PACK_EVALUATOR_UPSTREAM_URL=https://helm.easymeta.au \
            PACK_EVALUATOR_PROXY_PORT=18765 \
            PACK_EVALUATOR_ALLOWED_MODELS=claude-sonnet-4.6,claude-sonnet-4-6,claude-sonnet-5,sonnet,gpt-5.5 \
            PACK_EVALUATOR_MAX_REQUESTS=256 \
            PACK_EVALUATOR_MAX_CONCURRENT=4 \
            PACK_EVALUATOR_MAX_OUTPUT_TOKENS=65536 \
            PACK_EVALUATOR_TTL_MS=14400000 \
            PACK_EVALUATOR_REQUEST_TIMEOUT_MS=600000 \
            PACK_EVALUATOR_ACTIVITY_FILE="$PROXY_ACTIVITY" \
            "$NODE_BIN" /opt/pack-evaluator/lib/pack-evaluator-proxy.mjs \
            >"$PROXY_LOG" 2>&1 &
          PROXY_LAUNCH_PID=$!
          unset PACK_EVALUATOR_HELM_API_KEY

          PROXY_READY=false
          for _ in $(seq 1 30); do
            if curl --fail --silent \
              -H "Authorization: Bearer $LOCAL_TOKEN" \
              http://127.0.0.1:18765/healthz >/dev/null; then
              PROXY_READY=true
              break
            fi
            sleep 1
          done
          if [ "$PROXY_READY" != "true" ]; then
            echo "::error::Pack evaluator proxy did not become healthy within 30 seconds"
            PROXY_BYTES=$(wc -c < "$PROXY_LOG")
            PROXY_SHA256=$(sha256sum "$PROXY_LOG" | awk '{print $1}')
            jq -n \
              --arg outcome startup_failed \
              --argjson bytes "$PROXY_BYTES" \
              --arg sha256 "$PROXY_SHA256" \
              '{outcome: $outcome, bytes: $bytes, sha256: $sha256}' \
              > "$GITHUB_WORKSPACE/pack-diagnostics/proxy-diagnostics.json"
            kill "$PROXY_LAUNCH_PID" 2>/dev/null || true
            wait "$PROXY_LAUNCH_PID" 2>/dev/null || true
            exit 1
          fi
          PROXY_PID=$(pgrep -u packproxy -f pack-evaluator-proxy.mjs | head -n1)
          test -n "$PROXY_PID"

          if ! sudo -u packeval env -i \
            PATH=/opt/pack-evaluator/bin:/usr/bin:/bin \
            HOME=/home/packeval \
            PROXY_PID="$PROXY_PID" \
            bash -c '
              set -euo pipefail
              ! sudo -n true 2>/dev/null
              ! test -r "/proc/$PROXY_PID/environ"
              ! test -e /home/packeval/.codex/auth.json
              ! test -e /home/packeval/.claude
              ! test -r /var/run/docker.sock
              ! env | grep -Eq "SUPABASE|HELM|GITHUB_TOKEN|GH_TOKEN|AUTOMATION|APP_PRIVATE_KEY|CALLBACK|CACHE_INVALIDATE"
               test -x /opt/pack-evaluator/bin/node
               test -x /opt/pack-evaluator/bin/skillstore-cli
               test -r /opt/pack-evaluator/input/plan.json
               test -r /opt/pack-evaluator/input/skills
               test -n "$(find /opt/pack-evaluator/input/skills -name skill-report.json -print -quit)"
               command -v rg >/dev/null
              ! test -w /opt/pack-evaluator
              ! test -w /opt/pack-evaluator/bin
              ! test -w /opt/pack-evaluator/lib
              ! test -w /opt/pack-evaluator/input
              ! test -w /opt/pack-evaluator/runtime
              ! test -w /opt/pack-evaluator/runtime/bin
              ! test -w /opt/pack-evaluator/runtime/lib
              ! test -w /opt/pack-evaluator/generations
              test -x /opt/pack-evaluator/runtime/bin/claude
              test -x /opt/pack-evaluator/runtime/bin/codex
              test -r /opt/pack-evaluator/codex-home/config.toml
               test -w /opt/pack-evaluator/codex-home
               test "$(stat -c '%U:%G:%a' /opt/pack-evaluator/codex-home)" = 'root:root:1777'
              ! test -w /opt/pack-evaluator/codex-home/config.toml
              ! test -r /opt/pack-evaluator/results
            '; then
            echo 'evaluator isolation preflight failed' \
              > "$GITHUB_WORKSPACE/pack-diagnostics/preflight-failure.txt"
            exit 1
          fi

          classify_preflight_error() {
            local file="$1"
            if [ ! -s "$file" ]; then
              printf 'none\n'
            elif grep -Eqi 'permission denied|read-only file system|unable to open.*database|failed to.*(state|log|session)' "$file"; then
              printf 'state_storage\n'
            elif grep -Eqi '401|403|unauthoriz|authentication|api key' "$file"; then
              printf 'authentication\n'
            elif grep -Eqi '404|model.*not found|unsupported model' "$file"; then
              printf 'model_route\n'
            elif grep -Eqi 'timed out|timeout' "$file"; then
              printf 'timeout\n'
            elif grep -Eqi 'unknown argument|unexpected argument|usage:' "$file"; then
              printf 'cli_arguments\n'
            elif grep -Eqi 'error sending request|failed to send request|connection (reset|refused|closed|aborted)|transport.*(closed|error)|unexpected (eof|end of file)|temporary failure in name resolution|dns.*temporary|tls.*(handshake|temporary)|http[^0-9]*(408|429|502|503|504)|status( code)?[^0-9]*(408|429|502|503|504)' "$file"; then
              printf 'upstream_transport\n'
            else
              printf 'unknown\n'
            fi
          }
          cleanup_preflight_processes() {
            local probe_rc
            sudo pkill -TERM -u packeval 2>/dev/null || true
            for _ in $(seq 1 10); do
              if ! sudo pgrep -u packeval >/dev/null 2>&1; then
                break
              fi
              sleep 0.1
            done
            sudo pkill -KILL -u packeval 2>/dev/null || true
            sleep 0.1
            if sudo pgrep -u packeval >/dev/null 2>&1; then
              return 1
            else
              probe_rc=$?
              if [ "$probe_rc" -ne 1 ]; then
                return 2
              fi
            fi
            return 0
          }

          CLAUDE_PREFLIGHT_OUTCOME=passed
          if ! printf '%s\n' 'Reply with exactly PACK_EVALUATOR_READY and nothing else.' | \
            sudo -u packeval env -i \
              PATH=/opt/pack-evaluator/runtime/bin:/opt/pack-evaluator/bin:/usr/bin:/bin \
              HOME=/home/packeval \
              CODEX_HOME=/opt/pack-evaluator/codex-home \
              TMPDIR=/home/packeval/tmp \
              CI=true \
              NO_COLOR=1 \
              ANTHROPIC_BASE_URL=http://127.0.0.1:18765 \
              ANTHROPIC_AUTH_TOKEN="$LOCAL_TOKEN" \
              NO_PROXY=127.0.0.1,localhost \
              timeout --signal=TERM --kill-after=5s 60s \
              /opt/pack-evaluator/runtime/bin/claude \
                --print \
                --output-format text \
                --permission-mode bypassPermissions \
                --model sonnet \
                - \
              > "$CLAUDE_PREFLIGHT_STDOUT" \
              2> "$CLAUDE_PREFLIGHT_STDERR"; then
            CLAUDE_PREFLIGHT_OUTCOME=command_failed
          elif [ "$(tr -d '\r\n' < "$CLAUDE_PREFLIGHT_STDOUT")" != 'PACK_EVALUATOR_READY' ]; then
            CLAUDE_PREFLIGHT_OUTCOME=invalid_response
          fi

          CODEX_PREFLIGHT_OUTCOME=not_run
          CODEX_PREFLIGHT_ERROR_CLASS=none
          CODEX_PREFLIGHT_ATTEMPTS='[]'
          PREFLIGHT_RETRY_CLEANUP_OUTCOME=not_needed
          if [ "$CLAUDE_PREFLIGHT_OUTCOME" = "passed" ]; then
            # Retry only one narrowly classified transport failure. Permission,
            # auth, routing, CLI, timeout, and response-shape failures stay fail-closed.
            for CODEX_PREFLIGHT_ATTEMPT in 1 2; do
              : > "$CODEX_PREFLIGHT_STDOUT"
              : > "$CODEX_PREFLIGHT_STDERR"
              CODEX_PREFLIGHT_STARTED_MS=$(date +%s%3N)
              CODEX_PREFLIGHT_OUTCOME=passed
              if ! printf '%s\n' 'Reply with exactly PACK_EVALUATOR_READY and nothing else.' | \
                sudo -u packeval env -i \
                  PATH=/opt/pack-evaluator/runtime/bin:/opt/pack-evaluator/bin:/usr/bin:/bin \
                  HOME=/home/packeval \
                  CODEX_HOME=/opt/pack-evaluator/codex-home \
                  TMPDIR=/home/packeval/tmp \
                  CI=true \
                  NO_COLOR=1 \
                  PACK_EVALUATOR_PROXY_TOKEN="$LOCAL_TOKEN" \
                  NO_PROXY=127.0.0.1,localhost \
                  timeout --signal=TERM --kill-after=5s 60s \
                  /opt/pack-evaluator/runtime/bin/codex \
                    exec \
                    --skip-git-repo-check \
                    --sandbox read-only \
                    --cd /home/packeval \
                    --ephemeral \
                    --color never \
                    -m gpt-5.5 \
                    - \
                  > "$CODEX_PREFLIGHT_STDOUT" \
                  2> "$CODEX_PREFLIGHT_STDERR"; then
                CODEX_PREFLIGHT_OUTCOME=command_failed
              elif [ "$(tr -d '\r\n' < "$CODEX_PREFLIGHT_STDOUT")" != 'PACK_EVALUATOR_READY' ]; then
                CODEX_PREFLIGHT_OUTCOME=invalid_response
              fi
              CODEX_PREFLIGHT_DURATION_MS=$(( $(date +%s%3N) - CODEX_PREFLIGHT_STARTED_MS ))
              CODEX_PREFLIGHT_STDOUT_BYTES=$(wc -c < "$CODEX_PREFLIGHT_STDOUT")
              CODEX_PREFLIGHT_STDERR_BYTES=$(wc -c < "$CODEX_PREFLIGHT_STDERR")
              CODEX_PREFLIGHT_STDOUT_SHA256=$(sha256sum "$CODEX_PREFLIGHT_STDOUT" | awk '{print $1}')
              CODEX_PREFLIGHT_STDERR_SHA256=$(sha256sum "$CODEX_PREFLIGHT_STDERR" | awk '{print $1}')
              CODEX_PREFLIGHT_ERROR_CLASS=$(classify_preflight_error "$CODEX_PREFLIGHT_STDERR")
              CODEX_PREFLIGHT_ATTEMPTS=$(jq -c \
                --argjson attempt "$CODEX_PREFLIGHT_ATTEMPT" \
                --arg outcome "$CODEX_PREFLIGHT_OUTCOME" \
                --arg errorClass "$CODEX_PREFLIGHT_ERROR_CLASS" \
                --argjson durationMs "$CODEX_PREFLIGHT_DURATION_MS" \
                --argjson stdoutBytes "$CODEX_PREFLIGHT_STDOUT_BYTES" \
                --argjson stderrBytes "$CODEX_PREFLIGHT_STDERR_BYTES" \
                --arg stdoutSha256 "$CODEX_PREFLIGHT_STDOUT_SHA256" \
                --arg stderrSha256 "$CODEX_PREFLIGHT_STDERR_SHA256" \
                '. + [{
                  attempt: $attempt,
                  outcome: $outcome,
                  errorClass: $errorClass,
                  durationMs: $durationMs,
                  stdoutBytes: $stdoutBytes,
                  stderrBytes: $stderrBytes,
                  stdoutSha256: $stdoutSha256,
                  stderrSha256: $stderrSha256
                }]' <<< "$CODEX_PREFLIGHT_ATTEMPTS")
              if [ "$CODEX_PREFLIGHT_OUTCOME" = "passed" ] || \
                 [ "$CODEX_PREFLIGHT_OUTCOME" != "command_failed" ] || \
                 [ "$CODEX_PREFLIGHT_ERROR_CLASS" != "upstream_transport" ] || \
                 [ "$CODEX_PREFLIGHT_ATTEMPT" -eq 2 ]; then
                break
              fi
              if cleanup_preflight_processes; then
                PREFLIGHT_RETRY_CLEANUP_OUTCOME=passed
              else
                PREFLIGHT_RETRY_CLEANUP_RC=$?
                if [ "$PREFLIGHT_RETRY_CLEANUP_RC" -eq 1 ]; then
                  PREFLIGHT_RETRY_CLEANUP_OUTCOME=failed
                else
                  PREFLIGHT_RETRY_CLEANUP_OUTCOME=probe_failed
                fi
                break
              fi
              sleep 5
            done
          fi

          CLAUDE_PREFLIGHT_STDOUT_BYTES=$(wc -c < "$CLAUDE_PREFLIGHT_STDOUT")
          CLAUDE_PREFLIGHT_STDERR_BYTES=$(wc -c < "$CLAUDE_PREFLIGHT_STDERR")
          CLAUDE_PREFLIGHT_STDOUT_SHA256=$(sha256sum "$CLAUDE_PREFLIGHT_STDOUT" | awk '{print $1}')
          CLAUDE_PREFLIGHT_STDERR_SHA256=$(sha256sum "$CLAUDE_PREFLIGHT_STDERR" | awk '{print $1}')
          CODEX_PREFLIGHT_STDOUT_BYTES=$(wc -c < "$CODEX_PREFLIGHT_STDOUT")
          CODEX_PREFLIGHT_STDERR_BYTES=$(wc -c < "$CODEX_PREFLIGHT_STDERR")
          CODEX_PREFLIGHT_STDOUT_SHA256=$(sha256sum "$CODEX_PREFLIGHT_STDOUT" | awk '{print $1}')
          CODEX_PREFLIGHT_STDERR_SHA256=$(sha256sum "$CODEX_PREFLIGHT_STDERR" | awk '{print $1}')
          CLAUDE_PREFLIGHT_ERROR_CLASS=$(classify_preflight_error "$CLAUDE_PREFLIGHT_STDERR")
          PREFLIGHT_CLEANUP_OUTCOME=passed
          if cleanup_preflight_processes; then
            PREFLIGHT_CLEANUP_OUTCOME=passed
          else
            PREFLIGHT_CLEANUP_RC=$?
            if [ "$PREFLIGHT_CLEANUP_RC" -eq 1 ]; then
              PREFLIGHT_CLEANUP_OUTCOME=failed
            else
              PREFLIGHT_CLEANUP_OUTCOME=probe_failed
            fi
          fi
          jq -n \
            --arg claudeOutcome "$CLAUDE_PREFLIGHT_OUTCOME" \
            --argjson claudeStdoutBytes "$CLAUDE_PREFLIGHT_STDOUT_BYTES" \
            --argjson claudeStderrBytes "$CLAUDE_PREFLIGHT_STDERR_BYTES" \
            --arg claudeStdoutSha256 "$CLAUDE_PREFLIGHT_STDOUT_SHA256" \
            --arg claudeStderrSha256 "$CLAUDE_PREFLIGHT_STDERR_SHA256" \
            --arg claudeErrorClass "$CLAUDE_PREFLIGHT_ERROR_CLASS" \
            --arg codexOutcome "$CODEX_PREFLIGHT_OUTCOME" \
            --argjson codexStdoutBytes "$CODEX_PREFLIGHT_STDOUT_BYTES" \
            --argjson codexStderrBytes "$CODEX_PREFLIGHT_STDERR_BYTES" \
            --arg codexStdoutSha256 "$CODEX_PREFLIGHT_STDOUT_SHA256" \
            --arg codexStderrSha256 "$CODEX_PREFLIGHT_STDERR_SHA256" \
            --arg codexErrorClass "$CODEX_PREFLIGHT_ERROR_CLASS" \
            --argjson codexAttempts "$CODEX_PREFLIGHT_ATTEMPTS" \
            --arg cleanupOutcome "$PREFLIGHT_CLEANUP_OUTCOME" \
            --arg retryCleanupOutcome "$PREFLIGHT_RETRY_CLEANUP_OUTCOME" \
            '{
              claude: {
                outcome: $claudeOutcome,
                stdoutBytes: $claudeStdoutBytes,
                stderrBytes: $claudeStderrBytes,
                stdoutSha256: $claudeStdoutSha256,
                stderrSha256: $claudeStderrSha256,
                errorClass: $claudeErrorClass
              },
              codex: {
                outcome: $codexOutcome,
                stdoutBytes: $codexStdoutBytes,
                stderrBytes: $codexStderrBytes,
                stdoutSha256: $codexStdoutSha256,
                stderrSha256: $codexStderrSha256,
                errorClass: $codexErrorClass,
                attempts: $codexAttempts
              },
              cleanup: {
                outcome: $cleanupOutcome,
                retryOutcome: $retryCleanupOutcome
              }
            }' \
            > "$GITHUB_WORKSPACE/pack-diagnostics/agent-preflight-diagnostics.json"
          if [ "$CLAUDE_PREFLIGHT_OUTCOME" != "passed" ] || \
             [ "$CODEX_PREFLIGHT_OUTCOME" != "passed" ] || \
             [ "$PREFLIGHT_CLEANUP_OUTCOME" != "passed" ] || \
             { [ "$PREFLIGHT_RETRY_CLEANUP_OUTCOME" != "not_needed" ] && \
               [ "$PREFLIGHT_RETRY_CLEANUP_OUTCOME" != "passed" ]; }; then
            echo "::error::Pack evaluator model preflight failed: claude=$CLAUDE_PREFLIGHT_OUTCOME codex=$CODEX_PREFLIGHT_OUTCOME cleanup=$PREFLIGHT_CLEANUP_OUTCOME retry_cleanup=$PREFLIGHT_RETRY_CLEANUP_OUTCOME"
            exit 1
          fi

          PACKEVAL_UID=$(id -u packeval)
          PACKEVAL_GID=$(id -g packeval)
          checkpoint_loop &
          CHECKPOINT_PID=$!
          set +e
          # Claude executes installed Skills; Codex independently judges artifact evidence.
          # Explicit model targeting keeps the two roles separate rather than cross-falling back.
          setsid sudo env -i \
            PATH=/opt/pack-evaluator/runtime/bin:/opt/pack-evaluator/bin:/usr/bin:/bin \
            HOME=/home/packeval \
            CODEX_HOME=/opt/pack-evaluator/codex-home \
            TMPDIR=/home/packeval/tmp \
            CI=true \
            NO_COLOR=1 \
            SKILLSTORE_AGENTS=codex,claude \
            SKILLSTORE_AGENT_ENV_MODE=strict \
            SKILLSTORE_AGENT_ENV_ALLOWLIST=CODEX_HOME,PACK_EVALUATOR_PROXY_TOKEN,ANTHROPIC_BASE_URL,ANTHROPIC_AUTH_TOKEN,NO_PROXY \
            PACK_EVALUATOR_PROXY_TOKEN="$LOCAL_TOKEN" \
            ANTHROPIC_BASE_URL=http://127.0.0.1:18765 \
            ANTHROPIC_AUTH_TOKEN="$LOCAL_TOKEN" \
            NO_PROXY=127.0.0.1,localhost \
            timeout --signal=TERM --kill-after=30s 4h \
            prlimit --nproc=256:256 --as=6442450944:6442450944 -- \
            "$NODE_BIN" /opt/pack-evaluator/lib/pack-production.mjs evaluate \
            --plan /opt/pack-evaluator/input/plan.json \
            --results-dir /opt/pack-evaluator/results \
            --cli /opt/pack-evaluator/bin/skillstore-cli \
            --expected-cli-version "$PACK_PRODUCTION_CLI_VERSION" \
            --skills-dir /opt/pack-evaluator/input/skills \
            --evaluator-uid "$PACKEVAL_UID" \
            --evaluator-gid "$PACKEVAL_GID" \
            --evaluator-cwd /home/packeval \
            --evaluator-runtime-root /opt/pack-evaluator/generations \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --commit-sha "${{ github.sha }}" \
            --model sonnet \
            --judge-model gpt-5.5 \
            --max-candidates 4 \
            --pick 4 \
            --runs 1 \
            --final-runs 3 \
            --agent-timeout-ms 360000 \
            --agent-max-retries 1 \
            --threshold 7 \
            --baseline-delta 1 \
            --auto-publish-threshold 8 \
            --evaluation-budget-ms 13800000 \
            --scenario-timeout-ms 7200000 \
            --minimum-fallback-ms 2700000 \
            --scenario-idle-timeout-ms 1200000 \
            --proxy-activity-file "$PROXY_ACTIVITY" \
            > "$GITHUB_WORKSPACE/pack-diagnostics/evaluate-command.json" &
          EVALUATOR_PID=$!
          wait "$EVALUATOR_PID"
          EVALUATOR_RC=$?
          EVALUATOR_PID=''
          EVALUATOR_FINISHED=true
          kill "$CHECKPOINT_PID" 2>/dev/null || true
          wait "$CHECKPOINT_PID" 2>/dev/null || true
          CHECKPOINT_PID=''
          set -e
          sudo pkill -TERM -u packeval 2>/dev/null || true
          for _ in $(seq 1 10); do
            if ! sudo pgrep -u packeval >/dev/null 2>&1; then
              break
            fi
            sleep 0.1
          done
          sudo pkill -KILL -u packeval 2>/dev/null || true
          EVALUATOR_PROCESSES_STOPPED=true
          if sudo pgrep -u packeval >/dev/null 2>&1; then
            echo '::error::Unable to terminate all evaluator processes'
            EVALUATOR_RC=1
            EVALUATOR_PROCESSES_STOPPED=false
          fi
          if [ "$EVALUATOR_PROCESSES_STOPPED" != "true" ]; then
            echo 'evaluator processes survived TERM and KILL' \
              > "$GITHUB_WORKSPACE/pack-diagnostics/process-termination-failure.txt"
          else
            RESULT_BYTES=$(sudo du -sb /opt/pack-evaluator/results | awk '{print $1}')
            RESULT_FILES=$(sudo find /opt/pack-evaluator/results -type f | wc -l)
            if [ "$RESULT_BYTES" -gt 268435456 ]; then
              echo "::error::Evaluator result directory exceeds 256 MiB: $RESULT_BYTES bytes"
              EVALUATOR_RC=1
            elif [ "$RESULT_FILES" -gt 1000 ]; then
              echo "::error::Evaluator result directory exceeds 1000 files: $RESULT_FILES"
              EVALUATOR_RC=1
            elif sudo find /opt/pack-evaluator/results ! -type f ! -type d -print -quit | grep -q .; then
              echo '::error::Evaluator result directory contains a non-regular entry'
              EVALUATOR_RC=1
            else
              sudo cp -a /opt/pack-evaluator/results/. "$GITHUB_WORKSPACE/pack-harvest/"
            fi
          fi
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/pack-harvest"
          find "$GITHUB_WORKSPACE/pack-harvest" -type d -exec chmod 0700 {} +
          find "$GITHUB_WORKSPACE/pack-harvest" -type f -exec chmod 0600 {} +
          if find "$GITHUB_WORKSPACE/pack-harvest" ! -type f ! -type d -print -quit | grep -q .; then
            echo '::error::Copied evaluator evidence contains a non-regular entry'
            rm -rf "$GITHUB_WORKSPACE/pack-harvest"
            mkdir -p "$GITHUB_WORKSPACE/pack-harvest"
            echo 'copied evaluator evidence failed regular-file validation' \
              > "$GITHUB_WORKSPACE/pack-diagnostics/evidence-validation-failure.txt"
            EVALUATOR_RC=1
          fi
          if [ "$EVALUATOR_RC" -eq 0 ]; then
            if ! env -i PATH=/opt/pack-evaluator/runtime/bin:/opt/pack-evaluator/bin:/usr/bin:/bin \
              "$NODE_BIN" /opt/pack-evaluator/lib/pack-production.mjs verify \
              --plan /opt/pack-evaluator/input/plan.json \
              --results-dir "$GITHUB_WORKSPACE/pack-harvest" \
              --cli /opt/pack-evaluator/bin/skillstore-cli \
              --expected-cli-version "$PACK_PRODUCTION_CLI_VERSION" \
              --run-id "${{ github.run_id }}" \
              --run-attempt "${{ github.run_attempt }}" \
              --commit-sha "${{ github.sha }}" \
              --model sonnet \
              --judge-model gpt-5.5 \
              > "$GITHUB_WORKSPACE/pack-diagnostics/verification-command.json"; then
              echo 'trusted evaluation closure verification failed' \
                > "$GITHUB_WORKSPACE/pack-diagnostics/verification-failure.txt"
              EVALUATOR_RC=1
            fi
          fi
          rm -f "$GITHUB_WORKSPACE/pack-harvest/"*.stdout.partial
          if [ "$EVALUATOR_RC" -eq 0 ]; then
            mkdir -p "$GITHUB_WORKSPACE/pack-trusted"
            cp "$GITHUB_WORKSPACE/pack-harvest/evaluate-summary.json" \
              "$GITHUB_WORKSPACE/pack-harvest/evaluation-verification.json" \
              "$GITHUB_WORKSPACE/pack-harvest/"*.evaluation.json \
              "$GITHUB_WORKSPACE/pack-harvest/"*.stdout.json \
              "$GITHUB_WORKSPACE/pack-trusted/"
            find "$GITHUB_WORKSPACE/pack-trusted" -type f -exec chmod 0600 {} +
          fi
          for name in evaluate-progress.ndjson evaluate-checkpoint.json evaluate-summary.json; do
            if [ -f "$GITHUB_WORKSPACE/pack-harvest/$name" ]; then
              cp "$GITHUB_WORKSPACE/pack-harvest/$name" "$GITHUB_WORKSPACE/pack-diagnostics/$name"
            fi
          done
          find "$GITHUB_WORKSPACE/pack-harvest" -maxdepth 1 -type f -name '*.run.log' \
            -exec cp {} "$GITHUB_WORKSPACE/pack-diagnostics/" \;
          find "$GITHUB_WORKSPACE/pack-diagnostics" -type f -exec chmod 0600 {} +
          PROXY_BYTES=$(wc -c < "$PROXY_LOG")
          PROXY_SHA256=$(sha256sum "$PROXY_LOG" | awk '{print $1}')
          jq -n \
            --arg outcome completed \
            --argjson bytes "$PROXY_BYTES" \
            --arg sha256 "$PROXY_SHA256" \
            '{outcome: $outcome, bytes: $bytes, sha256: $sha256}' \
            > "$GITHUB_WORKSPACE/pack-diagnostics/proxy-diagnostics.json"
          if [ "$EVALUATOR_RC" -ne 0 ]; then
            printf 'evaluator_exit_code=%s\n' "$EVALUATOR_RC" \
              > "$GITHUB_WORKSPACE/pack-diagnostics/evaluator-failure.txt"
            echo "::error::Pack evaluator exited with code $EVALUATOR_RC"
            exit "$EVALUATOR_RC"
          fi
          jq '{attempts: [.attempts[] | {scenarioId, status, outcome, durationMs}], selectedGenerationId}' \
            "$GITHUB_WORKSPACE/pack-harvest/evaluate-summary.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload trusted evaluation evidence
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: pack-production-evaluation
          path: pack-trusted/
          if-no-files-found: error
          retention-days: 90

      - name: Upload bounded evaluation diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pack-production-diagnostics
          path: pack-diagnostics/
          if-no-files-found: warn
          retention-days: 90

  persist:
    name: Persist through trusted API
    needs: [plan, evaluate]
    if: needs.plan.outputs.has_scenarios == 'true' && needs.evaluate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout orchestrator only
        uses: actions/checkout@v5
        with:
          path: marketplace-persist
          ref: ${{ github.sha }}
          sparse-checkout: scripts/pack-production.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download evaluation evidence
        uses: actions/download-artifact@v6
        with:
          name: pack-production-evaluation
          path: pack-results

      - name: Persist every attempt atomically
        env:
          SKILLSTORE_API_URL: ${{ secrets.SKILLSTORE_API_URL }}
          PACK_PRODUCTION_AUTOMATION_KEY: ${{ secrets.PACK_PRODUCTION_AUTOMATION_KEY }}
        run: |
          node marketplace-persist/scripts/pack-production.mjs persist \
            --results-dir "$GITHUB_WORKSPACE/pack-results" \
            --api-url "$SKILLSTORE_API_URL" \
            --token "$PACK_PRODUCTION_AUTOMATION_KEY" \
            > "$GITHUB_WORKSPACE/pack-results/persist-command.json"

      - name: Upload persistence readback
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pack-production-persisted
          path: pack-results/
          if-no-files-found: error
          retention-days: 90

  enrich_publish_readback:
    name: Enrich, gate, publish, and prove production
    needs: [plan, persist]
    if: needs.plan.outputs.has_scenarios == 'true' && needs.persist.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout orchestrator only
        uses: actions/checkout@v5
        with:
          path: marketplace-finalize
          ref: ${{ github.sha }}
          sparse-checkout: scripts/pack-production.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download persisted evidence
        uses: actions/download-artifact@v6
        with:
          name: pack-production-persisted
          path: pack-results

      - name: Await enrichment and enforce publish gates
        env:
          SKILLSTORE_API_URL: ${{ secrets.SKILLSTORE_API_URL }}
          PACK_PRODUCTION_AUTOMATION_KEY: ${{ secrets.PACK_PRODUCTION_AUTOMATION_KEY }}
          # Fail closed until the hardened evaluator-container canary passes and
          # PACK_PRODUCTION_AUTO_PUBLISH_ENABLED is explicitly enabled.
          AUTO_PUBLISH: ${{ vars.PACK_PRODUCTION_AUTO_PUBLISH_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.auto_publish) && 'true' || 'false' }}
        run: |
          node marketplace-finalize/scripts/pack-production.mjs finalize \
            --results-dir "$GITHUB_WORKSPACE/pack-results" \
            --api-url "$SKILLSTORE_API_URL" \
            --token "$PACK_PRODUCTION_AUTOMATION_KEY" \
            --auto-publish "$AUTO_PUBLISH" \
            --max-wait-seconds 1800 \
            --poll-seconds 30 \
            > "$GITHUB_WORKSPACE/pack-results/finalize-command.json"
          jq . "$GITHUB_WORKSPACE/pack-results/final-result.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final production evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pack-production-final
          path: pack-results/
          if-no-files-found: error
          retention-days: 90

  production_slo:
    name: Report rolling seven-day production SLO
    needs: [plan, evaluate, persist, enrich_publish_readback]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout SLO reporter only
        uses: actions/checkout@v5
        with:
          path: marketplace-slo
          ref: ${{ github.sha }}
          sparse-checkout: scripts/pack-production.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download audited plan or no-op evidence
        if: needs.plan.result == 'success'
        uses: actions/download-artifact@v6
        with:
          name: pack-production-plan
          path: pack-plan

      - name: Query and report rolling seven-day SLO
        env:
          SKILLSTORE_API_URL: ${{ secrets.SKILLSTORE_API_URL }}
          PACK_PRODUCTION_AUTOMATION_KEY: ${{ secrets.PACK_PRODUCTION_AUTOMATION_KEY }}
          PLAN_RESULT: ${{ needs.plan.result }}
          EVALUATE_RESULT: ${{ needs.evaluate.result }}
          PERSIST_RESULT: ${{ needs.persist.result }}
          FINALIZE_RESULT: ${{ needs.enrich_publish_readback.result }}
          HAS_SCENARIOS: ${{ needs.plan.outputs.has_scenarios }}
          SCENARIO_COUNT: ${{ needs.plan.outputs.scenario_count }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pack-slo"
          node marketplace-slo/scripts/pack-production.mjs slo \
            --results-dir "$GITHUB_WORKSPACE/pack-slo" \
            --api-url "$SKILLSTORE_API_URL" \
            --token "$PACK_PRODUCTION_AUTOMATION_KEY" \
            > "$GITHUB_WORKSPACE/pack-slo/slo-command.json"

          SLO="$GITHUB_WORKSPACE/pack-slo/slo-result.json"
          PASSED=$(jq -r '.met' "$SLO")
          ACTUAL=$(jq -r '.publishedReadbackPassed' "$SLO")
          TARGET=$(jq -r '.target' "$SLO")
          {
            echo "## Rolling 7-Day Pack Production SLO"
            echo ""
            echo "- Published + readback passed: $ACTUAL/$TARGET"
            echo "- Plan: $PLAN_RESULT ($SCENARIO_COUNT scenarios)"
            echo "- Evaluate: $EVALUATE_RESULT"
            echo "- Persist: $PERSIST_RESULT"
            echo "- Finalize: $FINALIZE_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PASSED" != "true" ]; then
            echo "::error::Rolling 7-day Pack production SLO is below target: $ACTUAL/$TARGET"
            echo "- Failure: SLO is below target; quality gates remain unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload terminal SLO and no-op evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pack-production-slo
          path: |
            pack-slo/
            pack-plan/no-op.json
          if-no-files-found: error
          retention-days: 90
