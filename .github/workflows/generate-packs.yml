name: Generate Pack

on:
  workflow_run:
    workflows: ['Pack Opportunity Admission']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful Pack Opportunity Admission run id'
        type: string
        required: true
      smoke_only:
        description: 'Run exactly the Messages and Responses contract probes; never plan, generate, or persist'
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: generate-pack-production-v4
  cancel-in-progress: false

env:
  # Production v4 requires the immutable binding-aware release and verifies its
  # checksums.txt asset before the binary crosses into the evaluator boundary.
  # Release sequencing gate: replace only after the runtime-accept capable
  # Skillstore CLI release and an independently recorded digest are available.
  # No release attestation exists yet, so this stays intentionally fail-closed.
  PACK_PRODUCTION_CLI_VERSION: '__SET_AFTER_PACK_RUNTIME_ACCEPT_CLI_RELEASE__'
  PACK_PRODUCTION_CLI_SHA256: '__SET_AFTER_PACK_RUNTIME_ACCEPT_CLI_RELEASE_SHA256__'
  # One cap feeds the local proxy and every Claude CLI process.
  PACK_EVALUATOR_MAX_OUTPUT_TOKENS: '16384'

jobs:
  contract_smoke_only:
    name: Smoke Helm Messages and Responses only
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.smoke_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the immutable contract probe only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: ''
          clean: true
          persist-credentials: false
          sparse-checkout: scripts/pack-evaluator-contract-smoke.mjs
          sparse-checkout-cone-mode: false

      - name: Send exactly one Messages and one Responses request
        env:
          PACK_EVALUATOR_HELM_API_KEY: ${{ secrets.PACK_EVALUATOR_HELM_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$PACK_EVALUATOR_HELM_API_KEY"
          mkdir -p "$GITHUB_WORKSPACE/pack-contract-smoke"
          PACK_EVALUATOR_PROXY_TOKEN="$PACK_EVALUATOR_HELM_API_KEY" \
          PACK_EVALUATOR_PROXY_URL=https://helm.easymeta.au \
          PACK_EVALUATOR_CONTRACT_TIMEOUT_MS=30000 \
          PACK_EVALUATOR_CONTRACT_DIAGNOSTICS_FILE="$GITHUB_WORKSPACE/pack-contract-smoke/contract-smoke.json" \
          node scripts/pack-evaluator-contract-smoke.mjs

      - name: Upload sanitized contract diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pack-evaluator-contract-smoke
          path: pack-contract-smoke/
          if-no-files-found: warn
          retention-days: 14

  prepare:
    name: Prepare an admitted Opportunity Brief
    if: >
      github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_run' &&
      vars.PACK_PRODUCTION_AUTOMATION_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.smoke_only != true)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has_scenarios: ${{ steps.handoff.outputs.has_scenarios }}
      opportunity_id: ${{ steps.handoff.outputs.opportunity_id }}
      brief_digest: ${{ steps.handoff.outputs.brief_digest }}
      source_run_id: ${{ steps.handoff.outputs.source_run_id }}
      evaluation_template_id: ${{ steps.handoff.outputs.evaluation_template_id }}
    steps:
      - name: Checkout immutable workflow revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: marketplace-prepare
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: ''
          clean: true
          persist-credentials: false

      - name: Download the exact successful admission artifact
        id: admission-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          WORKFLOW_RUN_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'workflow_run' ]; then
            SOURCE_RUN_ID="$WORKFLOW_RUN_SOURCE_RUN_ID"
          else
            SOURCE_RUN_ID="$DISPATCH_SOURCE_RUN_ID"
          fi
          case "$SOURCE_RUN_ID" in
            ''|*[!0-9]*) echo '::error::source run id must be numeric'; exit 1 ;;
          esac
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/pack-admission-artifact"
          RUN=$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,workflowName,conclusion,createdAt,headSha,runAttempt,headBranch,headRepository)
          test "$(jq -r '.databaseId' <<<"$RUN")" = "$SOURCE_RUN_ID"
          test "$(jq -r '.workflowName' <<<"$RUN")" = 'Pack Opportunity Admission'
          test "$(jq -r '.conclusion' <<<"$RUN")" = 'success'
          test "$(jq -r '.headBranch' <<<"$RUN")" = main
          test "$(jq -r '.headRepository.nameWithOwner' <<<"$RUN")" = "$GITHUB_REPOSITORY"
          echo "ADMISSION_SHA=$(jq -r '.headSha' <<<"$RUN")" >> "$GITHUB_ENV"
          echo "SOURCE_CREATED_AT=$(jq -r '.createdAt' <<<"$RUN")" >> "$GITHUB_ENV"
          echo "ADMISSION_RUN_ATTEMPT=$(jq -r '.runAttempt' <<<"$RUN")" >> "$GITHUB_ENV"
          echo 'SOURCE_WORKFLOW_PATH=.github/workflows/pack-opportunity-admission.yml' >> "$GITHUB_ENV"
          RUN_PATH=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.path')
          test "$RUN_PATH" = '.github/workflows/pack-opportunity-admission.yml'
          ARTIFACTS=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "pack-opportunity-admission" and .expired == false)]')
          ARTIFACT_COUNT=$(jq 'length' <<<"$ARTIFACTS")
          if [ "$ARTIFACT_COUNT" -eq 0 ] && [ "$GITHUB_EVENT_NAME" = 'workflow_run' ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Admission run is an already-claimed 24-hour cadence no-op.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$ARTIFACT_COUNT" -eq 1
          ARTIFACT_ID=$(jq -r '.[0].id' <<<"$ARTIFACTS")
          test "$(jq -r '.[0].workflow_run.id' <<<"$ARTIFACTS")" = "$SOURCE_RUN_ID"
          ARTIFACT_SIZE=$(jq -r '.[0].size_in_bytes' <<<"$ARTIFACTS")
          ARTIFACT_DIGEST=$(jq -r '.[0].digest' <<<"$ARTIFACTS")
          test "$ARTIFACT_SIZE" -gt 0
          test "$ARTIFACT_SIZE" -le 10485760
          case "$ARTIFACT_DIGEST" in sha256:[0-9a-f][0-9a-f]*) ;; *) echo '::error::Admission artifact has no SHA-256 digest'; exit 1 ;; esac
          ARCHIVE="$GITHUB_WORKSPACE/pack-admission-artifact.zip"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$ARCHIVE"
          test "$(stat -c%s "$ARCHIVE")" = "$ARTIFACT_SIZE"
          test "sha256:$(sha256sum "$ARCHIVE" | awk '{print $1}')" = "$ARTIFACT_DIGEST"
          ZIP_TOTALS=$(LC_ALL=C zipinfo -t "$ARCHIVE")
          ENTRY_COUNT=$(awk '{print $1}' <<<"$ZIP_TOTALS")
          UNCOMPRESSED_BYTES=$(awk '{print $3}' <<<"$ZIP_TOTALS")
          if ! [[ "$ENTRY_COUNT" =~ ^[0-9]+$ && "$UNCOMPRESSED_BYTES" =~ ^[0-9]+$ ]]; then
            echo '::error::Admission ZIP totals are invalid'
            exit 1
          fi
          if [ "$ENTRY_COUNT" -lt 1 ] || [ "$ENTRY_COUNT" -gt 1024 ]; then
            echo '::error::Admission ZIP entry count exceeds 1024'
            exit 1
          fi
          if [ "$UNCOMPRESSED_BYTES" -lt 1 ] || [ "$UNCOMPRESSED_BYTES" -gt 134217728 ]; then
            echo '::error::Admission ZIP uncompressed size exceeds 128 MiB'
            exit 1
          fi
          if unzip -Z1 "$ARCHIVE" | grep -Eq '(^/|(^|/)\.\.(/|$)|\\)'; then
            echo '::error::Admission ZIP contains an unsafe path'
            exit 1
          fi
          if LC_ALL=C zipinfo -l "$ARCHIVE" | awk '$1 ~ /^l/ { found=1 } END { exit found ? 0 : 1 }'; then
            echo '::error::Admission ZIP contains a symbolic-link entry'
            exit 1
          fi
          rm -rf "$GITHUB_WORKSPACE/pack-admission-artifact"
          mkdir -p "$GITHUB_WORKSPACE/pack-admission-artifact"
          unzip -q "$ARCHIVE" -d "$GITHUB_WORKSPACE/pack-admission-artifact"
          if [ -n "$(find "$GITHUB_WORKSPACE/pack-admission-artifact" -type l -print -quit)" ]; then
            echo '::error::Admission ZIP contains a symbolic link'
            exit 1
          fi
          test -f "$GITHUB_WORKSPACE/pack-admission-artifact/opportunities.json"
          node "$GITHUB_WORKSPACE/marketplace-prepare/scripts/pack-opportunity-handoff.mjs" validate-admission \
            --input "$GITHUB_WORKSPACE/pack-admission-artifact/opportunities.json" \
            --source-run-id "$SOURCE_RUN_ID" --source-created-at "$SOURCE_CREATED_AT" \
            --admission-head-sha "$ADMISSION_SHA" --admission-run-attempt "$ADMISSION_RUN_ATTEMPT" \
            --source-workflow-path "$SOURCE_WORKFLOW_PATH"
          echo 'available=true' >> "$GITHUB_OUTPUT"

      - name: Validate exact Opportunity Brief handoff
        id: handoff
        if: steps.admission-artifact.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: marketplace-prepare
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/pack-plan"
          if [ "$(jq '.opportunities | length' "$GITHUB_WORKSPACE/pack-admission-artifact/opportunities.json")" -eq 0 ]; then
            echo 'has_scenarios=false' >> "$GITHUB_OUTPUT"
            echo 'No admitted Opportunity Brief is available.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SELECTED=$(jq -ec '.opportunities | if length == 1 then .[0] else error("single admission required") end' \
            "$GITHUB_WORKSPACE/pack-admission-artifact/opportunities.json")
          OPPORTUNITY_ID=$(jq -r '.opportunity_id' <<<"$SELECTED")
          BRIEF_DIGEST=$(jq -r '.brief_digest' <<<"$SELECTED")
          PLANS=$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=pack-production-plan&per_page=100")
          if [ "$(jq '.artifacts | length' <<<"$PLANS")" -eq 100 ] && \
             [ "$(date -d "$(jq -r '.artifacts[-1].created_at' <<<"$PLANS")" +%s)" -ge "$(date -d "$SOURCE_CREATED_AT" +%s)" ]; then
            echo '::error::More than 100 generation claims may overlap this admission window'
            exit 1
          fi
          while IFS=$'\t' read -r ARTIFACT_ID ARTIFACT_SIZE ARTIFACT_DIGEST PLAN_RUN_ID; do
            [ -n "$ARTIFACT_ID" ] || continue
            case "$PLAN_RUN_ID" in ''|*[!0-9]*) exit 1 ;; esac
            test "$ARTIFACT_SIZE" -gt 0 && test "$ARTIFACT_SIZE" -le 5242880
            case "$ARTIFACT_DIGEST" in sha256:[0-9a-f][0-9a-f]*) ;; *) exit 1 ;; esac
            PLAN_RUN=$(gh run view "$PLAN_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --json databaseId,workflowName,headBranch,headRepository,createdAt)
            test "$(jq -r '.databaseId' <<<"$PLAN_RUN")" = "$PLAN_RUN_ID"
            test "$(jq -r '.workflowName' <<<"$PLAN_RUN")" = 'Generate Pack'
            test "$(jq -r '.headBranch' <<<"$PLAN_RUN")" = main
            test "$(jq -r '.headRepository.nameWithOwner' <<<"$PLAN_RUN")" = "$GITHUB_REPOSITORY"
            test "$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID" --jq '.path')" = '.github/workflows/generate-packs.yml'
            test "$(date -d "$(jq -r '.createdAt' <<<"$PLAN_RUN")" +%s)" -ge "$(date -d "$SOURCE_CREATED_AT" +%s)"
            ARCHIVE="$RUNNER_TEMP/pack-plan-claim-$ARTIFACT_ID.zip"
            ROOT="$RUNNER_TEMP/pack-plan-claim-$ARTIFACT_ID"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$ARCHIVE"
            test "$(stat -c%s "$ARCHIVE")" -eq "$ARTIFACT_SIZE"
            test "sha256:$(sha256sum "$ARCHIVE" | awk '{print $1}')" = "$ARTIFACT_DIGEST"
            ZIP_TOTALS=$(LC_ALL=C zipinfo -t "$ARCHIVE")
            ENTRY_COUNT=$(awk '{print $1}' <<<"$ZIP_TOTALS")
            UNCOMPRESSED_BYTES=$(awk '{print $3}' <<<"$ZIP_TOTALS")
            test "$ENTRY_COUNT" -ge 1 && test "$ENTRY_COUNT" -le 1024
            test "$UNCOMPRESSED_BYTES" -ge 1 && test "$UNCOMPRESSED_BYTES" -le 134217728
            if unzip -Z1 "$ARCHIVE" | grep -Eq '(^/|(^|/)\.\.(/|$)|\\)'; then exit 1; fi
            if LC_ALL=C zipinfo -l "$ARCHIVE" | awk '$1 ~ /^l/ { found=1 } END { exit found ? 0 : 1 }'; then exit 1; fi
            rm -rf "$ROOT" && mkdir -p "$ROOT"
            unzip -q "$ARCHIVE" -d "$ROOT"
            test -z "$(find "$ROOT" -type l -print -quit)"
            test -f "$ROOT/plan.json"
            if jq -e --arg sourceRunId "$SOURCE_RUN_ID" --arg opportunityId "$OPPORTUNITY_ID" --arg briefDigest "$BRIEF_DIGEST" '
              .opportunityBinding.sourceRunId == $sourceRunId and
              .opportunityBinding.opportunityId == $opportunityId and
              .opportunityBinding.briefDigest == $briefDigest
            ' "$ROOT/plan.json" >/dev/null; then
              node scripts/pack-opportunity-handoff.mjs validate-plan-claim \
                --input "$ROOT/plan.json" --output "$ROOT/claim.json" \
                --source-run-id "$SOURCE_RUN_ID" --source-created-at "$SOURCE_CREATED_AT" \
                --opportunity-id "$OPPORTUNITY_ID" --brief-digest "$BRIEF_DIGEST"
              echo 'has_scenarios=false' >> "$GITHUB_OUTPUT"
              echo "Existing exact generation claim: $(jq -r .generationId "$ROOT/claim.json")" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done < <(jq -r --arg sourceCreatedAt "$SOURCE_CREATED_AT" '
            .artifacts[] |
            select(.expired == false and .created_at >= $sourceCreatedAt) |
            [.id, .size_in_bytes, .digest, .workflow_run.id] | @tsv
          ' <<<"$PLANS")
          node scripts/pack-opportunity-handoff.mjs handoff \
            --input "$GITHUB_WORKSPACE/pack-admission-artifact/opportunities.json" \
            --output "$GITHUB_WORKSPACE/pack-plan/plan.json" \
            --opportunity-output "$GITHUB_WORKSPACE/pack-plan/opportunity.json" \
            --opportunity-id "$OPPORTUNITY_ID" \
            --brief-digest "$BRIEF_DIGEST" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-created-at "$SOURCE_CREATED_AT" \
            --admission-head-sha "$ADMISSION_SHA" \
            --admission-run-attempt "$ADMISSION_RUN_ATTEMPT" \
            --source-workflow-path "$SOURCE_WORKFLOW_PATH" \
            --generation-id "$(node -e "process.stdout.write(require('node:crypto').randomUUID())")" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow 'Generate Pack' \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --commit-sha "$GITHUB_SHA"
          EVALUATION_TEMPLATE_ID=$(jq -r '.opportunityBinding.evaluationTemplateId' "$GITHUB_WORKSPACE/pack-plan/plan.json")
          {
            echo 'has_scenarios=true'
            echo "opportunity_id=$OPPORTUNITY_ID"
            echo "brief_digest=$BRIEF_DIGEST"
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "evaluation_template_id=$EVALUATION_TEMPLATE_ID"
          } >> "$GITHUB_OUTPUT"
          jq '{opportunityBinding, opportunityFile, scenario: .scenarios[0] | {id, version, generationId}}' \
            "$GITHUB_WORKSPACE/pack-plan/plan.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable plan
        if: steps.handoff.outputs.has_scenarios == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pack-production-plan
          path: pack-plan/
          if-no-files-found: error
          retention-days: 90

  evaluate:
    name: Evaluate without production credentials
    needs: prepare
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.has_scenarios == 'true'
    environment:
      name: pack-production-candidate
    # GitHub-hosted runners are single-use VMs. The evaluator never reuses the
    # persistent OAuth HOME or sibling workspaces from our self-hosted pool.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout immutable skills and orchestrator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: marketplace-evaluate
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: ''
          clean: true
          persist-credentials: false

      - name: Download plan
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: pack-production-plan
          path: pack-production-input

      - name: Generate approved cross-repository CLI token
        id: cli-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: marketplace,skillstore
          permission-contents: read

      - name: Download pinned Skillstore CLI after candidate approval
        id: cli
        uses: ./marketplace-evaluate/.github/actions/download-skillstore-cli
        with:
          version: ${{ env.PACK_PRODUCTION_CLI_VERSION }}
          minimum-version: ${{ env.PACK_PRODUCTION_CLI_VERSION }}
          require-checksum: 'true'
          expected-sha256: ${{ env.PACK_PRODUCTION_CLI_SHA256 }}
          token: ${{ steps.cli-app-token.outputs.token }}
          cache-dir: /home/runner/_work/_cache/skillstore-cli

      - name: Stage approved CLI identity
        env:
          CLI: ${{ steps.cli.outputs.cli-path }}
          CLI_SHA256: ${{ steps.cli.outputs.cli-sha256 }}
          CLI_VERSION: ${{ env.PACK_PRODUCTION_CLI_VERSION }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pack-production-cli"
          install -m 0555 "$CLI" "$GITHUB_WORKSPACE/pack-production-cli/skillstore-cli-linux-x64"
          printf '%s  skillstore-cli-linux-x64\n' "$CLI_SHA256" > "$GITHUB_WORKSPACE/pack-production-cli/checksums.txt"
          jq -n --arg version "$CLI_VERSION" --arg sha256 "$CLI_SHA256" \
            '{version: $version, sha256: $sha256}' > "$GITHUB_WORKSPACE/pack-production-input/cli-identity.json"

      - name: Verify Plan CLI handoff before execution
        run: |
          (cd pack-production-cli && sha256sum -c checksums.txt)
          chmod +x pack-production-cli/skillstore-cli-linux-x64
          VERSION=$(pack-production-cli/skillstore-cli-linux-x64 --version | grep -Eo '[0-9]+([.][0-9]+){2}' | head -n1)
          test "$VERSION" = "$PACK_PRODUCTION_CLI_VERSION"

      - name: Reject plans outside the bounded evaluation budget
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/pack-diagnostics"
          SLOT_COUNT=$(jq '[.scenarios[].capabilitySlots | length] | add' pack-production-input/plan.json)
          MAX_CANDIDATES=2
          MAX_PACK_SKILLS=3
          HIDDEN_VARIANTS=3
          MAX_BEST_SINGLE_COMPETITORS=3
          CONTRACT_PROBES=2
          MAX_CLI_PREFLIGHT_REQUESTS=4
          # The deterministic treatment floor is not a safe operating ceiling:
          # real file/browser work can require additional tool-result turns.
          # Reserve a bounded 20-request envelope and let the proxy enforce the
          # absolute 160-request stop, including the pre-publication runtime gate.
          TOOL_LOOP_HEADROOM=20
          PROXY_REQUEST_BUDGET=160
          # Upper-bound actual proxy wire requests for one scenario. Every
          # executor/Judge request is counted, plus one Claude follow-up for
          # each installed Skill that must emit runtime invocation evidence.
          # Both CLI preflights may receive one bounded retry. Candidate dedupe
          # and parallel Skill tool calls can only lower this bound.
          ESTIMATED_REQUESTS=$((
            CONTRACT_PROBES +
            MAX_CLI_PREFLIGHT_REQUESTS +
            3 * SLOT_COUNT * MAX_CANDIDATES +
            3 +
            HIDDEN_VARIANTS * (MAX_PACK_SKILLS + 2) +
            2 * HIDDEN_VARIANTS +
            3 * HIDDEN_VARIANTS * MAX_BEST_SINGLE_COMPETITORS +
            HIDDEN_VARIANTS * MAX_PACK_SKILLS * (MAX_PACK_SKILLS + 1)
          ))
          jq -n \
            --argjson slotCount "$SLOT_COUNT" \
            --argjson maxCandidates "$MAX_CANDIDATES" \
            --argjson maxPackSkills "$MAX_PACK_SKILLS" \
            --argjson maxBestSingleCompetitors "$MAX_BEST_SINGLE_COMPETITORS" \
            --argjson variants "$HIDDEN_VARIANTS" \
            --argjson contractProbes "$CONTRACT_PROBES" \
            --argjson maxCliPreflightRequests "$MAX_CLI_PREFLIGHT_REQUESTS" \
            --argjson toolLoopHeadroom "$TOOL_LOOP_HEADROOM" \
            --argjson estimatedRequests "$ESTIMATED_REQUESTS" \
            --argjson reservedRequests "$((ESTIMATED_REQUESTS + TOOL_LOOP_HEADROOM))" \
            --argjson requestBudget "$PROXY_REQUEST_BUDGET" \
            '{
              schemaVersion: "marketplace.pack-evaluation-budget/v1",
              slotCount: $slotCount,
              maxCandidates: $maxCandidates,
              maxPackSkills: $maxPackSkills,
              maxBestSingleCompetitors: $maxBestSingleCompetitors,
              variants: $variants,
              contractProbes: $contractProbes,
              maxCliPreflightRequests: $maxCliPreflightRequests,
              skillToolFollowupsIncluded: true,
              toolLoopHeadroom: $toolLoopHeadroom,
              estimatedRequests: $estimatedRequests,
              reservedRequests: $reservedRequests,
              requestBudget: $requestBudget,
              admitted: ($slotCount >= 1 and $slotCount <= 4 and $reservedRequests <= $requestBudget)
            }' > "$GITHUB_WORKSPACE/pack-diagnostics/evaluation-budget.json"
          if [ "$SLOT_COUNT" -lt 1 ] || [ "$SLOT_COUNT" -gt 4 ] || \
             [ "$((ESTIMATED_REQUESTS + TOOL_LOOP_HEADROOM))" -gt "$PROXY_REQUEST_BUDGET" ]; then
            echo "::error::Evaluation plan exceeds bounded budget: slots=$SLOT_COUNT reserved=$((ESTIMATED_REQUESTS + TOOL_LOOP_HEADROOM))/$PROXY_REQUEST_BUDGET"
            exit 1
          fi
          jq . "$GITHUB_WORKSPACE/pack-diagnostics/evaluation-budget.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Install evaluator runtimes before secrets are available
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            apparmor bubblewrap ffmpeg iptables poppler-utils ripgrep util-linux
          sudo install -d -o root -g root -m 0755 \
            /opt/pack-evaluator \
            /opt/pack-evaluator/runtime
          sudo npm install --global --ignore-scripts --prefix /opt/pack-evaluator/runtime \
            @anthropic-ai/claude-code@2.1.210 \
            @openai/codex@0.139.0
          sudo chown -R root:root /opt/pack-evaluator/runtime
          sudo chmod -R a=rX /opt/pack-evaluator/runtime
          command -v ffprobe
          command -v pdfinfo
          command -v pdftotext
          command -v rg
          test "$(command -v bwrap)" = /usr/bin/bwrap
          /usr/bin/bwrap --version
          test "$(command -v google-chrome)" = /usr/bin/google-chrome
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
          test "$(/opt/pack-evaluator/runtime/bin/claude --version | awk '{print $1}')" = '2.1.210'
          test "$(/opt/pack-evaluator/runtime/bin/codex --version | awk '{print $2}')" = '0.139.0'

      - name: Prepare disposable evaluator identities and filesystem
        env:
          CLI: ${{ github.workspace }}/pack-production-cli/skillstore-cli-linux-x64
        run: |
          sudo useradd --system --create-home --home-dir /home/packproxy --shell /usr/sbin/nologin packproxy
          sudo useradd --create-home --home-dir /home/packeval --shell /bin/bash packeval
          NODE_SOURCE=$(command -v node)
          test -x "$NODE_SOURCE"
          sudo install -d -o root -g root -m 0555 \
            /opt/pack-evaluator \
            /opt/pack-evaluator/bin \
            /opt/pack-evaluator/lib \
            /opt/pack-evaluator/input
          sudo install -o root -g root -m 0555 "$CLI" /opt/pack-evaluator/bin/skillstore-cli
          sudo install -o root -g root -m 0555 "$NODE_SOURCE" /opt/pack-evaluator/bin/node
          sudo install -o root -g root -m 0555 "$NODE_SOURCE" /opt/pack-evaluator/runtime/bin/node
          sudo install -o root -g root -m 0555 \
            "$GITHUB_WORKSPACE/marketplace-evaluate/scripts/pack-evaluator-proxy.mjs" \
            /opt/pack-evaluator/lib/pack-evaluator-proxy.mjs
          sudo install -o root -g root -m 0555 \
            "$GITHUB_WORKSPACE/marketplace-evaluate/scripts/pack-evaluator-contract-smoke.mjs" \
            /opt/pack-evaluator/lib/pack-evaluator-contract-smoke.mjs
          sudo install -o root -g root -m 0555 \
            "$GITHUB_WORKSPACE/marketplace-evaluate/scripts/pack-production.mjs" \
            /opt/pack-evaluator/lib/pack-production.mjs
          sudo install -o root -g root -m 0444 \
            "$GITHUB_WORKSPACE/pack-production-input/plan.json" \
            /opt/pack-evaluator/input/plan.json
          sudo install -d -o root -g root -m 0555 /opt/pack-evaluator/input/skills
          CANDIDATE_COUNT=0
          while IFS= read -r candidate; do
            CANONICAL_PATH=$(jq -r '.canonicalPath' <<<"$candidate")
            SOURCE_COMMIT=$(jq -r '.sourceCommit' <<<"$candidate")
            CONTENT_HASH=$(jq -r '.contentHash' <<<"$candidate")
            TREE_HASH=$(jq -r '.treeHash' <<<"$candidate")
            case "$CANONICAL_PATH" in skills/*) ;; *) echo '::error::Unsafe candidate canonicalPath'; exit 1 ;; esac
            git -C "$GITHUB_WORKSPACE/marketplace-evaluate" cat-file -e "$SOURCE_COMMIT:$CANONICAL_PATH"
            git -C "$GITHUB_WORKSPACE/marketplace-evaluate" archive "$SOURCE_COMMIT" "$CANONICAL_PATH" | \
              sudo tar -x -C /opt/pack-evaluator/input/skills
            REPORT="/opt/pack-evaluator/input/skills/$CANONICAL_PATH/skill-report.json"
            test -f "$REPORT"
            test "$(sudo jq -r '.meta.content_hash' "$REPORT")" = "$CONTENT_HASH"
            test "$(sudo jq -r '.meta.tree_hash' "$REPORT")" = "$TREE_HASH"
            CANDIDATE_COUNT=$((CANDIDATE_COUNT + 1))
          done < <(jq -c '.candidateSkills[]' "$GITHUB_WORKSPACE/pack-production-input/opportunity.json")
          test "$CANDIDATE_COUNT" -ge 2
          test "$CANDIDATE_COUNT" -le 3
          test "$(find /opt/pack-evaluator/input/skills -name skill-report.json -type f | wc -l | tr -d ' ')" = "$CANDIDATE_COUNT"
          sudo chown -R root:root /opt/pack-evaluator/input/skills
          sudo chmod -R a=rX /opt/pack-evaluator/input/skills
          test "$(sha256sum "$CLI" | awk '{print $1}')" = \
            "$(sha256sum /opt/pack-evaluator/bin/skillstore-cli | awk '{print $1}')"
          test "$(sha256sum "$NODE_SOURCE" | awk '{print $1}')" = \
            "$(sha256sum /opt/pack-evaluator/bin/node | awk '{print $1}')"
          test "$(sha256sum "$NODE_SOURCE" | awk '{print $1}')" = \
            "$(sha256sum /opt/pack-evaluator/runtime/bin/node | awk '{print $1}')"
          sudo chown -R root:root \
            "$GITHUB_WORKSPACE/marketplace-evaluate" \
            "$GITHUB_WORKSPACE/pack-production-input"
          sudo chmod -R a=rX,u+w \
            "$GITHUB_WORKSPACE/marketplace-evaluate" \
            "$GITHUB_WORKSPACE/pack-production-input"
          sudo install -d -o packeval -g packeval -m 0700 \
            /home/packeval/tmp
          # Codex 0.139 creates ephemeral state files directly under CODEX_HOME.
          # A root-owned sticky directory lets packeval create only its own state
          # while preventing it from replacing the root-owned immutable config.
          sudo install -d -o root -g root -m 1777 \
            /opt/pack-evaluator/codex-home
          sudo install -d -o packeval -g packeval -m 0700 \
            /opt/pack-evaluator/codex-home/log \
            /opt/pack-evaluator/codex-home/sessions
          sudo install -d -o root -g root -m 0700 /opt/pack-evaluator/results
          sudo install -d -o root -g root -m 0711 /opt/pack-evaluator/generations
          mkdir -p \
            "$GITHUB_WORKSPACE/pack-diagnostics" \
            "$GITHUB_WORKSPACE/pack-harvest"
          printf '%s\n' \
            'model_provider = "pack_evaluator_proxy"' \
            '[model_providers.pack_evaluator_proxy]' \
            'name = "Job-local Pack evaluator proxy"' \
            'base_url = "http://127.0.0.1:18765/v1"' \
            'env_key = "PACK_EVALUATOR_PROXY_TOKEN"' \
            'wire_api = "responses"' \
            'supports_websockets = false' \
            | sudo tee /opt/pack-evaluator/codex-home/config.toml >/dev/null
          sudo chown root:root /opt/pack-evaluator/codex-home/config.toml
          sudo chmod 0444 /opt/pack-evaluator/codex-home/config.toml

      - name: Configure and prove scoped bubblewrap user namespaces before secrets
        run: |
          set -euo pipefail
          sudo env \
            PACK_EVALUATOR_OUTER_WORKSPACE="$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/marketplace-evaluate/scripts/configure-pack-evaluator-bwrap.sh"

      - name: Restrict and prove evaluator egress before secrets
        run: |
          set -euo pipefail
          sudo "$GITHUB_WORKSPACE/marketplace-evaluate/scripts/configure-pack-evaluator-egress.sh"
          IPV4_REJECT_BEFORE=$(sudo iptables -w 5 -L PACK_EVALUATOR_EGRESS -v -n -x \
            | awk '$3 == "REJECT" {print $1}')
          IPV6_REJECT_BEFORE=$(sudo ip6tables -w 5 -L PACK_EVALUATOR_EGRESS -v -n -x \
            | awk '$3 == "REJECT" {print $1}')
          test -n "$IPV4_REJECT_BEFORE"
          test -n "$IPV6_REJECT_BEFORE"
          sudo -u packeval env -i PATH=/usr/bin:/bin bash -ceu '
            for blocked in \
              http://1.1.1.1 \
              http://169.254.169.254/latest/meta-data/ \
              http://127.0.0.1:18764 \
              http://[::1]:18765; do
              if curl --noproxy "*" --connect-timeout 1 --max-time 2 "$blocked" >/dev/null 2>&1; then
                echo "Evaluator egress unexpectedly reached a blocked target" >&2
                exit 1
              fi
            done
          '
          IPV4_REJECT_AFTER=$(sudo iptables -w 5 -L PACK_EVALUATOR_EGRESS -v -n -x \
            | awk '$3 == "REJECT" {print $1}')
          IPV6_REJECT_AFTER=$(sudo ip6tables -w 5 -L PACK_EVALUATOR_EGRESS -v -n -x \
            | awk '$3 == "REJECT" {print $1}')
          test "$IPV4_REJECT_AFTER" -gt "$IPV4_REJECT_BEFORE"
          test "$IPV6_REJECT_AFTER" -gt "$IPV6_REJECT_BEFORE"

      # The real Helm credential exists only in this runner-owned shell and the
      # separate packproxy process. Agent commands run as a different, non-sudo
      # user with an empty environment and receive only a localhost-scoped token.
      - name: Evaluate the single admitted scenario
        env:
          PACK_EVALUATOR_HELM_API_KEY: ${{ secrets.PACK_EVALUATOR_HELM_API_KEY }}
        run: |
          set -euo pipefail
          LOCAL_TOKEN=$(openssl rand -hex 32)
          NODE_BIN=/opt/pack-evaluator/bin/node
          test -x "$NODE_BIN"
          PROXY_LOG=$(mktemp)
          PROXY_ACTIVITY=$(mktemp)
          chmod 0600 "$PROXY_ACTIVITY"
          sudo chown packproxy:packproxy "$PROXY_ACTIVITY"
          chmod 0600 "$PROXY_LOG"
          CHECKPOINT_LOCK="$RUNNER_TEMP/pack-production-checkpoint.lock"
          EVALUATOR_RESULTS_DIR=/opt/pack-evaluator/results
          CHECKPOINT_PID=''
          EVALUATOR_PID=''
          EVALUATOR_FINISHED=false
          CLEANUP_DONE=false
          checkpoint_progress() {
            (
              flock -x 9
              for name in evaluate-progress.ndjson evaluate-checkpoint.json evaluate-summary.json; do
                if sudo test -f "$EVALUATOR_RESULTS_DIR/$name"; then
                  temporary="$GITHUB_WORKSPACE/pack-diagnostics/.${name}.tmp.${BASHPID}"
                  sudo cp "$EVALUATOR_RESULTS_DIR/$name" "$temporary"
                  sudo chown "$(id -u):$(id -g)" "$temporary"
                  chmod 0600 "$temporary"
                  mv -f "$temporary" "$GITHUB_WORKSPACE/pack-diagnostics/$name"
                fi
              done
            ) 9>"$CHECKPOINT_LOCK"
          }
          checkpoint_loop() {
            trap - EXIT INT TERM
            while true; do
              sleep 30
              checkpoint_progress || true
            done
          }
          write_interrupted_marker() {
            if [ "$EVALUATOR_FINISHED" = "true" ]; then
              return 0
            fi
            local temporary
            temporary=$(mktemp "$GITHUB_WORKSPACE/pack-diagnostics/.evaluator-interrupted.XXXXXX")
            printf 'evaluator_interrupted=true\n' > "$temporary"
            chmod 0600 "$temporary"
            mv -f "$temporary" "$GITHUB_WORKSPACE/pack-diagnostics/evaluator-interrupted.txt"
          }
          bounded_checkpoint_progress() {
            export -f checkpoint_progress
            export CHECKPOINT_LOCK EVALUATOR_RESULTS_DIR GITHUB_WORKSPACE
            timeout --signal=TERM --kill-after=0.2s 1s bash -c 'checkpoint_progress' \
              >/dev/null 2>&1 || true
          }
          cleanup() {
            local exit_code="${1:-$?}"
            if [ "$CLEANUP_DONE" = "true" ]; then
              return "$exit_code"
            fi
            CLEANUP_DONE=true
            set +e
            write_interrupted_marker
            bounded_checkpoint_progress
            evaluator_group_alive() {
              sudo ps -o stat= -g "$EVALUATOR_PID" 2>/dev/null | grep -qv '^[[:space:]]*Z'
            }
            if [ -n "$EVALUATOR_PID" ] && [ "$EVALUATOR_FINISHED" != "true" ]; then
              sudo kill -TERM -- "-$EVALUATOR_PID" 2>/dev/null || true
              for _ in $(seq 1 40); do
                if ! evaluator_group_alive; then
                  break
                fi
                sleep 0.1
              done
              sudo kill -KILL -- "-$EVALUATOR_PID" 2>/dev/null || true
              sleep 0.1
              if evaluator_group_alive; then
                echo 'root evaluator survived TERM and KILL' \
                  > "$GITHUB_WORKSPACE/pack-diagnostics/root-termination-failure.txt"
              fi
            fi
            if [ -n "$CHECKPOINT_PID" ]; then
              kill "$CHECKPOINT_PID" 2>/dev/null || true
              wait "$CHECKPOINT_PID" 2>/dev/null || true
            fi
            sudo pkill -TERM -u packeval 2>/dev/null || true
            for _ in $(seq 1 10); do
              if ! sudo pgrep -u packeval >/dev/null 2>&1; then
                break
              fi
              sleep 0.1
            done
            sudo pkill -KILL -u packeval 2>/dev/null || true
            sleep 0.1
            if sudo pgrep -u packeval >/dev/null 2>&1; then
              echo 'packeval processes survived TERM and KILL' \
                > "$GITHUB_WORKSPACE/pack-diagnostics/process-termination-failure.txt"
            fi
            sudo pkill -TERM -u packproxy -f pack-evaluator-proxy.mjs 2>/dev/null || true
            for _ in $(seq 1 10); do
              if ! sudo pgrep -u packproxy -f pack-evaluator-proxy.mjs >/dev/null 2>&1; then
                break
              fi
              sleep 0.1
            done
            sudo pkill -KILL -u packproxy -f pack-evaluator-proxy.mjs 2>/dev/null || true
            sleep 0.1
            if sudo pgrep -u packproxy -f pack-evaluator-proxy.mjs >/dev/null 2>&1; then
              echo 'packproxy processes survived TERM and KILL' \
                > "$GITHUB_WORKSPACE/pack-diagnostics/proxy-termination-failure.txt"
              if [ "$exit_code" -eq 0 ]; then exit_code=1; fi
            fi
            if sudo test -f "$PROXY_ACTIVITY"; then
              sudo install -o "$(id -u)" -g "$(id -g)" -m 0600 \
                "$PROXY_ACTIVITY" "$GITHUB_WORKSPACE/pack-diagnostics/proxy-activity.jsonl" || \
                echo 'proxy activity preservation failed' > "$GITHUB_WORKSPACE/pack-diagnostics/proxy-activity-preservation-failure.txt"
            fi
            rm -f "$PROXY_LOG"
            sudo rm -f "$PROXY_ACTIVITY"
            return "$exit_code"
          }
          terminate_step() {
            local exit_code="$1"
            cleanup "$exit_code"
            trap - EXIT
            exit "$exit_code"
          }
          trap 'terminate_step 143' TERM
          trap 'terminate_step 130' INT
          trap 'terminate_step 129' HUP
          trap 'cleanup $?' EXIT

          sudo -u packproxy env -i \
            PATH=/opt/pack-evaluator/bin:/usr/bin:/bin \
            PACK_EVALUATOR_LOCAL_TOKEN="$LOCAL_TOKEN" \
            PACK_EVALUATOR_UPSTREAM_KEY="$PACK_EVALUATOR_HELM_API_KEY" \
            PACK_EVALUATOR_UPSTREAM_URL=https://helm.easymeta.au \
            PACK_EVALUATOR_PROXY_PORT=18765 \
            PACK_EVALUATOR_ALLOWED_MODELS=claude-sonnet-4.6,claude-sonnet-4-6,claude-sonnet-5,sonnet,gpt-5.5 \
            PACK_EVALUATOR_MAX_REQUESTS=160 \
            PACK_EVALUATOR_MAX_INPUT_TOKENS=600000 \
            PACK_EVALUATOR_MAX_TOTAL_OUTPUT_TOKENS=120000 \
            PACK_EVALUATOR_MAX_COST_USD=10 \
            PACK_EVALUATOR_MAX_INPUT_COST_PER_MILLION_USD=100 \
            PACK_EVALUATOR_MAX_OUTPUT_COST_PER_MILLION_USD=500 \
            PACK_EVALUATOR_MAX_CONCURRENT=1 \
            PACK_EVALUATOR_MAX_OUTPUT_TOKENS="$PACK_EVALUATOR_MAX_OUTPUT_TOKENS" \
            PACK_EVALUATOR_TTL_MS=14400000 \
            PACK_EVALUATOR_REQUEST_TIMEOUT_MS=600000 \
            PACK_EVALUATOR_ACTIVITY_FILE="$PROXY_ACTIVITY" \
            "$NODE_BIN" /opt/pack-evaluator/lib/pack-evaluator-proxy.mjs \
            >"$PROXY_LOG" 2>&1 &
          PROXY_LAUNCH_PID=$!
          unset PACK_EVALUATOR_HELM_API_KEY

          PROXY_READY=false
          for _ in $(seq 1 30); do
            if curl --fail --silent \
              -H "Authorization: Bearer $LOCAL_TOKEN" \
              http://127.0.0.1:18765/healthz >/dev/null; then
              PROXY_READY=true
              break
            fi
            sleep 1
          done
          if [ "$PROXY_READY" != "true" ]; then
            echo "::error::Pack evaluator proxy did not become healthy within 30 seconds"
            PROXY_BYTES=$(wc -c < "$PROXY_LOG")
            PROXY_SHA256=$(sha256sum "$PROXY_LOG" | awk '{print $1}')
            jq -n \
              --arg outcome startup_failed \
              --argjson bytes "$PROXY_BYTES" \
              --arg sha256 "$PROXY_SHA256" \
              '{outcome: $outcome, bytes: $bytes, sha256: $sha256}' \
              > "$GITHUB_WORKSPACE/pack-diagnostics/proxy-diagnostics.json"
            kill "$PROXY_LAUNCH_PID" 2>/dev/null || true
            wait "$PROXY_LAUNCH_PID" 2>/dev/null || true
            exit 1
          fi
          PROXY_PID=$(pgrep -u packproxy -f pack-evaluator-proxy.mjs | head -n1)
          test -n "$PROXY_PID"

          if ! sudo -u packeval env -i \
            PATH=/opt/pack-evaluator/bin:/usr/bin:/bin \
            HOME=/home/packeval \
            PROXY_PID="$PROXY_PID" \
            bash -c '
              set -euo pipefail
              ! sudo -n true 2>/dev/null
              ! test -r "/proc/$PROXY_PID/environ"
              ! test -e /home/packeval/.codex/auth.json
              ! test -e /home/packeval/.claude
              ! test -r /var/run/docker.sock
              ! env | grep -Eq "SUPABASE|HELM|GITHUB_TOKEN|GH_TOKEN|AUTOMATION|APP_PRIVATE_KEY|CALLBACK|CACHE_INVALIDATE"
               test -x /opt/pack-evaluator/bin/node
               test -x /opt/pack-evaluator/bin/skillstore-cli
               test -r /opt/pack-evaluator/input/plan.json
               test -r /opt/pack-evaluator/input/skills
               test -n "$(find /opt/pack-evaluator/input/skills -name skill-report.json -print -quit)"
               command -v rg >/dev/null
              ! test -w /opt/pack-evaluator
              ! test -w /opt/pack-evaluator/bin
              ! test -w /opt/pack-evaluator/lib
              ! test -w /opt/pack-evaluator/input
              ! test -w /opt/pack-evaluator/runtime
              ! test -w /opt/pack-evaluator/runtime/bin
              ! test -w /opt/pack-evaluator/runtime/lib
              ! test -w /opt/pack-evaluator/generations
              test -x /opt/pack-evaluator/runtime/bin/claude
              test -x /opt/pack-evaluator/runtime/bin/codex
              test -r /opt/pack-evaluator/codex-home/config.toml
               test -w /opt/pack-evaluator/codex-home
               test "$(stat -c '%U:%G:%a' /opt/pack-evaluator/codex-home)" = 'root:root:1777'
              ! test -w /opt/pack-evaluator/codex-home/config.toml
              ! test -r /opt/pack-evaluator/results
            '; then
            echo 'evaluator isolation preflight failed' \
              > "$GITHUB_WORKSPACE/pack-diagnostics/preflight-failure.txt"
            exit 1
          fi

          # Two single-request contract probes (Messages and Responses) prove
          # the Helm key/model/route contract before any expensive agent run.
          INFRASTRUCTURE_FAILURE_FILE="$GITHUB_WORKSPACE/pack-diagnostics/infrastructure-failure.json"
          INFRASTRUCTURE_ARGS=()
          CONTRACT_DIAGNOSTICS="$GITHUB_WORKSPACE/pack-diagnostics/contract-smoke.json"
          set +e
          PACK_EVALUATOR_PROXY_TOKEN="$LOCAL_TOKEN" \
          PACK_EVALUATOR_PROXY_URL=http://127.0.0.1:18765 \
          PACK_EVALUATOR_CONTRACT_TIMEOUT_MS=30000 \
          PACK_EVALUATOR_CONTRACT_DIAGNOSTICS_FILE="$CONTRACT_DIAGNOSTICS" \
          "$NODE_BIN" /opt/pack-evaluator/lib/pack-evaluator-contract-smoke.mjs
          CONTRACT_RC=$?
          set -e

          if [ "$CONTRACT_RC" -ne 0 ]; then
            DIAGNOSTIC_SHA256=$(sha256sum "$CONTRACT_DIAGNOSTICS" | awk '{print $1}')
            CONTRACT_STATUS=$(jq -r '[.contracts[] | select(.outcome != "passed")][0].status // empty' "$CONTRACT_DIAGNOSTICS")
            CONTRACT_REASON=contract_failed
            if [ -n "$CONTRACT_STATUS" ] && [ "$CONTRACT_STATUS" -ge 400 ] && \
               [ "$CONTRACT_STATUS" -lt 500 ] && [ "$CONTRACT_STATUS" -ne 408 ] && \
               [ "$CONTRACT_STATUS" -ne 425 ] && [ "$CONTRACT_STATUS" -ne 429 ]; then
              CONTRACT_REASON=deterministic_http
            elif jq -e '[.contracts[] | select(.outcome == "transport_failed" and .transportErrorType == "AbortError")] | length > 0' \
              "$CONTRACT_DIAGNOSTICS" >/dev/null; then
              CONTRACT_REASON=timeout
            fi
            jq -n \
              --arg stage contract_smoke \
              --arg reason "$CONTRACT_REASON" \
              --arg status "$CONTRACT_STATUS" \
              --arg path "$(jq -r '[.contracts[] | select(.outcome != "passed")][0].path // empty' "$CONTRACT_DIAGNOSTICS")" \
              --arg model "$(jq -r '[.contracts[] | select(.outcome != "passed")][0].model // empty' "$CONTRACT_DIAGNOSTICS")" \
              --arg diagnosticSha256 "$DIAGNOSTIC_SHA256" \
              '{
                schemaVersion: "marketplace.pack-production-infrastructure-failure/v1",
                stage: $stage,
                reason: $reason,
                status: (if $status == "" then null else ($status | tonumber) end),
                path: (if $path == "" then null else $path end),
                model: (if $model == "" then null else $model end),
                diagnosticSha256: $diagnosticSha256
              }' > "$INFRASTRUCTURE_FAILURE_FILE"
          else
            set +e
            PACK_EVALUATOR_PROXY_TOKEN="$LOCAL_TOKEN" \
            PACK_DIAGNOSTICS_DIR="$GITHUB_WORKSPACE/pack-diagnostics" \
            PACK_EVALUATOR_ACTIVITY_FILE="$PROXY_ACTIVITY" \
            PACK_EVALUATOR_MARKETPLACE_COMMIT_SHA="$GITHUB_SHA" \
            PACK_EVALUATOR_CLI_SHA256="$(jq -r '.sha256' "$GITHUB_WORKSPACE/pack-production-input/cli-identity.json")" \
            bash "$GITHUB_WORKSPACE/marketplace-evaluate/scripts/pack-evaluator-preflight.sh"
            PREFLIGHT_RC=$?
            set -e
            if [ "$PREFLIGHT_RC" -ne 0 ]; then
              PREFLIGHT_DIAGNOSTICS="$GITHUB_WORKSPACE/pack-diagnostics/agent-preflight-diagnostics.json"
              DIAGNOSTIC_SHA256=$(sha256sum "$PREFLIGHT_DIAGNOSTICS" | awk '{print $1}')
              PREFLIGHT_REASON=$(jq -r '
                if .errorClass == "deterministic_http" then "deterministic_http"
                elif .errorClass == "timeout" then "timeout"
                else "preflight_failed" end
              ' "$PREFLIGHT_DIAGNOSTICS")
              PREFLIGHT_STATUS=$(jq -r '.http.inferenceFatalStatus // .http.inferenceRetryableStatus // empty' \
                "$PREFLIGHT_DIAGNOSTICS")
              PREFLIGHT_AUXILIARY_REJECTED_COUNT=$(jq -r '.http.auxiliaryRejectedCount // 0' \
                "$PREFLIGHT_DIAGNOSTICS")
              PREFLIGHT_ERROR_CATEGORY=$(sudo jq -rs '
                [
                  .[]
                  | select(
                      .phase == "response"
                      and (.path == "/v1/messages" or .path == "/v1/responses")
                      and (.status | type) == "number"
                      and .status >= 400 and .status < 500
                      and (.status != 408 and .status != 425 and .status != 429)
                    )
                ]
                | last as $activity
                | [
                    "unknown_model_or_lane",
                    "unsupported_parameter",
                    "authentication_failed",
                    "context_length_exceeded",
                    "malformed_request",
                    "other",
                    "request_body_too_large",
                    "model_not_allowed",
                    "invalid_output_token_limit"
                  ] as $allowed
                | if $activity != null and ($allowed | index($activity.errorCategory)) != null
                  then $activity.errorCategory
                  else empty
                  end
              ' "$PROXY_ACTIVITY" 2>/dev/null || true)
              jq -n \
                --arg stage agent_preflight \
                --arg reason "$PREFLIGHT_REASON" \
                --arg status "$PREFLIGHT_STATUS" \
                --arg errorCategory "$PREFLIGHT_ERROR_CATEGORY" \
                --argjson auxiliaryRejectedCount "$PREFLIGHT_AUXILIARY_REJECTED_COUNT" \
                --arg diagnosticSha256 "$DIAGNOSTIC_SHA256" \
                '{
                  schemaVersion: "marketplace.pack-production-infrastructure-failure/v1",
                  stage: $stage,
                  reason: $reason,
                  status: (if $status == "" then null else ($status | tonumber) end),
                  errorCategory: (if $errorCategory == "" then null else $errorCategory end),
                  auxiliaryRejectedCount: $auxiliaryRejectedCount,
                  diagnosticSha256: $diagnosticSha256
                }' > "$INFRASTRUCTURE_FAILURE_FILE"
            fi
          fi

          if [ -f "$INFRASTRUCTURE_FAILURE_FILE" ]; then
            INFRASTRUCTURE_ARGS+=(--infrastructure-failure-file "$INFRASTRUCTURE_FAILURE_FILE")
          fi
          PACKEVAL_UID=$(id -u packeval)
          PACKEVAL_GID=$(id -g packeval)
          checkpoint_loop &
          CHECKPOINT_PID=$!
          set +e
          # Claude executes installed Skills; Codex independently judges artifact evidence.
          # Explicit model targeting keeps the two roles separate rather than cross-falling back.
          setsid sudo env -i \
            PATH=/opt/pack-evaluator/runtime/bin:/usr/bin:/bin \
            HOME=/home/packeval \
            CODEX_HOME=/opt/pack-evaluator/codex-home \
            TMPDIR=/home/packeval/tmp \
            CI=true \
            NO_COLOR=1 \
            SKILLSTORE_AGENTS=codex,claude \
            SKILLSTORE_AGENT_ENV_MODE=strict \
            SKILLSTORE_AGENT_ENV_ALLOWLIST=CODEX_HOME,PACK_EVALUATOR_PROXY_TOKEN,PACK_EVALUATOR_CHROMIUM_PATH,ANTHROPIC_BASE_URL,ANTHROPIC_AUTH_TOKEN,CLAUDE_CODE_MAX_OUTPUT_TOKENS,NO_PROXY,SKILLSTORE_AGENT_SANDBOX_MODE,SKILLSTORE_AGENT_SANDBOX_RUNTIME_ROOT \
            SKILLSTORE_AGENT_SANDBOX_MODE=bwrap \
            SKILLSTORE_AGENT_SANDBOX_RUNTIME_ROOT=/opt/pack-evaluator/runtime \
            PACK_EVALUATOR_CHROMIUM_PATH=/usr/bin/google-chrome \
            PACK_EVALUATOR_PROXY_TOKEN="$LOCAL_TOKEN" \
            ANTHROPIC_BASE_URL=http://127.0.0.1:18765 \
            ANTHROPIC_AUTH_TOKEN="$LOCAL_TOKEN" \
            CLAUDE_CODE_MAX_OUTPUT_TOKENS="$PACK_EVALUATOR_MAX_OUTPUT_TOKENS" \
            NO_PROXY=127.0.0.1,localhost \
            timeout --signal=TERM --kill-after=30s 120m \
            prlimit --nproc=256:256 --as=6442450944:6442450944 -- \
            "$NODE_BIN" /opt/pack-evaluator/lib/pack-production.mjs evaluate \
            --plan /opt/pack-evaluator/input/plan.json \
            --results-dir /opt/pack-evaluator/results \
            --cli /opt/pack-evaluator/bin/skillstore-cli \
            --expected-cli-version "$PACK_PRODUCTION_CLI_VERSION" \
            --skills-dir /opt/pack-evaluator/input/skills \
            --evaluator-uid "$PACKEVAL_UID" \
            --evaluator-gid "$PACKEVAL_GID" \
            --evaluator-cwd /home/packeval \
            --evaluator-runtime-root /opt/pack-evaluator/generations \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --commit-sha "${{ github.sha }}" \
            --model sonnet \
            --judge-model gpt-5.5 \
            --max-candidates 2 \
            --pick 3 \
            --runs 1 \
            --final-runs 3 \
            --agent-timeout-ms 360000 \
            --agent-max-retries 1 \
            --threshold 7 \
            --baseline-delta 1 \
            --auto-publish-threshold 8 \
            --evaluation-budget-ms 7200000 \
            --scenario-timeout-ms 7200000 \
            --minimum-fallback-ms 1800000 \
            --scenario-idle-timeout-ms 600000 \
            --proxy-activity-file "$PROXY_ACTIVITY" \
            "${INFRASTRUCTURE_ARGS[@]}" \
            > "$GITHUB_WORKSPACE/pack-diagnostics/evaluate-command.json" &
          EVALUATOR_PID=$!
          wait "$EVALUATOR_PID"
          EVALUATOR_RC=$?
          EVALUATOR_PID=''
          EVALUATOR_FINISHED=true
          kill "$CHECKPOINT_PID" 2>/dev/null || true
          wait "$CHECKPOINT_PID" 2>/dev/null || true
          CHECKPOINT_PID=''
          set -e
          sudo pkill -TERM -u packeval 2>/dev/null || true
          for _ in $(seq 1 10); do
            if ! sudo pgrep -u packeval >/dev/null 2>&1; then
              break
            fi
            sleep 0.1
          done
          sudo pkill -KILL -u packeval 2>/dev/null || true
          EVALUATOR_PROCESSES_STOPPED=true
          if sudo pgrep -u packeval >/dev/null 2>&1; then
            echo '::error::Unable to terminate all evaluator processes'
            EVALUATOR_RC=1
            EVALUATOR_PROCESSES_STOPPED=false
          fi
          if [ "$EVALUATOR_PROCESSES_STOPPED" != "true" ]; then
            echo 'evaluator processes survived TERM and KILL' \
              > "$GITHUB_WORKSPACE/pack-diagnostics/process-termination-failure.txt"
          else
            RESULT_BYTES=$(sudo du -sb /opt/pack-evaluator/results | awk '{print $1}')
            RESULT_FILES=$(sudo find /opt/pack-evaluator/results -type f | wc -l)
            if [ "$RESULT_BYTES" -gt 268435456 ]; then
              echo "::error::Evaluator result directory exceeds 256 MiB: $RESULT_BYTES bytes"
              EVALUATOR_RC=1
            elif [ "$RESULT_FILES" -gt 1000 ]; then
              echo "::error::Evaluator result directory exceeds 1000 files: $RESULT_FILES"
              EVALUATOR_RC=1
            elif sudo find /opt/pack-evaluator/results ! -type f ! -type d -print -quit | grep -q .; then
              echo '::error::Evaluator result directory contains a non-regular entry'
              EVALUATOR_RC=1
            else
              sudo cp -a /opt/pack-evaluator/results/. "$GITHUB_WORKSPACE/pack-harvest/"
            fi
          fi
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/pack-harvest"
          find "$GITHUB_WORKSPACE/pack-harvest" -type d -exec chmod 0700 {} +
          find "$GITHUB_WORKSPACE/pack-harvest" -type f -exec chmod 0600 {} +
          if find "$GITHUB_WORKSPACE/pack-harvest" ! -type f ! -type d -print -quit | grep -q .; then
            echo '::error::Copied evaluator evidence contains a non-regular entry'
            rm -rf "$GITHUB_WORKSPACE/pack-harvest"
            mkdir -p "$GITHUB_WORKSPACE/pack-harvest"
            echo 'copied evaluator evidence failed regular-file validation' \
              > "$GITHUB_WORKSPACE/pack-diagnostics/evidence-validation-failure.txt"
            EVALUATOR_RC=1
          fi
          if [ "$EVALUATOR_RC" -eq 0 ]; then
            if ! env -i PATH=/opt/pack-evaluator/runtime/bin:/usr/bin:/bin \
              "$NODE_BIN" /opt/pack-evaluator/lib/pack-production.mjs verify \
              --plan /opt/pack-evaluator/input/plan.json \
              --results-dir "$GITHUB_WORKSPACE/pack-harvest" \
              --cli /opt/pack-evaluator/bin/skillstore-cli \
              --expected-cli-version "$PACK_PRODUCTION_CLI_VERSION" \
              --run-id "${{ github.run_id }}" \
              --run-attempt "${{ github.run_attempt }}" \
              --commit-sha "${{ github.sha }}" \
              --model sonnet \
              --judge-model gpt-5.5 \
              > "$GITHUB_WORKSPACE/pack-diagnostics/verification-command.json"; then
              echo 'trusted evaluation closure verification failed' \
                > "$GITHUB_WORKSPACE/pack-diagnostics/verification-failure.txt"
              EVALUATOR_RC=1
            fi
          fi
          if [ "$EVALUATOR_RC" -eq 0 ]; then
            # Keep the whole path traversable by packeval; runner temp paths
            # are not part of the evaluator's ownership boundary.
            sudo install -d -o root -g root -m 0711 /opt/pack-evaluator/prepublish-runtime
            RUNTIME_ROOT=$(sudo mktemp -d /opt/pack-evaluator/prepublish-runtime/runtime.XXXXXX)
            sudo chown packeval:packeval "$RUNTIME_ROOT"
            sudo chmod 0700 "$RUNTIME_ROOT"
            sudo install -d -o packeval -g packeval -m 0700 \
              "$RUNTIME_ROOT/home" "$RUNTIME_ROOT/tmp" "$RUNTIME_ROOT/stage" \
              "$RUNTIME_ROOT/output"
            # Codex needs an immutable provider configuration but creates
            # ephemeral state directly below CODEX_HOME. A sticky root-owned
            # parent prevents replacement of config.toml while allowing only
            # packeval to create its own log and session state.
            sudo install -d -o root -g root -m 1777 "$RUNTIME_ROOT/codex-home"
            sudo install -d -o packeval -g packeval -m 0700 \
              "$RUNTIME_ROOT/codex-home/log" "$RUNTIME_ROOT/codex-home/sessions"
            sudo install -o root -g root -m 0444 \
              /opt/pack-evaluator/codex-home/config.toml "$RUNTIME_ROOT/codex-home/config.toml"
            mapfile -t EVALUATION_FILES < <(find "$GITHUB_WORKSPACE/pack-harvest" -maxdepth 1 \
              -type f -name '*.evaluation.json' ! -name 'evaluation-verification.json' -print)
            test "${#EVALUATION_FILES[@]}" -eq 1
            EVALUATION_FILE="${EVALUATION_FILES[0]}"
            sudo -u packeval env -i \
              PATH=/opt/pack-evaluator/runtime/bin:/usr/bin:/bin \
              HOME="$RUNTIME_ROOT/home" \
              TMPDIR="$RUNTIME_ROOT/tmp" \
              "$NODE_BIN" "$GITHUB_WORKSPACE/marketplace-evaluate/scripts/pack-runtime-stage.mjs" \
                --evaluation "$EVALUATION_FILE" \
                --opportunity "$GITHUB_WORKSPACE/pack-production-input/opportunity.json" \
                --skills-root /opt/pack-evaluator/input/skills \
                --output-dir "$RUNTIME_ROOT/stage" \
                --output "$RUNTIME_ROOT/identities.json"
            set +e
            sudo -u packeval env -i \
              PATH=/opt/pack-evaluator/runtime/bin:/usr/bin:/bin \
              HOME="$RUNTIME_ROOT/home" \
              CODEX_HOME="$RUNTIME_ROOT/codex-home" \
              TMPDIR="$RUNTIME_ROOT/tmp" \
              CI=true \
              NO_COLOR=1 \
              SKILLSTORE_AGENTS=codex,claude \
              SKILLSTORE_AGENT_ENV_MODE=strict \
              SKILLSTORE_AGENT_ENV_ALLOWLIST=CODEX_HOME,PACK_EVALUATOR_PROXY_TOKEN,PACK_EVALUATOR_CHROMIUM_PATH,ANTHROPIC_BASE_URL,ANTHROPIC_AUTH_TOKEN,CLAUDE_CODE_MAX_OUTPUT_TOKENS,NO_PROXY,SKILLSTORE_AGENT_SANDBOX_MODE,SKILLSTORE_AGENT_SANDBOX_RUNTIME_ROOT \
              SKILLSTORE_AGENT_SANDBOX_MODE=bwrap \
              SKILLSTORE_AGENT_SANDBOX_RUNTIME_ROOT=/opt/pack-evaluator/runtime \
              PACK_EVALUATOR_CHROMIUM_PATH=/usr/bin/google-chrome \
              PACK_EVALUATOR_PROXY_TOKEN="$LOCAL_TOKEN" \
              ANTHROPIC_BASE_URL=http://127.0.0.1:18765 \
              ANTHROPIC_AUTH_TOKEN="$LOCAL_TOKEN" \
              CLAUDE_CODE_MAX_OUTPUT_TOKENS="$PACK_EVALUATOR_MAX_OUTPUT_TOKENS" \
              NO_PROXY=127.0.0.1,localhost \
              timeout --signal=TERM --kill-after=30s 20m \
              /opt/pack-evaluator/bin/skillstore-cli pack runtime-accept \
              --opportunity-file "$GITHUB_WORKSPACE/pack-production-input/opportunity.json" \
              --identity-file "$RUNTIME_ROOT/identities.json" \
              --model sonnet \
              --judge-model gpt-5.5 \
              --agent-timeout-ms 360000 \
              --chromium-path /usr/bin/google-chrome \
              --output "$RUNTIME_ROOT/output/runtime-acceptance.json" \
              > "$RUNTIME_ROOT/output/runtime-accept-command.json"
            RUNTIME_RC=$?
            set -e
            if [ "$RUNTIME_RC" -ne 0 ]; then
              if sudo test -f "$RUNTIME_ROOT/output/runtime-accept-command.json"; then
                sudo install -o "$(id -u)" -g "$(id -g)" -m 0600 \
                  "$RUNTIME_ROOT/output/runtime-accept-command.json" \
                  "$GITHUB_WORKSPACE/pack-diagnostics/runtime-accept-command.json"
              fi
              echo 'pre-publication orchestration runtime acceptance failed' \
                > "$GITHUB_WORKSPACE/pack-diagnostics/runtime-acceptance-failure.txt"
              EVALUATOR_RC=1
            else
              sudo test -f "$RUNTIME_ROOT/output/runtime-acceptance.json"
              sudo install -o "$(id -u)" -g "$(id -g)" -m 0600 \
                "$RUNTIME_ROOT/output/runtime-acceptance.json" \
                "$GITHUB_WORKSPACE/pack-harvest/runtime-acceptance.json"
              sudo install -o "$(id -u)" -g "$(id -g)" -m 0600 \
                "$RUNTIME_ROOT/output/runtime-accept-command.json" \
                "$GITHUB_WORKSPACE/pack-diagnostics/runtime-accept-command.json"
            fi
          fi
          rm -f "$GITHUB_WORKSPACE/pack-harvest/"*.stdout.partial
          if [ "$EVALUATOR_RC" -eq 0 ]; then
            mkdir -p "$GITHUB_WORKSPACE/pack-trusted"
            cp "$GITHUB_WORKSPACE/pack-harvest/evaluate-summary.json" \
              "$GITHUB_WORKSPACE/pack-harvest/evaluation-verification.json" \
              "$GITHUB_WORKSPACE/pack-harvest/"*.evaluation.json \
              "$GITHUB_WORKSPACE/pack-harvest/"*.stdout.json \
              "$GITHUB_WORKSPACE/pack-harvest/runtime-acceptance.json" \
              "$GITHUB_WORKSPACE/pack-trusted/"
            cp "$GITHUB_WORKSPACE/pack-production-input/opportunity.json" \
              "$GITHUB_WORKSPACE/pack-production-input/cli-identity.json" \
              "$GITHUB_WORKSPACE/pack-production-input/plan.json" \
              "$GITHUB_WORKSPACE/pack-trusted/"
            jq -e '.opportunityBinding' "$GITHUB_WORKSPACE/pack-production-input/plan.json" \
              > "$GITHUB_WORKSPACE/pack-trusted/opportunity-handoff.json"
            find "$GITHUB_WORKSPACE/pack-trusted" -type f -exec chmod 0600 {} +
          fi
          for name in evaluate-progress.ndjson evaluate-checkpoint.json evaluate-summary.json; do
            if [ -f "$GITHUB_WORKSPACE/pack-harvest/$name" ]; then
              cp "$GITHUB_WORKSPACE/pack-harvest/$name" "$GITHUB_WORKSPACE/pack-diagnostics/$name"
            fi
          done
          RUN_LOG_RECORDS=$(mktemp "$RUNNER_TEMP/pack-run-log-summaries.XXXXXX")
          : > "$RUN_LOG_RECORDS"
          while IFS= read -r -d '' run_log; do
            log_basename=$(basename "$run_log")
            log_bytes=$(wc -c < "$run_log")
            log_sha256=$(sha256sum "$run_log" | awk '{print $1}')
            jq -cn \
              --arg basename "$log_basename" \
              --argjson bytes "$log_bytes" \
              --arg sha256 "$log_sha256" \
              '{basename: $basename, bytes: $bytes, sha256: $sha256}' \
              >> "$RUN_LOG_RECORDS"
            rm -f "$run_log"
          done < <(find "$GITHUB_WORKSPACE/pack-harvest" -maxdepth 1 -type f -name '*.run.log' -print0 | sort -z)
          if find "$GITHUB_WORKSPACE/pack-harvest" -maxdepth 1 -type f -name '*.run.log' -print -quit | grep -q .; then
            echo '::error::Raw evaluator run logs survived bounded summarization'
            exit 1
          fi
          jq -s \
            '{schemaVersion: "marketplace.pack-production-run-log-summaries/v1", count: length, logs: .}' \
            "$RUN_LOG_RECORDS" > "$GITHUB_WORKSPACE/pack-diagnostics/run-log-summaries.json"
          rm -f "$RUN_LOG_RECORDS"
          find "$GITHUB_WORKSPACE/pack-diagnostics" -type f -exec chmod 0600 {} +
          PROXY_BYTES=$(wc -c < "$PROXY_LOG")
          PROXY_SHA256=$(sha256sum "$PROXY_LOG" | awk '{print $1}')
          jq -n \
            --arg outcome completed \
            --argjson bytes "$PROXY_BYTES" \
            --arg sha256 "$PROXY_SHA256" \
            '{outcome: $outcome, bytes: $bytes, sha256: $sha256}' \
            > "$GITHUB_WORKSPACE/pack-diagnostics/proxy-diagnostics.json"
          if [ "$EVALUATOR_RC" -ne 0 ]; then
            printf 'evaluator_exit_code=%s\n' "$EVALUATOR_RC" \
              > "$GITHUB_WORKSPACE/pack-diagnostics/evaluator-failure.txt"
            echo "::error::Pack evaluator exited with code $EVALUATOR_RC"
            exit "$EVALUATOR_RC"
          fi
          jq '{attempts: [.attempts[] | {scenarioId, status, outcome, durationMs}], selectedGenerationId}' \
            "$GITHUB_WORKSPACE/pack-harvest/evaluate-summary.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload trusted evaluation evidence
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pack-production-evaluation
          path: pack-trusted/
          if-no-files-found: error
          retention-days: 90

      - name: Upload bounded evaluation diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pack-production-diagnostics
          path: pack-diagnostics/
          if-no-files-found: warn
          retention-days: 90

  persist:
    name: Persist through trusted API
    needs: [prepare, evaluate]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.has_scenarios == 'true' && needs.evaluate.result == 'success'
    environment:
      name: pack-production-writer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout orchestrator only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: marketplace-persist
          ref: ${{ github.sha }}
          sparse-checkout: scripts/pack-production.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download evaluation evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: pack-production-evaluation
          path: pack-results

      - name: Persist every attempt atomically
        env:
          SKILLSTORE_API_URL: https://skillstore.io
          PACK_PRODUCTION_AUTOMATION_KEY: ${{ secrets.PACK_PRODUCTION_AUTOMATION_KEY }}
        run: |
          node marketplace-persist/scripts/pack-production.mjs persist \
            --results-dir "$GITHUB_WORKSPACE/pack-results" \
            --api-url "$SKILLSTORE_API_URL" \
            --token "$PACK_PRODUCTION_AUTOMATION_KEY" \
            > "$GITHUB_WORKSPACE/pack-results/persist-command.json"

      - name: Upload persistence readback
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pack-production-persisted
          path: pack-results/
          if-no-files-found: error
          retention-days: 90

  enrich_publish_readback:
    name: Enrich, gate, publish, and prove production
    needs: [prepare, persist]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.has_scenarios == 'true' && needs.persist.result == 'success'
    environment:
      name: pack-production-writer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout orchestrator only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: marketplace-finalize
          ref: ${{ github.sha }}
          sparse-checkout: scripts/pack-production.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download persisted evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: pack-production-persisted
          path: pack-results

      - name: Await enrichment and enforce publish gates
        env:
          SKILLSTORE_API_URL: https://skillstore.io
          PACK_PRODUCTION_AUTOMATION_KEY: ${{ secrets.PACK_PRODUCTION_AUTOMATION_KEY }}
          # Audit the requested state only. pack-production.mjs hard-stops every
          # v4 generation at review_pending; only the protected manual workflow
          # can publish.
          AUTO_PUBLISH: 'false'
        run: |
          node marketplace-finalize/scripts/pack-production.mjs finalize \
            --results-dir "$GITHUB_WORKSPACE/pack-results" \
            --api-url "$SKILLSTORE_API_URL" \
            --token "$PACK_PRODUCTION_AUTOMATION_KEY" \
            --auto-publish "$AUTO_PUBLISH" \
            --max-wait-seconds 1800 \
            --poll-seconds 60 \
            --max-poll-seconds 180 \
            > "$GITHUB_WORKSPACE/pack-results/finalize-command.json"
          jq . "$GITHUB_WORKSPACE/pack-results/final-result.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final production evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pack-production-final
          path: pack-results/
          if-no-files-found: error
          retention-days: 90
