name: Monitor Skill Sources

on:
  schedule:
    # Daily at 06:30 UTC (14:30 Beijing Time)
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Optional skill slugs to scan, comma or space separated'
        required: false
        type: string
        default: ''
      limit:
        description: 'Optional maximum number of approved skills to scan'
        required: false
        type: number
        default: 0
      concurrency:
        description: 'Parallel source scans, 1-8'
        required: false
        type: number
        default: 8
      write_concurrency:
        description: 'Parallel Supabase writes, 1-4'
        required: false
        type: number
        default: 2
      max_updates_per_run:
        description: 'Maximum updated skills to refresh into a marketplace PR in one run; 0 means unlimited'
        required: false
        type: number
        default: 100
      dry_run:
        description: 'Preview only; do not write Supabase, update local files, or create PRs'
        required: false
        type: boolean
        default: true
      create_pr:
        description: 'Create a marketplace PR for updated upstream skills when not in dry-run mode'
        required: false
        type: boolean
        default: true
      archive_missing:
        description: 'Archive confirmed missing skills in Supabase; manual use only'
        required: false
        type: boolean
        default: false
      confirm_archive:
        description: 'Allow archive without the two-scan age gate; manual use only'
        required: false
        type: boolean
        default: false
      delete_archived:
        description: 'Delete archived marketplace skill directories after DB archive; manual use only'
        required: false
        type: boolean
        default: false
      min_missing_age_hours:
        description: 'Minimum age between missing scans before archive can proceed'
        required: false
        type: number
        default: 24
      model:
        description: 'Model spec for update PR re-audits'
        required: false
        type: string
        default: ''
      expected_upstream_commit:
        description: 'Expected 40-character upstream commit for an explicit slug-scoped update PR'
        required: false
        type: string
        default: ''
      checkout_cache_dir:
        description: 'Persistent upstream checkout cache directory on self-hosted runners'
        required: false
        type: string
        default: '/home/runner/_work/_cache/skill-source-monitor'

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Full scans stay singleton. Manual slug-scoped batches can run in parallel
  # because the operator controls non-overlapping slug lists.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.slugs != '' && format('skill-source-monitor-{0}', github.run_id) || 'skill-source-monitor' }}
  cancel-in-progress: false

jobs:
  scan:
    name: Source accuracy scan
    runs-on: self-hosted
    timeout-minutes: 1440
    concurrency:
      # Source monitoring writes Skill projections and can invalidate a frozen
      # governance CAS even when it creates no artifact. Share the exact writer
      # mutex used by governance and scoring instead of overlapping them.
      group: production-skill-score-writes
      cancel-in-progress: false

    steps:
      - name: Initialize source monitor diagnostics
        env:
          DIAGNOSTIC_DIR: ${{ runner.temp }}/source-monitor-diagnostics-${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$DIAGNOSTIC_DIR"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "repository=$GITHUB_REPOSITORY"
            echo "workflow_sha=${{ github.workflow_sha }}"
            echo "runner_name=$RUNNER_NAME"
          } > "$DIAGNOSTIC_DIR/run.txt"

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: marketplace,skillstore

      - name: Clear inherited source monitor checkout
        env:
          DIAGNOSTIC_DIR: ${{ runner.temp }}/source-monitor-diagnostics-${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$DIAGNOSTIC_DIR"
          {
            echo "workspace=$GITHUB_WORKSPACE"
            echo "expected_workspace=$RUNNER_WORKSPACE/${GITHUB_REPOSITORY#*/}"
            git -C "$GITHUB_WORKSPACE" rev-parse HEAD 2>/dev/null || true
            git -C "$GITHUB_WORKSPACE" config --show-origin --get-regexp '^(core\.sparseCheckout|extensions\.worktreeConfig)$' 2>/dev/null || true
            git -C "$GITHUB_WORKSPACE" ls-files -v 2>/dev/null | awk '$1 ~ /^S/ { count += 1 } END { print "skip_worktree_count=" (count + 0) }'
          } > "$DIAGNOSTIC_DIR/pre-checkout.txt"

          EXPECTED_WORKSPACE="${RUNNER_WORKSPACE:?}/${GITHUB_REPOSITORY#*/}"
          if [ "${GITHUB_WORKSPACE:?}" != "$EXPECTED_WORKSPACE" ]; then
            echo "::error::Refusing to clear unexpected workspace: $GITHUB_WORKSPACE"
            exit 1
          fi
          cd "${RUNNER_TEMP:?}"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"

      - name: Checkout immutable source monitor runtime
        env:
          EXPECTED_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          PATTERNS_FILE="${RUNNER_TEMP:?}/source-monitor-runtime-${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}.patterns"
          trap 'rm -f "$PATTERNS_FILE"' EXIT
          cat > "$PATTERNS_FILE" <<'EOF'
          /.github/actions/download-skillstore-cli/
          /.github/workflows/monitor-skill-sources.yml
          /scripts/rebind-skill-report-hashes.mjs
          /scripts/verify-source-monitor-selection.mjs
          /skills/**/skill-report.json
          EOF

          CHECKOUT_SUCCEEDED=false
          for CHECKOUT_ATTEMPT in 1 2 3; do
            cd "${RUNNER_TEMP:?}"
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            git init "$GITHUB_WORKSPACE"
            git -C "$GITHUB_WORKSPACE" remote add origin "${GITHUB_SERVER_URL:?}/${GITHUB_REPOSITORY:?}.git"
            git -C "$GITHUB_WORKSPACE" config gc.auto 0
            git -C "$GITHUB_WORKSPACE" config http.version HTTP/1.1
            git -C "$GITHUB_WORKSPACE" sparse-checkout init --no-cone
            git -C "$GITHUB_WORKSPACE" sparse-checkout set --no-cone --stdin < "$PATTERNS_FILE"
            if git -C "$GITHUB_WORKSPACE" -c protocol.version=2 fetch \
                --no-tags --no-recurse-submodules --filter=blob:none --depth=1 \
                origin "$EXPECTED_SHA" \
              && git -C "$GITHUB_WORKSPACE" cat-file -e "$EXPECTED_SHA^{commit}" \
              && git -C "$GITHUB_WORKSPACE" checkout --detach --force "$EXPECTED_SHA"; then
              CHECKOUT_SUCCEEDED=true
              break
            fi
            if [ "$CHECKOUT_ATTEMPT" -lt 3 ]; then
              echo "::warning::Immutable source monitor checkout failed; retrying attempt $((CHECKOUT_ATTEMPT + 1))/3"
              sleep "$((CHECKOUT_ATTEMPT * 5))"
            fi
          done
          test "$CHECKOUT_SUCCEEDED" = true || {
            echo "::error::Immutable source monitor checkout failed after 3 attempts"
            exit 1
          }

      - name: Verify immutable source monitor runtime
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          DIAGNOSTIC_DIR: ${{ runner.temp }}/source-monitor-diagnostics-${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$DIAGNOSTIC_DIR"
          REQUIRED_RUNTIME_FILES=(
            ".github/actions/download-skillstore-cli/action.yml"
            ".github/workflows/monitor-skill-sources.yml"
            "scripts/rebind-skill-report-hashes.mjs"
            "scripts/verify-source-monitor-selection.mjs"
          )
          {
            echo "expected_workflow_sha=$EXPECTED_WORKFLOW_SHA"
            echo "actual_head=$(git rev-parse HEAD)"
            echo "sparse_checkout=$(git config --bool core.sparseCheckout 2>/dev/null || echo false)"
            echo "sparse_file=$(git rev-parse --git-path info/sparse-checkout)"
            git ls-files -v -- "${REQUIRED_RUNTIME_FILES[@]}"
          } > "$DIAGNOSTIC_DIR/post-checkout.txt"

          test "$(git rev-parse HEAD)" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git config --bool core.sparseCheckout)" = true
          test -f "$(git rev-parse --git-path info/sparse-checkout)"
          if git ls-files -v -- "${REQUIRED_RUNTIME_FILES[@]}" | awk '$1 ~ /^S/ { found=1 } END { exit !found }'; then
            echo "::error::Immutable source monitor runtime contains skip-worktree files"
            exit 1
          fi
          for file in "${REQUIRED_RUNTIME_FILES[@]}"; do
            test -f "$GITHUB_WORKSPACE/$file" && test ! -L "$GITHUB_WORKSPACE/$file" || {
              echo "::error::Required source monitor runtime file is missing or not a regular file: $file"
              exit 1
            }
            test "$(git hash-object -- "$GITHUB_WORKSPACE/$file")" = "$(git rev-parse "$EXPECTED_WORKFLOW_SHA:$file")" || {
              echo "::error::Source monitor runtime file does not match workflow head: $file"
              exit 1
            }
          done

      - name: Download Skillstore CLI
        uses: ./.github/actions/download-skillstore-cli
        with:
          version: 2.16.1
          token: ${{ steps.app-token.outputs.token }}
          cache-dir: /home/runner/_work/_cache/skillstore-cli
          minimum-version: 2.16.1
          require-checksum: true

      - name: Prepare git workspace
        run: |
          set -euo pipefail
          git config user.name "ai-skill-store[bot]"
          git config user.email "2628292+ai-skill-store[bot]@users.noreply.github.com"
          {
            echo "/skillstore-cli"
            echo "/source-monitor-results/"
          } >> .git/info/exclude

      - name: Run source monitor
        id: monitor
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SKILLSTORE_AGENTS: ${{ vars.SKILLSTORE_AGENTS }}
          SLUGS: ${{ inputs.slugs || '' }}
          LIMIT: ${{ inputs.limit || 0 }}
          CONCURRENCY: ${{ inputs.concurrency || 8 }}
          WRITE_CONCURRENCY: ${{ inputs.write_concurrency || 2 }}
          MAX_UPDATES_PER_RUN: ${{ inputs.max_updates_per_run || 100 }}
          CHECKOUT_CACHE_DIR: ${{ inputs.checkout_cache_dir || '/home/runner/_work/_cache/skill-source-monitor' }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          CREATE_PR: ${{ github.event_name == 'schedule' && 'true' || inputs.create_pr }}
          ARCHIVE_MISSING: ${{ inputs.archive_missing || false }}
          CONFIRM_ARCHIVE: ${{ inputs.confirm_archive || false }}
          DELETE_ARCHIVED: ${{ inputs.delete_archived || false }}
          MIN_MISSING_AGE_HOURS: ${{ inputs.min_missing_age_hours || 24 }}
          MODEL: ${{ inputs.model || '' }}
          EXPECTED_UPSTREAM_COMMIT: ${{ inputs.expected_upstream_commit || '' }}
        run: |
          set -euo pipefail

          mkdir -p source-monitor-results "$CHECKOUT_CACHE_DIR"
          JSONL_FILE="source-monitor-results/skill-source-monitor-${GITHUB_RUN_ID}.jsonl"
          SUMMARY_FILE="source-monitor-results/skill-source-monitor-${GITHUB_RUN_ID}.md"
          CLI_VERSION_OUTPUT="$("$GITHUB_WORKSPACE/skillstore-cli" --version 2>&1 || true)"
          MONITOR_HELP="$("$GITHUB_WORKSPACE/skillstore-cli" skill monitor-upstream --help 2>&1 || true)"
          UPDATE_SELECTION_OFFSET=$(( GITHUB_RUN_NUMBER * MAX_UPDATES_PER_RUN ))
          echo "Downloaded CLI version: $CLI_VERSION_OUTPUT"

          CMD=(
            "$GITHUB_WORKSPACE/skillstore-cli"
            skill monitor-upstream
            --output jsonl
            --summary markdown
            --jsonlFile "$JSONL_FILE"
            --summaryFile "$SUMMARY_FILE"
            --concurrency "$CONCURRENCY"
            --maxLocalUpdates "$MAX_UPDATES_PER_RUN"
            --updateSelectionOffset "$UPDATE_SELECTION_OFFSET"
          )

          if grep -q -- '--writeConcurrency' <<<"$MONITOR_HELP"; then
            CMD+=(--writeConcurrency "$WRITE_CONCURRENCY")
          else
            echo "::warning::Downloaded Skillstore CLI does not support --writeConcurrency; Supabase writes will use scan concurrency."
          fi

          if [ -n "$CHECKOUT_CACHE_DIR" ]; then
            if grep -q -- '--checkoutCacheDir' <<<"$MONITOR_HELP"; then
              CMD+=(--checkoutCacheDir "$CHECKOUT_CACHE_DIR")
            else
              echo "::warning::Downloaded Skillstore CLI does not support --checkoutCacheDir; continuing without checkout cache. This only affects runtime and network usage."
              CHECKOUT_CACHE_DIR=""
            fi
          fi

          if [ -n "$SLUGS" ]; then
            CMD+=(--slugs "$SLUGS")
          else
            CMD+=(--all)
          fi

          if [ "$LIMIT" != "0" ]; then
            CMD+=(--limit "$LIMIT")
          fi

          if [ "$DRY_RUN" != "true" ]; then
            if [ "$CREATE_PR" = "true" ] && [ -n "$SLUGS" ]; then
              if [ -z "$EXPECTED_UPSTREAM_COMMIT" ]; then
                echo "::error::A slug-scoped update PR requires expected_upstream_commit"
                exit 1
              fi
              if ! [[ "$EXPECTED_UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::expected_upstream_commit must be a lowercase 40-character Git SHA"
                exit 1
              fi
              if [ "$ARCHIVE_MISSING" != "false" ] || [ "$CONFIRM_ARCHIVE" != "false" ] || [ "$DELETE_ARCHIVED" != "false" ]; then
                echo "::error::A slug-scoped update PR cannot archive or delete skills"
                exit 1
              fi
              CMD+=(--updateLocal)
            else
              CMD+=(--write)
              if [ "$CREATE_PR" = "true" ]; then
                CMD+=(--updateLocal)
              fi
            fi
          fi

          if [ "$ARCHIVE_MISSING" = "true" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::error::archive_missing requires dry_run=false"
              exit 1
            fi
            CMD+=(--archiveMissing --minMissingAgeHours "$MIN_MISSING_AGE_HOURS")
            if [ "$CONFIRM_ARCHIVE" = "true" ]; then
              CMD+=(--confirmArchive)
            fi
            if [ "$DELETE_ARCHIVED" = "true" ]; then
              CMD+=(--deleteArchived)
            fi
          elif [ "$DELETE_ARCHIVED" = "true" ]; then
            echo "::error::delete_archived requires archive_missing=true"
            exit 1
          fi

          if [ -n "$MODEL" ]; then
            CMD+=(--model "$MODEL")
          fi

          echo "Dry run: $DRY_RUN"
          echo "Create PR: $CREATE_PR"
          echo "Source scan concurrency: $CONCURRENCY"
          echo "Supabase write concurrency: $WRITE_CONCURRENCY"
          echo "Max local updates per run: $MAX_UPDATES_PER_RUN"
          echo "Update selection offset: $UPDATE_SELECTION_OFFSET"
          echo "Checkout cache dir: $CHECKOUT_CACHE_DIR"
          echo "Archive missing: $ARCHIVE_MISSING"
          echo "Delete archived: $DELETE_ARCHIVED"
          echo "Command: ${CMD[*]}"
          "${CMD[@]}" 2>&1 | tee "source-monitor-results/stdout-${GITHUB_RUN_ID}.jsonl"

          if [ -n "$SLUGS" ]; then
            VERIFY_SELECTION=(
              node "$GITHUB_WORKSPACE/scripts/verify-source-monitor-selection.mjs"
              --requested "$SLUGS"
              --jsonl "$JSONL_FILE"
            )
            if [ -n "$EXPECTED_UPSTREAM_COMMIT" ]; then
              VERIFY_SELECTION+=(--expected-upstream-commit "$EXPECTED_UPSTREAM_COMMIT")
            fi
            if [ "$DRY_RUN" != "true" ] && [ "$CREATE_PR" = "true" ]; then
              VERIFY_SELECTION+=(
                --require-local-updates
                --summary "$SUMMARY_FILE"
                --repository-root "$GITHUB_WORKSPACE"
              )
            fi
            "${VERIFY_SELECTION[@]}"
          fi

          echo "jsonl_file=$JSONL_FILE" >> "$GITHUB_OUTPUT"
          echo "summary_file=$SUMMARY_FILE" >> "$GITHUB_OUTPUT"

      - name: Bind source monitor reports to packaged trees
        env:
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          CREATE_PR: ${{ github.event_name == 'schedule' && 'true' || inputs.create_pr }}
        run: |
          set -euo pipefail

          if [ "$DRY_RUN" = "true" ] || [ "$CREATE_PR" != "true" ]; then
            echo "Packaged tree hash binding skipped because no update PR will be created."
            exit 0
          fi

          CHANGED_ARTIFACTS="$RUNNER_TEMP/source-monitor-changed-artifacts-${GITHUB_RUN_ID}.bin"
          CHANGED_SKILLS="$RUNNER_TEMP/source-monitor-changed-skills-${GITHUB_RUN_ID}.bin"

          if ! git diff --no-renames --quiet --diff-filter=D HEAD -- 'skills/**/skill-report.json'; then
            echo "::error::Source monitor deleted a published report; refusing an unbound update PR"
            exit 1
          fi

          git diff --no-renames --name-only -z --diff-filter=ACMRT HEAD -- \
            'skills/**/SKILL.md' 'skills/**/skill-report.json' > "$CHANGED_ARTIFACTS"
          : > "$CHANGED_SKILLS"
          while IFS= read -r -d '' artifact_path; do
            case "$artifact_path" in
              skills/*/skill-report.json)
                printf '%s\0' "${artifact_path%/skill-report.json}/SKILL.md" >> "$CHANGED_SKILLS"
                ;;
              skills/*/SKILL.md)
                printf '%s\0' "$artifact_path" >> "$CHANGED_SKILLS"
                ;;
              *)
                echo "::error::Unexpected source monitor artifact path: $artifact_path"
                exit 1
                ;;
            esac
          done < "$CHANGED_ARTIFACTS"

          if [ ! -s "$CHANGED_SKILLS" ]; then
            echo "No changed published reports require packaged tree hash binding."
            exit 0
          fi

          LC_ALL=C sort -z -u "$CHANGED_SKILLS" -o "$CHANGED_SKILLS"
          while IFS= read -r -d '' skill_path; do
            skill_dir="${skill_path%/SKILL.md}"
            git ls-files -z -- "$skill_dir" | git update-index -z --no-skip-worktree --stdin
            git add --sparse -A -f -- "$skill_dir"
          done < "$CHANGED_SKILLS"
          node scripts/rebind-skill-report-hashes.mjs \
            --repo-root "$PWD" \
            --skill-paths-file "$CHANGED_SKILLS"
          while IFS= read -r -d '' skill_path; do
            git add --sparse -f -- "${skill_path%/SKILL.md}/skill-report.json"
          done < "$CHANGED_SKILLS"
          echo "::notice::Bound source monitor report hashes to the exact packaged Marketplace trees"

      - name: Generate Fresh GitHub App Token for PR
        id: pr-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: marketplace

      - name: Create source monitor PR
        env:
          GH_TOKEN: ${{ steps.pr-app-token.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          CREATE_PR: ${{ github.event_name == 'schedule' && 'true' || inputs.create_pr }}
          SUMMARY_FILE: ${{ steps.monitor.outputs.summary_file }}
        run: |
          set -euo pipefail

          if [ "$DRY_RUN" = "true" ] || [ "$CREATE_PR" != "true" ]; then
            echo "Source monitor PR creation skipped."
            exit 0
          fi

          if [ -z "$(git status --porcelain)" ]; then
            echo "No marketplace file changes detected; PR skipped."
            exit 0
          fi

          BRANCH="skill-source-monitor/run-${GITHUB_RUN_ID}"
          TITLE="Update skill sources from monitor run ${GITHUB_RUN_ID}"
          BODY_FILE="source-monitor-results/pr-body-${GITHUB_RUN_ID}.md"

          git switch -c "$BRANCH"
          git add -A .
          if git diff --cached --quiet; then
            echo "No staged marketplace file changes detected; PR skipped."
            exit 0
          fi
          git commit -m "$TITLE"

          AUTH_HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git config --local --replace-all http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH_HEADER"
          git push --force-with-lease -u origin "$BRANCH"

          {
            echo "## Skill Source Monitor Update"
            echo ""
            echo "This PR was generated by the \`Monitor Skill Sources\` workflow."
            echo ""
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Branch: \`$BRANCH\`"
            echo ""
            if [ -n "$SUMMARY_FILE" ] && [ -s "$SUMMARY_FILE" ]; then
              cat "$SUMMARY_FILE"
            else
              echo "_No markdown summary file was produced._"
            fi
            echo ""
            echo "## Review Checklist"
            echo ""
            echo "- [ ] Fresh \`skill-report.json\` evidence exists for every updated skill"
            echo "- [ ] Risk or rating changes are reviewed"
            echo "- [ ] No unrelated marketplace files changed"
          } > "$BODY_FILE"

          gh label create skill-source-monitor \
            --color 0969DA \
            --description "Automated skill source monitor updates" || true

          PR_OUTPUT=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body-file "$BODY_FILE" \
            --label skill-source-monitor 2>&1) || {
              echo "$PR_OUTPUT"
              echo "::warning::Retrying PR creation without label."
              PR_OUTPUT=$(gh pr create \
                --base main \
                --head "$BRANCH" \
                --title "$TITLE" \
                --body-file "$BODY_FILE" 2>&1) || {
                  echo "$PR_OUTPUT"
                  exit 1
                }
            }

          echo "$PR_OUTPUT"

      - name: Upload monitor evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-source-monitor-${{ github.run_id }}
          path: |
            source-monitor-results/
            ${{ runner.temp }}/source-monitor-diagnostics-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 30

      - name: Final summary
        if: always()
        env:
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          CREATE_PR: ${{ github.event_name == 'schedule' && 'true' || inputs.create_pr }}
          SLUGS: ${{ inputs.slugs || '' }}
          CONCURRENCY: ${{ inputs.concurrency || 8 }}
          WRITE_CONCURRENCY: ${{ inputs.write_concurrency || 2 }}
          MAX_UPDATES_PER_RUN: ${{ inputs.max_updates_per_run || 100 }}
          CHECKOUT_CACHE_DIR: ${{ inputs.checkout_cache_dir || '/home/runner/_work/_cache/skill-source-monitor' }}
          ARCHIVE_MISSING: ${{ inputs.archive_missing || false }}
          DELETE_ARCHIVED: ${{ inputs.delete_archived || false }}
        run: |
          if [ "$DRY_RUN" != "true" ] && { [ "$CREATE_PR" != "true" ] || [ -z "$SLUGS" ]; }; then
            WRITES="enabled"
          else
            WRITES="disabled"
          fi

          if [ "$DRY_RUN" != "true" ] && [ "$CREATE_PR" = "true" ]; then
            UPDATE_PRS="enabled for updated skills"
          else
            UPDATE_PRS="disabled"
          fi

          if [ "$ARCHIVE_MISSING" = "true" ]; then
            ARCHIVE_MODE="manual mode enabled"
          else
            ARCHIVE_MODE="disabled"
          fi

          if [ "$DELETE_ARCHIVED" = "true" ]; then
            DELETE_MODE="manual mode enabled"
          else
            DELETE_MODE="disabled"
          fi

          {
            echo ""
            echo "### Workflow Guardrails"
            echo ""
            echo "- Dry run: $DRY_RUN"
            echo "- Supabase writes: $WRITES"
            echo "- Update PRs: $UPDATE_PRS"
            echo "- Source scan concurrency: $CONCURRENCY"
            echo "- Supabase write concurrency: $WRITE_CONCURRENCY"
            echo "- Max local updates per run: $MAX_UPDATES_PER_RUN"
            echo "- Checkout cache dir: \`$CHECKOUT_CACHE_DIR\`"
            echo "- Archive actions: $ARCHIVE_MODE"
            echo "- Marketplace deletions: $DELETE_MODE"
            echo "- Evidence artifact: skill-source-monitor-${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
