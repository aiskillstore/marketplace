name: Govern Fresh Canonical Audits

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Freeze, execute, or run one authenticated incident recovery'
        type: choice
        required: true
        default: dry-run
        options: [dry-run, execute, recover, recover-cache, recover-smoke]
      cohort_path:
        description: 'Exact repository-relative raw32 Fresh cohort JSON; dry-run only'
        type: string
        required: false
        default: 'governance/fresh-canonical-audit/raw32-exact62-v1.json'
      start_after:
        description: 'Exact prior batch end slug; dry-run only'
        type: string
        required: false
        default: ''
      previous_boundary_run_id:
        description: 'Immediately preceding successful fresh dry-run boundary; production inventory must prove it was executed'
        type: string
        required: false
        default: ''
      previous_execute_run_id:
        description: 'Successful execute run for previous_boundary_run_id; required when start_after is set'
        type: string
        required: false
        default: ''
      batch_size:
        description: 'Fresh audits per frozen batch (1-10)'
        type: number
        required: true
        default: 10
      model:
        description: 'Fresh audit model override'
        type: string
        required: false
        default: ''
      dry_run_id:
        description: 'Successful dry-run workflow run ID; execute or recover only'
        type: string
        required: false
        default: ''
      failed_execute_run_id:
        description: 'Failed execute run to authenticate; recover only'
        type: string
        required: false
        default: ''
      cli_version:
        description: 'Exact audited CLI version'
        type: string
        required: true
        default: '2.15.10'

permissions:
  actions: read
  contents: read

concurrency:
  group: artifact-version-backfill-production
  cancel-in-progress: false

env:
  FRESH_GOVERNANCE_CLI_VERSION: '2.15.10'
  FRESH_GOVERNANCE_CLI_SHA256: '2ea8ef90fcb890b83b1cf1bd772bd02da3fff98bc8f5162c481287552518bdd8'
  REPORT_ORIGIN_FRESH_COHORT: 'governance/fresh-canonical-audit/raw32-exact62-v1.json'
  REPORT_ORIGIN_FRESH_COHORT_SHA256: 'c8a2f173067a9064a693669db12db398de1324a044e8ae54176ab368aa3038c3'

jobs:
  freeze-boundary:
    if: inputs.mode == 'dry-run'
    runs-on: self-hosted
    timeout-minutes: 360
    steps:
      - name: Checkout complete Marketplace history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: true
          sparse-checkout: ''
          sparse-checkout-cone-mode: false

      - name: Normalize full checkout and verify governance runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git sparse-checkout disable
          git reset --hard HEAD
          for path in \
            .github/actions/download-skillstore-cli/action.yml \
            scripts/prepare-fresh-canonical-audit-batch.mjs \
            scripts/fetch-artifact-version-inventory.mjs; do
            test -f "$path" || { echo "::error file=$path::Missing fresh governance runtime"; exit 1; }
          done

      - name: Validate dry-run inputs and governance runtime
        env:
          CLI_VERSION: ${{ inputs.cli_version }}
          COHORT_PATH: ${{ inputs.cohort_path }}
          DRY_RUN_ID: ${{ inputs.dry_run_id }}
          START_AFTER: ${{ inputs.start_after }}
          PREVIOUS_BOUNDARY_RUN_ID: ${{ inputs.previous_boundary_run_id }}
          PREVIOUS_EXECUTE_RUN_ID: ${{ inputs.previous_execute_run_id }}
          FAILED_EXECUTE_RUN_ID: ${{ inputs.failed_execute_run_id }}
        run: |
          set -euo pipefail
          test "$CLI_VERSION" = "$FRESH_GOVERNANCE_CLI_VERSION" || { echo '::error::workflow CLI pin changed'; exit 1; }
          test -z "$DRY_RUN_ID" || { echo '::error::dry-run cannot consume dry_run_id'; exit 1; }
          test -z "$FAILED_EXECUTE_RUN_ID" || { echo '::error::dry-run cannot consume failed_execute_run_id'; exit 1; }
          if test -n "$START_AFTER"; then
            [[ "$PREVIOUS_BOUNDARY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo '::error::cursor continuation requires numeric previous_boundary_run_id'; exit 1; }
            [[ "$PREVIOUS_EXECUTE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo '::error::cursor continuation requires numeric previous_execute_run_id'; exit 1; }
          else
            test -z "$PREVIOUS_BOUNDARY_RUN_ID" || { echo '::error::initial batch cannot consume previous_boundary_run_id'; exit 1; }
            test -z "$PREVIOUS_EXECUTE_RUN_ID" || { echo '::error::initial batch cannot consume previous_execute_run_id'; exit 1; }
          fi
          test -f "$COHORT_PATH" || { echo '::error::lineage-unproven cohort is missing'; exit 1; }
          case "$COHORT_PATH" in
            "$REPORT_ORIGIN_FRESH_COHORT")
              test "$(sha256sum "$COHORT_PATH" | awk '{print $1}')" = "$REPORT_ORIGIN_FRESH_COHORT_SHA256"
              jq -e '
                .schemaVersion == 1 and .status == "lineage_unproven"
                and .count == 62 and (.rows | length) == 62
                and ([.rows[].slug] | unique | length) == 62
                and ([.rows[].skillId] | unique | length) == 62
                and ([.rows[].path] | unique | length) == 62
                and all(.rows[];
                  .remainingReason == "same_source_tree_unproven"
                  and .governanceEligibleByLineage == false
                  and (has("legacyReference") | not))
              ' "$COHORT_PATH" >/dev/null
              ;;
            *) echo '::error::cohort_path is not an authenticated Fresh campaign'; exit 1 ;;
          esac
          test -f scripts/prepare-fresh-canonical-audit-batch.mjs
          test -f .github/actions/download-skillstore-cli/action.yml

      - name: Authenticate the immediately preceding boundary chain
        if: inputs.start_after != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_BOUNDARY_RUN_ID: ${{ inputs.previous_boundary_run_id }}
          PREVIOUS_EXECUTE_RUN_ID: ${{ inputs.previous_execute_run_id }}
          START_AFTER: ${{ inputs.start_after }}
        run: |
          set -euo pipefail
          run_json=$(gh run view "$PREVIOUS_BOUNDARY_RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,conclusion,event,headBranch,headSha,workflowName)
          jq -e --argjson id "$PREVIOUS_BOUNDARY_RUN_ID" '.databaseId==$id and .conclusion=="success" and .event=="workflow_dispatch" and .headBranch=="main" and .workflowName=="Govern Fresh Canonical Audits"' <<< "$run_json" >/dev/null
          mkdir -p "$RUNNER_TEMP/previous-boundary"
          gh run download "$PREVIOUS_BOUNDARY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "fresh-canonical-audit-boundary-$PREVIOUS_BOUNDARY_RUN_ID" \
            --dir "$RUNNER_TEMP/previous-boundary"
          (cd "$RUNNER_TEMP/previous-boundary" && sha256sum --check SHA256SUMS)
          test "$(jq -r .lastSelected "$RUNNER_TEMP/previous-boundary/metadata.json")" = "$START_AFTER"
          test "$(jq -r .lastSelected "$RUNNER_TEMP/previous-boundary/selected-cohort.json")" = "$START_AFTER"
          jq -n --slurpfile metadata "$RUNNER_TEMP/previous-boundary/metadata.json" \
            --slurpfile selection "$RUNNER_TEMP/previous-boundary/selected-cohort.json" \
            '{metadata:$metadata[0],selection:$selection[0]}' > "$RUNNER_TEMP/previous-boundary-chain-base.json"

          execute_json=$(gh run view "$PREVIOUS_EXECUTE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,conclusion,event,headBranch,headSha,workflowName)
          jq -e --argjson id "$PREVIOUS_EXECUTE_RUN_ID" '.databaseId==$id and .conclusion=="success" and .event=="workflow_dispatch" and .headBranch=="main" and .workflowName=="Govern Fresh Canonical Audits"' <<< "$execute_json" >/dev/null
          mkdir -p "$RUNNER_TEMP/previous-execution"
          gh run download "$PREVIOUS_EXECUTE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "fresh-canonical-audit-execution-$PREVIOUS_EXECUTE_RUN_ID" \
            --dir "$RUNNER_TEMP/previous-execution"
          execution_boundary="$RUNNER_TEMP/previous-execution/boundary"
          cmp "$RUNNER_TEMP/previous-boundary/SHA256SUMS" "$execution_boundary/SHA256SUMS"
          execute_head_sha=$(jq -r .headSha <<< "$execute_json")
          legacy_hidden_pattern='  \./runtime/\.github/(actions/download-skillstore-cli/action\.yml|workflows/govern-fresh-canonical-audits\.yml)$'
          if [ "$PREVIOUS_EXECUTE_RUN_ID" = '29619841184' ] \
            && [ "$execute_head_sha" = '09cce5e8dac464d8e5f1d0a10446110bd95a9e3f' ]; then
            # This one successful execution predates include-hidden-files on the
            # execution artifact. The original dry-run boundary above is still
            # fully authenticated, and its identical checksum manifest seals the
            # two omitted runtime files. Validate every re-uploaded visible byte.
            test "$(grep -Ec "$legacy_hidden_pattern" "$execution_boundary/SHA256SUMS")" = 2
            test ! -e "$execution_boundary/runtime/.github/actions/download-skillstore-cli/action.yml"
            test ! -e "$execution_boundary/runtime/.github/workflows/govern-fresh-canonical-audits.yml"
            (cd "$execution_boundary" && grep -Ev "$legacy_hidden_pattern" SHA256SUMS | sha256sum --check -)
          else
            (cd "$execution_boundary" && sha256sum --check SHA256SUMS)
          fi
          (cd "$RUNNER_TEMP/previous-execution/execution-proof" && sha256sum --check SHA256SUMS)
          proof="$RUNNER_TEMP/previous-execution/execution-proof/proof.json"
          proof_schema=$(jq -r .schemaVersion "$proof")
          if [ "$proof_schema" = 1 ]; then
            jq -e --arg executeRunId "$PREVIOUS_EXECUTE_RUN_ID" \
              --arg dryRunId "$PREVIOUS_BOUNDARY_RUN_ID" --arg lastSelected "$START_AFTER" \
              --arg executeHeadSha "$execute_head_sha" \
              '.status=="fresh_canonical_audit_execution_complete" and .executeRunId==$executeRunId and .dryRunId==$dryRunId and .lastSelected==$lastSelected and .workflowCommit==$executeHeadSha and .scoreFinalized==true and .timestampFinalized==true and .cacheClosureCompleted==true and .packClosureCompleted==true and .productionSmokeCompleted==true' \
              "$proof" >/dev/null
          elif [ "$proof_schema" = 2 ] && [ "$(jq -r .producerKind "$proof")" = fresh_canonical_audit_recovery ]; then
            case "$(jq -r .failedExecuteRunId "$proof")" in
              29666546406)
                expected_failed_sha='3e7baf520a4d078047b53b95352156e3a3f74260'
                expected_original_cli='2.8.0'
                expected_original_cli_sha='ecfaa49aa72d24b8ea6322c7dae24d4bbe9df174a5d009cc56d7d2a89e7ae05a'
                expected_failed_cli='2.8.2'
                expected_failed_cli_sha='9b885943950c15555e8fbae522adf2cf9514ae74f63050a905c8e97694d52fcb'
                expected_smoke_commit='e368da730951aceca17a7e5d9d5a9adc0e3efc2a'
                ;;
              29684825610)
                expected_failed_sha='2bfe0fd5cf25a967c5481dd83207b0de24997273'
                expected_original_cli='2.8.4'
                expected_original_cli_sha='282cfb6103f580c1758674f6d407493b3039a2ca788c986297684180ae6f0dbb'
                expected_failed_cli='2.8.4'
                expected_failed_cli_sha='282cfb6103f580c1758674f6d407493b3039a2ca788c986297684180ae6f0dbb'
                expected_smoke_commit='0f78b2d983b0e233f6b7071e38ddf6b4f29c9168'
                ;;
              *) echo '::error::unsupported cache-recovery incident'; exit 1 ;;
            esac
            jq -e --arg executeRunId "$PREVIOUS_EXECUTE_RUN_ID" \
              --arg dryRunId "$PREVIOUS_BOUNDARY_RUN_ID" --arg lastSelected "$START_AFTER" \
              --arg executeHeadSha "$execute_head_sha" \
              --arg failedExecuteRunId "$(jq -r .failedExecuteRunId "$proof")" \
              --arg failedExecuteHeadSha "$expected_failed_sha" \
              --arg originalCliVersion "$expected_original_cli" \
              --arg originalCliSha "$expected_original_cli_sha" \
              --arg failedCliVersion "$expected_failed_cli" \
              --arg failedCliSha "$expected_failed_cli_sha" \
              --arg smokeCommit "$expected_smoke_commit" '
              .producerKind=="fresh_canonical_audit_recovery"
              and .status=="fresh_canonical_audit_execution_complete"
              and .executeRunId==$executeRunId and .dryRunId==$dryRunId
              and .lastSelected==$lastSelected and .workflowCommit==$executeHeadSha
              and .failedExecuteRunId==$failedExecuteRunId
              and .failedExecuteHeadSha==$failedExecuteHeadSha
              and .originalCli.version==$originalCliVersion and .originalCli.sha256==$originalCliSha
              and .failedExecutionCli.version==$failedCliVersion and .failedExecutionCli.sha256==$failedCliSha
              and .recoveryRuntime.cacheVersion=="v7" and .recoveryRuntime.smokeCommit==$smokeCommit
              and .recoveryRuntime.publicCliVersion=="0.1.10"
              and .recoveryRuntime.publicCliIntegrity=="sha512-HKxQJadsobOSJFrf43w9kPHjwlzel0KC9G0R2tIfHVwIbypj2r0eQE2mZkj07wZKQOtYLbQRBcLi2eZpLftzJw=="
              and .scoreFinalized==true and .timestampFinalized==true
              and .cacheClosureCompleted==true and .packClosureCompleted==true
              and .productionSmokeCompleted==true' \
              "$proof" >/dev/null
            recovery="$RUNNER_TEMP/previous-execution/recovery-evidence"
            (cd "$recovery" && sha256sum --check SHA256SUMS)
            test "$(jq -r .recoveryEvidenceManifestSha256 "$proof")" = "$(sha256sum "$recovery/SHA256SUMS" | awk '{print $1}')"
            test "$(jq -r .boundaryManifestSha256 "$proof")" = "$(sha256sum "$execution_boundary/SHA256SUMS" | awk '{print $1}')"
            test "$(jq -r .scoreTimestampEvidenceSha256 "$proof")" = "$(sha256sum "$recovery/score-timestamp-evidence.json" | awk '{print $1}')"
            test "$(jq -r .cacheClosureEvidenceSha256 "$proof")" = "$(sha256sum "$recovery/cache-closure-evidence.json" | awk '{print $1}')"
            test "$(jq -r .cacheReadbackSha256 "$proof")" = "$(sha256sum "$recovery/cache-readback.json" | awk '{print $1}')"
            test "$(jq -r .smokeResultSha256 "$proof")" = "$(sha256sum "$recovery/smoke-result.json" | awk '{print $1}')"
          elif [ "$proof_schema" = 2 ] && [ "$(jq -r .producerKind "$proof")" = fresh_canonical_audit_smoke_recovery ]; then
            jq -e --arg executeRunId "$PREVIOUS_EXECUTE_RUN_ID" \
              --arg dryRunId "$PREVIOUS_BOUNDARY_RUN_ID" --arg lastSelected "$START_AFTER" \
              --arg executeHeadSha "$execute_head_sha" '
              .status=="fresh_canonical_audit_execution_complete"
              and .executeRunId==$executeRunId and .dryRunId==$dryRunId
              and .lastSelected==$lastSelected and .workflowCommit==$executeHeadSha
              and .failedExecuteRunId=="29671150631"
              and .failedExecuteHeadSha=="88d62f4c32ec837ef30075b202b81a580b723259"
              and .failedExecutionCli.version=="2.8.3"
              and .failedExecutionCli.sha256=="296cab05576adec2c6613255b26663fab58e8f3fa585e2c085cd0367d8c7274f"
              and .failedSmokeExpectedPublicCliVersion=="0.1.9"
              and .recoveryRuntime.smokeCommit=="e368da730951aceca17a7e5d9d5a9adc0e3efc2a"
              and .recoveryRuntime.publicCliVersion=="0.1.10"
              and .recoveryRuntime.publicCliIntegrity=="sha512-HKxQJadsobOSJFrf43w9kPHjwlzel0KC9G0R2tIfHVwIbypj2r0eQE2mZkj07wZKQOtYLbQRBcLi2eZpLftzJw=="
              and .scoreFinalized==true and .timestampFinalized==true
              and .cacheClosureCompleted==true and .packClosureCompleted==true
              and .productionSmokeCompleted==true' "$proof" >/dev/null
            recovery="$RUNNER_TEMP/previous-execution/recovery-evidence"
            (cd "$recovery" && sha256sum --check SHA256SUMS)
            test "$(jq -r .recoveryEvidenceManifestSha256 "$proof")" = "$(sha256sum "$recovery/SHA256SUMS" | awk '{print $1}')"
            test "$(jq -r .boundaryManifestSha256 "$proof")" = "$(sha256sum "$execution_boundary/SHA256SUMS" | awk '{print $1}')"
            test "$(jq -r .smokeResultSha256 "$proof")" = "$(sha256sum "$recovery/smoke-result.json" | awk '{print $1}')"
          else
            echo '::error::unsupported fresh execution proof schema'; exit 1
          fi
          test "$(jq -r .cohortSha256 "$proof")" = "$(jq -r .cohortSha256 "$RUNNER_TEMP/previous-boundary/metadata.json")"
          test "$(jq -r .executedCount "$proof")" = "$(jq -r .count "$RUNNER_TEMP/previous-boundary/selected-cohort.json")"
          test "$(jq -r .executionResultsSha256 "$proof")" = "$(sha256sum "$RUNNER_TEMP/previous-execution/execution-results.json" | awk '{print $1}')"
          test "$(jq -r .postInventorySha256 "$proof")" = "$(sha256sum "$RUNNER_TEMP/previous-execution/post-inventory.json" | awk '{print $1}')"
          jq -e --slurpfile selected "$RUNNER_TEMP/previous-boundary/selected-cohort.json" '
            [$selected[0].rows[].skillId] as $ids |
            [.rows[] | select(.id as $id | $ids | index($id))] as $rows |
            ($rows|length)==($ids|length) and all($rows[]; .artifact_revision>=1 and (.current_artifact_version_id|type)=="string")
          ' "$RUNNER_TEMP/previous-execution/post-inventory.json" >/dev/null
          jq -n --slurpfile chain "$RUNNER_TEMP/previous-boundary-chain-base.json" \
            --slurpfile proof "$proof" \
            '$chain[0] + {executionProof:$proof[0]}' > "$RUNNER_TEMP/previous-boundary-chain.json"

      - name: Fetch exact production cursor inventory
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          node scripts/fetch-artifact-version-inventory.mjs --skills-only \
            --output "$RUNNER_TEMP/pre-inventory.json"

      - name: Select one bounded cohort from immutable lineage evidence
        id: plan
        env:
          COHORT_PATH: ${{ inputs.cohort_path }}
          START_AFTER: ${{ inputs.start_after }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          set -euo pipefail
          continuation_args=()
          test -z "$START_AFTER" || continuation_args=(--previous-boundary "$RUNNER_TEMP/previous-boundary-chain.json")
          node scripts/prepare-fresh-canonical-audit-batch.mjs \
            --repository-root "$GITHUB_WORKSPACE" --cohort "$COHORT_PATH" \
            --start-after "$START_AFTER" --batch-size "$BATCH_SIZE" \
            --production-inventory "$RUNNER_TEMP/pre-inventory.json" \
            "${continuation_args[@]}" \
            --output "$RUNNER_TEMP/selected-cohort.json"
          echo "count=$(jq -r .count "$RUNNER_TEMP/selected-cohort.json")" >> "$GITHUB_OUTPUT"
          echo "last_selected=$(jq -r .lastSelected "$RUNNER_TEMP/selected-cohort.json")" >> "$GITHUB_OUTPUT"
          echo "remaining=$(jq -r .remaining "$RUNNER_TEMP/selected-cohort.json")" >> "$GITHUB_OUTPUT"

      - name: Materialize only frozen commit-addressed paths
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/materialized"
          while IFS= read -r group; do
            commit=$(jq -r .marketplaceCommit <<< "$group")
            target="$root/$commit"
            mkdir -p "$target"
            mapfile -t paths < <(jq -r '.paths[]' <<< "$group")
            git archive --format=tar "$commit" -- "${paths[@]}" | tar -xf - -C "$target"
          done < <(jq -c '.groups[]' "$RUNNER_TEMP/selected-cohort.json")

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: marketplace,skillstore

      - name: Download exact fresh-governance CLI 2.15.10
        uses: ./.github/actions/download-skillstore-cli
        with:
          token: ${{ steps.app-token.outputs.token }}
          version: '2.15.10'
          minimum-version: '2.15.10'
          cache-dir: /home/runner/_work/_cache/skillstore-cli

      - name: Hard-block until the released Linux binary digest is audited
        run: |
          set -euo pipefail
          actual=$(sha256sum "$GITHUB_WORKSPACE/skillstore-cli" | awk '{print $1}')
          [[ "$FRESH_GOVERNANCE_CLI_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::invalid CLI 2.15.10 digest'; exit 1; }
          test "$actual" = "$FRESH_GOVERNANCE_CLI_SHA256" || { echo '::error::CLI 2.15.10 digest mismatch'; exit 1; }

      - name: Run genuinely fresh audits against each frozen commit
        env:
          SKILLSTORE_AGENTS: ${{ vars.SKILLSTORE_AGENTS }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          run_nonce=$(node -e "process.stdout.write(require('node:crypto').randomUUID())")
          run_started_at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          mkdir -p "$RUNNER_TEMP/fresh-audit-manifests"
          while IFS= read -r group; do
            commit=$(jq -r .marketplaceCommit <<< "$group")
            slugs=$(jq -r '.slugs | join(",")' <<< "$group")
            count=$(jq -r .count <<< "$group")
            model_args=()
            test -z "$MODEL" || model_args=(--model "$MODEL")
            (
              cd "$RUNNER_TEMP/materialized/$commit"
              "$GITHUB_WORKSPACE/skillstore-cli" skill audit skills --slugs "$slugs" \
                --checkpoint-file "$RUNNER_TEMP/audit-$commit.checkpoint.json" \
                --correlation-id "$GITHUB_RUN_ID-$commit" \
                --fresh-run-manifest-file "$RUNNER_TEMP/fresh-audit-manifests/$commit.json" \
                --fresh-run-nonce "$run_nonce" --fresh-run-id "$GITHUB_RUN_ID" \
                --fresh-run-started-at "$run_started_at" --fresh-selected-count "$count" \
                "${model_args[@]}"
            )
          done < <(jq -c '.groups[]' "$RUNNER_TEMP/selected-cohort.json")
          jq -s --arg nonce "$run_nonce" --arg runId "$GITHUB_RUN_ID" --arg startedAt "$run_started_at" '
            if length == 0 or any(.runNonce != $nonce or .runId != $runId or .startedAt != $startedAt or .status != "fresh_audit_run_complete") then error("fresh audit group manifest mismatch") else {
              schemaVersion:1,status:"fresh_audit_run_complete",runNonce:$nonce,runId:$runId,startedAt:$startedAt,
              selectedCount:(map(.selectedCount)|add),selectedSlugs:(map(.selectedSlugs[])|sort),completed:(map(.completed[])|sort_by(.slug))
            } end' "$RUNNER_TEMP"/fresh-audit-manifests/*.json > "$RUNNER_TEMP/fresh-audit-run.json"
          test "$(jq -r .selectedCount "$RUNNER_TEMP/fresh-audit-run.json")" = "$(jq -r .count "$RUNNER_TEMP/selected-cohort.json")"
          diff -u <(jq -S '.selectedSlugs' "$RUNNER_TEMP/fresh-audit-run.json") \
            <(jq -S '[.rows[].slug] | sort' "$RUNNER_TEMP/selected-cohort.json")

      - name: Freeze production CAS and fresh v3 audit evidence without writes
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/skillstore-cli" skill govern-fresh-canonical-audit \
            --cohort "$RUNNER_TEMP/selected-cohort.json" \
            --audit-run-manifest "$RUNNER_TEMP/fresh-audit-run.json" \
            --root "$RUNNER_TEMP/materialized" --dry-run \
            --result-file "$RUNNER_TEMP/fresh-boundary.json"

      - name: Prove Report-Origin raw32 audits are replacement pointers only
        if: inputs.cohort_path == 'governance/fresh-canonical-audit/raw32-exact62-v1.json'
        run: |
          set -euo pipefail
          jq -e --slurpfile selected "$RUNNER_TEMP/selected-cohort.json" '
            .status == "fresh_canonical_audit_frozen"
            and (.candidates | length) == $selected[0].count
            and (([.candidates[].row.slug] | sort) == ([$selected[0].rows[].slug] | sort))
          ' "$RUNNER_TEMP/fresh-boundary.json" >/dev/null
          failures=$(jq -r '
            .candidates[] as $candidate
            | [
                { name: "replacement_mode", ok: ($candidate.auditReplacementMode == "commit_addressed") },
                { name: "legacy_audit_shape", ok: (($candidate.expectedLatestAudit | keys | sort) == ["content_hash", "id", "skill_id", "version"]) },
                { name: "legacy_audit_raw32", ok: ($candidate.expectedLatestAudit.content_hash | test("^[0-9a-f]{32}$")) },
                { name: "r0_skill", ok: ($candidate.expectedSkill.artifact_revision == 0 and $candidate.expectedSkill.current_artifact_version_id == null) },
                { name: "legacy_pointer", ok: ($candidate.expectedSkill.public_eligibility_audit_id == $candidate.expectedLatestAudit.id) },
                { name: "commit_source_ref", ok: ($candidate.expectedSkill.source_ref == $candidate.row.marketplaceCommit and $candidate.expectedSkill.skill_report_url == ("https://github.com/aiskillstore/marketplace/blob/" + $candidate.row.marketplaceCommit + "/" + $candidate.row.path + "/skill-report.json")) },
                { name: "rpc_expected_audit", ok: ($candidate.rpcPayload.p_expected_latest_audit_id == $candidate.expectedLatestAudit.id and $candidate.rpcPayload.p_expected_latest_audit_version == $candidate.expectedLatestAudit.version and $candidate.rpcPayload.p_expected_latest_audit_content_hash == $candidate.expectedLatestAudit.content_hash) },
                { name: "rpc_expected_reference", ok: ($candidate.rpcPayload.p_expected_source_ref == $candidate.row.marketplaceCommit and $candidate.rpcPayload.p_expected_skill_report_url == ("https://github.com/aiskillstore/marketplace/blob/" + $candidate.row.marketplaceCommit + "/" + $candidate.row.path + "/skill-report.json")) },
                { name: "fresh_audit_identity", ok: ($candidate.rpcPayload.p_audit_id == $candidate.auditId and $candidate.auditId != $candidate.expectedLatestAudit.id) },
                { name: "fresh_audit_binding_v3", ok: (
                    ($candidate.rpcPayload.p_audit_payload.content_hash | test("^v3:[0-9a-f]{40}:[0-9a-f]{64}:[0-9a-f]{64}:[0-9a-f]+:[0-9a-f]{32}$"))
                    and $candidate.rpcPayload.p_audit_payload.content_hash != $candidate.expectedLatestAudit.content_hash
                    and $candidate.rpcPayload.p_audit_payload.subject_marketplace_commit_sha == $candidate.row.marketplaceCommit
                    and $candidate.rpcPayload.p_audit_payload.subject_content_hash == $candidate.row.canonicalArtifact.contentHash
                    and $candidate.rpcPayload.p_audit_payload.subject_tree_hash == $candidate.row.canonicalArtifact.treeHash
                    and $candidate.rpcPayload.p_audit_payload.subject_plugin_path == $candidate.row.path
                    and ($candidate.rpcPayload.p_audit_payload.audit_payload_hash | test("^[0-9a-f]{32}$"))
                  ) },
                { name: "fresh_report", ok: ($candidate.auditRunEvidence.previousReportSha256 != $candidate.auditRunEvidence.reportSha256) }
              ]
            | map(select(.ok | not) | .name) as $failed
            | select($failed | length > 0)
            | "\($candidate.row.slug):\($failed | join(","))"
          ' "$RUNNER_TEMP/fresh-boundary.json")
          test -z "$failures" || { echo "::error::invalid Report-Origin replacement proof: $failures"; exit 1; }

      - name: Freeze exact audited reports and execution boundary
        env:
          COHORT_PATH: ${{ inputs.cohort_path }}
        run: |
          set -euo pipefail
          boundary="$RUNNER_TEMP/fresh-canonical-boundary"
          mkdir -p "$boundary/reports" "$boundary/runtime/.github/workflows" \
            "$boundary/runtime/.github/actions/download-skillstore-cli" "$boundary/runtime/scripts"
          cp "$RUNNER_TEMP/selected-cohort.json" "$boundary/selected-cohort.json"
          cp "$RUNNER_TEMP/fresh-boundary.json" "$boundary/fresh-boundary.json"
          cp "$RUNNER_TEMP/fresh-audit-run.json" "$boundary/fresh-audit-run.json"
          cp "$RUNNER_TEMP/pre-inventory.json" "$boundary/pre-inventory.json"
          cp .github/workflows/govern-fresh-canonical-audits.yml \
            "$boundary/runtime/.github/workflows/govern-fresh-canonical-audits.yml"
          cp .github/actions/download-skillstore-cli/action.yml \
            "$boundary/runtime/.github/actions/download-skillstore-cli/action.yml"
          cp scripts/prepare-fresh-canonical-audit-batch.mjs \
            "$boundary/runtime/scripts/prepare-fresh-canonical-audit-batch.mjs"
          while IFS=$'\t' read -r commit path; do
            source="$RUNNER_TEMP/materialized/$commit/$path/skill-report.json"
            target="$boundary/reports/$commit/$path/skill-report.json"
            mkdir -p "$(dirname "$target")"
            cp "$source" "$target"
          done < <(jq -r '.rows[] | [.marketplaceCommit,.path] | @tsv' "$boundary/selected-cohort.json")
          jq -n \
            --arg runId "$GITHUB_RUN_ID" --arg repository "$GITHUB_REPOSITORY" \
            --arg workflowCommit "$GITHUB_SHA" --arg cliVersion "$FRESH_GOVERNANCE_CLI_VERSION" \
            --arg cliSha256 "$(sha256sum "$GITHUB_WORKSPACE/skillstore-cli" | awk '{print $1}')" \
            --arg cohortPath "$COHORT_PATH" --arg startAfter '${{ inputs.start_after }}' \
            --arg lastSelected "$(jq -r .lastSelected "$RUNNER_TEMP/selected-cohort.json")" \
            --arg previousBoundaryRunId '${{ inputs.previous_boundary_run_id }}' \
            --arg previousExecuteRunId '${{ inputs.previous_execute_run_id }}' \
            --arg cohortSha256 "$(sha256sum "$COHORT_PATH" | awk '{print $1}')" \
            --arg preInventorySha256 "$(sha256sum "$RUNNER_TEMP/pre-inventory.json" | awk '{print $1}')" \
            --arg auditReplacementMode "$(test "$COHORT_PATH" = "$REPORT_ORIGIN_FRESH_COHORT" && echo commit_addressed_raw32_pointer_replacement || echo standard)" \
            '{schemaVersion:1,status:"fresh_canonical_audit_frozen",runId:$runId,repository:$repository,workflowCommit:$workflowCommit,cliVersion:$cliVersion,cliSha256:$cliSha256,cohortPath:$cohortPath,cohortSha256:$cohortSha256,auditReplacementMode:$auditReplacementMode,startAfter:$startAfter,lastSelected:$lastSelected,previousBoundaryRunId:$previousBoundaryRunId,previousExecuteRunId:$previousExecuteRunId,preInventorySha256:$preInventorySha256}' \
            > "$boundary/metadata.json"
          (cd "$boundary" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload strict fresh-audit boundary
        uses: actions/upload-artifact@v6
        with:
          name: fresh-canonical-audit-boundary-${{ github.run_id }}
          path: ${{ runner.temp }}/fresh-canonical-boundary/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Publish no-write boundary summary
        run: |
          {
            echo '## Fresh canonical audit boundary'
            echo "- Selected: \`${{ steps.plan.outputs.count }}\` (maximum 10)"
            echo "- Last selected: \`${{ steps.plan.outputs.last_selected }}\`"
            echo "- Remaining: \`${{ steps.plan.outputs.remaining }}\`"
            echo '- Every report is a new v3 audit over an exact historical commit/path; no production write occurred.'
            echo "- Execute with \`dry_run_id=$GITHUB_RUN_ID\`."
          } >> "$GITHUB_STEP_SUMMARY"

  execute-boundary:
    if: inputs.mode == 'execute'
    concurrency:
      group: production-skill-score-writes
      cancel-in-progress: false
    runs-on: self-hosted
    timeout-minutes: 180
    env:
      ZERO_WRITE_DRY_RUN_ID: '29743150038'
      ZERO_WRITE_DRY_RUN_SHA: 'd75b0863d962bc58cf69d554f8fa6ea67a5c040a'
      ZERO_WRITE_DRY_ARTIFACT_ID: '8461534557'
      ZERO_WRITE_DRY_ARTIFACT_DIGEST: 'sha256:627c18c8d1c127ed6fb4d5020043dae90f35643550b37e6b0150a76233dbfc4b'
      ZERO_WRITE_FAILED_RUN_ID: '29744338076'
      ZERO_WRITE_FAILED_RUN_SHA: 'd75b0863d962bc58cf69d554f8fa6ea67a5c040a'
      ZERO_WRITE_FAILED_ARTIFACT_ID: '8461872394'
      ZERO_WRITE_FAILED_ARTIFACT_DIGEST: 'sha256:e36360f2dd23fae710d9c6ea3a0f02e40b55b31fe18b57f354a62542b8560b50'
    steps:
      - name: Checkout complete Marketplace history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: true
          sparse-checkout: ''
          sparse-checkout-cone-mode: false

      - name: Normalize full checkout and verify governance runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git sparse-checkout disable
          git reset --hard HEAD
          for path in \
            .github/actions/download-skillstore-cli/action.yml \
            scripts/prepare-fresh-canonical-audit-batch.mjs \
            scripts/fetch-artifact-version-inventory.mjs \
            scripts/verify-fresh-canonical-zero-write-recovery.mjs; do
            test -f "$path" || { echo "::error file=$path::Missing fresh governance runtime"; exit 1; }
          done

      - name: Validate execute inputs
        env:
          CLI_VERSION: ${{ inputs.cli_version }}
          MODE: ${{ inputs.mode }}
          DRY_RUN_ID: ${{ inputs.dry_run_id }}
          START_AFTER: ${{ inputs.start_after }}
          FAILED_EXECUTE_RUN_ID: ${{ inputs.failed_execute_run_id }}
          PREVIOUS_BOUNDARY_RUN_ID: ${{ inputs.previous_boundary_run_id }}
          PREVIOUS_EXECUTE_RUN_ID: ${{ inputs.previous_execute_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main || { echo '::error::execute requires main'; exit 1; }
          test "$CLI_VERSION" = "$FRESH_GOVERNANCE_CLI_VERSION" || { echo '::error::workflow CLI pin changed'; exit 1; }
          test -z "$START_AFTER" || { echo '::error::execute cannot accept a scan cursor'; exit 1; }
          test -z "$PREVIOUS_BOUNDARY_RUN_ID" && test -z "$PREVIOUS_EXECUTE_RUN_ID"
          if test "$MODE" = 'recover-rpc-timeout'; then
            test "$DRY_RUN_ID" = "$ZERO_WRITE_DRY_RUN_ID"
            test "$FAILED_EXECUTE_RUN_ID" = "$ZERO_WRITE_FAILED_RUN_ID"
          else
            [[ "$DRY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo '::error::numeric dry_run_id required'; exit 1; }
            test "$DRY_RUN_ID" != "$ZERO_WRITE_DRY_RUN_ID" || { echo '::error::sealed zero-write boundary cannot be executed'; exit 1; }
            test -z "$FAILED_EXECUTE_RUN_ID" || { echo '::error::execute cannot consume failed_execute_run_id'; exit 1; }
          fi

      - name: Download and authenticate the successful frozen boundary
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN_ID: ${{ inputs.dry_run_id }}
        run: |
          set -euo pipefail
          run_json=$(gh run view "$DRY_RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,conclusion,event,headBranch,headSha,workflowName)
          jq -e --argjson id "$DRY_RUN_ID" '.databaseId==$id and .conclusion=="success" and .event=="workflow_dispatch" and .headBranch=="main" and .workflowName=="Govern Fresh Canonical Audits"' <<< "$run_json" >/dev/null
          if test "$DRY_RUN_ID" = '29646612265'; then
            test "$(jq -r .headSha <<< "$run_json")" = '11101c85a06aaec0d8f0deda0a4aac82cf24899b'
            artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DRY_RUN_ID/artifacts?per_page=100")
            jq -e '
              [.artifacts[] | select(
                .name=="fresh-canonical-audit-boundary-29646612265"
                and .expired==false
                and .digest=="sha256:4d5b40e20e59cd830125e572ed2ba888dcc2ce5309a62001793a87dd8464035b"
              )] | length==1
            ' <<< "$artifacts" >/dev/null
          elif test "$DRY_RUN_ID" = "$ZERO_WRITE_DRY_RUN_ID"; then
            test "$(jq -r .headSha <<< "$run_json")" = "$ZERO_WRITE_DRY_RUN_SHA"
            artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DRY_RUN_ID/artifacts?per_page=100")
            jq -e --argjson id "$ZERO_WRITE_DRY_ARTIFACT_ID" \
              --arg digest "$ZERO_WRITE_DRY_ARTIFACT_DIGEST" \
              --arg name "fresh-canonical-audit-boundary-$ZERO_WRITE_DRY_RUN_ID" '
              [.artifacts[] | select(.id==$id and .name==$name and .expired==false and .digest==$digest)] | length==1
            ' <<< "$artifacts" >/dev/null
          fi
          mkdir -p "$RUNNER_TEMP/boundary"
          gh run download "$DRY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "fresh-canonical-audit-boundary-$DRY_RUN_ID" --dir "$RUNNER_TEMP/boundary"
          (cd "$RUNNER_TEMP/boundary" && sha256sum --check SHA256SUMS)
          test "$(jq -r .workflowCommit "$RUNNER_TEMP/boundary/metadata.json")" = "$(jq -r .headSha <<< "$run_json")"
          git merge-base --is-ancestor "$(jq -r .workflowCommit "$RUNNER_TEMP/boundary/metadata.json")" "$GITHUB_SHA"
          if test "$DRY_RUN_ID" = '29646612265'; then
            test "$(jq -r .cliVersion "$RUNNER_TEMP/boundary/metadata.json")" = '2.8.0'
            test "$(jq -r .cliSha256 "$RUNNER_TEMP/boundary/metadata.json")" = 'ecfaa49aa72d24b8ea6322c7dae24d4bbe9df174a5d009cc56d7d2a89e7ae05a'
            for path in \
              .github/workflows/govern-fresh-canonical-audits.yml \
              .github/actions/download-skillstore-cli/action.yml \
              scripts/prepare-fresh-canonical-audit-batch.mjs; do
              git show "11101c85a06aaec0d8f0deda0a4aac82cf24899b:$path" \
                | cmp - "$RUNNER_TEMP/boundary/runtime/$path"
            done
          elif test "$DRY_RUN_ID" = "$ZERO_WRITE_DRY_RUN_ID"; then
            for path in \
              .github/workflows/govern-fresh-canonical-audits.yml \
              .github/actions/download-skillstore-cli/action.yml \
              scripts/prepare-fresh-canonical-audit-batch.mjs; do
              git show "$ZERO_WRITE_DRY_RUN_SHA:$path" | cmp - "$RUNNER_TEMP/boundary/runtime/$path"
            done
          else
            cmp .github/workflows/govern-fresh-canonical-audits.yml \
              "$RUNNER_TEMP/boundary/runtime/.github/workflows/govern-fresh-canonical-audits.yml"
            cmp .github/actions/download-skillstore-cli/action.yml \
              "$RUNNER_TEMP/boundary/runtime/.github/actions/download-skillstore-cli/action.yml"
            cmp scripts/prepare-fresh-canonical-audit-batch.mjs \
              "$RUNNER_TEMP/boundary/runtime/scripts/prepare-fresh-canonical-audit-batch.mjs"
          fi

      - name: Authenticate exact zero-write timeout incident
        if: inputs.mode == 'recover-rpc-timeout'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          incident="$RUNNER_TEMP/zero-write-incident"
          mkdir -p "$incident/failed-execution"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ZERO_WRITE_DRY_RUN_ID" > "$incident/dry-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ZERO_WRITE_FAILED_RUN_ID" > "$incident/failed-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ZERO_WRITE_DRY_RUN_ID/artifacts?per_page=100" > "$incident/dry-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ZERO_WRITE_FAILED_RUN_ID/artifacts?per_page=100" > "$incident/failed-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ZERO_WRITE_FAILED_RUN_ID/jobs?filter=latest&per_page=100" > "$incident/failed-jobs.json"
          gh run download "$ZERO_WRITE_FAILED_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "fresh-canonical-audit-execution-$ZERO_WRITE_FAILED_RUN_ID" \
            --dir "$incident/failed-execution"
          mapfile -t top_level < <(find "$incident/failed-execution" -mindepth 1 -maxdepth 1 -printf '%f\n')
          test "${#top_level[@]}" = 1 && test "${top_level[0]}" = boundary
          (cd "$incident/failed-execution/boundary" && sha256sum --check SHA256SUMS)
          diff -qr "$RUNNER_TEMP/boundary" "$incident/failed-execution/boundary"

      - name: Verify all ten rows still match the zero-write boundary
        if: inputs.mode == 'recover-rpc-timeout'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          incident="$RUNNER_TEMP/zero-write-incident"
          jq '{schemaVersion:1,scopedSkillIds:[.rows[].skillId],rows:.rows}' \
            "$RUNNER_TEMP/boundary/selected-cohort.json" > "$incident/scope.json"
          node scripts/fetch-artifact-version-inventory.mjs \
            --scope-inventory "$incident/scope.json" --output "$incident/current-inventory.json"
          node scripts/verify-fresh-canonical-zero-write-recovery.mjs \
            --boundary "$RUNNER_TEMP/boundary/fresh-boundary.json" \
            --original-inventory "$RUNNER_TEMP/boundary/pre-inventory.json" \
            --current-inventory "$incident/current-inventory.json" \
            --dry-run "$incident/dry-run.json" --failed-run "$incident/failed-run.json" \
            --dry-artifacts "$incident/dry-artifacts.json" \
            --failed-artifacts "$incident/failed-artifacts.json" \
            --failed-jobs "$incident/failed-jobs.json" \
            > "$incident/verification.json"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: marketplace,skillstore

      - name: Download exact audited CLI 2.15.10
        uses: ./.github/actions/download-skillstore-cli
        with:
          token: ${{ steps.app-token.outputs.token }}
          version: '2.15.10'
          minimum-version: '2.15.10'
          cache-dir: /home/runner/_work/_cache/skillstore-cli

      - name: Verify frozen CLI identity
        env:
          DRY_RUN_ID: ${{ inputs.dry_run_id }}
        run: |
          set -euo pipefail
          expected=$(jq -r .cliSha256 "$RUNNER_TEMP/boundary/metadata.json")
          actual=$(sha256sum "$GITHUB_WORKSPACE/skillstore-cli" | awk '{print $1}')
          [[ "$FRESH_GOVERNANCE_CLI_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::invalid CLI 2.15.10 digest'; exit 1; }
          if test "$DRY_RUN_ID" = '29646612265'; then
            test "$expected" = 'ecfaa49aa72d24b8ea6322c7dae24d4bbe9df174a5d009cc56d7d2a89e7ae05a'
          else
            test "$expected" = "$FRESH_GOVERNANCE_CLI_SHA256"
          fi
          test "$actual" = "$FRESH_GOVERNANCE_CLI_SHA256"

      - name: Rematerialize exact source and overlay only frozen fresh reports
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/materialized"
          while IFS= read -r group; do
            commit=$(jq -r .marketplaceCommit <<< "$group")
            target="$root/$commit"
            mkdir -p "$target"
            mapfile -t paths < <(jq -r '.paths[]' <<< "$group")
            git archive --format=tar "$commit" -- "${paths[@]}" | tar -xf - -C "$target"
          done < <(jq -c '.groups[]' "$RUNNER_TEMP/boundary/selected-cohort.json")
          while IFS=$'\t' read -r commit path; do
            cp "$RUNNER_TEMP/boundary/reports/$commit/$path/skill-report.json" \
              "$root/$commit/$path/skill-report.json"
          done < <(jq -r '.rows[] | [.marketplaceCommit,.path] | @tsv' "$RUNNER_TEMP/boundary/selected-cohort.json")

      - name: Execute resumable compound governance, score, and cache closure
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CACHE_INVALIDATE_SECRET: ${{ secrets.CACHE_INVALIDATE_SECRET }}
          SKILLSTORE_SITE_URL: https://skillstore.io
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/skillstore-cli" skill govern-fresh-canonical-audit \
            --boundary "$RUNNER_TEMP/boundary/fresh-boundary.json" \
            --root "$RUNNER_TEMP/materialized" \
            --result-file "$RUNNER_TEMP/execution-results.json"

      - name: Fetch exact post-execution artifact and Pack evidence
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          jq '{schemaVersion:1,scopedSkillIds:[.rows[].skillId],rows:.rows}' \
            "$RUNNER_TEMP/boundary/selected-cohort.json" > "$RUNNER_TEMP/scope.json"
          node scripts/fetch-artifact-version-inventory.mjs \
            --scope-inventory "$RUNNER_TEMP/scope.json" --output "$RUNNER_TEMP/post-inventory.json"
          test "$(jq -r '[.artifacts[] | select(.artifact_revision==1)] | length' "$RUNNER_TEMP/post-inventory.json")" \
            = "$(jq -r .count "$RUNNER_TEMP/boundary/selected-cohort.json")"
          test "$(jq --slurpfile scope "$RUNNER_TEMP/scope.json" -r '[.rows[] as $row | select(($scope[0].scopedSkillIds | index($row.id)) != null) | select($row.artifact_revision==1 and $row.current_artifact_version_id!=null)] | length' "$RUNNER_TEMP/post-inventory.json")" \
            = "$(jq -r .count "$RUNNER_TEMP/boundary/selected-cohort.json")"

      - name: Checkout current Skillstore production smoke harness
        uses: actions/checkout@v5
        with:
          repository: aiskillstore/skillstore
          token: ${{ steps.app-token.outputs.token }}
          path: skillstore-smoke

      - name: Verify every P0/P1 download, install, NPX, Pack, and MCP channel
        env:
          SMOKE_PUBLIC_CLI_PACKAGES: skillstore@0.1.10,skillstore@latest
          SMOKE_EXPECTED_PUBLIC_CLI_VERSION: 0.1.10
          SMOKE_EXPECTED_PUBLIC_CLI_INTEGRITY: sha512-HKxQJadsobOSJFrf43w9kPHjwlzel0KC9G0R2tIfHVwIbypj2r0eQE2mZkj07wZKQOtYLbQRBcLi2eZpLftzJw==
          SMOKE_EXPECTED_SIGNING_KEY_ID: EP0Myk7rTk_J0RdG1fvpkP
          SMOKE_EXPECTED_SIGNING_PUBLIC_KEY_X: 2tbC6eNY4T9sx4Pvuo_NwHlXGyWWz95WAtHyHUTqzs8
          SMOKE_EXPECT_INTERACTION_RECOVERY: true
        run: >-
          node skillstore-smoke/scripts/smoke/production-smoke.mjs
          --base-url https://skillstore.io
          --attempts 3
          --retry-ms 3000

      - name: Seal successful execute closure for the next cursor
        run: |
          set -euo pipefail
          expected=$(jq -r .count "$RUNNER_TEMP/boundary/selected-cohort.json")
          test "$(jq length "$RUNNER_TEMP/execution-results.json")" = "$expected"
          proof="$RUNNER_TEMP/execution-proof"
          mkdir -p "$proof"
          jq -n \
            --arg executeRunId "$GITHUB_RUN_ID" --arg dryRunId '${{ inputs.dry_run_id }}' \
            --arg producerKind '${{ inputs.mode == 'recover-rpc-timeout' && 'fresh_canonical_zero_write_recovery' || 'fresh_canonical_execute' }}' \
            --arg failedExecuteRunId '${{ inputs.failed_execute_run_id }}' \
            --arg workflowCommit "$GITHUB_SHA" \
            --arg lastSelected "$(jq -r .lastSelected "$RUNNER_TEMP/boundary/selected-cohort.json")" \
            --arg cohortSha256 "$(jq -r .cohortSha256 "$RUNNER_TEMP/boundary/metadata.json")" \
            --arg executionResultsSha256 "$(sha256sum "$RUNNER_TEMP/execution-results.json" | awk '{print $1}')" \
            --arg postInventorySha256 "$(sha256sum "$RUNNER_TEMP/post-inventory.json" | awk '{print $1}')" \
            --argjson executedCount "$expected" \
            '{schemaVersion:1,producerKind:$producerKind,status:"fresh_canonical_audit_execution_complete",executeRunId:$executeRunId,dryRunId:$dryRunId,failedExecuteRunId:$failedExecuteRunId,workflowCommit:$workflowCommit,lastSelected:$lastSelected,cohortSha256:$cohortSha256,executedCount:$executedCount,executionResultsSha256:$executionResultsSha256,postInventorySha256:$postInventorySha256,scoreFinalized:true,timestampFinalized:true,cacheClosureCompleted:true,packClosureCompleted:true,productionSmokeCompleted:true}' \
            > "$proof/proof.json"
          (cd "$proof" && sha256sum proof.json > SHA256SUMS)

      - name: Upload execution and smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fresh-canonical-audit-execution-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/boundary/
            ${{ runner.temp }}/execution-results.json
            ${{ runner.temp }}/post-inventory.json
            ${{ runner.temp }}/execution-proof/
            ${{ runner.temp }}/zero-write-incident/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified execution summary
        run: |
          {
            echo '## Fresh canonical audit execution verified'
            echo "- Frozen boundary: \`${{ inputs.dry_run_id }}\`"
            echo "- Executed: \`$(jq length "$RUNNER_TEMP/execution-results.json")\`"
            echo '- Canonical r1, independent v3 source audits, fresh scores, cache/Pack closure, and all production P0/P1 install channels passed.'
          } >> "$GITHUB_STEP_SUMMARY"

  recover-boundary:
    if: inputs.mode == 'recover' || inputs.mode == 'recover-cache'
    concurrency:
      group: production-skill-score-writes
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      INCIDENT_DRY_RUN_ID: ${{ inputs.mode == 'recover-cache' && '29682699325' || '29646612265' }}
      INCIDENT_DRY_RUN_SHA: ${{ inputs.mode == 'recover-cache' && 'e8ce3fcb20197aefea54f9fb43ccce4716e3209c' || '11101c85a06aaec0d8f0deda0a4aac82cf24899b' }}
      INCIDENT_BOUNDARY_ARTIFACT_DIGEST: ${{ inputs.mode == 'recover-cache' && 'sha256:4fd86f8b01d8fdea25d94dc843cf7a26a3e46bca09605e41ddca8d28fff4d4cd' || 'sha256:4d5b40e20e59cd830125e572ed2ba888dcc2ce5309a62001793a87dd8464035b' }}
      INCIDENT_FAILED_EXECUTE_RUN_ID: ${{ inputs.mode == 'recover-cache' && '29684825610' || '29666546406' }}
      INCIDENT_FAILED_EXECUTE_SHA: ${{ inputs.mode == 'recover-cache' && '2bfe0fd5cf25a967c5481dd83207b0de24997273' || '3e7baf520a4d078047b53b95352156e3a3f74260' }}
      INCIDENT_FAILED_ARTIFACT_DIGEST: ${{ inputs.mode == 'recover-cache' && 'sha256:95583b3df74c1f5af7f351a6f44d05490df46aa84531bc44f439947decf8daf6' || 'sha256:d35558237279c275c3dd0d7169f8f0ae718719c050e7d2055dd8ac32d344b526' }}
      INCIDENT_BOUNDARY_CLI_VERSION: ${{ inputs.mode == 'recover-cache' && '2.8.4' || '2.8.0' }}
      INCIDENT_BOUNDARY_CLI_SHA256: ${{ inputs.mode == 'recover-cache' && '282cfb6103f580c1758674f6d407493b3039a2ca788c986297684180ae6f0dbb' || 'ecfaa49aa72d24b8ea6322c7dae24d4bbe9df174a5d009cc56d7d2a89e7ae05a' }}
      INCIDENT_EXECUTE_CLI_VERSION: ${{ inputs.mode == 'recover-cache' && '2.8.4' || '2.8.2' }}
      INCIDENT_EXECUTE_CLI_SHA256: ${{ inputs.mode == 'recover-cache' && '282cfb6103f580c1758674f6d407493b3039a2ca788c986297684180ae6f0dbb' || '9b885943950c15555e8fbae522adf2cf9514ae74f63050a905c8e97694d52fcb' }}
      RECOVERY_INPUT_CLI_VERSION: ${{ inputs.mode == 'recover-cache' && '2.8.4' || '2.8.3' }}
      RECOVERY_EXPECTED_CACHE_VERSION: 'v7'
      RECOVERY_SMOKE_SHA: ${{ inputs.mode == 'recover-cache' && '0f78b2d983b0e233f6b7071e38ddf6b4f29c9168' || 'e368da730951aceca17a7e5d9d5a9adc0e3efc2a' }}
      RECOVERY_PUBLIC_CLI_VERSION: '0.1.10'
      RECOVERY_PUBLIC_CLI_INTEGRITY: 'sha512-HKxQJadsobOSJFrf43w9kPHjwlzel0KC9G0R2tIfHVwIbypj2r0eQE2mZkj07wZKQOtYLbQRBcLi2eZpLftzJw=='
    steps:
      - name: Checkout immutable Marketplace recovery runtime
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          clean: true

      - name: Validate incident-only recovery inputs and external release gates
        env:
          DRY_RUN_ID: ${{ inputs.dry_run_id }}
          FAILED_EXECUTE_RUN_ID: ${{ inputs.failed_execute_run_id }}
          START_AFTER: ${{ inputs.start_after }}
          PREVIOUS_BOUNDARY_RUN_ID: ${{ inputs.previous_boundary_run_id }}
          PREVIOUS_EXECUTE_RUN_ID: ${{ inputs.previous_execute_run_id }}
          CLI_VERSION: ${{ inputs.cli_version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          test "$DRY_RUN_ID" = "$INCIDENT_DRY_RUN_ID"
          test "$FAILED_EXECUTE_RUN_ID" = "$INCIDENT_FAILED_EXECUTE_RUN_ID"
          test "$CLI_VERSION" = "$RECOVERY_INPUT_CLI_VERSION"
          test -z "$START_AFTER" && test -z "$PREVIOUS_BOUNDARY_RUN_ID" && test -z "$PREVIOUS_EXECUTE_RUN_ID"
          [[ "$RECOVERY_EXPECTED_CACHE_VERSION" =~ ^v[1-9][0-9]*$ ]] || {
            echo '::error::pin the deployed Skill score-detail cache version before recovery'; exit 1;
          }
          [[ "$RECOVERY_SMOKE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::pin the merged Skillstore structured-smoke commit before recovery'; exit 1;
          }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$INCIDENT_DRY_RUN_SHA" "$GITHUB_SHA"
          git merge-base --is-ancestor "$INCIDENT_FAILED_EXECUTE_SHA" "$GITHUB_SHA"
          node --check scripts/verify-fresh-canonical-audit-recovery.mjs
          node --check scripts/close-fresh-canonical-audit-cache.mjs

      - name: Authenticate original boundary and failed execute run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/recovery-source"
          mkdir -p "$evidence/original-boundary" "$evidence/failed-execution"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_DRY_RUN_ID" > "$evidence/dry-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_FAILED_EXECUTE_RUN_ID" > "$evidence/failed-run.json"
          jq -e --argjson id "$INCIDENT_DRY_RUN_ID" --arg sha "$INCIDENT_DRY_RUN_SHA" '
            .id==$id and .name=="Govern Fresh Canonical Audits" and .event=="workflow_dispatch"
            and .head_branch=="main" and .head_sha==$sha and .conclusion=="success" and .run_attempt==1
          ' "$evidence/dry-run.json" >/dev/null
          jq -e --argjson id "$INCIDENT_FAILED_EXECUTE_RUN_ID" --arg sha "$INCIDENT_FAILED_EXECUTE_SHA" '
            .id==$id and .name=="Govern Fresh Canonical Audits" and .event=="workflow_dispatch"
            and .head_branch=="main" and .head_sha==$sha and .conclusion=="failure" and .run_attempt==1
          ' "$evidence/failed-run.json" >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_DRY_RUN_ID/artifacts" > "$evidence/dry-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_FAILED_EXECUTE_RUN_ID/artifacts" > "$evidence/failed-artifacts.json"
          jq -e --arg name "fresh-canonical-audit-boundary-$INCIDENT_DRY_RUN_ID" \
            --arg digest "$INCIDENT_BOUNDARY_ARTIFACT_DIGEST" '
            [.artifacts[] | select(.name==$name and .expired==false and .digest==$digest)] | length==1
          ' "$evidence/dry-artifacts.json" >/dev/null
          jq -e --arg name "fresh-canonical-audit-execution-$INCIDENT_FAILED_EXECUTE_RUN_ID" \
            --arg digest "$INCIDENT_FAILED_ARTIFACT_DIGEST" '
            [.artifacts[] | select(.name==$name and .expired==false and .digest==$digest)] | length==1
          ' "$evidence/failed-artifacts.json" >/dev/null

          gh run download "$INCIDENT_DRY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "fresh-canonical-audit-boundary-$INCIDENT_DRY_RUN_ID" --dir "$evidence/original-boundary"
          gh run download "$INCIDENT_FAILED_EXECUTE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "fresh-canonical-audit-execution-$INCIDENT_FAILED_EXECUTE_RUN_ID" --dir "$evidence/failed-execution"
          (cd "$evidence/original-boundary" && sha256sum --check SHA256SUMS)
          (cd "$evidence/failed-execution/boundary" && sha256sum --check SHA256SUMS)
          diff -qr "$evidence/original-boundary" "$evidence/failed-execution/boundary"
          test "$(jq -r .cliVersion "$evidence/original-boundary/metadata.json")" = "$INCIDENT_BOUNDARY_CLI_VERSION"
          test "$(jq -r .cliSha256 "$evidence/original-boundary/metadata.json")" = "$INCIDENT_BOUNDARY_CLI_SHA256"
          test "$(jq -r .runId "$evidence/original-boundary/metadata.json")" = "$INCIDENT_DRY_RUN_ID"
          git show "$INCIDENT_DRY_RUN_SHA:.github/workflows/govern-fresh-canonical-audits.yml" \
            | cmp - "$evidence/original-boundary/runtime/.github/workflows/govern-fresh-canonical-audits.yml"
          git show "$INCIDENT_DRY_RUN_SHA:.github/actions/download-skillstore-cli/action.yml" \
            | cmp - "$evidence/original-boundary/runtime/.github/actions/download-skillstore-cli/action.yml"
          git show "$INCIDENT_DRY_RUN_SHA:scripts/prepare-fresh-canonical-audit-batch.mjs" \
            | cmp - "$evidence/original-boundary/runtime/scripts/prepare-fresh-canonical-audit-batch.mjs"
          git show "$INCIDENT_FAILED_EXECUTE_SHA:.github/workflows/govern-fresh-canonical-audits.yml" \
            > "$evidence/failed-workflow.yml"
          test "$(grep -Fc "$INCIDENT_EXECUTE_CLI_VERSION" "$evidence/failed-workflow.yml")" -ge 1
          test "$(grep -Fc "$INCIDENT_EXECUTE_CLI_SHA256" "$evidence/failed-workflow.yml")" -ge 1

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_FAILED_EXECUTE_RUN_ID/jobs?filter=latest&per_page=100" \
            > "$evidence/failed-jobs.json"
          jq -e --arg cliStep "Download exact audited CLI $INCIDENT_EXECUTE_CLI_VERSION" '
            def job_rows:
              if type=="object" and (.jobs|type)=="array" then .jobs
              elif type=="array" and all(.[]; type=="object" and (.jobs|type)=="array") then [.[].jobs[]]
              elif type=="array" then .
              else error("unsupported jobs response") end;
            job_rows as $jobs |
            [$jobs[] | select(.name=="execute-boundary" and .conclusion=="failure")] | length==1
            and ([$jobs[].steps[] | select(.name=="Checkout complete Marketplace history" and .conclusion=="success")] | length==1)
            and ([$jobs[].steps[] | select(.name=="Normalize full checkout and verify governance runtime" and .conclusion=="success")] | length==1)
            and ([$jobs[].steps[] | select(.name=="Validate execute inputs" and .conclusion=="success")] | length==1)
            and ([$jobs[].steps[] | select(.name=="Download and authenticate the successful frozen boundary" and .conclusion=="success")] | length==1)
            and ([$jobs[].steps[] | select(.name=="Generate GitHub App token" and .conclusion=="success")] | length==1)
            and ([$jobs[].steps[] | select(.name==$cliStep and .conclusion=="success")] | length==1)
            and ([$jobs[].steps[] | select(.name=="Verify frozen CLI identity" and .conclusion=="success")] | length==1)
            and ([$jobs[].steps[] | select(.name=="Rematerialize exact source and overlay only frozen fresh reports" and .conclusion=="success")] | length==1)
            and ([$jobs[].steps[] | select(.name=="Execute resumable compound governance, score, and cache closure" and .conclusion=="failure")] | length==1)
            and ([$jobs[].steps[] | select(.name=="Fetch exact post-execution artifact and Pack evidence" and .conclusion=="skipped")] | length==1)
            and ([$jobs[].steps[] | select(.name=="Verify every P0/P1 download, install, NPX, Pack, and MCP channel" and .conclusion=="skipped")] | length==1)
            and ([$jobs[].steps[] | select(.name=="Seal successful execute closure for the next cursor" and .conclusion=="skipped")] | length==1)
          ' "$evidence/failed-jobs.json" >/dev/null

      - name: Fetch exact scoped post-inventory
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          boundary="$RUNNER_TEMP/recovery-source/original-boundary"
          recovery="$RUNNER_TEMP/fresh-recovery"
          mkdir -p "$recovery/recovery-evidence"
          jq '{schemaVersion:1,scopedSkillIds:[.rows[].skillId],rows:.rows}' \
            "$boundary/selected-cohort.json" > "$recovery/scope.json"
          node scripts/fetch-artifact-version-inventory.mjs \
            --scope-inventory "$recovery/scope.json" --output "$recovery/post-inventory.json"

      - name: Reconstruct and verify every durable governance result without writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          node scripts/verify-fresh-canonical-audit-recovery.mjs \
            --boundary "$RUNNER_TEMP/recovery-source/original-boundary/fresh-boundary.json" \
            --post-inventory "$RUNNER_TEMP/fresh-recovery/post-inventory.json" \
            --failed-run "$RUNNER_TEMP/recovery-source/failed-run.json" \
            --expected-failed-run-id "$INCIDENT_FAILED_EXECUTE_RUN_ID" \
            --expected-failed-run-sha "$INCIDENT_FAILED_EXECUTE_SHA" \
            --output-dir "$RUNNER_TEMP/fresh-recovery/recovery-evidence"
          cp "$RUNNER_TEMP/fresh-recovery/recovery-evidence/execution-results.json" \
            "$RUNNER_TEMP/fresh-recovery/execution-results.json"
          jq -r '.rows[].slug' "$RUNNER_TEMP/recovery-source/original-boundary/selected-cohort.json" \
            | sort -u > "$RUNNER_TEMP/fresh-recovery/recovery-evidence/slugs.txt"
          test "$(wc -l < "$RUNNER_TEMP/fresh-recovery/recovery-evidence/slugs.txt" | tr -d ' ')" = 10

      - name: Close exact cache and dependent Pack closure one Skill at a time
        env:
          CACHE_INVALIDATE_SECRET: ${{ secrets.CACHE_INVALIDATE_SECRET }}
        run: |
          set -euo pipefail
          node scripts/close-fresh-canonical-audit-cache.mjs \
            --slugs-file "$RUNNER_TEMP/fresh-recovery/recovery-evidence/slugs.txt" \
            --site-url https://skillstore.io \
            --output "$RUNNER_TEMP/fresh-recovery/recovery-evidence/cache-closure-evidence.json"

      - name: Verify every recovered production score cache readback
        run: |
          set -euo pipefail
          node scripts/score-cache-closure.mjs readback \
            --expected-score-evidence "$RUNNER_TEMP/fresh-recovery/recovery-evidence/expected-score-evidence.json" \
            --evidence "$RUNNER_TEMP/fresh-recovery/recovery-evidence/cache-readback.json" \
            --site-url https://skillstore.io \
            --expected-cache-version "$RECOVERY_EXPECTED_CACHE_VERSION" \
            --concurrency 1 --attempts 3 --timeout-ms 30000

      - name: Generate GitHub App token for immutable smoke harness
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: skillstore

      - name: Checkout pinned Skillstore structured smoke harness
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: aiskillstore/skillstore
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ env.RECOVERY_SMOKE_SHA }}
          path: skillstore-smoke
          fetch-depth: 1

      - name: Verify download, install, NPX, Pack, MCP, and CI channels
        env:
          SMOKE_PUBLIC_CLI_PACKAGES: skillstore@0.1.10,skillstore@latest
          SMOKE_EXPECTED_PUBLIC_CLI_VERSION: '0.1.10'
          SMOKE_EXPECTED_PUBLIC_CLI_INTEGRITY: ${{ env.RECOVERY_PUBLIC_CLI_INTEGRITY }}
          SMOKE_EXPECTED_SIGNING_KEY_ID: EP0Myk7rTk_J0RdG1fvpkP
          SMOKE_EXPECTED_SIGNING_PUBLIC_KEY_X: 2tbC6eNY4T9sx4Pvuo_NwHlXGyWWz95WAtHyHUTqzs8
          SMOKE_EXPECT_INTERACTION_RECOVERY: true
          CI: true
        run: |
          set -euo pipefail
          test "$(git -C skillstore-smoke rev-parse HEAD)" = "$RECOVERY_SMOKE_SHA"
          sha256sum skillstore-smoke/scripts/smoke/production-smoke.mjs \
            > "$RUNNER_TEMP/fresh-recovery/recovery-evidence/smoke-runtime.sha256"
          node skillstore-smoke/scripts/smoke/production-smoke.mjs \
            --base-url https://skillstore.io --attempts 3 --retry-ms 3000 \
            --result-file "$RUNNER_TEMP/fresh-recovery/recovery-evidence/smoke-result.json" \
            2>&1 | tee "$RUNNER_TEMP/fresh-recovery/recovery-evidence/smoke.log"

      - name: Seal schema-v2 recovery proof for the next cursor
        run: |
          set -euo pipefail
          recovery="$RUNNER_TEMP/fresh-recovery"
          evidence="$recovery/recovery-evidence"
          boundary="$RUNNER_TEMP/recovery-source/original-boundary"
          cp -a "$boundary" "$recovery/boundary"
          cp "$RUNNER_TEMP/recovery-source/"*.json "$evidence/"
          cp "$RUNNER_TEMP/recovery-source/failed-workflow.yml" "$evidence/"
          cp scripts/verify-fresh-canonical-audit-recovery.mjs "$evidence/"
          cp scripts/close-fresh-canonical-audit-cache.mjs "$evidence/"
          (cd "$evidence" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          proof="$recovery/execution-proof"
          mkdir -p "$proof"
          jq -n \
            --arg executeRunId "$GITHUB_RUN_ID" --arg dryRunId "$INCIDENT_DRY_RUN_ID" \
            --arg failedExecuteRunId "$INCIDENT_FAILED_EXECUTE_RUN_ID" \
            --arg failedExecuteHeadSha "$INCIDENT_FAILED_EXECUTE_SHA" --arg workflowCommit "$GITHUB_SHA" \
            --arg lastSelected "$(jq -r .lastSelected "$boundary/selected-cohort.json")" \
            --arg cohortSha256 "$(jq -r .cohortSha256 "$boundary/metadata.json")" \
            --arg executionResultsSha256 "$(sha256sum "$recovery/execution-results.json" | awk '{print $1}')" \
            --arg postInventorySha256 "$(sha256sum "$recovery/post-inventory.json" | awk '{print $1}')" \
            --arg boundaryManifestSha256 "$(sha256sum "$boundary/SHA256SUMS" | awk '{print $1}')" \
            --arg recoveryEvidenceManifestSha256 "$(sha256sum "$evidence/SHA256SUMS" | awk '{print $1}')" \
            --arg scoreTimestampEvidenceSha256 "$(sha256sum "$evidence/score-timestamp-evidence.json" | awk '{print $1}')" \
            --arg cacheClosureEvidenceSha256 "$(sha256sum "$evidence/cache-closure-evidence.json" | awk '{print $1}')" \
            --arg cacheReadbackSha256 "$(sha256sum "$evidence/cache-readback.json" | awk '{print $1}')" \
            --arg smokeResultSha256 "$(sha256sum "$evidence/smoke-result.json" | awk '{print $1}')" \
            --arg originalCliVersion "$INCIDENT_BOUNDARY_CLI_VERSION" --arg originalCliSha256 "$INCIDENT_BOUNDARY_CLI_SHA256" \
            --arg failedExecutionCliVersion "$INCIDENT_EXECUTE_CLI_VERSION" --arg failedExecutionCliSha256 "$INCIDENT_EXECUTE_CLI_SHA256" \
            --arg cacheVersion "$RECOVERY_EXPECTED_CACHE_VERSION" --arg smokeCommit "$RECOVERY_SMOKE_SHA" \
            --arg publicCliVersion "$RECOVERY_PUBLIC_CLI_VERSION" --arg publicCliIntegrity "$RECOVERY_PUBLIC_CLI_INTEGRITY" \
            --argjson executedCount 10 \
            '{schemaVersion:2,producerKind:"fresh_canonical_audit_recovery",status:"fresh_canonical_audit_execution_complete",executeRunId:$executeRunId,dryRunId:$dryRunId,failedExecuteRunId:$failedExecuteRunId,failedExecuteHeadSha:$failedExecuteHeadSha,workflowCommit:$workflowCommit,lastSelected:$lastSelected,cohortSha256:$cohortSha256,executedCount:$executedCount,executionResultsSha256:$executionResultsSha256,postInventorySha256:$postInventorySha256,boundaryManifestSha256:$boundaryManifestSha256,recoveryEvidenceManifestSha256:$recoveryEvidenceManifestSha256,scoreTimestampEvidenceSha256:$scoreTimestampEvidenceSha256,cacheClosureEvidenceSha256:$cacheClosureEvidenceSha256,cacheReadbackSha256:$cacheReadbackSha256,smokeResultSha256:$smokeResultSha256,originalCli:{version:$originalCliVersion,sha256:$originalCliSha256},failedExecutionCli:{version:$failedExecutionCliVersion,sha256:$failedExecutionCliSha256},recoveryRuntime:{cacheVersion:$cacheVersion,smokeCommit:$smokeCommit,publicCliVersion:$publicCliVersion,publicCliIntegrity:$publicCliIntegrity},scoreFinalized:true,timestampFinalized:true,cacheClosureCompleted:true,packClosureCompleted:true,productionSmokeCompleted:true}' \
            > "$proof/proof.json"
          (cd "$proof" && sha256sum proof.json > SHA256SUMS)

      - name: Upload recovery execution and smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fresh-canonical-audit-execution-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fresh-recovery/boundary/
            ${{ runner.temp }}/fresh-recovery/execution-results.json
            ${{ runner.temp }}/fresh-recovery/post-inventory.json
            ${{ runner.temp }}/fresh-recovery/recovery-evidence/
            ${{ runner.temp }}/fresh-recovery/execution-proof/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified recovery summary
        run: |
          recovered=$(jq length "$RUNNER_TEMP/fresh-recovery/execution-results.json")
          expected=$(jq -r .count "$RUNNER_TEMP/fresh-recovery/boundary/selected-cohort.json")
          next_cursor=$(jq -r .lastSelected "$RUNNER_TEMP/fresh-recovery/boundary/selected-cohort.json")
          {
            echo '## Fresh canonical audit execution recovered'
            echo "- Frozen boundary: \`$INCIDENT_DRY_RUN_ID\`"
            echo "- Failed execute: \`$INCIDENT_FAILED_EXECUTE_RUN_ID\`"
            echo "- Reconstructed durable writes: \`$recovered/$expected\`."
            echo "- Next campaign cursor: \`$next_cursor\`."
            echo '- No governance RPC or score recalculation ran in recovery.'
          } >> "$GITHUB_STEP_SUMMARY"

  recover-smoke-boundary:
    if: inputs.mode == 'recover-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INCIDENT_DRY_RUN_ID: '29669706395'
      INCIDENT_DRY_RUN_SHA: '88d62f4c32ec837ef30075b202b81a580b723259'
      INCIDENT_BOUNDARY_ARTIFACT_DIGEST: 'sha256:12cfbdd4bcd38e38c93495c145c7e8d1f7254b50a236457d3112aa6b92055d2c'
      INCIDENT_FAILED_EXECUTE_RUN_ID: '29671150631'
      INCIDENT_FAILED_EXECUTE_SHA: '88d62f4c32ec837ef30075b202b81a580b723259'
      INCIDENT_FAILED_ARTIFACT_DIGEST: 'sha256:2d52fc0097f9d7e4014c66e3af97081f519d00e391e9867eb345d756d1e3fcbf'
      INCIDENT_EXECUTE_CLI_VERSION: '2.8.3'
      INCIDENT_EXECUTE_CLI_SHA256: '296cab05576adec2c6613255b26663fab58e8f3fa585e2c085cd0367d8c7274f'
      INCIDENT_FAILED_SMOKE_CLI_VERSION: '0.1.9'
      RECOVERY_SMOKE_SHA: 'e368da730951aceca17a7e5d9d5a9adc0e3efc2a'
      RECOVERY_PUBLIC_CLI_VERSION: '0.1.10'
      RECOVERY_PUBLIC_CLI_INTEGRITY: 'sha512-HKxQJadsobOSJFrf43w9kPHjwlzel0KC9G0R2tIfHVwIbypj2r0eQE2mZkj07wZKQOtYLbQRBcLi2eZpLftzJw=='
    steps:
      - name: Checkout immutable smoke-recovery runtime
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          clean: true

      - name: Validate smoke-only incident inputs and public CLI identity
        env:
          DRY_RUN_ID: ${{ inputs.dry_run_id }}
          FAILED_EXECUTE_RUN_ID: ${{ inputs.failed_execute_run_id }}
          START_AFTER: ${{ inputs.start_after }}
          PREVIOUS_BOUNDARY_RUN_ID: ${{ inputs.previous_boundary_run_id }}
          PREVIOUS_EXECUTE_RUN_ID: ${{ inputs.previous_execute_run_id }}
          CLI_VERSION: ${{ inputs.cli_version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          test "$DRY_RUN_ID" = "$INCIDENT_DRY_RUN_ID"
          test "$FAILED_EXECUTE_RUN_ID" = "$INCIDENT_FAILED_EXECUTE_RUN_ID"
          test "$CLI_VERSION" = "$INCIDENT_EXECUTE_CLI_VERSION"
          test -z "$START_AFTER" && test -z "$PREVIOUS_BOUNDARY_RUN_ID" && test -z "$PREVIOUS_EXECUTE_RUN_ID"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$INCIDENT_DRY_RUN_SHA" "$GITHUB_SHA"
          test "$(npm view "skillstore@$RECOVERY_PUBLIC_CLI_VERSION" version)" = "$RECOVERY_PUBLIC_CLI_VERSION"
          test "$(npm view "skillstore@$RECOVERY_PUBLIC_CLI_VERSION" dist.integrity)" = "$RECOVERY_PUBLIC_CLI_INTEGRITY"
          test "$(npm view skillstore@latest version)" = "$RECOVERY_PUBLIC_CLI_VERSION"
          test "$(npm view skillstore@latest dist.integrity)" = "$RECOVERY_PUBLIC_CLI_INTEGRITY"

      - name: Authenticate the exact failed smoke boundary without writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/smoke-recovery-source"
          recovery="$RUNNER_TEMP/fresh-smoke-recovery"
          mkdir -p "$source/original-boundary" "$source/failed-execution" "$recovery/recovery-evidence"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_DRY_RUN_ID" > "$source/dry-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_FAILED_EXECUTE_RUN_ID" > "$source/failed-run.json"
          jq -e --argjson id "$INCIDENT_DRY_RUN_ID" --arg sha "$INCIDENT_DRY_RUN_SHA" '
            .id==$id and .name=="Govern Fresh Canonical Audits" and .event=="workflow_dispatch"
            and .head_branch=="main" and .head_sha==$sha and .conclusion=="success" and .run_attempt==1
          ' "$source/dry-run.json" >/dev/null
          jq -e --argjson id "$INCIDENT_FAILED_EXECUTE_RUN_ID" --arg sha "$INCIDENT_FAILED_EXECUTE_SHA" '
            .id==$id and .name=="Govern Fresh Canonical Audits" and .event=="workflow_dispatch"
            and .head_branch=="main" and .head_sha==$sha and .conclusion=="failure" and .run_attempt==1
          ' "$source/failed-run.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_DRY_RUN_ID/artifacts" > "$source/dry-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_FAILED_EXECUTE_RUN_ID/artifacts" > "$source/failed-artifacts.json"
          jq -e --arg name "fresh-canonical-audit-boundary-$INCIDENT_DRY_RUN_ID" \
            --arg digest "$INCIDENT_BOUNDARY_ARTIFACT_DIGEST" '
            [.artifacts[] | select(.name==$name and .expired==false and .digest==$digest)] | length==1
          ' "$source/dry-artifacts.json" >/dev/null
          jq -e --arg name "fresh-canonical-audit-execution-$INCIDENT_FAILED_EXECUTE_RUN_ID" \
            --arg digest "$INCIDENT_FAILED_ARTIFACT_DIGEST" '
            [.artifacts[] | select(.name==$name and .expired==false and .digest==$digest)] | length==1
          ' "$source/failed-artifacts.json" >/dev/null
          gh run download "$INCIDENT_DRY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "fresh-canonical-audit-boundary-$INCIDENT_DRY_RUN_ID" --dir "$source/original-boundary"
          gh run download "$INCIDENT_FAILED_EXECUTE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "fresh-canonical-audit-execution-$INCIDENT_FAILED_EXECUTE_RUN_ID" --dir "$source/failed-execution"
          (cd "$source/original-boundary" && sha256sum --check SHA256SUMS)
          (cd "$source/failed-execution/boundary" && sha256sum --check SHA256SUMS)
          cmp "$source/original-boundary/SHA256SUMS" "$source/failed-execution/boundary/SHA256SUMS"
          test ! -e "$source/failed-execution/execution-proof/proof.json"
          test "$(jq -r .cliVersion "$source/original-boundary/metadata.json")" = "$INCIDENT_EXECUTE_CLI_VERSION"
          test "$(jq -r .cliSha256 "$source/original-boundary/metadata.json")" = "$INCIDENT_EXECUTE_CLI_SHA256"
          jq -e --slurpfile selected "$source/original-boundary/selected-cohort.json" '
            length==$selected[0].count
            and [.[].skillId]==[$selected[0].rows[].skillId]
            and all(.[]; .artifactCreated==true and .artifactRevision==1)
          ' "$source/failed-execution/execution-results.json" >/dev/null
          jq -e --slurpfile selected "$source/original-boundary/selected-cohort.json" \
            --slurpfile results "$source/failed-execution/execution-results.json" '
            [$selected[0].rows[].skillId] as $ids |
            ($results[0] | map({key:.skillId,value:.artifactVersionId}) | from_entries) as $versions |
            [.rows[] | select(.id as $id | $ids | index($id))] as $rows |
            ($rows|length)==($ids|length)
            and all($rows[]; .artifact_revision==1 and .current_artifact_version_id==$versions[.id])
          ' "$source/failed-execution/post-inventory.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_FAILED_EXECUTE_RUN_ID/jobs?filter=latest&per_page=100" \
            > "$source/failed-jobs.json"
          jq -e '
            def job_rows:
              if type=="object" and (.jobs|type)=="array" then .jobs
              elif type=="array" and all(.[]; type=="object" and (.jobs|type)=="array") then [.[].jobs[]]
              elif type=="array" then .
              else error("unsupported jobs response") end;
            job_rows as $jobs |
            [$jobs[] | select(.name=="execute-boundary" and .conclusion=="failure")] | length==1
            and ([$jobs[].steps[] | select(.name=="Execute resumable compound governance, score, and cache closure" and .conclusion=="success")] | length==1)
            and ([$jobs[].steps[] | select(.name=="Fetch exact post-execution artifact and Pack evidence" and .conclusion=="success")] | length==1)
            and ([$jobs[].steps[] | select(.name=="Verify every P0/P1 download, install, NPX, Pack, and MCP channel" and .conclusion=="failure")] | length==1)
            and ([$jobs[].steps[] | select(.name=="Seal successful execute closure for the next cursor" and .conclusion=="skipped")] | length==1)
            and ([$jobs[].steps[] | select(.name=="Upload execution and smoke evidence" and .conclusion=="success")] | length==1)
          ' "$source/failed-jobs.json" >/dev/null
          gh run view "$INCIDENT_FAILED_EXECUTE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed \
            > "$source/failed-smoke.log"
          test "$(grep -Fc '[FAIL][P0]' "$source/failed-smoke.log")" = 1
          test "$(grep -Fc '[PASS]' "$source/failed-smoke.log")" = 20
          grep -F 'expected "0.1.9", got "0.1.10"' "$source/failed-smoke.log" >/dev/null
          cp -a "$source/original-boundary" "$recovery/boundary"
          cp "$source/failed-execution/execution-results.json" "$recovery/execution-results.json"
          cp "$source/failed-execution/post-inventory.json" "$recovery/post-inventory.json"

      - name: Verify production 10 of 10 readback without writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/smoke-recovery-source"
          recovery="$RUNNER_TEMP/fresh-smoke-recovery"
          jq '{schemaVersion:1,scopedSkillIds:[.rows[].skillId],rows:.rows}' \
            "$source/original-boundary/selected-cohort.json" > "$recovery/scope.json"
          node scripts/fetch-artifact-version-inventory.mjs \
            --scope-inventory "$recovery/scope.json" \
            --output "$recovery/recovery-evidence/production-readback.json"
          jq -e --slurpfile results "$recovery/execution-results.json" '
            ($results[0] | map({key:.skillId,value:.}) | from_entries) as $expected |
            [.rows[] | select($expected[.id] != null)] as $rows |
            ($rows|length)==10 and all($rows[];
              .artifact_revision==1
              and .current_artifact_version_id==$expected[.id].artifactVersionId
              and .public_eligibility_audit_id==$expected[.id].auditId
              and .current_quality_score_snapshot_id==$expected[.id].scoreSnapshotId)
          ' "$recovery/recovery-evidence/production-readback.json" >/dev/null

      - name: Generate GitHub App token for immutable smoke harness
        id: smoke-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: skillstore

      - name: Checkout pinned Skillstore structured smoke harness
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: aiskillstore/skillstore
          token: ${{ steps.smoke-app-token.outputs.token }}
          ref: ${{ env.RECOVERY_SMOKE_SHA }}
          path: skillstore-smoke
          fetch-depth: 1

      - name: Verify corrected download, install, NPX, Pack, MCP, and CI channels
        env:
          SMOKE_PUBLIC_CLI_PACKAGES: skillstore@0.1.10,skillstore@latest
          SMOKE_EXPECTED_PUBLIC_CLI_VERSION: '0.1.10'
          SMOKE_EXPECTED_PUBLIC_CLI_INTEGRITY: ${{ env.RECOVERY_PUBLIC_CLI_INTEGRITY }}
          SMOKE_EXPECTED_SIGNING_KEY_ID: EP0Myk7rTk_J0RdG1fvpkP
          SMOKE_EXPECTED_SIGNING_PUBLIC_KEY_X: 2tbC6eNY4T9sx4Pvuo_NwHlXGyWWz95WAtHyHUTqzs8
          SMOKE_EXPECT_INTERACTION_RECOVERY: true
          CI: true
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fresh-smoke-recovery/recovery-evidence"
          test "$(git -C skillstore-smoke rev-parse HEAD)" = "$RECOVERY_SMOKE_SHA"
          sha256sum skillstore-smoke/scripts/smoke/production-smoke.mjs > "$evidence/smoke-runtime.sha256"
          node skillstore-smoke/scripts/smoke/production-smoke.mjs \
            --base-url https://skillstore.io --attempts 3 --retry-ms 3000 \
            --result-file "$evidence/smoke-result.json" 2>&1 | tee "$evidence/smoke.log"

      - name: Seal schema-v2 smoke-only recovery proof for the next cursor
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/smoke-recovery-source"
          recovery="$RUNNER_TEMP/fresh-smoke-recovery"
          evidence="$recovery/recovery-evidence"
          cp "$source/"*.json "$evidence/"
          cp "$source/failed-smoke.log" "$evidence/"
          (cd "$evidence" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          proof="$recovery/execution-proof"
          mkdir -p "$proof"
          jq -n \
            --arg executeRunId "$GITHUB_RUN_ID" --arg dryRunId "$INCIDENT_DRY_RUN_ID" \
            --arg failedExecuteRunId "$INCIDENT_FAILED_EXECUTE_RUN_ID" \
            --arg failedExecuteHeadSha "$INCIDENT_FAILED_EXECUTE_SHA" --arg workflowCommit "$GITHUB_SHA" \
            --arg lastSelected "$(jq -r .lastSelected "$recovery/boundary/selected-cohort.json")" \
            --arg cohortSha256 "$(jq -r .cohortSha256 "$recovery/boundary/metadata.json")" \
            --arg executionResultsSha256 "$(sha256sum "$recovery/execution-results.json" | awk '{print $1}')" \
            --arg postInventorySha256 "$(sha256sum "$recovery/post-inventory.json" | awk '{print $1}')" \
            --arg boundaryManifestSha256 "$(sha256sum "$recovery/boundary/SHA256SUMS" | awk '{print $1}')" \
            --arg recoveryEvidenceManifestSha256 "$(sha256sum "$evidence/SHA256SUMS" | awk '{print $1}')" \
            --arg smokeResultSha256 "$(sha256sum "$evidence/smoke-result.json" | awk '{print $1}')" \
            --arg failedExecutionCliVersion "$INCIDENT_EXECUTE_CLI_VERSION" \
            --arg failedExecutionCliSha256 "$INCIDENT_EXECUTE_CLI_SHA256" \
            --arg failedSmokeExpectedPublicCliVersion "$INCIDENT_FAILED_SMOKE_CLI_VERSION" \
            --arg smokeCommit "$RECOVERY_SMOKE_SHA" --arg publicCliVersion "$RECOVERY_PUBLIC_CLI_VERSION" \
            --arg publicCliIntegrity "$RECOVERY_PUBLIC_CLI_INTEGRITY" --argjson executedCount 10 \
            '{schemaVersion:2,producerKind:"fresh_canonical_audit_smoke_recovery",status:"fresh_canonical_audit_execution_complete",executeRunId:$executeRunId,dryRunId:$dryRunId,failedExecuteRunId:$failedExecuteRunId,failedExecuteHeadSha:$failedExecuteHeadSha,workflowCommit:$workflowCommit,lastSelected:$lastSelected,cohortSha256:$cohortSha256,executedCount:$executedCount,executionResultsSha256:$executionResultsSha256,postInventorySha256:$postInventorySha256,boundaryManifestSha256:$boundaryManifestSha256,recoveryEvidenceManifestSha256:$recoveryEvidenceManifestSha256,smokeResultSha256:$smokeResultSha256,failedExecutionCli:{version:$failedExecutionCliVersion,sha256:$failedExecutionCliSha256},failedSmokeExpectedPublicCliVersion:$failedSmokeExpectedPublicCliVersion,recoveryRuntime:{smokeCommit:$smokeCommit,publicCliVersion:$publicCliVersion,publicCliIntegrity:$publicCliIntegrity},scoreFinalized:true,timestampFinalized:true,cacheClosureCompleted:true,packClosureCompleted:true,productionSmokeCompleted:true}' \
            > "$proof/proof.json"
          (cd "$proof" && sha256sum proof.json > SHA256SUMS)

      - name: Upload smoke-only recovery evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fresh-canonical-audit-execution-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/fresh-smoke-recovery/boundary/
            ${{ runner.temp }}/fresh-smoke-recovery/execution-results.json
            ${{ runner.temp }}/fresh-smoke-recovery/post-inventory.json
            ${{ runner.temp }}/fresh-smoke-recovery/recovery-evidence/
            ${{ runner.temp }}/fresh-smoke-recovery/execution-proof/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified smoke-only recovery summary
        run: |
          {
            echo '## Fresh canonical audit smoke closure recovered'
            echo "- Frozen boundary: \`$INCIDENT_DRY_RUN_ID\`"
            echo "- Failed execute: \`$INCIDENT_FAILED_EXECUTE_RUN_ID\`"
            echo '- Durable governance, score, and cache readback: `10/10`.'
            echo '- Recovery ran no governance RPC, score recalculation, or cache invalidation.'
          } >> "$GITHUB_STEP_SUMMARY"
