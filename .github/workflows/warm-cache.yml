name: Warm KV Cache

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'warm = verify/fill, force = invalidate then verify, invalidate = remove selected cache entries only'
        required: true
        type: choice
        options:
          - warm
          - force
          - invalidate
        default: warm
      scope:
        description: 'Warm only an explicit changed or high-traffic Skill set'
        required: true
        type: choice
        options:
          - changed
          - high-traffic
        default: changed
      slugs:
        description: 'Changed or high-traffic skill slugs (comma/space separated)'
        required: false
        type: string
        default: ''
      locales:
        description: 'Allowlisted locales to warm (comma/space separated); automatic callers should pass only the affected locales'
        required: false
        type: string
        default: 'en'
      source_run_id:
        description: 'Source workflow run containing the synced-slugs artifact (changed scope only)'
        required: false
        type: string
        default: ''
      request_budget:
        description: 'Hard cap for warm verification HTTP requests, including retries and build probes (1-128)'
        required: true
        type: string
        default: '128'
      byte_budget:
        description: 'Hard cap for downloaded response bytes (1-33554432)'
        required: true
        type: string
        default: '20971520'
      expected_build_token:
        description: 'Optional exact x-skillstore-build value for deployment-specific warming'
        required: false
        type: string
        default: ''
      warm_zip:
        description: 'Also verify the ZIP cache after API and HTML caches'
        required: false
        type: boolean
        default: false

concurrency:
  group: warm-cache
  cancel-in-progress: false

env:
  SITE_URL: https://skillstore.io
  SUPPORTED_LOCALES: 'en zh-hans zh-hant ja ko de fr es pt ru ar'
  CONCURRENCY: 4
  MAX_FORCE_INVALIDATION_SLUGS: 25
  INVALIDATE_BATCH_SIZE: 1
  BUILD_HEADER: x-skillstore-build
  API_CACHE_HEADER: x-api-kv-cache
  PAGE_CACHE_HEADER: x-page-kv-cache
  CACHE_WRITE_HEADER: x-kv-write
  CACHE_KEY_HEADER: x-kv-key
  CACHE_VERSION_HEADER: x-kv-version

jobs:
  warm:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - name: Checkout cache tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            .github/actions
            scripts

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Download changed slugs from source workflow
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: synced-slugs
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Resolve and validate warm scope
        id: scope
        env:
          SCOPE: ${{ inputs.scope }}
          MODE: ${{ inputs.mode }}
          INPUT_SLUGS: ${{ inputs.slugs }}
          INPUT_LOCALES: ${{ inputs.locales }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          REQUEST_BUDGET: ${{ inputs.request_budget }}
          BYTE_BUDGET: ${{ inputs.byte_budget }}
          WARM_ZIP: ${{ inputs.warm_zip }}
        run: |
          set -euo pipefail

          if ! [[ "$CONCURRENCY" =~ ^[1-9][0-9]*$ ]] || [ "$CONCURRENCY" -gt 4 ]; then
            echo "::error::concurrency must be a positive integer no greater than 4"
            exit 1
          fi
          if ! [[ "$REQUEST_BUDGET" =~ ^[1-9][0-9]*$ ]] || [ "$REQUEST_BUDGET" -gt 128 ]; then
            echo "::error::request_budget must be an integer between 1 and 128"
            exit 1
          fi
          if ! [[ "$BYTE_BUDGET" =~ ^[1-9][0-9]*$ ]] || [ "$BYTE_BUDGET" -gt 33554432 ]; then
            echo "::error::byte_budget must be an integer between 1 and 33554432"
            exit 1
          fi
          if [ "$WARM_ZIP" != "true" ] && [ "$WARM_ZIP" != "false" ]; then
            echo "::error::warm_zip must be true or false"
            exit 1
          fi
          if [ "$MODE" != "warm" ] && [ "$WARM_ZIP" = "true" ]; then
            echo "::error::force/invalidate modes do not invalidate immutable ZIP artifacts; run ZIP verification separately in warm mode"
            exit 1
          fi

          LOCALES_FILE="$RUNNER_TEMP/warm-cache-locales.txt"
          printf '%s\n' "$INPUT_LOCALES" | tr ',[:space:]' '\n' | sed '/^$/d' | sort -u > "$LOCALES_FILE"
          if [ ! -s "$LOCALES_FILE" ]; then
            echo "::error::locales must contain at least one supported locale"
            exit 1
          fi
          while IFS= read -r locale; do
            case " $SUPPORTED_LOCALES " in
              *" $locale "*) ;;
              *)
                echo "::error::Unsupported locale: $locale"
                exit 1
                ;;
            esac
          done < "$LOCALES_FILE"
          RESOLVED_LOCALES=$(tr '\n' ' ' < "$LOCALES_FILE" | sed 's/ $//')

          WORK_DIR="$RUNNER_TEMP/warm-cache"
          mkdir -p "$WORK_DIR"
          SLUGS_FILE="$WORK_DIR/skills-slugs.txt"
          : > "$SLUGS_FILE"

          normalize_slugs() {
            tr ',[:space:]' '\n' | sed '/^$/d' | sort -u
          }

          if [ -n "$SOURCE_RUN_ID" ]; then
            if [ "$SCOPE" != "changed" ]; then
              echo "::error::source_run_id is only valid for changed scope"
              exit 1
            fi
            if [ ! -f synced-slugs.txt ]; then
              echo "::error::synced-slugs artifact is missing synced-slugs.txt"
              exit 1
            fi
            normalize_slugs < synced-slugs.txt > "$SLUGS_FILE"
          else
            printf '%s\n' "$INPUT_SLUGS" | normalize_slugs > "$SLUGS_FILE"
          fi

          SLUG_COUNT=$(grep -c . "$SLUGS_FILE" || true)
          if [ "$SLUG_COUNT" -eq 0 ]; then
            echo "::error::Warm scope is empty. Supply an explicit changed or high-traffic Skill set."
            exit 1
          fi
          if [ "$MODE" != "warm" ] && [ "$SLUG_COUNT" -gt "$MAX_FORCE_INVALIDATION_SLUGS" ]; then
            echo "::error::Invalidation is limited to $MAX_FORCE_INVALIDATION_SLUGS skills per run; resolved $SLUG_COUNT"
            exit 1
          fi
          LOCALE_COUNT=$(grep -c . "$LOCALES_FILE")
          MINIMUM_REQUESTS=0
          if [ "$MODE" != "invalidate" ]; then
            MINIMUM_REQUESTS=$((2 + SLUG_COUNT * LOCALE_COUNT * 6))
            if [ "$WARM_ZIP" = "true" ]; then
              MINIMUM_REQUESTS=$((MINIMUM_REQUESTS + SLUG_COUNT * 3))
            fi
          fi
          if [ "$MINIMUM_REQUESTS" -gt "$REQUEST_BUDGET" ]; then
            echo "::error::Resolved scope needs at least $MINIMUM_REQUESTS requests for complete cache verification, above request_budget=$REQUEST_BUDGET"
            exit 1
          fi

          echo "Resolved $SLUG_COUNT skill(s) for scope $SCOPE"
          echo "slugs_file=$SLUGS_FILE" >> "$GITHUB_OUTPUT"
          echo "slug_count=$SLUG_COUNT" >> "$GITHUB_OUTPUT"
          echo "locales=$RESOLVED_LOCALES" >> "$GITHUB_OUTPUT"

      - name: Invalidate selected skill caches
        if: inputs.mode != 'warm'
        uses: ./.github/actions/invalidate-cache
        with:
          type: skills
          slugs-file: ${{ steps.scope.outputs.slugs_file }}
          secret: ${{ secrets.CACHE_INVALIDATE_SECRET }}
          batch-size: ${{ env.INVALIDATE_BATCH_SIZE }}
          concurrency: '1'
          invalidate-artifacts: ${{ inputs.mode == 'invalidate' }}
          invalidate-dependent-packs: ${{ inputs.mode == 'invalidate' }}
          fail-on-error: 'true'

      - name: Warm and verify API, HTML, and optional ZIP caches
        if: inputs.mode != 'invalidate'
        env:
          SLUGS_FILE: ${{ steps.scope.outputs.slugs_file }}
          REQUEST_BUDGET: ${{ inputs.request_budget }}
          BYTE_BUDGET: ${{ inputs.byte_budget }}
          EXPECTED_BUILD_TOKEN: ${{ inputs.expected_build_token }}
          WARM_ZIP: ${{ inputs.warm_zip }}
          WARM_MODE: ${{ inputs.mode }}
          WARM_SCOPE: ${{ inputs.scope }}
          LOCALES: ${{ steps.scope.outputs.locales }}
        run: |
          set -euo pipefail

          REPORT="$RUNNER_TEMP/warm-cache-report.jsonl"
          SUMMARY="$RUNNER_TEMP/warm-cache-summary.json"
          args=(
            --slugs-file "$SLUGS_FILE"
            --site-url "$SITE_URL"
            --locales "$LOCALES"
            --concurrency "$CONCURRENCY"
            --request-budget "$REQUEST_BUDGET"
            --byte-budget "$BYTE_BUDGET"
            --mode "$WARM_MODE"
            --scope "$WARM_SCOPE"
            --build-header "$BUILD_HEADER"
            --api-cache-header "$API_CACHE_HEADER"
            --page-cache-header "$PAGE_CACHE_HEADER"
            --cache-write-header "$CACHE_WRITE_HEADER"
            --cache-key-header "$CACHE_KEY_HEADER"
            --cache-version-header "$CACHE_VERSION_HEADER"
            --report "$REPORT"
            --summary "$SUMMARY"
          )
          if [ -n "$EXPECTED_BUILD_TOKEN" ]; then
            args+=(--expected-build-token "$EXPECTED_BUILD_TOKEN")
          fi
          if [ "$WARM_ZIP" = "true" ]; then
            args+=(--warm-zip)
          fi

          node scripts/warm-skill-cache.mjs "${args[@]}"

      - name: Upload warm verification evidence
        if: always() && inputs.mode != 'invalidate'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: warm-cache-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/warm-cache-report.jsonl
            ${{ runner.temp }}/warm-cache-summary.json
          if-no-files-found: warn
          retention-days: 14
