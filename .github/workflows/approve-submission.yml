# Manual Approval Workflow for Large Submissions
#
# This workflow processes submissions that require admin approval:
# - Repos with >50 skills
# - Repos flagged by security checks
#
# Triggered manually by repository admins via workflow_dispatch.
# Uses GitHub Environment protection rules for additional approval gate.

name: Approve & Process Submission

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: 'Submission ID to approve and process'
        required: true
        type: string
      github_url:
        description: 'GitHub URL (auto-filled from submission)'
        required: true
        type: string
      review_issue_url:
        description: 'Marketplace review issue URL for submitter notifications'
        required: false
        type: string
        default: ''
      review_issue_number:
        description: 'Marketplace review issue number for submitter notifications'
        required: false
        type: string
        default: ''
      model:
        description: 'Model to use (e.g., gpt-5.5:high, claude-sonnet-4.6)'
        required: false
        type: string
        default: ''
      cli_version:
        description: 'CLI version (default: latest)'
        required: false
        type: string
        default: 'latest'
      max_parallel:
        description: 'Max parallel shards (default: 6)'
        type: string
        default: '6'

env:
  SUBMISSION_ID: ${{ inputs.submission_id }}
  GITHUB_URL: ${{ inputs.github_url }}
  REVIEW_ISSUE_URL: ${{ inputs.review_issue_url }}
  REVIEW_ISSUE_NUMBER: ${{ inputs.review_issue_number }}

concurrency:
  group: approve-submission-${{ inputs.submission_id }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # JOB 1: APPROVAL GATE
  # Requires manual approval in GitHub UI via environment protection
  # ============================================================
  approve:
    runs-on: self-hosted
    timeout-minutes: 1440  # 24 hours for manual approval wait
    environment: production  # Requires manual approval configured in repo settings
    steps:
      - name: Record approval
        run: |
          echo "✅ Submission ${{ inputs.submission_id }} approved by ${{ github.actor }}"
          echo "URL: ${{ inputs.github_url }}"

      - name: Notify skillstore - Approved
        env:
          SKILLSTORE_API_URL: ${{ secrets.SKILLSTORE_API_URL }}
          SKILLSTORE_CALLBACK_TOKEN: ${{ secrets.SKILLSTORE_CALLBACK_TOKEN }}
        run: |
          PAYLOAD=$(jq -n \
            --arg submission_id "${{ inputs.submission_id }}" \
            --arg approved_by "${{ github.actor }}" \
            --arg workflow_run_id "${{ github.run_id }}" \
            --arg workflow_run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg review_issue_url "$REVIEW_ISSUE_URL" \
            --arg review_issue_number "$REVIEW_ISSUE_NUMBER" \
            '{
              submission_id: $submission_id,
              event: "approved",
              approved_by: $approved_by,
              workflow_run_id: ($workflow_run_id | tonumber),
              workflow_run_url: $workflow_run_url
            }
            + (if $review_issue_url != "" then { issue_url: $review_issue_url } else {} end)
            + (if $review_issue_number != "" then { issue_number: ($review_issue_number | tonumber) } else {} end)')

          curl -sS -X POST "$SKILLSTORE_API_URL/api/submit/callback" \
            -H "Authorization: Bearer $SKILLSTORE_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions/SkillstoreBot" \
            -H "X-Skillstore-Callback: true" \
            -d "$PAYLOAD" || echo "::warning::Failed to notify skillstore"

  # ============================================================
  # JOB 2: PROCESS SKILLS (Reusable Workflow)
  # Discovers, processes, and creates PR for approved submission
  # ============================================================
  process-skills:
    needs: approve
    uses: ./.github/workflows/reusable-process-skills.yml
    with:
      github_url: ${{ inputs.github_url }}
      submission_id: ${{ inputs.submission_id }}
      model: ${{ inputs.model }}
      cli_version: ${{ inputs.cli_version }}
      max_parallel: ${{ inputs.max_parallel }}
      is_manual_approval: true
      approved_by: ${{ github.actor }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      SKILLSTORE_AGENTS: ${{ vars.SKILLSTORE_AGENTS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SKILLSTORE_API_URL: ${{ secrets.SKILLSTORE_API_URL }}
      SKILLSTORE_CALLBACK_TOKEN: ${{ secrets.SKILLSTORE_CALLBACK_TOKEN }}

  # ============================================================
  # JOB 3: NOTIFICATIONS AND SUMMARY
  # Sends callbacks to skillstore API and creates workflow summary
  # ============================================================
  notify:
    needs: [approve, process-skills]
    if: always()
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Notify skillstore - PR created
        if: needs.process-skills.outputs.pr_url
        env:
          PR_URL: ${{ needs.process-skills.outputs.pr_url }}
          PROCESSED_COUNT: ${{ needs.process-skills.outputs.processed_count }}
          HIGHEST_RISK: ${{ needs.process-skills.outputs.highest_risk }}
        run: |
          curl -sS -X POST "${{ secrets.SKILLSTORE_API_URL }}/api/submit/callback" \
            -H "Authorization: Bearer ${{ secrets.SKILLSTORE_CALLBACK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions/SkillstoreBot" \
            -H "X-Skillstore-Callback: true" \
            -d '{
              "submission_id": "'"${{ env.SUBMISSION_ID }}"'",
              "event": "pr_created",
              "pr_url": "'"$PR_URL"'",
              "processed_count": '"$PROCESSED_COUNT"',
              "approved_by": "'"${{ github.actor }}"'",
              "workflow_run_id": ${{ github.run_id }},
              "workflow_run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' || echo "::warning::Failed to notify skillstore"

      - name: Notify skillstore - Completed without PR
        if: needs.process-skills.result == 'success' && needs.process-skills.outputs.outcome == 'no_op'
        env:
          REASON_CODE: ${{ needs.process-skills.outputs.outcome_reason }}
        run: |
          curl -sS -X POST "${{ secrets.SKILLSTORE_API_URL }}/api/submit/callback" \
            -H "Authorization: Bearer ${{ secrets.SKILLSTORE_CALLBACK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions/SkillstoreBot" \
            -H "X-Skillstore-Callback: true" \
            -d '{
              "submission_id": "'"${{ env.SUBMISSION_ID }}"'",
              "event": "completed",
              "reason_code": "'"$REASON_CODE"'",
              "processed_count": 0,
              "approved_by": "'"${{ github.actor }}"'",
              "workflow_run_id": ${{ github.run_id }},
              "workflow_run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' || echo "::warning::Failed to notify skillstore"

      - name: Notify skillstore - Rejected because all targets exist
        if: needs.process-skills.result == 'success' && needs.process-skills.outputs.outcome == 'rejected'
        env:
          REASON_CODE: ${{ needs.process-skills.outputs.outcome_reason }}
          SELECTED_COUNT: ${{ needs.process-skills.outputs.selected_count }}
          EXISTING_TARGETS: ${{ needs.process-skills.outputs.existing_targets }}
          SKILLSTORE_API_URL: ${{ secrets.SKILLSTORE_API_URL }}
          SKILLSTORE_CALLBACK_TOKEN: ${{ secrets.SKILLSTORE_CALLBACK_TOKEN }}
        run: |
          set -euo pipefail
          REASON="$REASON_CODE: count=$SELECTED_COUNT; targets=$EXISTING_TARGETS"
          PAYLOAD=$(jq -n \
            --arg submission_id "${{ env.SUBMISSION_ID }}" \
            --arg reason_code "$REASON_CODE" \
            --arg reason "$REASON" \
            --arg approved_by "${{ github.actor }}" \
            --arg workflow_run_id "${{ github.run_id }}" \
            --arg workflow_run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              submission_id: $submission_id,
              event: "rejected",
              outcome: "rejected",
              reason_code: $reason_code,
              reason: $reason,
              processed_count: 0,
              approved_by: $approved_by,
              workflow_run_id: ($workflow_run_id | tonumber),
              workflow_run_url: $workflow_run_url
            }')
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 --retry-max-time 120 --retry-connrefused \
            --connect-timeout 10 --max-time 30 \
            -X POST "$SKILLSTORE_API_URL/api/submit/callback" \
            -H "Authorization: Bearer $SKILLSTORE_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions/SkillstoreBot" \
            -H "X-Skillstore-Callback: true" \
            -d "$PAYLOAD"

      - name: Notify skillstore - Failed
        if: needs.process-skills.result == 'failure'
        env:
          SKILLSTORE_API_URL: ${{ secrets.SKILLSTORE_API_URL }}
          SKILLSTORE_CALLBACK_TOKEN: ${{ secrets.SKILLSTORE_CALLBACK_TOKEN }}
        run: |
          PAYLOAD=$(jq -n \
            --arg submission_id "${{ env.SUBMISSION_ID }}" \
            --arg error_message "Processing workflow failed. Check GitHub Actions log for details." \
            --arg workflow_run_id "${{ github.run_id }}" \
            --arg workflow_run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg review_issue_url "$REVIEW_ISSUE_URL" \
            --arg review_issue_number "$REVIEW_ISSUE_NUMBER" \
            '{
              submission_id: $submission_id,
              event: "failed",
              error_message: $error_message,
              workflow_run_id: ($workflow_run_id | tonumber),
              workflow_run_url: $workflow_run_url
            }
            + (if $review_issue_url != "" then { issue_url: $review_issue_url } else {} end)
            + (if $review_issue_number != "" then { issue_number: ($review_issue_number | tonumber) } else {} end)')

          curl -sS -X POST "$SKILLSTORE_API_URL/api/submit/callback" \
            -H "Authorization: Bearer $SKILLSTORE_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions/SkillstoreBot" \
            -H "X-Skillstore-Callback: true" \
            -d "$PAYLOAD" || echo "::warning::Failed to notify skillstore"

      - name: Summary
        if: always()
        env:
          PR_URL: ${{ needs.process-skills.outputs.pr_url }}
          PROCESSED_COUNT: ${{ needs.process-skills.outputs.processed_count }}
          HIGHEST_RISK: ${{ needs.process-skills.outputs.highest_risk }}
          OUTCOME: ${{ needs.process-skills.outputs.outcome }}
          OUTCOME_REASON: ${{ needs.process-skills.outputs.outcome_reason }}
          EXISTING_TARGETS: ${{ needs.process-skills.outputs.existing_targets }}
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## Processing Summary (Manual Approval)

          **Source**: ${{ env.GITHUB_URL }}
          **Submission ID**: \`${{ env.SUBMISSION_ID }}\`
          **Approved by**: @${{ github.actor }}

          | Metric | Value |
          |--------|-------|
          | Workflow Status | ${{ needs.process-skills.result }} |
          | Successfully Processed | ${PROCESSED_COUNT:-N/A} |
          | Highest Risk | ${HIGHEST_RISK:-N/A} |
          | Business Outcome | ${OUTCOME:-N/A} |
          | Outcome Reason | ${OUTCOME_REASON:-N/A} |

          EOF

          if [ -n "$EXISTING_TARGETS" ]; then
            echo "Existing targets: \`$EXISTING_TARGETS\`" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$PR_URL" ]; then
            echo "🔗 **PR Created**: $PR_URL" >> $GITHUB_STEP_SUMMARY
          fi
