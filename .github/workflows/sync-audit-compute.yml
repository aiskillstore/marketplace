name: Sync Audit Compute Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'

permissions:
  contents: read

concurrency:
  group: sync-audit-compute
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      HELM_BASE_URL: https://helm.easymeta.au/v1
      HELM_API_KEY: ${{ secrets.HELM_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      LEGACY_TOKENS: '1308077250'
      LEGACY_COST_USD: '2568.41704016099988706'
      AUDIT_READ_MAX_ATTEMPTS: '3'
      AUDIT_READ_RETRY_BASE_SECONDS: '2'
    steps:
      - name: Checkout research refresh helper
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/fetch-audit-compute-usage.sh
            scripts/refresh-security-research-stats.sh
          sparse-checkout-cone-mode: false

      - name: Sync audit compute snapshot
        id: sync-compute
        run: |
          set -euo pipefail

          for name in HELM_API_KEY SUPABASE_URL SUPABASE_SERVICE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

          helm_base="${HELM_BASE_URL%/}"
          if [[ "$helm_base" == */v1 ]]; then
            helm_usage_url="$helm_base/usage/stats"
          else
            helm_usage_url="$helm_base/v1/usage/stats"
          fi

          helm_usage_json="$(./scripts/fetch-audit-compute-usage.sh "$helm_usage_url")"

          validated_totals="$(
            HELM_USAGE_JSON="$helm_usage_json" python3 - <<'PY'
          import json
          import math
          import os

          def reject_nonstandard_number(value):
              raise ValueError(f"non-standard JSON number: {value}")

          data = json.loads(
              os.environ["HELM_USAGE_JSON"],
              parse_constant=reject_nonstandard_number,
          )
          if not isinstance(data, dict):
              raise SystemExit("Helm usage API response must be an object")
          if data.get("object") != "usage_stats":
              raise SystemExit("Helm usage API returned an unexpected object")

          if "totals" not in data or not isinstance(data["totals"], dict):
              raise SystemExit("Helm usage API totals must exist and be an object")
          totals = data["totals"]
          for field in ("total_tokens", "cost_usd"):
              if field not in totals:
                  raise SystemExit(f"Helm usage API totals missing {field}")

          total_tokens = totals["total_tokens"]
          if (
              type(total_tokens) is not int
              or total_tokens < 0
              or total_tokens > 9223372036854775807
          ):
              raise SystemExit("Helm total_tokens must be a signed 64-bit nonnegative integer")

          cost_usd = totals["cost_usd"]
          if type(cost_usd) not in (int, float) or cost_usd < 0:
              raise SystemExit("Helm cost_usd must be a nonnegative number")
          try:
              cost_is_finite = math.isfinite(cost_usd)
          except OverflowError:
              cost_is_finite = False
          if not cost_is_finite:
              raise SystemExit("Helm cost_usd must be finite and representable")

          print(total_tokens, cost_usd)
          PY
          )"
          read -r helm_tokens helm_cost <<<"$validated_totals"

          captured_at="$(date -u +%F)"
          note="Helm API usage stats + legacy claude-relay baseline, list-price equivalent"

          rpc_payload="$(
            CAPTURED_AT="$captured_at" \
            HELM_TOKENS="$helm_tokens" \
            HELM_COST="$helm_cost" \
            LEGACY_TOKENS="$LEGACY_TOKENS" \
            LEGACY_COST_USD="$LEGACY_COST_USD" \
            NOTE="$note" \
            python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "p_captured_at": os.environ["CAPTURED_AT"],
              "p_helm_tokens": int(os.environ["HELM_TOKENS"]),
              "p_helm_cost_usd": float(os.environ["HELM_COST"]),
              "p_relay_tokens": int(os.environ["LEGACY_TOKENS"]),
              "p_relay_cost_usd": float(os.environ["LEGACY_COST_USD"]),
              "p_note": os.environ["NOTE"],
          }, allow_nan=False))
          PY
          )"

          supabase_base="${SUPABASE_URL%/}"
          response="$(
            curl --disable \
              --fail --silent --show-error \
              --proto '=https' \
              --proto-redir '=https' \
              --tlsv1.2 \
              --retry 0 \
              --connect-timeout 30 \
              --max-time 120 \
              --request POST "$supabase_base/rest/v1/rpc/record_audit_compute_snapshot" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -H "Content-Type: application/json" \
              -H "Accept-Profile: skillstore" \
              -H "Content-Profile: skillstore" \
              --data "$rpc_payload"
          )"

          total_tokens="$(python3 -c "print(int('$helm_tokens') + int('$LEGACY_TOKENS'))")"
          total_cost="$(python3 -c "print(round(float('$helm_cost') + float('$LEGACY_COST_USD')))")"

          {
            echo "## Audit Compute Snapshot"
            echo ""
            echo "- Captured at: \`$captured_at\`"
            echo "- Helm: \`$helm_tokens\` tokens / \`$helm_cost\` USD"
            echo "- Legacy baseline: \`$LEGACY_TOKENS\` tokens / \`$LEGACY_COST_USD\` USD"
            echo "- Public total: \`$total_tokens\` tokens / \`$total_cost\` USD"
            echo "- RPC response: \`$response\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh security research snapshot
        id: security-research-refresh
        continue-on-error: true
        env:
          SKILLSTORE_API_URL: https://skillstore.io
          SECURITY_RESEARCH_AUTOMATION_KEY: ${{ secrets.SECURITY_RESEARCH_AUTOMATION_KEY }}
        run: ./scripts/refresh-security-research-stats.sh

      - name: Report security research refresh failure
        if: steps.sync-compute.outcome == 'success' && steps.security-research-refresh.outcome == 'failure'
        run: |
          echo "::warning::Audit compute snapshot sync succeeded, but the security research snapshot refresh failed"
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Security Research Refresh Warning

          The audit-compute snapshot remains committed. The dedicated refresh endpoint failed after bounded retries; the stale-only safety-net workflow will retry without replaying the compute sync.
          EOF
