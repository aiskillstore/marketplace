name: Pack Review

on:
  issue_comment:
    types: [created]

jobs:
  process-command:
    # Skip bot comments (the callback posts its own "⏳ Generation started" notice as
    # the App, which would otherwise re-trigger this job). Human comments are
    # trimmed and command-checked inside the script so leading blank lines before
    # /generate or /approve do not silently skip the workflow.
    if: >-
      (contains(github.event.issue.labels.*.name, 'pack-review') ||
       contains(github.event.issue.labels.*.name, 'plugin-review')) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Process command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CALLBACK_URL: ${{ secrets.SKILLSTORE_API_URL }}/api/packs/review/callback
          CALLBACK_SECRET: ${{ secrets.SKILLSTORE_CALLBACK_TOKEN }}
        with:
          script: |
            const comment = context.payload.comment.body.trim();
            const knownCommands = ['/generate', '/approve', '/regenerate', '/reject'];
            if (!knownCommands.some((command) => comment.startsWith(command))) {
              console.log(`Not a recognized command: ${comment.substring(0, 50)}`);
              return;
            }
            // Usage guides can contain an immutable Pack-production DAG marker.
            // The legacy callback cannot prove or preserve that binding, so it
            // may never accept an inline guide replacement for any Pack.
            if (comment.startsWith('/approve') && /(?:^|\s)--guide(?:\s|=)/.test(comment)) {
              core.setFailed('/approve --guide is disabled; immutable usage guides must use a binding-aware API');
              return;
            }

            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor
            });
            if (!['admin', 'write'].includes(perm.permission)) {
              core.setFailed('Insufficient permissions');
              return;
            }

            const issueBody = context.payload.issue.body;
            const isPackProductionV4 = /Pack Production Generation|Generation ID|skillstore\.pack-evaluation\/v4/i.test(issueBody);
            if (
              isPackProductionV4
              && ['/generate', '/approve', '/regenerate'].some((command) => comment.startsWith(command))
            ) {
              core.setFailed('Pack Production v4 can only be published by the generation-bound production workflow');
              return;
            }

            // Extract pack ID from issue body. Tolerate legacy Plugin ID rows
            // from issues opened before the product rename.
            const packIdMatch = issueBody.match(/(?:Pack|Plugin) ID[^`]*`([^`]+)`/);
            if (!packIdMatch) {
              console.log('Pack ID not found in issue body');
              return;
            }
            const packId = packIdMatch[1];
            console.log(`Processing command for pack: ${packId}`);

            let event, payload;

            if (comment.startsWith('/generate')) {
              event = 'generate';
              payload = { packId };
            } else if (comment.startsWith('/approve')) {
              event = 'approve';
              payload = {
                packId,
                approvedBy: context.actor,
                modifiedGuide: null
              };
            } else if (comment.startsWith('/regenerate')) {
              event = 'regenerate';
              payload = {
                packId,
                coverOnly: comment.includes('--cover'),
                guideOnly: comment.includes('--guide')
              };
            } else if (comment.startsWith('/reject')) {
              event = 'reject';
              const reason = comment.replace('/reject', '').trim();
              payload = {
                packId,
                rejectedBy: context.actor,
                reason: reason || 'No reason provided'
              };
            } else {
              console.log(`Not a recognized command: ${comment.substring(0, 50)}`);
              return; // Not a recognized command
            }

            console.log(`Event: ${event}, Payload: ${JSON.stringify(payload)}`);

            // Call skillstore callback API
            const callbackUrl = process.env.CALLBACK_URL;
            const callbackSecret = process.env.CALLBACK_SECRET;

            if (!callbackUrl || !callbackSecret) {
              core.setFailed('SKILLSTORE_CALLBACK_URL or SKILLSTORE_CALLBACK_SECRET not configured');
              return;
            }

            try {
              const response = await fetch(callbackUrl, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${callbackSecret}`
                },
                body: JSON.stringify({ event, ...payload, issueNumber: context.issue.number })
              });

              const responseText = await response.text();
              console.log(`Callback response: ${response.status} - ${responseText}`);

              // A legacy review issue can outlive the Pack it referred to. The
              // callback has already proved that no mutable Pack exists, so a
              // structured Pack-not-found response is a terminal no-op rather
              // than a retryable command failure. Keep every other 404/error
              // fail-closed: an unexpected route or response must remain
              // visible to reviewers.
              let callbackError = null;
              try {
                callbackError = JSON.parse(responseText);
              } catch {
                // Non-JSON error bodies are never safe to downgrade.
              }
              const isMissingLegacyPack = response.status === 404
                && callbackError?.message === 'Pack not found';
              if (isMissingLegacyPack) {
                core.notice(`Callback no-op: legacy Pack ${packId} no longer exists`);
                return;
              }

              if (!response.ok) {
                core.setFailed(`Callback failed: ${response.status} - ${responseText}`);
                // Add failure reaction
                await github.rest.reactions.createForIssueComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: context.payload.comment.id,
                  content: '-1'
                });
                return;
              }

              // Add success reaction
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: '+1'
              });

            } catch (error) {
              core.setFailed(`Callback request failed: ${error.message}`);
              // Add failure reaction
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: '-1'
              });
            }
