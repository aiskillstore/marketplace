name: Reconcile submission provider sync
run-name: ${{ inputs.recovery_run_ids != '' && format('Reconcile bounded submission push {0} using recoveries {1}', inputs.failed_run_id, inputs.recovery_run_ids) || inputs.audit_pr != '' && format('Reconcile audit push {0} using recovery {1} and PR {2}', inputs.failed_run_id, inputs.recovery_run_id, inputs.audit_pr) || format('Reconcile submission push {0} using recovery {1}', inputs.failed_run_id, inputs.recovery_run_id) }}
on:
  workflow_dispatch:
    inputs:
      audit_pr:
        description: 'Optional merged report-only audit PR; verifies full repaired range without replay'
        type: string
        default: ''
      failed_run_id:
        description: Exact failed publication or blocked audit push sync run
        type: string
        required: true
      recovery_run_ids:
        description: 'Opt-in bounded recovery: exact comma-separated completed runs; verifies all providers then sends one full published callback'
        type: string
        default: ''
      recovery_run_id:
        description: Exact successful provider recovery or same-SHA cache-only warm recovery run
        type: string
        default: ''
      score_recovery_run_id:
        description: 'Optional exact scoring run after provider and callback completed; recovery_run_id must be the later same-SHA warm run'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write
concurrency:
  group: submission-provider-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Verify exact recovery and provider state
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RECOVERY_RUN_IDS: ${{ inputs.recovery_run_ids }}
          SCORE_RECOVERY_RUN_ID: ${{ inputs.score_recovery_run_id }}
          SKILLSTORE_API_URL: ${{ secrets.SKILLSTORE_API_URL }}
          SKILLSTORE_CALLBACK_TOKEN: ${{ secrets.SKILLSTORE_CALLBACK_TOKEN }}
          AUDIT_PR: ${{ inputs.audit_pr }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$RECOVERY_RUN_IDS" ]; then
            test -z "$SCORE_RECOVERY_RUN_ID"
            node scripts/bounded-submission-recovery.mjs finalize
          else
            node scripts/reconcile-submission-sync.mjs
          fi
      - name: Record separate reconciliation result
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          PUBLICATION_SHA: ${{ steps.verify.outputs.publication_sha }}
        run: |
          set -euo pipefail
          [[ "$FAILED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PUBLICATION_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PUBLICATION_SHA" \
            -f state=success \
            -f context="agentcrew/provider-reconciliation/$FAILED_RUN_ID" \
            -f description='Exact recovery verified without provider replay' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
