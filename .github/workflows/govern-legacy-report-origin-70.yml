name: Govern Legacy Report-Origin V2-Only

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Recover the exact sealed post-score incident'
        type: choice
        required: true
        default: recover-post-score
        options: [recover-post-score]
      dry_run_id:
        description: 'Exact successful dry-run run ID'
        type: string
        required: true
      failed_execute_run_id:
        description: 'Exact cancelled execute run ID'
        type: string
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: artifact-version-backfill-production
  cancel-in-progress: false

env:
  ORIGIN_CLI_VERSION: '2.15.9'
  # Production is intentionally impossible until the released linux-x64 binary
  # has been audited and this placeholder is replaced by its exact SHA-256.
  ORIGIN_CLI_SHA256: '9a980bbb9574dd3da976803264796dd3ba57d15bafde5645afe6fe5783e5e9ec'
  RECOVERY_CLI_VERSION: '2.15.10'
  RECOVERY_CLI_SHA256: '2ea8ef90fcb890b83b1cf1bd772bd02da3fff98bc8f5162c481287552518bdd8'
  INCIDENT_DRY_RUN_ID: '29781656344'
  INCIDENT_DRY_RUN_SHA: '3d596a8adb68424326794898b381688aa252f636'
  INCIDENT_BOUNDARY_ARTIFACT_ID: '8476920934'
  INCIDENT_BOUNDARY_ARTIFACT_DIGEST: 'sha256:964aa8359db0608b45ff8f7b6aca6686ca9ef3a3a9bbd5add2f45c9ea3fadfa5'
  INCIDENT_EXECUTE_RUN_ID: '29782034145'
  INCIDENT_EXECUTE_JOB_ID: '88485256934'
  INCIDENT_EXECUTION_ARTIFACT_ID: '8477301225'
  INCIDENT_EXECUTION_ARTIFACT_DIGEST: 'sha256:e4c70363c55f79011c8b28ade2050af34859af15d37925848123f13aed7315a8'
  ORIGIN_COHORT: scripts/data/ordinary-v2-report-origin-cohort-v1.json
  # Boundary 29775654869 classified the complete non-deferred residual. This
  # cohort freezes only its 192 v2 report-origin rows; raw32 and deferred rows
  # stay excluded instead of weakening source-audit or install validation.
  ORIGIN_COHORT_SHA256: 3750ca3d83fe28efb5673f384cef74195a44d388f14062ba3cec9f06f78a873c

jobs:
  freeze-boundary:
    if: inputs.mode == 'dry-run'
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - name: Checkout complete Marketplace history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: true
          sparse-checkout: ''
          sparse-checkout-cone-mode: false

      - name: Normalize full checkout and verify report-origin runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git sparse-checkout disable
          git reset --hard HEAD
          for path in "$ORIGIN_COHORT" \
            .github/actions/download-skillstore-cli/action.yml \
            scripts/build-legacy-report-origin-boundary.mjs \
            scripts/materialize-legacy-report-origin-evidence.mjs \
            scripts/verify-legacy-report-origin-boundary.mjs; do
            test -f "$path" || { echo "::error file=$path::Missing report-origin runtime after full-checkout normalization"; exit 1; }
          done

      - name: Validate immutable runtime and exact cohort
        env:
          DRY_RUN_ID: ${{ inputs.dry_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          [ -z "$DRY_RUN_ID" ] || { echo '::error::dry_run_id is execute-only'; exit 1; }
          for path in "$ORIGIN_COHORT" \
            scripts/build-legacy-report-origin-boundary.mjs \
            scripts/materialize-legacy-report-origin-evidence.mjs \
            scripts/verify-legacy-report-origin-boundary.mjs; do
            test -f "$path" || { echo "::error file=$path::Missing report-origin runtime"; exit 1; }
          done
          test "$(sha256sum "$ORIGIN_COHORT" | awk '{print $1}')" = "$ORIGIN_COHORT_SHA256"
          jq -e '.schemaVersion == 2 and .selectedCount == 192 and (.rows | length) == 192 and (.sourceBoundaries | length) == 1' "$ORIGIN_COHORT" >/dev/null
          [[ "$ORIGIN_CLI_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo '::error::CLI 2.15.9 audit digest is still a non-production placeholder'; exit 1;
          }

      - name: Download and verify the frozen drift classification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-boundaries"
          while IFS= read -r boundary; do
            run_id=$(jq -r .runId <<< "$boundary")
            expected=$(jq -r .classificationSha256 <<< "$boundary")
            run_json=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" \
              --json databaseId,conclusion,event,headBranch,workflowName)
            jq -e --argjson id "$run_id" '
              .databaseId == $id and .conclusion == "success" and
              .event == "workflow_dispatch" and .headBranch == "main" and
              .workflowName == "Govern Legacy-Equivalent Artifacts"
            ' <<< "$run_json" >/dev/null || { echo "::error::invalid source boundary $run_id"; exit 1; }
            target="$RUNNER_TEMP/source-boundaries/$run_id"
            mkdir -p "$target"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name "legacy-equivalent-boundary-$run_id" --dir "$target"
            (cd "$target" && sha256sum --check SHA256SUMS)
            test "$(sha256sum "$target/classification.json" | awk '{print $1}')" = "$expected" || {
              echo "::error::classification $run_id differs from checked-in cohort"; exit 1;
            }
          done < <(jq -c '.sourceBoundaries[]' "$ORIGIN_COHORT")

      - name: Build exact 192-row v2-only drift classification and plan
        run: |
          set -euo pipefail
          node scripts/build-legacy-report-origin-boundary.mjs \
            --cohort "$ORIGIN_COHORT" \
            --boundaries-root "$RUNNER_TEMP/source-boundaries" \
            --classification-output "$RUNNER_TEMP/classification.json" \
            --plan-output "$RUNNER_TEMP/plan.json"

      - name: Re-prove all report-origin evidence from Git
        run: |
          set -euo pipefail
          node scripts/materialize-legacy-report-origin-evidence.mjs \
            --repository-root "$GITHUB_WORKSPACE" --cohort "$ORIGIN_COHORT" \
            --expected-count 192 --origin-root "$RUNNER_TEMP/origin" \
            --previous-report-root "$RUNNER_TEMP/previous" \
            --manifest "$RUNNER_TEMP/origin-lineage.json"

      - name: Materialize exact current source trees
        run: |
          set -euo pipefail
          while IFS= read -r group; do
            commit=$(jq -r .marketplaceCommit <<< "$group")
            root="$RUNNER_TEMP/current/$commit"
            mkdir -p "$root"
            mapfile -t paths < <(jq -r '.paths[]' <<< "$group")
            git archive --format=tar "$commit" -- "${paths[@]}" | tar -xf - -C "$root"
          done < <(jq -c '.groups[]' "$RUNNER_TEMP/plan.json")

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: marketplace,skillstore

      - name: Download exact unpublished-gated CLI
        uses: ./.github/actions/download-skillstore-cli
        with:
          token: ${{ steps.app-token.outputs.token }}
          version: '2.15.9'
          minimum-version: '2.15.9'
          cache-dir: /home/runner/_work/_cache/skillstore-cli

      - name: Verify audited CLI binary identity
        run: |
          set -euo pipefail
          test "$(sha256sum "$GITHUB_WORKSPACE/skillstore-cli" | awk '{print $1}')" = "$ORIGIN_CLI_SHA256"

      - name: Run exact 192-row administrator dry-run
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dry-run-groups"
          : > "$RUNNER_TEMP/dry-run-results.jsonl"
          : > "$RUNNER_TEMP/dry-run-failures.jsonl"
          while IFS= read -r group; do
            commit=$(jq -r .marketplaceCommit <<< "$group")
            group_root="$RUNNER_TEMP/dry-run-groups/$commit"
            mkdir -p "$group_root/results" "$group_root/logs"
            : > "$group_root/results.jsonl"
            while IFS= read -r slug; do
              result="$group_root/results/$slug.json"
              stdout="$group_root/logs/$slug.stdout"
              stderr="$group_root/logs/$slug.stderr"
              set +e
              "$GITHUB_WORKSPACE/skillstore-cli" skill govern-legacy-equivalent \
                --classification "$RUNNER_TEMP/classification.json" \
                --legacy-origin-lineage "$RUNNER_TEMP/origin-lineage.json" \
                --legacy-origin-root "$RUNNER_TEMP/origin" \
                --legacy-previous-report-root "$RUNNER_TEMP/previous" \
                --root "$RUNNER_TEMP/current/$commit" --slugs "$slug" \
                --dry-run --concurrency 1 --result-file "$result" \
                >"$stdout" 2>"$stderr"
              exit_code=$?
              set -e
              [ ! -s "$stdout" ] || cat "$stdout"
              [ ! -s "$stderr" ] || cat "$stderr" >&2
              if [ "$exit_code" -ne 0 ]; then
                jq -n -c --arg commit "$commit" --arg slug "$slug" \
                  --argjson exitCode "$exit_code" --rawfile error "$stderr" \
                  '{marketplaceCommit:$commit,slug:$slug,exitCode:$exitCode,error:$error}' \
                  >> "$RUNNER_TEMP/dry-run-failures.jsonl"
                continue
              fi
              jq -e --arg slug "$slug" '
                .success == true and .mode == "dry-run" and .governed == 0 and
                .validated == 1 and (.results | length) == 1 and .results[0].slug == $slug
              ' "$result" >/dev/null
              jq -c . "$result" >> "$group_root/results.jsonl"
            done < <(jq -r '.slugs[]' <<< "$group")
            jq -s '
              {success:all(.[];.success == true),mode:"dry-run",
               governed:(map(.governed)|add // 0),validated:(map(.validated)|add // 0),
               results:[.[].results[]]}
            ' "$group_root/results.jsonl" > "$group_root/group.json"
            jq -n -c --arg commit "$commit" --slurpfile result "$group_root/group.json" \
              '{marketplaceCommit:$commit,result:$result[0]}' >> "$RUNNER_TEMP/dry-run-results.jsonl"
          done < <(jq -c '.groups[]' "$RUNNER_TEMP/plan.json")
          if [ -s "$RUNNER_TEMP/dry-run-failures.jsonl" ]; then
            jq -s . "$RUNNER_TEMP/dry-run-failures.jsonl" > "$RUNNER_TEMP/dry-run-failures.json"
            jq -r '.[] | "::error title=No-write validation failed for \(.slug)::\(.error | split("\n")[0])"' \
              "$RUNNER_TEMP/dry-run-failures.json"
            exit 1
          fi
          jq -s . "$RUNNER_TEMP/dry-run-results.jsonl" > "$RUNNER_TEMP/dry-run-results.json"

      - name: Upload no-write validation failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: legacy-report-origin-v2-only-failed-dry-run-${{ github.run_id }}
          path: ${{ runner.temp }}/dry-run-failures.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Freeze exact cohort, manifest, classification, and dry-run boundary
        run: |
          set -euo pipefail
          boundary="$RUNNER_TEMP/origin-boundary"
          mkdir -p "$boundary"
          cp "$ORIGIN_COHORT" "$boundary/cohort.json"
          cp "$RUNNER_TEMP/plan.json" "$boundary/plan.json"
          cp "$RUNNER_TEMP/classification.json" "$boundary/classification.json"
          cp "$RUNNER_TEMP/origin-lineage.json" "$boundary/origin-lineage.json"
          cp "$RUNNER_TEMP/dry-run-results.json" "$boundary/dry-run-results.json"
          node scripts/verify-legacy-report-origin-boundary.mjs --phase freeze \
            --cohort "$boundary/cohort.json" --plan "$boundary/plan.json" \
            --classification "$boundary/classification.json" \
            --manifest "$boundary/origin-lineage.json" \
            --dry-run-results "$boundary/dry-run-results.json" \
            --run-id "$GITHUB_RUN_ID" --repository "$GITHUB_REPOSITORY" \
            --workflow-commit "$GITHUB_SHA" --cli-version "$ORIGIN_CLI_VERSION" \
            --cli-sha256 "$ORIGIN_CLI_SHA256" --output "$boundary/boundary.json"
          (cd "$boundary" && sha256sum cohort.json plan.json classification.json \
            origin-lineage.json dry-run-results.json boundary.json > SHA256SUMS)

      - name: Upload immutable report-origin boundary
        uses: actions/upload-artifact@v6
        with:
          name: legacy-report-origin-v2-only-boundary-${{ github.run_id }}
          path: ${{ runner.temp }}/origin-boundary/
          if-no-files-found: error
          retention-days: 30

  execute-boundary:
    if: inputs.mode == 'recover-post-score'
    concurrency:
      group: production-skill-score-writes
      cancel-in-progress: false
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - name: Checkout complete Marketplace history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: true
          sparse-checkout: ''
          sparse-checkout-cone-mode: false

      - name: Normalize full checkout and verify report-origin runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git sparse-checkout disable
          git reset --hard HEAD
          for path in "$ORIGIN_COHORT" \
            .github/actions/download-skillstore-cli/action.yml \
            scripts/build-legacy-report-origin-boundary.mjs \
            scripts/materialize-legacy-report-origin-evidence.mjs \
            scripts/verify-legacy-report-origin-boundary.mjs; do
            test -f "$path" || { echo "::error file=$path::Missing report-origin runtime after full-checkout normalization"; exit 1; }
          done

      - name: Validate exact recovery gate and production pins
        env:
          DRY_RUN_ID: ${{ inputs.dry_run_id }}
          FAILED_EXECUTE_RUN_ID: ${{ inputs.failed_execute_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          test "$DRY_RUN_ID" = "$INCIDENT_DRY_RUN_ID"
          test "$FAILED_EXECUTE_RUN_ID" = "$INCIDENT_EXECUTE_RUN_ID"
          [[ "$ORIGIN_CLI_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RECOVERY_CLI_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Download exact successful dry-run boundary
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN_ID: ${{ inputs.dry_run_id }}
        run: |
          set -euo pipefail
          run_json=$(gh run view "$DRY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,conclusion,event,headBranch,headSha,workflowName)
          jq -e --argjson id "$DRY_RUN_ID" '
            .databaseId == $id and .conclusion == "success" and
            .event == "workflow_dispatch" and .headBranch == "main" and
            .workflowName == "Govern Legacy Report-Origin V2-Only"
          ' <<< "$run_json" >/dev/null || { echo '::error::dry_run_id is not a successful origin dry-run'; exit 1; }
          mkdir -p "$RUNNER_TEMP/boundary"
          gh run download "$DRY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "legacy-report-origin-v2-only-boundary-$DRY_RUN_ID" --dir "$RUNNER_TEMP/boundary"
          (cd "$RUNNER_TEMP/boundary" && sha256sum --check SHA256SUMS)
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DRY_RUN_ID/artifacts?per_page=100")
          jq -e --argjson id "$INCIDENT_BOUNDARY_ARTIFACT_ID" \
            --arg digest "$INCIDENT_BOUNDARY_ARTIFACT_DIGEST" \
            --arg name "legacy-report-origin-v2-only-boundary-$DRY_RUN_ID" '
            [.artifacts[] | select(.id==$id and .name==$name and .expired==false and .digest==$digest)] | length==1
          ' <<< "$artifacts" >/dev/null
          test "$(jq -r .workflowCommit "$RUNNER_TEMP/boundary/boundary.json")" = "$(jq -r .headSha <<< "$run_json")"
          test "$(jq -r .headSha <<< "$run_json")" = "$INCIDENT_DRY_RUN_SHA"
          git merge-base --is-ancestor "$(jq -r .workflowCommit "$RUNNER_TEMP/boundary/boundary.json")" "$GITHUB_SHA"

      - name: Authenticate the sealed cancelled execute
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          incident="$RUNNER_TEMP/post-score-incident"
          mkdir -p "$incident/failed-execution"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_EXECUTE_RUN_ID" > "$incident/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_EXECUTE_RUN_ID/artifacts?per_page=100" > "$incident/artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INCIDENT_EXECUTE_RUN_ID/jobs?filter=latest&per_page=100" > "$incident/jobs.json"
          jq -e --argjson id "$INCIDENT_EXECUTE_RUN_ID" --arg sha "$INCIDENT_DRY_RUN_SHA" '
            .id==$id and .name=="Govern Legacy Report-Origin V2-Only" and
            .event=="workflow_dispatch" and .head_branch=="main" and .head_sha==$sha and
            .conclusion=="cancelled" and .run_attempt==1
          ' "$incident/run.json" >/dev/null
          jq -e --argjson id "$INCIDENT_EXECUTION_ARTIFACT_ID" \
            --arg digest "$INCIDENT_EXECUTION_ARTIFACT_DIGEST" \
            --arg name "legacy-report-origin-v2-only-execution-$INCIDENT_EXECUTE_RUN_ID" '
            [.artifacts[] | select(.id==$id and .name==$name and .expired==false and .digest==$digest)] | length==1
          ' "$incident/artifacts.json" >/dev/null
          jq -e --argjson id "$INCIDENT_EXECUTE_JOB_ID" '
            [.jobs[] | select(.id==$id and .name=="execute-boundary" and
              .runner_name=="docker-runner-199-4-4" and .conclusion=="cancelled")] | length==1
          ' "$incident/jobs.json" >/dev/null
          gh run download "$INCIDENT_EXECUTE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "legacy-report-origin-v2-only-execution-$INCIDENT_EXECUTE_RUN_ID" \
            --dir "$incident/failed-execution"
          mapfile -t files < <(find "$incident/failed-execution" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test "${#files[@]}" = 2
          test "${files[0]}" = boundary && test "${files[1]}" = current-origin-lineage.json
          (cd "$incident/failed-execution/boundary" && sha256sum --check SHA256SUMS)
          diff -qr "$RUNNER_TEMP/boundary" "$incident/failed-execution/boundary"
          cmp "$RUNNER_TEMP/boundary/origin-lineage.json" \
            "$incident/failed-execution/current-origin-lineage.json"
          test ! -e "$incident/failed-execution/execution-results.json"

      - name: Recompute Git evidence and byte-match the frozen manifest
        run: |
          set -euo pipefail
          test "$(sha256sum "$RUNNER_TEMP/boundary/cohort.json" | awk '{print $1}')" = "$ORIGIN_COHORT_SHA256"
          node scripts/materialize-legacy-report-origin-evidence.mjs \
            --repository-root "$GITHUB_WORKSPACE" --cohort "$RUNNER_TEMP/boundary/cohort.json" \
            --expected-count 192 --origin-root "$RUNNER_TEMP/origin" \
            --previous-report-root "$RUNNER_TEMP/previous" \
            --manifest "$RUNNER_TEMP/current-origin-lineage.json"
          cmp "$RUNNER_TEMP/boundary/origin-lineage.json" "$RUNNER_TEMP/current-origin-lineage.json" || {
            echo '::error::report-origin Git evidence differs from frozen boundary'; exit 1;
          }
          node scripts/verify-legacy-report-origin-boundary.mjs --phase execute-preflight \
            --boundary "$RUNNER_TEMP/boundary/boundary.json" \
            --expected-run-id '${{ inputs.dry_run_id }}' \
            --cohort "$RUNNER_TEMP/boundary/cohort.json" --plan "$RUNNER_TEMP/boundary/plan.json" \
            --classification "$RUNNER_TEMP/boundary/classification.json" \
            --manifest "$RUNNER_TEMP/boundary/origin-lineage.json" \
            --dry-run-results "$RUNNER_TEMP/boundary/dry-run-results.json"

      - name: Materialize only the frozen current source trees
        run: |
          set -euo pipefail
          while IFS= read -r group; do
            commit=$(jq -r .marketplaceCommit <<< "$group")
            root="$RUNNER_TEMP/current/$commit"
            mkdir -p "$root"
            mapfile -t paths < <(jq -r '.paths[]' <<< "$group")
            git archive --format=tar "$commit" -- "${paths[@]}" | tar -xf - -C "$root"
          done < <(jq -c '.groups[]' "$RUNNER_TEMP/boundary/plan.json")

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: marketplace,skillstore

      - name: Download exact audited CLI
        uses: ./.github/actions/download-skillstore-cli
        with:
          token: ${{ steps.app-token.outputs.token }}
          version: '2.15.10'
          minimum-version: '2.15.10'
          cache-dir: /home/runner/_work/_cache/skillstore-cli

      - name: Verify boundary and recovery CLI identities
        run: |
          set -euo pipefail
          test "$(jq -r .cliVersion "$RUNNER_TEMP/boundary/boundary.json")" = "$ORIGIN_CLI_VERSION"
          test "$(jq -r .cliSha256 "$RUNNER_TEMP/boundary/boundary.json")" = "$ORIGIN_CLI_SHA256"
          actual=$(sha256sum "$GITHUB_WORKSPACE/skillstore-cli" | awk '{print $1}')
          test "$actual" = "$RECOVERY_CLI_SHA256"

      - name: Recover only the frozen 192 post-score rows
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CACHE_INVALIDATE_SECRET: ${{ secrets.CACHE_INVALIDATE_SECRET }}
          SKILLSTORE_SITE_URL: https://skillstore.io
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/execution-groups"
          : > "$RUNNER_TEMP/execution-results.jsonl"
          while IFS= read -r group; do
            commit=$(jq -r .marketplaceCommit <<< "$group")
            slugs=$(jq -r '.slugs | join(",")' <<< "$group")
            result="$RUNNER_TEMP/execution-groups/$commit.json"
            "$GITHUB_WORKSPACE/skillstore-cli" skill govern-legacy-equivalent \
              --classification "$RUNNER_TEMP/boundary/classification.json" \
              --legacy-origin-lineage "$RUNNER_TEMP/current-origin-lineage.json" \
              --legacy-origin-root "$RUNNER_TEMP/origin" \
              --legacy-previous-report-root "$RUNNER_TEMP/previous" \
              --root "$RUNNER_TEMP/current/$commit" --slugs "$slugs" \
              --concurrency 1 --result-file "$result"
            jq -n -c --arg commit "$commit" --slurpfile result "$result" \
              '{marketplaceCommit:$commit,result:$result[0]}' >> "$RUNNER_TEMP/execution-results.jsonl"
          done < <(jq -c '.groups[]' "$RUNNER_TEMP/boundary/plan.json")
          jq -s . "$RUNNER_TEMP/execution-results.jsonl" > "$RUNNER_TEMP/execution-results.json"
          jq -e '[.[].result.results[]] as $rows |
            ($rows | length) == 192 and ($rows | map(.slug) | unique | length) == 192 and
            ($rows | all(.mode == "execute" and .artifactRevision == 1 and .artifactCreated == false))' \
            "$RUNNER_TEMP/execution-results.json" >/dev/null

      - name: Checkout current Skillstore production smoke harness
        uses: actions/checkout@v5
        with:
          repository: aiskillstore/skillstore
          ref: c1b150a305b1f1244b2097286e3e2f84ab3b4efd
          token: ${{ steps.app-token.outputs.token }}
          path: skillstore-smoke
          sparse-checkout: scripts/smoke

      - name: Verify every production P0/P1 channel
        env:
          SMOKE_PUBLIC_CLI_PACKAGES: skillstore@0.1.9,skillstore@latest
          SMOKE_EXPECTED_SIGNING_KEY_ID: EP0Myk7rTk_J0RdG1fvpkP
          SMOKE_EXPECTED_SIGNING_PUBLIC_KEY_X: 2tbC6eNY4T9sx4Pvuo_NwHlXGyWWz95WAtHyHUTqzs8
          SMOKE_EXPECT_INTERACTION_RECOVERY: 'false'
        run: |
          set -euo pipefail
          node skillstore-smoke/scripts/smoke/production-smoke.mjs \
            --base-url https://skillstore.io --attempts 3 --retry-ms 3000 \
            | tee "$RUNNER_TEMP/production-smoke.log"

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: legacy-report-origin-v2-only-execution-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/boundary/
            ${{ runner.temp }}/current-origin-lineage.json
            ${{ runner.temp }}/execution-results.json
            ${{ runner.temp }}/post-score-incident/
            ${{ runner.temp }}/production-smoke.log
          if-no-files-found: error
          retention-days: 30
