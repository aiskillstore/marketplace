name: Reusable Skill Processing Workflow

# Shared workflow for processing skills in parallel shards
# Used by: approve-submission.yml, process-submission.yml
#
# Architecture:
#   Job 1: discover-and-plan   - Clone repo, discover skills, create matrix
#   Job 2: process (matrix)    - Process skills in parallel shards
#   Job 3: merge-and-create-pr - Combine results, create single PR

on:
  workflow_call:
    inputs:
      github_url:
        description: 'GitHub repository URL to process'
        required: true
        type: string
      submission_id:
        description: 'Unique submission identifier'
        required: true
        type: string
      model:
        description: 'AI model to use (optional)'
        required: false
        type: string
        default: ''
      cli_version:
        description: 'Reserved compatibility input; submission processing is pinned to CLI 2.15.12'
        required: false
        type: string
        default: '2.15.12'
      max_parallel:
        description: 'Maximum parallel shards'
        required: false
        type: string
        default: '6'
      is_manual_approval:
        description: 'Whether this is from manual approval workflow'
        required: false
        type: boolean
        default: false
      approved_by:
        description: 'Username who approved (for manual approvals)'
        required: false
        type: string
        default: ''
    outputs:
      pr_url:
        description: 'URL of created pull request'
        value: ${{ jobs.merge-and-create-pr.outputs.pr_url }}
      processed_count:
        description: 'Number of skills successfully processed'
        value: ${{ jobs.discover-and-plan.outputs.target_disposition == 'all_existing' && '0' || jobs.merge-and-create-pr.outputs.processed_count }}
      highest_risk:
        description: 'Highest security risk level found'
        value: ${{ jobs.discover-and-plan.outputs.target_disposition == 'all_existing' && 'not_evaluated' || jobs.merge-and-create-pr.outputs.highest_risk }}
      outcome:
        description: 'Terminal outcome: pr_created, no_op, or rejected'
        value: ${{ jobs.discover-and-plan.outputs.target_disposition == 'all_existing' && 'rejected' || jobs.merge-and-create-pr.outputs.outcome }}
      outcome_reason:
        description: 'Machine-readable terminal outcome reason'
        value: ${{ jobs.discover-and-plan.outputs.target_disposition == 'all_existing' && jobs.discover-and-plan.outputs.target_reason || jobs.merge-and-create-pr.outputs.outcome_reason }}
      existing_targets:
        description: 'Comma-separated exact targets for a handled existing-target rejection'
        value: ${{ jobs.discover-and-plan.outputs.existing_targets }}
      source_sha:
        description: 'Immutable source commit used for discovery'
        value: ${{ jobs.discover-and-plan.outputs.source_sha }}
      scope:
        description: 'Validated authoritative publication scope'
        value: ${{ jobs.discover-and-plan.outputs.scope_path }}
      physical_count:
        description: 'Physical SKILL.md files observed'
        value: ${{ jobs.discover-and-plan.outputs.physical_count }}
      selected_count:
        description: 'Skills in the authoritative selection plan'
        value: ${{ jobs.discover-and-plan.outputs.selected_count }}
      ignored_count:
        description: 'Out-of-scope SKILL.md files ignored by authority'
        value: ${{ jobs.discover-and-plan.outputs.ignored_count }}
      identical_count:
        description: 'Ignored identical local mirror groups'
        value: ${{ jobs.discover-and-plan.outputs.identical_count }}
      conflicting_count:
        description: 'Conflicting ignored local mirror groups recorded as diagnostics'
        value: ${{ jobs.discover-and-plan.outputs.conflicting_count }}
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
      SKILLSTORE_AGENTS:
        required: false
      HELM_API_KEY:
        required: true
      SUPABASE_URL:
        required: true
      SUPABASE_SERVICE_KEY:
        required: true
      SKILLSTORE_API_URL:
        required: false
      SKILLSTORE_CALLBACK_TOKEN:
        required: false

env:
  SHARD_THRESHOLD: 30
  MAX_SHARDS: 6

jobs:
  # ============================================================
  # JOB 1: DISCOVER AND PLAN
  # Clone repo, discover skills, create matrix for parallel processing
  # ============================================================
  discover-and-plan:
    runs-on: self-hosted
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      skill_count: ${{ steps.discover.outputs.skill_count }}
      skills_json: ${{ steps.discover.outputs.skills_json }}
      is_sharded: ${{ steps.plan.outputs.is_sharded }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      owner: ${{ steps.clone.outputs.owner }}
      repo: ${{ steps.clone.outputs.repo }}
      branch: ${{ steps.clone.outputs.branch }}
      github_url: ${{ steps.discover.outputs.github_url }}
      source_sha: ${{ steps.clone.outputs.ref_sha }}
      scope_path: ${{ steps.discover.outputs.scope_path }}
      selection_plan: ${{ steps.discover.outputs.selection_plan }}
      physical_count: ${{ steps.discover.outputs.physical_count }}
      selected_count: ${{ steps.discover.outputs.skill_count }}
      ignored_count: ${{ steps.discover.outputs.ignored_count }}
      identical_count: ${{ steps.discover.outputs.identical_count }}
      conflicting_count: ${{ steps.discover.outputs.conflicting_count }}
      target_disposition: ${{ steps.targets.outputs.disposition }}
      target_reason: ${{ steps.targets.outputs.reason_code }}
      existing_count: ${{ steps.targets.outputs.existing_count }}
      existing_targets: ${{ steps.targets.outputs.existing_targets }}
    steps:
      - name: Clear inherited discovery checkout
        run: |
          set -euo pipefail
          EXPECTED_WORKSPACE="${RUNNER_WORKSPACE:?}/${GITHUB_REPOSITORY#*/}"
          if [ "${GITHUB_WORKSPACE:?}" != "$EXPECTED_WORKSPACE" ]; then
            echo "::error::Refusing to clear unexpected workspace: $GITHUB_WORKSPACE"
            exit 1
          fi
          cd "${RUNNER_TEMP:?}"
          if git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" sparse-checkout disable >/dev/null 2>&1 || true
            git -C "$GITHUB_WORKSPACE" config --local --unset-all core.sparseCheckout >/dev/null 2>&1 || true
            git -C "$GITHUB_WORKSPACE" config --worktree --unset-all core.sparseCheckout >/dev/null 2>&1 || true
          fi
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"

      - name: Checkout immutable discovery runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Verify immutable discovery runtime
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          REQUIRED_RUNTIME_FILES=(
            "schemas/skill-report.schema.json"
            "governance/submission-slug-aliases.json"
            ".github/actions/download-skillstore-cli/action.yml"
            ".github/workflows/reusable-process-skills.yml"
            "scripts/resolve-submission-source.mjs"
            "scripts/discover-submission-skills.mjs"
            "scripts/classify-submission-targets.mjs"
            "scripts/process-submission-shard.mjs"
            "scripts/submission-selection-plan.mjs"
            "scripts/submission-shard-contract.mjs"
            "scripts/aggregate-submission-shards.mjs"
            "scripts/resolve-approved-submission.mjs"
          )
          test "$(git rev-parse HEAD)" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git config --bool core.sparseCheckout 2>/dev/null || echo false)" != "true"
          test ! -f "$(git rev-parse --git-path info/sparse-checkout)"
          if git ls-files -v -- "${REQUIRED_RUNTIME_FILES[@]}" | awk '$1 ~ /^S/ { found=1 } END { exit !found }'; then
            echo "::error::Immutable discovery runtime contains skip-worktree files"
            exit 1
          fi
          for file in "${REQUIRED_RUNTIME_FILES[@]}"; do
            test -f "$GITHUB_WORKSPACE/$file" && test ! -L "$GITHUB_WORKSPACE/$file" || {
              echo "::error::Required runtime file is missing or not a regular file: $file"
              exit 1
            }
            test "$(git hash-object -- "$GITHUB_WORKSPACE/$file")" = "$(git rev-parse "$EXPECTED_WORKFLOW_SHA:$file")" || {
              echo "::error::Runtime file does not match workflow head: $file"
              exit 1
            }
          done

      - name: Clone source repository
        id: clone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBMISSION_URL: ${{ inputs.github_url }}
        run: |
          set -euo pipefail
          REPOSITORY_ID=$(node "$GITHUB_WORKSPACE/scripts/resolve-submission-source.mjs" \
            --github-url "$SUBMISSION_URL" --repository-only)
          OWNER_REPO=$(jq -er '"\(.owner)/\(.repo)"' <<< "$REPOSITORY_ID")
          DEFAULT_REF=$(gh api "repos/$OWNER_REPO" --jq '.default_branch')
          REFS_FILE="${RUNNER_TEMP:?}/submission-refs-${{ github.run_id }}-${{ github.run_attempt }}.txt"
          git ls-remote --heads --tags "https://github.com/$OWNER_REPO.git" > "$REFS_FILE"
          RESOLVED=$(node "$GITHUB_WORKSPACE/scripts/resolve-submission-source.mjs" \
            --github-url "$SUBMISSION_URL" \
            --default-ref "$DEFAULT_REF" \
            --refs-file "$REFS_FILE")
          rm -f "$REFS_FILE"

          OWNER=$(jq -er '.owner' <<< "$RESOLVED")
          REPO=$(jq -er '.repo' <<< "$RESOLVED")
          REF=$(jq -er '.ref' <<< "$RESOLVED")
          REF_SHA=$(jq -er '.refSha' <<< "$RESOLVED")
          SKILL_PATH=$(jq -er '.skillPath' <<< "$RESOLVED")
          EXPLICIT_PATH=$(jq -r '
            if (.explicitPath | type) == "boolean" then
              .explicitPath
            else
              error("explicitPath must be a boolean")
            end
          ' <<< "$RESOLVED")
          NORMALIZED_URL=$(jq -er '.normalizedUrl' <<< "$RESOLVED")
          SOURCE_DIR="${RUNNER_TEMP:?}/submission-source-${{ github.run_id }}-${{ github.run_attempt }}"
          rm -rf "$SOURCE_DIR"
          git clone --depth 1 --branch "$REF" "https://github.com/$OWNER/$REPO.git" "$SOURCE_DIR"
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$REF_SHA" || {
            echo "::error::Resolved source ref moved during clone: $REF"
            exit 1
          }

          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "branch=$REF" >> "$GITHUB_OUTPUT"
          echo "ref_sha=$REF_SHA" >> "$GITHUB_OUTPUT"
          echo "skill_path=$SKILL_PATH" >> "$GITHUB_OUTPUT"
          echo "explicit_path=$EXPLICIT_PATH" >> "$GITHUB_OUTPUT"
          echo "normalized_url=$NORMALIZED_URL" >> "$GITHUB_OUTPUT"
          echo "source_dir=$SOURCE_DIR" >> "$GITHUB_OUTPUT"
          echo "📦 Cloned $OWNER/$REPO at immutable $REF ($REF_SHA)"

      - name: Discover skills (fast - no AI)
        id: discover
        env:
          SKILL_PATH: ${{ steps.clone.outputs.skill_path }}
          SOURCE_DIR: ${{ steps.clone.outputs.source_dir }}
          SOURCE_REPOSITORY: ${{ steps.clone.outputs.owner }}/${{ steps.clone.outputs.repo }}
          SOURCE_SHA: ${{ steps.clone.outputs.ref_sha }}
        run: |
          set -euo pipefail
          DISCOVERY=$(node "$GITHUB_WORKSPACE/scripts/discover-submission-skills.mjs" \
            --source-dir "$SOURCE_DIR" \
            --skill-path "$SKILL_PATH" \
            --explicit-path "${{ steps.clone.outputs.explicit_path }}" \
            --repository "$SOURCE_REPOSITORY" \
            --slug-aliases-file "$GITHUB_WORKSPACE/governance/submission-slug-aliases.json")
          FULL_PLAN=$(jq -ce --arg repository "$SOURCE_REPOSITORY" --arg sourceCommit "$SOURCE_SHA" \
            '{schemaVersion: 1, repository: $repository, sourceCommit: $sourceCommit, scope: .scope, skills: .skills}' <<< "$DISCOVERY")
          PLAN_FILE="${RUNNER_TEMP:?}/selection-plan-${{ github.run_id }}-${{ github.run_attempt }}.json"
          printf '%s\n' "$FULL_PLAN" > "$PLAN_FILE"
          node "$GITHUB_WORKSPACE/scripts/submission-selection-plan.mjs" --input "$PLAN_FILE" --output "$PLAN_FILE"
          FULL_PLAN=$(tr -d '\n' < "$PLAN_FILE")
          rm -f "$PLAN_FILE"
          SKILLS_JSON=$(jq -cer '[.skills[].slug]' <<< "$DISCOVERY")
          SKILL_COUNT=$(jq -er '.skills | length' <<< "$DISCOVERY")
          SCOPE_PATH=$(jq -er '.scope.path' <<< "$DISCOVERY")
          SCOPE_REASON=$(jq -er '.scope.reason' <<< "$DISCOVERY")
          PHYSICAL_COUNT=$(jq -er '.stats.physicalSkillFiles' <<< "$DISCOVERY")
          IGNORED_COUNT=$(jq -er '.stats.ignoredSkillFiles' <<< "$DISCOVERY")
          IDENTICAL_MIRRORS=$(jq -er '.stats.identicalMirrorGroups' <<< "$DISCOVERY")
          CONFLICTING_MIRRORS=$(jq -er '.stats.conflictingMirrorGroups' <<< "$DISCOVERY")
          # CLI always receives the repository root. The immutable selection
          # plan, not an untrusted tree URL, carries the authority scope.
          printf 'github_url=https://github.com/%s/%s\n' "${{ steps.clone.outputs.owner }}" "${{ steps.clone.outputs.repo }}" >> "$GITHUB_OUTPUT"
          echo "skills_json=$SKILLS_JSON" >> "$GITHUB_OUTPUT"
          echo "skill_count=$SKILL_COUNT" >> "$GITHUB_OUTPUT"
          echo "scope_path=$SCOPE_PATH" >> "$GITHUB_OUTPUT"
          echo "selection_plan=$FULL_PLAN" >> "$GITHUB_OUTPUT"
          echo "physical_count=$PHYSICAL_COUNT" >> "$GITHUB_OUTPUT"
          echo "ignored_count=$IGNORED_COUNT" >> "$GITHUB_OUTPUT"
          echo "identical_count=$IDENTICAL_MIRRORS" >> "$GITHUB_OUTPUT"
          echo "conflicting_count=$CONFLICTING_MIRRORS" >> "$GITHUB_OUTPUT"
          echo "📊 Selected $SKILL_COUNT public skill(s) from ${SCOPE_PATH:-repository root}; ignored $IGNORED_COUNT of $PHYSICAL_COUNT physical SKILL.md files"
          annotation_escape() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g'; }
          ANNOTATION=$(printf 'reason=%s scope=%s selected=%s ignored=%s identical_mirror_groups=%s conflicting_mirror_groups=%s' "$SCOPE_REASON" "${SCOPE_PATH:-.}" "$SKILL_COUNT" "$IGNORED_COUNT" "$IDENTICAL_MIRRORS" "$CONFLICTING_MIRRORS" | annotation_escape)
          echo "::notice title=DISCOVERY_SCOPE_SELECTED::$ANNOTATION"
          {
            echo "## Skill discovery scope"
            echo
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Source commit | \`${{ steps.clone.outputs.ref_sha }}\` |"
            echo "| Scope reason | \`$SCOPE_REASON\` |"
            echo "| Selected scope | \`${SCOPE_PATH:-.}\` |"
            echo "| Physical SKILL.md files | $PHYSICAL_COUNT |"
            echo "| Selected public skills | $SKILL_COUNT |"
            echo "| Ignored out-of-scope SKILL.md files | $IGNORED_COUNT |"
            echo "| Identical mirror groups | $IDENTICAL_MIRRORS |"
            echo "| Conflicting ignored mirror groups | $CONFLICTING_MIRRORS |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Classify submission targets
        id: targets
        env:
          FULL_SELECTION_PLAN: ${{ steps.discover.outputs.selection_plan }}
          SOURCE_REF: ${{ steps.clone.outputs.branch }}
        run: |
          set -euo pipefail
          PLAN_FILE="${RUNNER_TEMP:?}/target-plan-${{ github.run_id }}-${{ github.run_attempt }}.json"
          cleanup_target_plan() { rm -f "$PLAN_FILE"; }
          trap cleanup_target_plan EXIT
          umask 077
          printf '%s\n' "$FULL_SELECTION_PLAN" > "$PLAN_FILE"
          CLASSIFICATION=$(node "$GITHUB_WORKSPACE/scripts/classify-submission-targets.mjs" \
            --marketplace-root "$GITHUB_WORKSPACE" \
            --selection-plan "$PLAN_FILE" \
            --source-ref "$SOURCE_REF")
          DISPOSITION=$(jq -er '.disposition' <<< "$CLASSIFICATION")
          REASON_CODE=$(jq -er '.reasonCode' <<< "$CLASSIFICATION")
          SELECTED_COUNT=$(jq -er '.selectedCount' <<< "$CLASSIFICATION")
          EXISTING_COUNT=$(jq -er '.existingCount' <<< "$CLASSIFICATION")
          EXISTING_TARGETS=$(jq -er '.existingTargets | join(",")' <<< "$CLASSIFICATION")
          echo "disposition=$DISPOSITION" >> "$GITHUB_OUTPUT"
          echo "reason_code=$REASON_CODE" >> "$GITHUB_OUTPUT"
          echo "existing_count=$EXISTING_COUNT" >> "$GITHUB_OUTPUT"
          echo "existing_targets=$EXISTING_TARGETS" >> "$GITHUB_OUTPUT"
          if [ "$DISPOSITION" = "all_existing" ]; then
            echo "::notice title=SUBMISSION_ALREADY_PUBLISHED::All $EXISTING_COUNT selected targets already exist; skipping CLI, AI, shards, artifacts, branch, and PR"
          fi
          {
            echo "## Submission target preflight"
            echo
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Disposition | \`$DISPOSITION\` |"
            echo "| Reason | \`$REASON_CODE\` |"
            echo "| Selected targets | $SELECTED_COUNT |"
            echo "| Existing targets | $EXISTING_COUNT |"
            if [ -n "$EXISTING_TARGETS" ]; then
              echo
              echo "Exact existing targets: \`$EXISTING_TARGETS\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify skillstore - Processing started
        if: inputs.is_manual_approval == false && steps.targets.outputs.disposition == 'processable'
        run: |
          curl -sS -X POST "${{ secrets.SKILLSTORE_API_URL }}/api/submit/callback" \
            -H "Authorization: Bearer ${{ secrets.SKILLSTORE_CALLBACK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions/SkillstoreBot" \
            -H "X-Skillstore-Callback: true" \
            -d '{
              "submission_id": "'"${{ inputs.submission_id }}"'",
              "event": "started",
              "workflow_run_id": ${{ github.run_id }},
              "workflow_run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' || echo "::warning::Failed to notify skillstore"

      - name: Plan processing strategy
        id: plan
        if: steps.targets.outputs.disposition == 'processable'
        env:
          FULL_SELECTION_PLAN: ${{ steps.discover.outputs.selection_plan }}
          EXPLICIT_PATH: ${{ steps.clone.outputs.explicit_path }}
        run: |
          COUNT=$(jq -er '.skills | length' <<< "$FULL_SELECTION_PLAN")
          THRESHOLD=${{ env.SHARD_THRESHOLD }}
          MAX_SHARDS=${{ env.MAX_SHARDS }}

          if [ "$COUNT" -eq 0 ]; then
            if [ "$EXPLICIT_PATH" = "true" ]; then
              echo "::error::Explicit GitHub skill path resolved to zero skills"
              exit 1
            fi
            echo "No skills found; planning one explicit no-op shard"
            MATRIX=$(jq -ce '{include: [{shard: 0, selection_plan: .}]}' <<< "$FULL_SELECTION_PLAN")
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            echo "is_sharded=false" >> $GITHUB_OUTPUT
            echo "shard_count=1" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$COUNT" -lt "$THRESHOLD" ]; then
            echo "📦 Simple mode: $COUNT skills (below threshold $THRESHOLD)"
            MATRIX=$(jq -ce '{include: [{shard: 0, selection_plan: .}]}' <<< "$FULL_SELECTION_PLAN")
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            echo "is_sharded=false" >> $GITHUB_OUTPUT
            echo "shard_count=1" >> $GITHUB_OUTPUT
          else
            # Dynamic shard count
            if [ "$COUNT" -lt $((MAX_SHARDS * 5)) ]; then
              SHARDS=$(( (COUNT + 4) / 5 ))
              [ "$SHARDS" -lt 2 ] && SHARDS=2
            else
              SHARDS=$MAX_SHARDS
            fi

            echo "🔀 Sharded mode: $COUNT skills → $SHARDS shards (dynamic sizing)"

            BASE_SIZE=$((COUNT / SHARDS))
            REMAINDER=$((COUNT % SHARDS))

            MATRIX=$(jq -nce --argjson plan "$FULL_SELECTION_PLAN" --argjson shards "$SHARDS" '
              ($plan.skills | length) as $count |
              ($count / $shards | floor) as $base |
              ($count % $shards) as $remainder |
              {include: [range(0; $shards) as $index |
                ($base + (if $index < $remainder then 1 else 0 end)) as $size |
                ($index * $base + (if $index < $remainder then $index else $remainder end)) as $start |
                {shard: $index, selection_plan: ($plan | .skills = .skills[$start:($start + $size)])}
              ]}')
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            echo "is_sharded=true" >> $GITHUB_OUTPUT
            echo "shard_count=$SHARDS" >> $GITHUB_OUTPUT
          fi

      - name: Cleanup source
        if: always()
        run: rm -rf "${{ steps.clone.outputs.source_dir }}"

  # ============================================================
  # JOB 2: PROCESS (Parallel Matrix)
  # Each shard processes a subset of skills with retry logic
  # ============================================================
  process:
    needs: discover-and-plan
    if: needs.discover-and-plan.outputs.target_disposition == 'processable' && needs.discover-and-plan.outputs.shard_count != '0'
    runs-on: self-hosted
    timeout-minutes: 1440
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.discover-and-plan.outputs.matrix) }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: marketplace,skillstore

      - name: Clear inherited marketplace checkout
        run: |
          set -euo pipefail

          EXPECTED_WORKSPACE="${RUNNER_WORKSPACE:?}/${GITHUB_REPOSITORY#*/}"
          if [ "${GITHUB_WORKSPACE:?}" != "$EXPECTED_WORKSPACE" ]; then
            echo "::error::Refusing to clear unexpected workspace: $GITHUB_WORKSPACE"
            exit 1
          fi

          cd "${RUNNER_TEMP:?}"
          if git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" sparse-checkout disable >/dev/null 2>&1 || true
            git -C "$GITHUB_WORKSPACE" config --local --unset-all core.sparseCheckout >/dev/null 2>&1 || true
            git -C "$GITHUB_WORKSPACE" config --worktree --unset-all core.sparseCheckout >/dev/null 2>&1 || true
          fi
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"

      - name: Checkout marketplace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Verify immutable processing runtime
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail

          ACTUAL_HEAD=$(git rev-parse HEAD)
          if [ "$ACTUAL_HEAD" != "$EXPECTED_WORKFLOW_SHA" ]; then
            echo "::error::Marketplace checkout mismatch: expected $EXPECTED_WORKFLOW_SHA, got $ACTUAL_HEAD"
            exit 1
          fi

          if [ "$(git config --bool core.sparseCheckout 2>/dev/null || echo false)" = "true" ]; then
            echo "::error::Marketplace checkout is still sparse"
            exit 1
          fi
          test ! -f "$(git rev-parse --git-path info/sparse-checkout)" || {
            echo "::error::Inherited sparse-checkout definition is still present"
            exit 1
          }

          REQUIRED_RUNTIME_FILES=(
            "schemas/skill-report.schema.json"
            "governance/submission-slug-aliases.json"
            ".github/actions/download-skillstore-cli/action.yml"
            ".github/workflows/reusable-process-skills.yml"
            "scripts/resolve-submission-source.mjs"
            "scripts/discover-submission-skills.mjs"
            "scripts/classify-submission-targets.mjs"
            "scripts/process-submission-shard.mjs"
            "scripts/submission-selection-plan.mjs"
            "scripts/submission-shard-contract.mjs"
            "scripts/aggregate-submission-shards.mjs"
            "scripts/resolve-approved-submission.mjs"
          )
          if git ls-files -v -- "${REQUIRED_RUNTIME_FILES[@]}" | awk '$1 ~ /^S/ { found=1 } END { exit !found }'; then
            echo "::error::Immutable processing runtime contains skip-worktree files"
            exit 1
          fi
          for file in "${REQUIRED_RUNTIME_FILES[@]}"; do
            test -f "$GITHUB_WORKSPACE/$file" && test ! -L "$GITHUB_WORKSPACE/$file" || {
              echo "::error::Required processing runtime file is missing or not a regular file: $file"
              exit 1
            }
            EXPECTED_BLOB=$(git rev-parse "$EXPECTED_WORKFLOW_SHA:$file")
            ACTUAL_BLOB=$(git hash-object -- "$GITHUB_WORKSPACE/$file")
            if [ "$ACTUAL_BLOB" != "$EXPECTED_BLOB" ]; then
              echo "::error::Processing runtime file does not match workflow head: $file"
              exit 1
            fi
          done

      - name: Download Skillstore CLI
        uses: ./.github/actions/download-skillstore-cli
        with:
          # Dependency gate: do not merge before cli-v2.15.12 is released.
          version: '2.15.12'
          token: ${{ steps.app-token.outputs.token }}
          cache-dir: /home/runner/_work/_cache/skillstore-cli
          minimum-version: 2.15.12
          require-checksum: true

      - name: Process shard ${{ matrix.shard }}
        id: process
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKILLSTORE_AGENTS: ${{ secrets.SKILLSTORE_AGENTS }}
          HELM_API_KEY: ${{ secrets.HELM_API_KEY }}
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SELECTION_PLAN_JSON: ${{ toJSON(matrix.selection_plan) }}
          NORMALIZED_GITHUB_URL: ${{ needs.discover-and-plan.outputs.github_url }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          RESULT_DIR="/tmp/submission-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}"
          INPUT_PLAN="${RUNNER_TEMP:?}/selection-plan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}.json"
          cleanup_input_plan() { rm -f "$INPUT_PLAN"; }
          trap cleanup_input_plan EXIT
          umask 077
          printf '%s\n' "$SELECTION_PLAN_JSON" > "$INPUT_PLAN"
          node "$GITHUB_WORKSPACE/scripts/process-submission-shard.mjs" \
            --cli "$GITHUB_WORKSPACE/skillstore-cli" \
            --github-url "$NORMALIZED_GITHUB_URL" \
            --selection-plan "$INPUT_PLAN" \
            --result-dir "$RESULT_DIR" \
            --marketplace-repo "${{ github.repository }}" \
            --shard-index "${{ matrix.shard }}" \
            --slug-aliases-file "$GITHUB_WORKSPACE/governance/submission-slug-aliases.json" \
            --model "$MODEL"

      - name: Create mode-preserving shard archive
        if: always()
        run: |
          set -euo pipefail
          RESULT_DIR="/tmp/submission-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}"
          LOG_FILE="$RESULT_DIR/process-output-${{ matrix.shard }}.log"
          MANIFEST_FILE="$RESULT_DIR/shard-manifest.json"
          mkdir -p "$RESULT_DIR/pending"
          test -f "$LOG_FILE" || : > "$LOG_FILE"
          test -f "$MANIFEST_FILE" || {
            echo "::error::Shard process step did not produce a diagnostic manifest"
            exit 1
          }
          PLAN_EVIDENCE=()
          if [ -f "$RESULT_DIR/selection-plan.json" ] && jq -e . "$RESULT_DIR/selection-plan.json" >/dev/null; then
            jq -r '[.skills[].slug] | join(",")' "$RESULT_DIR/selection-plan.json" > "$RESULT_DIR/planned-slugs.csv"
            PLAN_EVIDENCE+=(selection-plan.json)
          else
            # Preserve the untrusted bytes separately; do not let malformed
            # plan JSON prevent artifact upload or overwrite valid evidence.
            jq -r '[.planned[]] | join(",")' "$MANIFEST_FILE" > "$RESULT_DIR/planned-slugs.csv"
            test -f "$RESULT_DIR/selection-plan.invalid.json" || : > "$RESULT_DIR/selection-plan.invalid.json"
            PLAN_EVIDENCE+=(selection-plan.invalid.json)
          fi
          SHARD_ARCHIVE_NAME="process-shard-${{ github.run_attempt }}-${{ matrix.shard }}.tar.gz"
          tar -C "$RESULT_DIR" -czf "$RESULT_DIR/$SHARD_ARCHIVE_NAME" \
            pending "$(basename "$LOG_FILE")" planned-slugs.csv shard-manifest.json "${PLAN_EVIDENCE[@]}"

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: process-shard-${{ github.run_attempt }}-${{ matrix.shard }}
          path: /tmp/submission-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}/process-shard-${{ github.run_attempt }}-${{ matrix.shard }}.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Enforce shard terminal status
        if: always()
        env:
          EXPECTED_SELECTION_PLAN_JSON: ${{ toJSON(matrix.selection_plan) }}
        run: |
          set -euo pipefail
          RESULT_DIR="/tmp/submission-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}"
          EXPECTED_PLAN="${RUNNER_TEMP:?}/expected-selection-plan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}.json"
          cleanup_expected_plan() { rm -f "$EXPECTED_PLAN"; }
          trap cleanup_expected_plan EXIT
          umask 077
          printf '%s\n' "$EXPECTED_SELECTION_PLAN_JSON" > "$EXPECTED_PLAN"
          node "$GITHUB_WORKSPACE/scripts/submission-selection-plan.mjs" --input "$EXPECTED_PLAN" --output "$EXPECTED_PLAN"
          PLANNED_SLUGS=$(jq -r '[.skills[].slug] | join(",")' "$EXPECTED_PLAN")
          node "$GITHUB_WORKSPACE/scripts/submission-shard-contract.mjs" \
            --manifest "$RESULT_DIR/shard-manifest.json" \
            --expected-index "${{ matrix.shard }}" \
            --expected-slugs "$PLANNED_SLUGS" \
            --expected-selection-plan "$EXPECTED_PLAN" \
            --pending-root "$RESULT_DIR/pending" \
            --require-success

      - name: Cleanup isolated shard results
        if: always()
        run: rm -rf "/tmp/submission-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}"


  # ============================================================
  # JOB 3: MERGE AND CREATE PR
  # Combine all shard results and create a single PR
  # ============================================================
  merge-and-create-pr:
    needs: [discover-and-plan, process]
    if: always() && needs.discover-and-plan.outputs.target_disposition == 'processable' && needs.discover-and-plan.outputs.shard_count != '0'
    runs-on: self-hosted
    timeout-minutes: 60
    permissions:
      contents: write  # Required for git push operations
      pull-requests: write  # Required for creating PRs
    outputs:
      pr_url: ${{ steps.create_pr.outputs.pr_url }}
      processed_count: ${{ steps.create_pr.outputs.processed_count }}
      highest_risk: ${{ steps.create_pr.outputs.highest_risk }}
      outcome: ${{ steps.create_pr.outputs.outcome }}
      outcome_reason: ${{ steps.create_pr.outputs.outcome_reason }}
    steps:
      - name: Clear inherited aggregation checkout
        run: |
          set -euo pipefail
          EXPECTED_WORKSPACE="${RUNNER_WORKSPACE:?}/${GITHUB_REPOSITORY#*/}"
          if [ "${GITHUB_WORKSPACE:?}" != "$EXPECTED_WORKSPACE" ]; then
            echo "::error::Refusing to clear unexpected workspace: $GITHUB_WORKSPACE"
            exit 1
          fi
          cd "${RUNNER_TEMP:?}"
          if git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" sparse-checkout disable >/dev/null 2>&1 || true
            git -C "$GITHUB_WORKSPACE" config --local --unset-all core.sparseCheckout >/dev/null 2>&1 || true
            git -C "$GITHUB_WORKSPACE" config --worktree --unset-all core.sparseCheckout >/dev/null 2>&1 || true
          fi
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"

      - name: Checkout immutable aggregation runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Verify immutable aggregation runtime
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          REQUIRED_RUNTIME_FILES=(
            "schemas/skill-report.schema.json"
            ".github/actions/download-skillstore-cli/action.yml"
            ".github/workflows/reusable-process-skills.yml"
            "scripts/resolve-submission-source.mjs"
            "scripts/discover-submission-skills.mjs"
            "scripts/classify-submission-targets.mjs"
            "scripts/process-submission-shard.mjs"
            "scripts/submission-selection-plan.mjs"
            "scripts/submission-shard-contract.mjs"
            "scripts/aggregate-submission-shards.mjs"
            "scripts/resolve-approved-submission.mjs"
          )
          test "$(git rev-parse HEAD)" = "$EXPECTED_WORKFLOW_SHA"
          test "$(git config --bool core.sparseCheckout 2>/dev/null || echo false)" != "true"
          test ! -f "$(git rev-parse --git-path info/sparse-checkout)"
          if git ls-files -v -- "${REQUIRED_RUNTIME_FILES[@]}" | awk '$1 ~ /^S/ { found=1 } END { exit !found }'; then
            echo "::error::Immutable aggregation runtime contains skip-worktree files"
            exit 1
          fi
          for file in "${REQUIRED_RUNTIME_FILES[@]}"; do
            test -f "$GITHUB_WORKSPACE/$file" && test ! -L "$GITHUB_WORKSPACE/$file" || {
              echo "::error::Required runtime file is missing or not a regular file: $file"
              exit 1
            }
            test "$(git hash-object -- "$GITHUB_WORKSPACE/$file")" = "$(git rev-parse "$EXPECTED_WORKFLOW_SHA:$file")" || {
              echo "::error::Runtime file does not match workflow head: $file"
              exit 1
            }
          done

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Download all shard artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: process-shard-${{ github.run_attempt }}-*
          merge-multiple: false
          path: ${{ runner.temp }}/submission-artifacts-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Merge results and create PR
        id: create_pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          SHARD_MATRIX: ${{ needs.discover-and-plan.outputs.matrix }}
        run: |
          set -euo pipefail

          WORK_DIR="${RUNNER_TEMP:?}/marketplace-${{ github.run_id }}-${{ github.run_attempt }}"
          ARTIFACTS_DIR="${RUNNER_TEMP:?}/submission-artifacts-${{ github.run_id }}-${{ github.run_attempt }}"

          cleanup() {
            echo "🧹 Cleaning up temp directories..."
            rm -rf "$WORK_DIR" "$ARTIFACTS_DIR" "${ARTIFACTS_DIR}.approval-plan.json" \
              "${ARTIFACTS_DIR}.summary.json" "${ARTIFACTS_DIR}.merged" 2>/dev/null || true
          }
          trap cleanup EXIT

          if [ "${{ needs.process.result }}" != "success" ]; then
            echo "::error::Shard processing did not complete successfully; refusing to aggregate"
            exit 1
          fi

          echo "📦 Cloning fresh repository to $WORK_DIR..."
          git clone --depth 1 "https://x-access-token:${APP_TOKEN}@github.com/${REPOSITORY}.git" "$WORK_DIR"
          cd "$WORK_DIR"

          git config user.name "ai-skill-store[bot]"
          git config user.email "2628292+ai-skill-store[bot]@users.noreply.github.com"

          echo "=== Resolving frozen results from all shards ==="
          APPROVAL_PLAN="${ARTIFACTS_DIR}.approval-plan.json"
          AGGREGATION_SUMMARY="${ARTIFACTS_DIR}.summary.json"
          MERGED_RESULTS="${ARTIFACTS_DIR}.merged"
          node "$GITHUB_WORKSPACE/scripts/aggregate-submission-shards.mjs" \
            --artifacts-dir "$ARTIFACTS_DIR" \
            --run-attempt "${{ github.run_attempt }}" \
            --matrix-json "$SHARD_MATRIX" \
            --expected-count "${{ needs.discover-and-plan.outputs.shard_count }}" \
            --approval-plan "$APPROVAL_PLAN" \
            --merged-results "$MERGED_RESULTS" \
            --summary "$AGGREGATION_SUMMARY"

          AGGREGATION_STATUS=$(jq -er '.status' "$AGGREGATION_SUMMARY")
          AGGREGATION_REASON=$(jq -er '.reasonCode' "$AGGREGATION_SUMMARY")
          if [ "$AGGREGATION_STATUS" = "no_op" ]; then
            echo "Explicit legal no-op: $AGGREGATION_REASON"
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            echo "processed_count=0" >> "$GITHUB_OUTPUT"
            echo "highest_risk=safe" >> "$GITHUB_OUTPUT"
            echo "outcome=no_op" >> "$GITHUB_OUTPUT"
            echo "outcome_reason=$AGGREGATION_REASON" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$AGGREGATION_STATUS" = "has_results"
          mapfile -t SUBMISSION_PATHS < <(jq -r '.skills[].pendingDir' "$APPROVAL_PLAN")
          test "${#SUBMISSION_PATHS[@]}" -gt 0

          echo "=== Copying only frozen submission results ==="
          for pending_dir in "${SUBMISSION_PATHS[@]}"; do
            test ! -e "$WORK_DIR/$pending_dir" || {
              echo "::error::Pending path already exists on main: $pending_dir"
              exit 1
            }
            target_dir=$(jq -r --arg pendingDir "$pending_dir" \
              '.skills[] | select(.pendingDir == $pendingDir) | .targetDir' "$APPROVAL_PLAN")
            test ! -e "$WORK_DIR/$target_dir" || {
              echo "::error::Published target already exists; use the explicit update workflow: $target_dir"
              exit 1
            }
            mkdir -p "$WORK_DIR/$(dirname "$pending_dir")"
            cp -R "$MERGED_RESULTS/$pending_dir" "$WORK_DIR/$pending_dir"
          done

          PROCESSED_COUNT=0
          HIGHEST_RISK="safe"
          PROCESSED_SKILLS=""

          for pending_dir in "${SUBMISSION_PATHS[@]}"; do
            report="$pending_dir/skill-report.json"
            NAMESPACED_SLUG=$(jq -r 'if .meta.source_type == "official" then .meta.slug else .meta.owner + "/" + .meta.slug end' "$report")
            RISK=$(jq -r '.security_audit.risk_level // "unknown"' "$report")

            PROCESSED_SKILLS="$PROCESSED_SKILLS,$NAMESPACED_SLUG"
            PROCESSED_COUNT=$((PROCESSED_COUNT + 1))

            case "$RISK" in
              critical) HIGHEST_RISK="critical" ;;
              high) [ "$HIGHEST_RISK" != "critical" ] && HIGHEST_RISK="high" ;;
              medium) [ "$HIGHEST_RISK" = "safe" ] || [ "$HIGHEST_RISK" = "low" ] && HIGHEST_RISK="medium" ;;
              low) [ "$HIGHEST_RISK" = "safe" ] && HIGHEST_RISK="low" ;;
            esac
          done

          PROCESSED_SKILLS="${PROCESSED_SKILLS#,}"

          TOTAL_ERRORS=0

          echo "📊 Merged Results:"
          echo "  Total processed: $PROCESSED_COUNT"
          echo "  Total errors: $TOTAL_ERRORS"
          echo "  Highest risk: $HIGHEST_RISK"

          test "$PROCESSED_COUNT" -gt 0 || {
            echo "::error::Validated non-no-op aggregate contains no skills"
            exit 1
          }

          echo "has_results=true" >> $GITHUB_OUTPUT
          echo "processed_count=$PROCESSED_COUNT" >> $GITHUB_OUTPUT
          echo "skills_list=$PROCESSED_SKILLS" >> $GITHUB_OUTPUT
          echo "highest_risk=$HIGHEST_RISK" >> $GITHUB_OUTPUT
          echo "total_errors=$TOTAL_ERRORS" >> $GITHUB_OUTPUT

          REPO_NAME="${{ needs.discover-and-plan.outputs.repo }}"
          BRANCH_NAME="submission/${REPO_NAME}-${{ inputs.submission_id }}"
          IS_SHARDED="${{ needs.discover-and-plan.outputs.is_sharded }}"
          SHARD_COUNT="${{ needs.discover-and-plan.outputs.shard_count }}"
          SKILL_COUNT="${{ needs.discover-and-plan.outputs.skill_count }}"

          # Configure git remote URL with authentication token
          echo "🔑 Configuring git authentication..."
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${REPOSITORY}.git"

          git push origin --delete "$BRANCH_NAME" 2>/dev/null || true

          git checkout -b "$BRANCH_NAME"
          git add -- "${SUBMISSION_PATHS[@]}"

          # Different commit messages for manual approval vs automatic
          if [ "${{ inputs.is_manual_approval }}" = "true" ]; then
            APPROVAL_INFO="[approved by: ${{ inputs.approved_by }}]"
          else
            APPROVAL_INFO=""
          fi

          if [ "$PROCESSED_COUNT" -eq 1 ]; then
            FIRST_SKILL=$(echo "$PROCESSED_SKILLS" | cut -d',' -f1)
            git commit -m "Add pending skill: $FIRST_SKILL [submission: ${{ inputs.submission_id }}] $APPROVAL_INFO"
            PR_TITLE="$([ "${{ inputs.is_manual_approval }}" = "true" ] && echo "[APPROVED] " || echo "")New skill: $FIRST_SKILL ($HIGHEST_RISK risk)"
          else
            git commit -m "Add $PROCESSED_COUNT pending skills from $REPO_NAME [submission: ${{ inputs.submission_id }}] $APPROVAL_INFO"
            if [ "$IS_SHARDED" = "true" ]; then
              PR_TITLE="$([ "${{ inputs.is_manual_approval }}" = "true" ] && echo "[APPROVED] " || echo "")New skills: $PROCESSED_COUNT skills from $REPO_NAME ($HIGHEST_RISK) [parallel: ${SHARD_COUNT} shards]"
            else
              PR_TITLE="$([ "${{ inputs.is_manual_approval }}" = "true" ] && echo "[APPROVED] " || echo "")New skills: $PROCESSED_COUNT skills from $REPO_NAME ($HIGHEST_RISK risk)"
            fi
          fi

          git push origin "$BRANCH_NAME"

          RISK_BADGE="🟢"
          [ "$HIGHEST_RISK" = "critical" ] && RISK_BADGE="🔴"
          [ "$HIGHEST_RISK" = "high" ] && RISK_BADGE="🟠"
          [ "$HIGHEST_RISK" = "medium" ] && RISK_BADGE="🟡"
          [ "$HIGHEST_RISK" = "low" ] && RISK_BADGE="🟡"

          SKILLS_TABLE="| Skill | Risk | Status |
          |-------|------|--------|"

          TABLE_COUNT=0
          for pending_dir in "${SUBMISSION_PATHS[@]}"; do
            [ "$TABLE_COUNT" -ge 50 ] && break
            report="$pending_dir/skill-report.json"
            NAMESPACED_SLUG=$(jq -r 'if .meta.source_type == "official" then .meta.slug else .meta.owner + "/" + .meta.slug end' "$report")
            SKILL_RISK=$(jq -r '.security_audit.risk_level // "unknown"' "$report")
            SKILLS_TABLE="$SKILLS_TABLE
          | \`$NAMESPACED_SLUG\` | $SKILL_RISK | Ready |"
            TABLE_COUNT=$((TABLE_COUNT + 1))
          done

          if [ "$PROCESSED_COUNT" -gt 50 ]; then
            SKILLS_TABLE="$SKILLS_TABLE
          | ... | ... | ... |
          | *and $((PROCESSED_COUNT - 50)) more* | | |"
          fi

          # Build PR body with conditional approval info
          if [ "${{ inputs.is_manual_approval }}" = "true" ]; then
            APPROVAL_SECTION="**Approved by**: @${{ inputs.approved_by }}

          "
          else
            APPROVAL_SECTION=""
          fi

          cat > pr-body.md << EOF
          ## $([ "${{ inputs.is_manual_approval }}" = "true" ] && echo "✅ Approved " || echo "")Skill Submission: $REPO_NAME

          **Submission ID**: \`${{ inputs.submission_id }}\`
          **Source**: ${{ inputs.github_url }}
          ${APPROVAL_SECTION}
          ### Summary $RISK_BADGE
          - Skills discovered: $SKILL_COUNT
          - Skills processed: $PROCESSED_COUNT
          - Highest risk: $HIGHEST_RISK
          EOF

          if [ "$IS_SHARDED" = "true" ]; then
            echo "- Processing mode: **Parallel** ($SHARD_COUNT shards)" >> pr-body.md
          fi

          if [ "$TOTAL_ERRORS" -gt 0 ]; then
            echo "- ⚠️ Failed skills: $TOTAL_ERRORS" >> pr-body.md
          fi

          cat >> pr-body.md << EOF

          ### Skills
          $SKILLS_TABLE

          ### Review Checklist
          $([ "${{ inputs.is_manual_approval }}" = "true" ] && echo "- [x] Manual approval granted by @${{ inputs.approved_by }}" || echo "- [ ] Automated submission review")
          - [ ] All skill contents are appropriate
          - [ ] Security audit findings reviewed
          - [ ] Source repository checked

          ---
          *Processed by skillstore-cli*
          EOF

          PR_CREATE_OUTPUT=""
          if ! PR_CREATE_OUTPUT=$(gh pr create \
            --title "$PR_TITLE" \
            --body-file pr-body.md \
            --label "pending-review" \
            --base main \
            --head "$BRANCH_NAME" 2>&1); then
            echo "$PR_CREATE_OUTPUT"
            exit 1
          fi

          PR_URL=$(printf '%s\n' "$PR_CREATE_OUTPUT" | tail -1)

          if [ "${{ inputs.is_manual_approval }}" = "true" ]; then
            gh pr edit "$PR_URL" --add-label "manually-approved" || \
              echo "::warning::Optional label 'manually-approved' could not be applied"
          fi

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "outcome=pr_created" >> $GITHUB_OUTPUT
          echo "outcome_reason=processed_all_planned" >> $GITHUB_OUTPUT
          echo "Created PR: $PR_URL"
