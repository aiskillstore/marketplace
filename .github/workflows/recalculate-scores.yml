# GitHub Action Workflow for Recalculating Skill Quality Scores
#
# Runs daily to update community metrics (views, downloads, favorites)
# and recalculate composite quality scores for all skills.
#
# This ensures the "Community" dimension reflects actual engagement data
# after skills mature beyond the 7-day grace period.

name: Recalculate Skill Scores

on:
  schedule:
    # Run daily at 03:00 UTC (11:00 Beijing Time)
    - cron: '0 3 * * *'

  workflow_dispatch:
    inputs:
      slug:
        description: 'Score specific skill only (leave empty for all)'
        type: string
        default: ''
      limit:
        description: 'Maximum skills to process (leave empty for all)'
        type: string
        default: ''
      concurrency:
        description: 'Parallel database updates (production-safe default: 1)'
        type: string
        default: '1'
      dry_run:
        description: 'Preview without updating database'
        type: boolean
        default: false
      cli_version:
        description: 'CLI version (default: latest)'
        type: string
        default: 'latest'
      timeout_seconds:
        description: 'Per-skill CLI timeout in seconds (0 disables)'
        type: string
        default: '180'

concurrency:
  group: recalculate-scores
  cancel-in-progress: false

jobs:
  recalculate:
    runs-on: self-hosted
    timeout-minutes: 1440
    concurrency:
      group: production-skill-score-writes
      cancel-in-progress: false
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: marketplace,skillstore

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: |
            .github/actions
            scripts
            skills
          fetch-depth: 1

      - name: Download Skillstore CLI
        uses: ./.github/actions/download-skillstore-cli
        with:
          version: ${{ inputs.cli_version || 'latest' }}
          token: ${{ steps.app-token.outputs.token }}
          cache-dir: /home/runner/_work/_cache/skillstore-cli

      - name: Recalculate quality scores
        id: score
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Used below for one batched score-cache invalidation after scoring.
          # The per-slug CLI children intentionally run with this env cleared.
          CACHE_INVALIDATE_SECRET: ${{ secrets.CACHE_INVALIDATE_SECRET }}
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_CONCURRENCY: ${{ inputs.concurrency || '1' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds || '180' }}
        run: |
          echo "=== Skill Quality Score Recalculation ==="
          echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          INVALIDATE_SLUGS_FILE=""

          configure_tls() {
            if [ ! -s /etc/ssl/certs/ca-certificates.crt ] && command -v apt-get >/dev/null 2>&1; then
              echo "CA bundle missing; attempting to install ca-certificates"
              if command -v sudo >/dev/null 2>&1; then
                sudo apt-get update -y && sudo apt-get install -y ca-certificates || true
              else
                apt-get update -y && apt-get install -y ca-certificates || true
              fi
            fi

            if command -v update-ca-certificates >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1; then
                sudo update-ca-certificates || true
              else
                update-ca-certificates || true
              fi
            fi

            if [ -s /etc/ssl/certs/ca-certificates.crt ]; then
              export NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt
              export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
              export REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
              export GIT_SSL_CAINFO=/etc/ssl/certs/ca-certificates.crt
            fi
            export NODE_OPTIONS="${NODE_OPTIONS:-} --use-openssl-ca"
          }

          configure_tls

          # Build wrapper args. The wrapper script (scripts/recalculate-scores.sh)
          # runs the CLI in per-slug mode with retry/backoff so a single
          # breakdown update TimeoutError does not take down the whole run.
          WRAPPER_ARGS=(
            --cli "$GITHUB_WORKSPACE/skillstore-cli"
            --concurrency "$INPUT_CONCURRENCY"
            # The CLI already retries transient Supabase requests. A second
            # wrapper retry layer can multiply a slow database wave.
            --max-attempts 1
            --retry-base-seconds 5
            --timeout-seconds "$INPUT_TIMEOUT_SECONDS"
          )

          SUPPORTS_SLUGS=0
          SCORE_HELP=$("$GITHUB_WORKSPACE/skillstore-cli" skill score --help 2>&1 || true)
          if printf '%s\n' "$SCORE_HELP" | grep -q -- '--slugs'; then
            SUPPORTS_SLUGS=1
          else
            echo "::warning::Downloaded CLI does not advertise --slugs support; falling back to legacy --recalculate mode."
          fi

          if [ -n "$INPUT_SLUG" ]; then
            if [ "$SUPPORTS_SLUGS" -ne 1 ]; then
              echo "::error::Single-skill mode requires a CLI with --slugs support. The downloaded release asset appears older than the resolved tag."
              exit 2
            fi
            # Single-skill mode: per-slug wrapper
            WRAPPER_ARGS+=( --slugs "$INPUT_SLUG" )
            INVALIDATE_SLUGS_FILE="$RUNNER_TEMP/recalculate-invalidate-slugs.txt"
            printf '%s\n' "$INPUT_SLUG" > "$INVALIDATE_SLUGS_FILE"
            echo "Mode: Single skill ($INPUT_SLUG)"
          elif [ "$SUPPORTS_SLUGS" -eq 1 ]; then
            # Scheduled/default full recalculation must still use the
            # per-slug isolation wrapper when the downloaded CLI supports
            # it. Enumerate the canonical DB slug from each report; path
            # segments are owner-qualified and do not necessarily match
            # skillstore.skills.slug.
            mapfile -t ALL_SLUGS < <(node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const slugs = new Set();
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(fullPath);
              } else if (entry.isFile() && entry.name === 'skill-report.json') {
                const report = JSON.parse(fs.readFileSync(fullPath, 'utf8'));
                const slug = report?.meta?.slug;
                if (typeof slug === 'string' && slug.trim()) slugs.add(slug.trim());
              }
            }
          }

          walk('skills');
          for (const slug of [...slugs].sort()) console.log(slug);
          NODE
          )
            if [ -n "$INPUT_LIMIT" ]; then
              if ! [[ "$INPUT_LIMIT" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::limit must be a positive integer when provided: $INPUT_LIMIT"
                exit 2
              fi
              mapfile -t ALL_SLUGS < <(printf '%s\n' "${ALL_SLUGS[@]}" | head -n "$INPUT_LIMIT")
              echo "Mode: All skills (limit $INPUT_LIMIT)"
            else
              echo "Mode: All skills"
            fi

            if [ "${#ALL_SLUGS[@]}" -eq 0 ]; then
              echo "::error::No skills found to recalculate. Sparse checkout may be missing skills/."
              exit 1
            fi

            SLUGS_FILE="$RUNNER_TEMP/recalculate-slugs.txt"
            printf '%s\n' "${ALL_SLUGS[@]}" > "$SLUGS_FILE"
            WRAPPER_ARGS+=( --slugs-file "$SLUGS_FILE" )
            INVALIDATE_SLUGS_FILE="$SLUGS_FILE"
            echo "Skills queued: ${#ALL_SLUGS[@]}"
            echo "Slug list file: $SLUGS_FILE"
          else
            # Compatibility fallback for mislabeled/older CLI release
            # assets (observed: cli-v1.28.0 asset reporting 1.27.0).
            # This restores the historical all-skills path instead of
            # failing before any skill is scored.
            if [ -n "$INPUT_LIMIT" ]; then
              if ! [[ "$INPUT_LIMIT" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::limit must be a positive integer when provided: $INPUT_LIMIT"
                exit 2
              fi
              WRAPPER_ARGS+=( --limit "$INPUT_LIMIT" )
              echo "Mode: All skills via legacy CLI (limit $INPUT_LIMIT)"
            else
              echo "Mode: All skills via legacy CLI"
            fi
            WRAPPER_ARGS+=( --recalculate )
          fi

          if [ "$INPUT_CONCURRENCY" != "5" ]; then
            echo "Concurrency: $INPUT_CONCURRENCY"
          fi

          if [ "$INPUT_DRY_RUN" = "true" ]; then
            WRAPPER_ARGS+=( --dry-run )
            echo "Dry Run: Yes"
          fi

          echo ""
          echo "Running: scripts/recalculate-scores.sh ${WRAPPER_ARGS[*]}"
          echo "----------------------------------------"

          # Run wrapper. Output to both stdout and score-output.log for
          # backwards-compatible grep parsing. GitHub Actions runs bash
          # with `-e`; temporarily disable it so we can inspect EXIT_CODE
          # and preserve partial-success behavior.
          set +e
          # Full recalculation launches one CLI process per slug. Do not let
          # each child invalidate cache independently; that turns 5k skills
          # into 5k network calls. We batch invalidate after scoring succeeds.
          CACHE_INVALIDATE_SECRET= bash scripts/recalculate-scores.sh "${WRAPPER_ARGS[@]}" 2>&1 | tee score-output.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo ""
          echo "----------------------------------------"

          # Parse results from log. The wrapper prints aggregate
          # Processed/Updated/Errors/Duration lines at the very end; the
          # earlier per-slug lines emitted by the CLI are ignored.
          PROCESSED=$(grep -oP 'Processed:\s*\K\d+' score-output.log | tail -n1 || echo "0")
          UPDATED=$(grep -oP 'Updated:\s*\K\d+' score-output.log | tail -n1 || echo "0")
          ERRORS=$(grep -oP 'Errors:\s*\K\d+' score-output.log | tail -n1 || echo "0")
          DURATION=$(grep -oP 'Duration:\s*\K\d+' score-output.log | tail -n1 || echo "0")

          echo "processed=$PROCESSED" >> $GITHUB_OUTPUT
          echo "updated=$UPDATED" >> $GITHUB_OUTPUT
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          echo "duration=${DURATION}s" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          # Treat partial per-slug failures as a successful run only when
          # at least one slug succeeded. A non-zero wrapper exit means the
          # run made no successful progress (all/global failure) and must
          # keep the workflow red.
          SUCCESSFUL=$(( ${PROCESSED:-0} - ${ERRORS:-0} ))
          if [ "$EXIT_CODE" -ne 0 ]; then
            if [ "${PROCESSED:-0}" -eq 0 ] || [ "$SUCCESSFUL" -le 0 ]; then
              echo "::error::Recalculation failed: no skills were scored successfully."
              exit "$EXIT_CODE"
            fi

            echo "::warning::Score recalculation finished with $ERRORS error(s) after processing $PROCESSED skill(s); keeping the workflow green because it made progress."
          elif [ "${ERRORS:-0}" -gt 0 ]; then
            echo "::warning::Score recalculation finished with $ERRORS error(s) after processing $PROCESSED skill(s)."
          fi

          if [ "$INPUT_DRY_RUN" != "true" ] && [ -n "$INVALIDATE_SLUGS_FILE" ] && [ -s "$INVALIDATE_SLUGS_FILE" ] && [ "$SUCCESSFUL" -gt 0 ]; then
            echo ""
            echo "Batch invalidating skill score cache from $INVALIDATE_SLUGS_FILE"
            INVALIDATE_SLUGS_FILE="$INVALIDATE_SLUGS_FILE" node <<'NODE' || echo "::warning::Batch cache invalidation failed; scores were already written and will be visible after cache refresh."
          const fs = require('node:fs');

          const file = process.env.INVALIDATE_SLUGS_FILE;
          const secret = process.env.CACHE_INVALIDATE_SECRET;
          const site = (process.env.SKILLSTORE_SITE_URL || 'https://skillstore.io').replace(/\/+$/, '');
          const batchSize = 50;
          const timeoutMs = 10_000;

          async function postBatch(batch, index) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), timeoutMs);
            try {
              const res = await fetch(`${site}/api/cache/invalidate`, {
                method: 'POST',
                signal: controller.signal,
                headers: {
                  Authorization: `Bearer ${secret}`,
                  'Content-Type': 'application/json',
                  'User-Agent': 'skillstore-marketplace-workflow',
                },
                body: JSON.stringify({
                  type: 'skills',
                  slugs: batch,
                  invalidateApi: true,
                  invalidateArtifacts: false,
                }),
              });
              const text = await res.text();
              if (!res.ok) {
                console.error(`::warning::cache invalidation batch ${index} failed ${res.status}: ${text.slice(0, 300)}`);
                return false;
              }
              console.log(`[cache] invalidated ${batch.length} skills in batch ${index}`);
              return true;
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              console.error(`::warning::cache invalidation batch ${index} skipped: ${message}`);
              return false;
            } finally {
              clearTimeout(timeout);
            }
          }

          (async () => {
            if (!secret) {
              console.log('[cache] skipped: CACHE_INVALIDATE_SECRET is not set');
              return;
            }
            const slugs = [...new Set(
              fs.readFileSync(file, 'utf8')
                .split(/\r?\n/)
                .map((slug) => slug.trim())
                .filter(Boolean)
            )];
            if (slugs.length === 0) {
              console.log('[cache] skipped: no slugs to invalidate');
              return;
            }

            let failed = 0;
            for (let i = 0; i < slugs.length; i += batchSize) {
              const ok = await postBatch(slugs.slice(i, i + batchSize), Math.floor(i / batchSize) + 1);
              if (!ok) failed++;
            }
            console.log(`[cache] batch invalidation complete: slugs=${slugs.length} failed_batches=${failed}`);
            if (failed > 0) process.exitCode = 1;
          })().catch((error) => {
            console.error(error instanceof Error ? error.stack || error.message : String(error));
            process.exitCode = 1;
          });
          NODE
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f score-output.log 2>/dev/null || true

      - name: Summary
        if: always()
        env:
          PROCESSED: ${{ steps.score.outputs.processed }}
          UPDATED: ${{ steps.score.outputs.updated }}
          ERRORS: ${{ steps.score.outputs.errors }}
          DURATION: ${{ steps.score.outputs.duration }}
          EXIT_CODE: ${{ steps.score.outputs.exit_code }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SLUG: ${{ inputs.slug }}
          CLI_VERSION: ${{ inputs.cli_version || 'latest' }}
        run: |
          MODE="All skills"
          if [ -n "$SLUG" ]; then
            MODE="Single skill ($SLUG)"
          fi

          UPDATED_DISPLAY="$UPDATED"
          if [ "$DRY_RUN" = "true" ]; then
            UPDATED_DISPLAY="0 (dry run)"
          fi

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## Skill Quality Score Recalculation

          | Metric | Value |
          |--------|-------|
          | Mode | $MODE |
          | Processed | $PROCESSED |
          | Updated | $UPDATED_DISPLAY |
          | Errors | $ERRORS |
          | Duration | $DURATION |
          | Dry Run | $DRY_RUN |
          | CLI Version | \`$CLI_VERSION\` |

          EOF

          if [ "$EXIT_CODE" = "0" ]; then
            echo "✅ Score recalculation completed successfully" >> $GITHUB_STEP_SUMMARY
          elif [ "$PROCESSED" -gt 0 ]; then
            echo "⚠️ Score recalculation completed with warnings (non-fatal exit code: $EXIT_CODE)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Score recalculation failed before making progress (exit code: $EXIT_CODE)" >> $GITHUB_STEP_SUMMARY
          fi

          cat << 'EOF' >> $GITHUB_STEP_SUMMARY

          ### What Changed
          - Community scores updated based on latest engagement metrics (views, downloads, favorites)
          - Skills older than 7 days now use actual metrics instead of neutral 50 score
          - Maintainability recency scores refreshed based on update timestamps
          EOF
