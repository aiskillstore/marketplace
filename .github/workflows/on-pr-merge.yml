name: On PR Merge - Approve Skill
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Publication {0}', inputs.correlation_id) || format('Publish merged PR #{0}', github.event.pull_request.number) }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact merged submission PR to recover
        required: true
        type: string
      correlation_id:
        description: Exact idempotency correlation bound to the merged PR identity
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: publication-${{ inputs.correlation_id }}
  cancel-in-progress: false

jobs:
  approve-skill:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Verify trusted submission PR provenance
        id: freeze_pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Recovery requires one exact positive PR number"
            exit 1
          }
          PR=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")
          jq -e --arg repository "$REPOSITORY" --arg event_name "$EVENT_NAME" '
            .merged == true and
            .base.ref == "main" and
            .user.id == 254047988 and
            .user.login == "ai-skill-store[bot]" and
            .head.repo.full_name == $repository and
            (.head.ref | startswith("submission/")) and
            ($event_name == "workflow_dispatch" or any(.labels[]; .name == "pending-review"))
          ' <<< "$PR" >/dev/null || {
            echo "::error::Merged pending-review PR does not have trusted submission provenance"
            exit 1
          }

          MERGE_COMMIT_SHA=$(jq -er '.merge_commit_sha' <<< "$PR")
          HEAD_SHA=$(jq -er '.head.sha' <<< "$PR")
          PR_URL=$(jq -er '.html_url' <<< "$PR")
          MERGED_BY=$(jq -er '.merged_by.login' <<< "$PR")
          SUBMISSION_ID=$(jq -r '.body // ""' <<< "$PR" \
            | grep -oE 'Submission ID.*`[0-9a-f-]{36}`' \
            | grep -oE '[0-9a-f-]{36}' || true)
          [[ "$MERGE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            EXPECTED_CORRELATION_ID="submission-pr-${PR_NUMBER}-${HEAD_SHA}-${MERGE_COMMIT_SHA}"
            [ "$CORRELATION_ID" = "$EXPECTED_CORRELATION_ID" ] || {
              echo "::error::Publication correlation does not match the authoritative merged PR identity"
              exit 1
            }
          fi
          [ "$PR_URL" = "https://github.com/$REPOSITORY/pull/$PR_NUMBER" ]
          [[ "$MERGED_BY" =~ ^([A-Za-z0-9-]+|github-actions\[bot\])$ ]]
          {
            echo "pr_number=$PR_NUMBER"
            echo "merge_commit_sha=$MERGE_COMMIT_SHA"
            echo "submission_id=$SUBMISSION_ID"
            echo "pr_url=$PR_URL"
            echo "merged_by=$MERGED_BY"
          } >> "$GITHUB_OUTPUT"

      - name: Verify durable publication dispatch outbox
        id: publication_claim
        env:
          GH_TOKEN: ${{ github.token }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          MERGE_COMMIT_SHA: ${{ steps.freeze_pr.outputs.merge_commit_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          DIGEST=$(printf '%s' "$CORRELATION_ID" | sha256sum | awk '{print $1}')
          OUTBOX_PREFIX="tags/agentcrew-dispatch-outbox/publication/$DIGEST/"
          CONTEXT="agentcrew/publication/$DIGEST"
          OUTBOX=$(gh api "repos/$REPOSITORY/git/matching-refs/$OUTBOX_PREFIX")
          jq -e --arg prefix "refs/$OUTBOX_PREFIX" --arg merge_sha "$MERGE_COMMIT_SHA" '
            length > 0 and length <= 8 and
            all(.[];
              (.ref | startswith($prefix)) and
              ((.ref | ltrimstr($prefix)) | test("^[0-9]{13}-[1-9][0-9]*$")) and
              .object.type == "commit" and
              .object.sha == $merge_sha)
          ' <<< "$OUTBOX" >/dev/null || {
            echo "::error::Durable publication dispatch outbox does not bind the exact merge commit"
            exit 1
          }
          STATUSES=$(gh api --paginate "repos/$REPOSITORY/commits/$MERGE_COMMIT_SHA/statuses?per_page=100" | jq -s 'add')
          if jq -e --arg context "$CONTEXT" 'any(.[]; .context == $context)' <<< "$STATUSES" >/dev/null; then
            echo "::error::Existing durable publication status refuses duplicate execution"
            exit 1
          fi
          gh api --method POST "repos/$REPOSITORY/statuses/$MERGE_COMMIT_SHA" \
            -f state=pending -f context="$CONTEXT" \
            -f description='Correlated publication is running' \
            -f target_url="https://github.com/$REPOSITORY/actions/runs/${{ github.run_id }}"
          echo "owns_reservation=true" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Find pending skills and commit to skills directory
        id: publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          MERGE_COMMIT_SHA: ${{ steps.freeze_pr.outputs.merge_commit_sha }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          PR_NUMBER: ${{ steps.freeze_pr.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          SUBMISSION_ID: ${{ steps.freeze_pr.outputs.submission_id }}
        run: |
          set -euo pipefail

          # Use temp directory for clean git operations
          WORK_DIR="/tmp/marketplace-approve-${{ github.run_id }}"
          PR_FILES="${WORK_DIR}.pr-files.txt"
          APPROVAL_PLAN="${WORK_DIR}.approval-plan.json"
          MATERIALIZE_PATTERNS="${WORK_DIR}.marketplace-patterns"

          cleanup() {
            echo "🧹 Cleaning up temp directory..."
            rm -rf "$WORK_DIR" "$APPROVAL_PLAN" "$PR_FILES" "$MATERIALIZE_PATTERNS" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Freeze approval scope to this merged PR. Never scan the repository's
          # shared pending tree: another submission may be present concurrently.
          gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' > "$PR_FILES"

          mapfile -t MATERIALIZE_PENDING_PATHS < <(
            awk -F/ '
              $1 == "pending" && $NF == "SKILL.md" && NF == 3 { print $1 "/" $2 }
              $1 == "pending" && $NF == "SKILL.md" && NF == 4 { print $1 "/" $2 "/" $3 }
            ' "$PR_FILES" | LC_ALL=C sort -u
          )
          test "${#MATERIALIZE_PENDING_PATHS[@]}" -gt 0 || {
            echo "::error::Merged PR contains no canonical pending SKILL.md"
            exit 1
          }
          MATERIALIZE_TARGET_PATHS=()
          for pending_dir in "${MATERIALIZE_PENDING_PATHS[@]}"; do
            IFS='/' read -r -a segments <<< "$pending_dir"
            for segment in "${segments[@]:1}"; do
              [[ "$segment" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] && [ "$segment" != pending ] || {
                echo "::error::Invalid pending path selected from merged PR: $pending_dir"
                exit 1
              }
            done
            MATERIALIZE_TARGET_PATHS+=("skills/${pending_dir#pending/}")
          done

          echo "📦 Cloning fresh repository to $WORK_DIR..."
          for CLONE_ATTEMPT in 1 2 3; do
            rm -rf "$WORK_DIR"
            if git clone --depth 1 --filter=blob:none --no-checkout \
              "https://x-access-token:${APP_TOKEN}@github.com/${REPOSITORY}.git" "$WORK_DIR"; then
              break
            fi
            if [ "$CLONE_ATTEMPT" -eq 3 ]; then
              echo "::error::Fresh approval clone failed after 3 attempts"
              exit 1
            fi
            echo "::warning::Fresh approval clone failed; retrying attempt $((CLONE_ATTEMPT + 1))/3"
            sleep "$((CLONE_ATTEMPT * 5))"
          done

          git -C "$WORK_DIR" config user.name "ai-skill-store[bot]"
          git -C "$WORK_DIR" config user.email "2628292+ai-skill-store[bot]@users.noreply.github.com"

          assert_approval_path_shape() {
            local candidate="$1" current='' entry type segment
            local path_segments=()
            IFS='/' read -r -a path_segments <<< "$candidate"
            for segment in "${path_segments[@]}"; do
              current="${current:+$current/}$segment"
              entry=$(git -C "$WORK_DIR" ls-tree HEAD -- "$current")
              [ -n "$entry" ] || return 0
              type=$(awk 'NR == 1 { print $2 }' <<< "$entry")
              [ "$type" = tree ] || {
                echo "::error::Approval target has a symlink or non-directory path component: $candidate"
                exit 1
              }
            done
          }
          for candidate in "${MATERIALIZE_PENDING_PATHS[@]}" "${MATERIALIZE_TARGET_PATHS[@]}"; do
            assert_approval_path_shape "$candidate"
          done

          {
            printf '/scripts/resolve-approved-submission.mjs\n'
            printf '/%s/\n' "${MATERIALIZE_PENDING_PATHS[@]}" "${MATERIALIZE_TARGET_PATHS[@]}"
          } > "$MATERIALIZE_PATTERNS"
          git -C "$WORK_DIR" sparse-checkout init --no-cone
          MATERIALIZE_SUCCEEDED=false
          for MATERIALIZE_ATTEMPT in 1 2 3; do
            if git -C "$WORK_DIR" sparse-checkout set --no-cone --stdin < "$MATERIALIZE_PATTERNS" \
              && git -C "$WORK_DIR" checkout --force; then
              MATERIALIZE_SUCCEEDED=true
              break
            fi
            if [ "$MATERIALIZE_ATTEMPT" -lt 3 ]; then
              echo "::warning::Approval target materialization failed; retrying attempt $((MATERIALIZE_ATTEMPT + 1))/3"
              sleep "$((MATERIALIZE_ATTEMPT * 5))"
            fi
          done
          test "$MATERIALIZE_SUCCEEDED" = true || {
            echo "::error::Approval target materialization failed after 3 attempts"
            exit 1
          }
          if git -C "$WORK_DIR" ls-files -v -- \
              scripts/resolve-approved-submission.mjs \
              "${MATERIALIZE_PENDING_PATHS[@]}" "${MATERIALIZE_TARGET_PATHS[@]}" \
            | awk '$1 ~ /^S/ { found=1 } END { exit !found }'; then
            echo "::error::A tracked approval path was not materialized"
            exit 1
          fi
          test -f "$WORK_DIR/scripts/resolve-approved-submission.mjs" \
            && test ! -L "$WORK_DIR/scripts/resolve-approved-submission.mjs" || {
              echo "::error::Approval resolver is missing or not a regular file"
              exit 1
            }
          test "$(git -C "$WORK_DIR" hash-object -- scripts/resolve-approved-submission.mjs)" \
            = "$(git -C "$WORK_DIR" rev-parse HEAD:scripts/resolve-approved-submission.mjs)" || {
              echo "::error::Approval resolver does not match the cloned main head"
              exit 1
            }

          cd "$WORK_DIR"
          node scripts/resolve-approved-submission.mjs \
            --repo-root "$WORK_DIR" \
            --files "$PR_FILES" \
            --output "$APPROVAL_PLAN"

          mapfile -t SKILL_PATHS < <(jq -r '.skills[].pendingDir' "$APPROVAL_PLAN")
          mapfile -t TARGET_PATHS < <(jq -r '.skills[].targetDir' "$APPROVAL_PLAN")
          SKILL_NAMES=$(jq -r '[.skills[].reportSlug | "/" + .] | join(" ")' "$APPROVAL_PLAN")
          DUPLICATE_ONLY=$(jq -r '[.skills[] | select(.duplicate != true)] | length == 0' "$APPROVAL_PLAN")
          echo "duplicate_only=$DUPLICATE_ONLY" >> "$GITHUB_OUTPUT"
          test "${#SKILL_PATHS[@]}" -gt 0
          test "${#SKILL_PATHS[@]}" -eq "${#TARGET_PATHS[@]}"
          echo "Frozen pending skills: ${SKILL_PATHS[*]}"

          [[ "$MERGE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Merged PR has no exact merge commit identity"
            exit 1
          }
          git fetch --no-tags --depth=1 origin "$MERGE_COMMIT_SHA"
          for PENDING_DIR in "${SKILL_PATHS[@]}"; do
            git diff --quiet "$MERGE_COMMIT_SHA" HEAD -- "$PENDING_DIR" || {
              echo "::error::Pending skill changed after the reviewed merge: $PENDING_DIR"
              exit 1
            }
          done
          while IFS= read -r TARGET_DIR; do
            [ -n "$TARGET_DIR" ] || continue
            git diff --quiet "$MERGE_COMMIT_SHA" HEAD -- "$TARGET_DIR" || {
              echo "::error::Published update target changed after the reviewed merge: $TARGET_DIR"
              exit 1
            }
          done < <(jq -r '.skills[] | select(.update == true) | .targetDir' "$APPROVAL_PLAN")

          echo "=== Moving skills from pending to skills ==="
          for PENDING_DIR in "${SKILL_PATHS[@]}"; do
            TARGET_DIR=$(jq -r --arg pendingDir "$PENDING_DIR" \
              '.skills[] | select(.pendingDir == $pendingDir) | .targetDir' "$APPROVAL_PLAN")

            echo "Moving $PENDING_DIR to $TARGET_DIR"

            IS_DUPLICATE=$(jq -r --arg pendingDir "$PENDING_DIR" \
              '.skills[] | select(.pendingDir == $pendingDir) | .duplicate' "$APPROVAL_PLAN")
            if [ "$IS_DUPLICATE" = "true" ]; then
              test -d "$TARGET_DIR" && test ! -L "$TARGET_DIR" \
                && diff -qr --exclude=skill-report.json "$PENDING_DIR" "$TARGET_DIR" || {
                  echo "::error::Exact duplicate target changed after approval planning: $TARGET_DIR"
                  exit 1
                }
              echo "Published skill already matches; removing duplicate pending submission"
              rm -rf -- "$PENDING_DIR"
              continue
            fi

            IS_UPDATE=$(jq -r --arg pendingDir "$PENDING_DIR" \
              '.skills[] | select(.pendingDir == $pendingDir) | .update' "$APPROVAL_PLAN")
            if [ "$IS_UPDATE" = "true" ]; then
              test -d "$TARGET_DIR" && test ! -L "$TARGET_DIR" || {
                echo "::error::Reviewed update target is missing or unsafe: $TARGET_DIR"
                exit 1
              }
              rm -rf -- "$TARGET_DIR"
              mv "$PENDING_DIR" "$TARGET_DIR"
              continue
            fi

            mkdir -p "$(dirname "$TARGET_DIR")"
            test ! -e "$TARGET_DIR" && test ! -L "$TARGET_DIR" || {
              echo "::error::Refusing to overwrite existing published target $TARGET_DIR"
              exit 1
            }
            mv "$PENDING_DIR" "$TARGET_DIR"
          done

          echo "=== Committing and pushing ==="
          git add -A -f -- "${SKILL_PATHS[@]}" "${TARGET_PATHS[@]}"
          PROVIDER_SYNC_REQUIRED=false
          if ! git diff --staged --quiet -- "${TARGET_PATHS[@]}"; then
            PROVIDER_SYNC_REQUIRED=true
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            SUBMISSION_TAG=""
            if [ -n "$SUBMISSION_ID" ]; then
              SUBMISSION_TAG=" [submission: $SUBMISSION_ID]"
            fi

            git commit \
              -m "Approve skills: $SKILL_NAMES$SUBMISSION_TAG" \
              -m "AgentCrew-Publication: $CORRELATION_ID"

            # Configure git remote URL with authentication token
            echo "🔑 Configuring git authentication..."
            git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${REPOSITORY}.git"

            # Push with bounded, lossless retry for main-branch races. A rebase
            # conflict or an exhausted retry window is a hard failure; never report
            # a merged callback after dropping the publication commit.
            PUSHED=false
            verify_update_parent() {
              local target_dir expected_tree expected_ref parent_report parent_tree
              while IFS= read -r target_dir; do
                [ -n "$target_dir" ] || continue
                expected_tree=$(jq -er '.meta.previous_tree_hash' "$target_dir/skill-report.json")
                expected_ref=$(jq -er '.meta.previous_source_ref' "$target_dir/skill-report.json")
                parent_report=$(git show "HEAD^:$target_dir/skill-report.json")
                parent_tree=$(node scripts/resolve-approved-submission.mjs \
                  --tree-hash-at-commit \
                  --repo-root "$PWD" \
                  --commit HEAD^ \
                  --skill-dir "$target_dir")
                jq -e --arg sourceRef "$expected_ref" '.meta.source_ref == $sourceRef' \
                  <<< "$parent_report" >/dev/null && [ "$parent_tree" = "$expected_tree" ] || {
                    echo "::error::Published update target changed before push: $target_dir"
                    exit 1
                  }
              done < <(jq -r '.skills[] | select(.update == true) | .targetDir' "$APPROVAL_PLAN")
            }
            # Keep every merged approval lossless under bursty main-branch writes.
            # ponytail: optimistic remote serialization; add a durable queue only if
            # contention still exceeds this bounded retry window.
            for i in {1..12}; do
              git fetch origin main
              git rebase origin/main
              verify_update_parent
              if git push origin HEAD:main; then
                echo "✅ Successfully pushed to main"
                PUSHED=true
                break
              fi
              echo "Push failed after a clean rebase; retrying ($i/12)..."
              sleep "$((i * 2 + RANDOM % 3))"
            done
            test "$PUSHED" = true || {
              echo "::error::Failed to publish approved skills after 12 attempts"
              exit 1
            }
          fi
          echo "provider_sync_required=$PROVIDER_SYNC_REQUIRED" >> "$GITHUB_OUTPUT"

      - name: Notify skillstore - Resolved
        if: steps.freeze_pr.outputs.submission_id != ''
        env:
          DUPLICATE_ONLY: ${{ steps.publish.outputs.duplicate_only }}
          SUBMISSION_ID: ${{ steps.freeze_pr.outputs.submission_id }}
          SKILLSTORE_API_URL: ${{ secrets.SKILLSTORE_API_URL }}
          SKILLSTORE_CALLBACK_TOKEN: ${{ secrets.SKILLSTORE_CALLBACK_TOKEN }}
          PR_URL: ${{ steps.freeze_pr.outputs.pr_url }}
          PR_NUMBER: ${{ steps.freeze_pr.outputs.pr_number }}
          MERGED_BY: ${{ steps.freeze_pr.outputs.merged_by }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        run: |
          set -euo pipefail
          if [ -z "$SKILLSTORE_API_URL" ] || [ -z "$SKILLSTORE_CALLBACK_TOKEN" ]; then
            echo "::error::Skillstore callback secrets are not configured"
            exit 1
          fi
          EVENT="merged"
          REASON=""
          if [ "$DUPLICATE_ONLY" = "true" ]; then
            EVENT="rejected"
            REASON="All reviewed skills already exist at the same immutable source and canonical tree."
          fi
          PAYLOAD=$(jq -n \
            --arg submission_id "$SUBMISSION_ID" \
            --arg event "$EVENT" \
            --arg pr_url "$PR_URL" \
            --arg pr_number "$PR_NUMBER" \
            --arg merged_by "$MERGED_BY" \
            --arg reason "$REASON" \
            --arg workflow_run_id "${{ github.run_id }}" \
            --arg workflow_run_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              submission_id: $submission_id,
              event: $event,
              pr_url: $pr_url,
              pr_number: ($pr_number | tonumber),
              workflow_run_id: ($workflow_run_id | tonumber),
              workflow_run_url: $workflow_run_url
            } + if $event == "rejected" then {
              rejected_by: $merged_by,
              reason: $reason
            } else {
              merged_by: $merged_by
            } end')
          echo "📤 Notifying skillstore: submission $SUBMISSION_ID $EVENT"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 --retry-max-time 120 --retry-connrefused \
            --connect-timeout 10 --max-time 30 \
            -X POST "$SKILLSTORE_API_URL/api/submit/callback" \
            -H "Authorization: Bearer $SKILLSTORE_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions/SkillstoreBot" \
            -H "X-Skillstore-Callback: true" \
            -H "Idempotency-Key: publication-resolved-${CORRELATION_ID}" \
            -d "$PAYLOAD"

      - name: Record durable publication result
        if: always() && steps.publication_claim.outputs.owns_reservation == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          MERGE_COMMIT_SHA: ${{ steps.freeze_pr.outputs.merge_commit_sha }}
          PROVIDER_SYNC_REQUIRED: ${{ steps.publish.outputs.provider_sync_required }}
          REPOSITORY: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          CONTEXT="agentcrew/publication/$(printf '%s' "$CORRELATION_ID" | sha256sum | awk '{print $1}')"
          if [ "$JOB_STATUS" != success ]; then
            gh api --method POST "repos/$REPOSITORY/statuses/$MERGE_COMMIT_SHA" \
              -f state=failure -f context="$CONTEXT" \
              -f description='Correlated publication failed; inspection required' \
              -f target_url="https://github.com/$REPOSITORY/actions/runs/${{ github.run_id }}"
            exit 0
          fi
          if [ "$PROVIDER_SYNC_REQUIRED" != true ]; then
            gh api --method POST "repos/$REPOSITORY/statuses/$MERGE_COMMIT_SHA" \
              -f state=success -f context="$CONTEXT" \
              -f description='Publication completed; no provider changes required' \
              -f target_url="https://github.com/$REPOSITORY/actions/runs/${{ github.run_id }}"
            exit 0
          fi
          STATUSES=$(gh api --paginate "repos/$REPOSITORY/commits/$MERGE_COMMIT_SHA/statuses?per_page=100" | jq -s 'add')
          CURRENT_STATE=$(jq -r --arg context "$CONTEXT" '[.[] | select(.context == $context)][0].state // ""' <<< "$STATUSES")
          if [ "$CURRENT_STATE" = success ] || [ "$CURRENT_STATE" = failure ]; then
            echo "::notice::Provider sync already recorded $CURRENT_STATE; refusing to regress it"
            exit 0
          fi
          echo "::notice::Publication completed; the unique push sync owns provider completion"
