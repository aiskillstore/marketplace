name: On PR Merge - Approve Skill

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  approve-skill:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'pending-review')
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Extract submission ID from PR body
        id: extract_submission
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Extract submission ID from PR body: **Submission ID**: `UUID`
          SUBMISSION_ID=$(echo "$PR_BODY" | grep -oE 'Submission ID.*`[0-9a-f-]{36}`' | grep -oE '[0-9a-f-]{36}' || echo "")
          echo "submission_id=$SUBMISSION_ID" >> $GITHUB_OUTPUT
          if [ -n "$SUBMISSION_ID" ]; then
            echo "📋 Found submission ID: $SUBMISSION_ID"
          else
            echo "⚠️ No submission ID found in PR body"
          fi

      - name: Find pending skills and commit to skills directory
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          SUBMISSION_ID: ${{ steps.extract_submission.outputs.submission_id }}
        run: |
          set -euo pipefail

          # Use temp directory for clean git operations
          WORK_DIR="/tmp/marketplace-approve-${{ github.run_id }}"

          cleanup() {
            echo "🧹 Cleaning up temp directory..."
            rm -rf "$WORK_DIR" "${WORK_DIR}.approval-plan.json" "${WORK_DIR}.pr-files.txt" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "📦 Cloning fresh repository to $WORK_DIR..."
          git clone --depth 1 "https://x-access-token:${APP_TOKEN}@github.com/${REPOSITORY}.git" "$WORK_DIR"
          cd "$WORK_DIR"

          git config user.name "ai-skill-store[bot]"
          git config user.email "2628292+ai-skill-store[bot]@users.noreply.github.com"

          # Freeze approval scope to this merged PR. Never scan the repository's
          # shared pending tree: another submission may be present concurrently.
          PR_FILES="${WORK_DIR}.pr-files.txt"
          APPROVAL_PLAN="${WORK_DIR}.approval-plan.json"
          gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' > "$PR_FILES"
          node scripts/resolve-approved-submission.mjs \
            --repo-root "$WORK_DIR" \
            --files "$PR_FILES" \
            --output "$APPROVAL_PLAN"

          mapfile -t SKILL_PATHS < <(jq -r '.skills[].pendingDir' "$APPROVAL_PLAN")
          SKILL_NAMES=$(jq -r '[.skills[].reportSlug | "/" + .] | join(" ")' "$APPROVAL_PLAN")
          test "${#SKILL_PATHS[@]}" -gt 0
          echo "Frozen pending skills: ${SKILL_PATHS[*]}"

          [[ "$MERGE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Merged PR has no exact merge commit identity"
            exit 1
          }
          git fetch --no-tags --depth=1 origin "$MERGE_COMMIT_SHA"
          for PENDING_DIR in "${SKILL_PATHS[@]}"; do
            git diff --quiet "$MERGE_COMMIT_SHA" HEAD -- "$PENDING_DIR" || {
              echo "::error::Pending skill changed after the reviewed merge: $PENDING_DIR"
              exit 1
            }
          done

          echo "=== Moving skills from pending to skills ==="
          for PENDING_DIR in "${SKILL_PATHS[@]}"; do
            if [ -d "$PENDING_DIR" ] && [ -f "$PENDING_DIR/SKILL.md" ]; then
              TARGET_DIR=$(jq -r --arg pendingDir "$PENDING_DIR" \
                '.skills[] | select(.pendingDir == $pendingDir) | .targetDir' "$APPROVAL_PLAN")

              echo "Moving $PENDING_DIR to $TARGET_DIR"

              mkdir -p "$(dirname "$TARGET_DIR")"
              test ! -e "$TARGET_DIR" || {
                echo "::error::Refusing to overwrite existing published target $TARGET_DIR"
                exit 1
              }
              mv "$PENDING_DIR" "$TARGET_DIR"
            fi
          done

          echo "=== Committing and pushing ==="
          # Stage all changes including deletions from pending/
          git add -A

          # Remove empty pending directory
          if [ -d "pending" ] && [ -z "$(ls -A pending 2>/dev/null)" ]; then
            rmdir pending 2>/dev/null || true
            git add -A
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            SUBMISSION_TAG=""
            if [ -n "$SUBMISSION_ID" ]; then
              SUBMISSION_TAG=" [submission: $SUBMISSION_ID]"
            fi

            git commit -m "Approve skills: $SKILL_NAMES$SUBMISSION_TAG"

            # Configure git remote URL with authentication token
            echo "🔑 Configuring git authentication..."
            git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${REPOSITORY}.git"

            # Push with bounded, lossless retry for main-branch races. A rebase
            # conflict or three rejected pushes is a hard failure; never report
            # a merged callback after dropping the publication commit.
            PUSHED=false
            for i in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "✅ Successfully pushed to main"
                PUSHED=true
                break
              fi
              echo "Push failed after a clean rebase; retrying ($i/3)..."
              sleep 2
            done
            test "$PUSHED" = true || {
              echo "::error::Failed to publish approved skills after 3 attempts"
              exit 1
            }
          fi

      - name: Notify skillstore - Merged
        if: steps.extract_submission.outputs.submission_id != ''
        env:
          SUBMISSION_ID: ${{ steps.extract_submission.outputs.submission_id }}
          SKILLSTORE_API_URL: ${{ secrets.SKILLSTORE_API_URL }}
          SKILLSTORE_CALLBACK_TOKEN: ${{ secrets.SKILLSTORE_CALLBACK_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: |
          echo "📤 Notifying skillstore: submission $SUBMISSION_ID merged"
          curl -sS -X POST "$SKILLSTORE_API_URL/api/submit/callback" \
            -H "Authorization: Bearer $SKILLSTORE_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions/SkillstoreBot" \
            -H "X-Skillstore-Callback: true" \
            -d '{
              "submission_id": "'"$SUBMISSION_ID"'",
              "event": "merged",
              "pr_url": "'"$PR_URL"'",
              "pr_number": '"$PR_NUMBER"',
              "merged_by": "'"$MERGED_BY"'",
              "workflow_run_id": ${{ github.run_id }},
              "workflow_run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' || echo "::warning::Failed to notify skillstore"
