name: On PR Merge - Approve Skill

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  approve-skill:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'pending-review')
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Extract submission ID from PR body
        id: extract_submission
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Extract submission ID from PR body: **Submission ID**: `UUID`
          SUBMISSION_ID=$(echo "$PR_BODY" | grep -oE 'Submission ID.*`[0-9a-f-]{36}`' | grep -oE '[0-9a-f-]{36}' || echo "")
          echo "submission_id=$SUBMISSION_ID" >> $GITHUB_OUTPUT
          if [ -n "$SUBMISSION_ID" ]; then
            echo "📋 Found submission ID: $SUBMISSION_ID"
          else
            echo "⚠️ No submission ID found in PR body"
          fi

      - name: Find pending skills and commit to skills directory
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          SUBMISSION_ID: ${{ steps.extract_submission.outputs.submission_id }}
        run: |
          set -euo pipefail

          # Use temp directory for clean git operations
          WORK_DIR="/tmp/marketplace-approve-${{ github.run_id }}"

          cleanup() {
            echo "🧹 Cleaning up temp directory..."
            rm -rf "$WORK_DIR" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "📦 Cloning fresh repository to $WORK_DIR..."
          git clone --depth 1 "https://x-access-token:${APP_TOKEN}@github.com/${REPOSITORY}.git" "$WORK_DIR"
          cd "$WORK_DIR"

          git config user.name "ai-skill-store[bot]"
          git config user.email "2628292+ai-skill-store[bot]@users.noreply.github.com"

          # Resolve every skill before moving anything. The resolver supports both:
          # - flat pending/ produced by single-skill CLI output
          # - legacy pending/author/skill-name
          # Flat metadata is trusted only from skill-report.json (author) and
          # SKILL.md frontmatter (slug); unsafe or ambiguous paths fail closed.
          RESOLUTIONS=$(node ./scripts/resolve-pending-skill-path.mjs --repo . --format tsv)

          if [ -z "$RESOLUTIONS" ]; then
            echo "No pending skills found to approve"
            exit 0
          fi

          declare -a PENDING_DIRS=()
          declare -a TARGET_DIRS=()
          SKILL_NAMES=""
          while IFS=$'\t' read -r PENDING_DIR TARGET_DIR AUTHOR SKILL_NAME LAYOUT; do
            [ -n "$PENDING_DIR" ] || continue
            PENDING_DIRS+=("$PENDING_DIR")
            TARGET_DIRS+=("$TARGET_DIR")
            SKILL_NAMES="$SKILL_NAMES /$SKILL_NAME"
            echo "Resolved $LAYOUT pending skill: $PENDING_DIR -> $TARGET_DIR (author=$AUTHOR, slug=$SKILL_NAME)"
          done <<< "$RESOLUTIONS"

          echo "=== Moving skills from pending to skills ==="
          for index in "${!PENDING_DIRS[@]}"; do
            PENDING_DIR="${PENDING_DIRS[$index]}"
            TARGET_DIR="${TARGET_DIRS[$index]}"

            mkdir -p "$(dirname "$TARGET_DIR")"
            if [ -d "$TARGET_DIR" ]; then
              rm -rf -- "$TARGET_DIR"
            fi
            mv -- "$PENDING_DIR" "$TARGET_DIR"
            if [ "$PENDING_DIR" != "pending" ]; then
              rmdir -- "$(dirname "$PENDING_DIR")" 2>/dev/null || true
            fi
          done

          echo "=== Committing and pushing ==="
          # Stage all changes including deletions from pending/
          git add -A

          # Remove empty pending directory
          if [ -d "pending" ] && [ -z "$(ls -A pending 2>/dev/null)" ]; then
            rmdir pending 2>/dev/null || true
            git add -A
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            SUBMISSION_TAG=""
            if [ -n "$SUBMISSION_ID" ]; then
              SUBMISSION_TAG=" [submission: $SUBMISSION_ID]"
            fi

            git commit -m "Approve skills:$SKILL_NAMES$SUBMISSION_TAG"

            # Configure git remote URL with authentication token
            echo "🔑 Configuring git authentication..."
            git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${REPOSITORY}.git"

            # Push with retry for race conditions
            for i in 1 2 3; do
              if git push origin main; then
                echo "✅ Successfully pushed to main"
                break
              fi
              echo "Push failed, pulling latest and retrying ($i/3)..."
              git pull --rebase origin main || {
                # If rebase fails, abort and retry with fresh state
                git rebase --abort 2>/dev/null || true
                git reset --hard origin/main
                git cherry-pick HEAD@{1} || true
              }
              sleep 2
            done
          fi

      - name: Notify skillstore - Merged
        if: steps.extract_submission.outputs.submission_id != ''
        env:
          SUBMISSION_ID: ${{ steps.extract_submission.outputs.submission_id }}
          SKILLSTORE_API_URL: ${{ secrets.SKILLSTORE_API_URL }}
          SKILLSTORE_CALLBACK_TOKEN: ${{ secrets.SKILLSTORE_CALLBACK_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: |
          echo "📤 Notifying skillstore: submission $SUBMISSION_ID merged"
          curl -sS -X POST "$SKILLSTORE_API_URL/api/submit/callback" \
            -H "Authorization: Bearer $SKILLSTORE_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions/SkillstoreBot" \
            -H "X-Skillstore-Callback: true" \
            -d '{
              "submission_id": "'"$SUBMISSION_ID"'",
              "event": "merged",
              "pr_url": "'"$PR_URL"'",
              "pr_number": '"$PR_NUMBER"',
              "merged_by": "'"$MERGED_BY"'",
              "workflow_run_id": ${{ github.run_id }},
              "workflow_run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' || echo "::warning::Failed to notify skillstore"
