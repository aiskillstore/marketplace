name: Validate Marketplace

on:
  push:
    branches: [main]
    paths:
      # Only validate approved skills on push to main
      - "skills/**/SKILL.md"
      - "skills/**/skill-report.json"
      - "skills/**/SKILL.md"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "scripts/check-workflow-action-pins.mjs"
      - "scripts/resolve-approved-submission.mjs"
      - "scripts/detect-changed-skills.mjs"
      - "scripts/resolve-manual-skills.mjs"
      - "scripts/materialize-changed-skills.mjs"
      - "scripts/rebind-skill-report-hashes.mjs"
      - "scripts/verify-recovered-skill-reports.mjs"
      - "scripts/recovered-skill-reports.test.mjs"
      - "scripts/tests/**"
  pull_request:
    branches: [main]
    paths:
      # Validate both pending and skills on PR (CI gate)
      - "skills/**/SKILL.md"
      - "skills/**/skill-report.json"
      - "skills/**/SKILL.md"
      - "pending/**/SKILL.md"
      - "pending/**/skill-report.json"
      - "pending/**/SKILL.md"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "scripts/check-workflow-action-pins.mjs"
      - "scripts/resolve-approved-submission.mjs"
      - "scripts/detect-changed-skills.mjs"
      - "scripts/resolve-manual-skills.mjs"
      - "scripts/materialize-changed-skills.mjs"
      - "scripts/rebind-skill-report-hashes.mjs"
      - "scripts/verify-recovered-skill-reports.mjs"
      - "scripts/recovered-skill-reports.test.mjs"
      - "scripts/tests/**"
  workflow_dispatch:

env:
  # Enable auto-fix for push, PRs, and manual triggers (set to 'false' to disable)
  AUTO_FIX_ENABLED: ${{ contains(fromJSON('["pull_request", "push", "workflow_dispatch"]'), github.event_name) }}

jobs:
  action-pin-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Test workflow action pin policy
        run: node --test scripts/tests/workflow-action-pin-policy.test.mjs

      - name: Enforce workflow action pin policy
        run: node scripts/check-workflow-action-pins.mjs

  validate:
    needs: action-pin-policy
    runs-on: self-hosted
    timeout-minutes: 1440 # 24 hours
    permissions:
      contents: write  # Required for git push operations
      pull-requests: write  # Required for PR operations if any
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: marketplace,skillstore

      - name: Setup isolated temporary workspace
        id: setup-workspace
        env:
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # Determine branch name
          if [ "$EVENT_NAME" == "pull_request" ]; then
            BRANCH="$HEAD_REF"
          else
            BRANCH="$REF_NAME"
          fi

          # Create unique temporary directory for this workflow run
          WORK_DIR="/tmp/marketplace-validate-$RUN_ID"

          echo "WORK_DIR=$WORK_DIR" >> $GITHUB_ENV
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "work_dir=$WORK_DIR" >> $GITHUB_OUTPUT

          echo "📁 Creating temporary workspace: $WORK_DIR"
          echo "🌿 Target branch: $BRANCH"

          # Cleanup any existing directory
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"

          # Clone repository to temporary workspace
          echo "📦 Cloning repository..."
          git clone --depth 1 --branch "$BRANCH" \
            "https://x-access-token:${APP_TOKEN}@github.com/${REPOSITORY}.git" \
            "$WORK_DIR"

          cd "$WORK_DIR"

          AUTO_FIX_BASE_SHA=$(git rev-parse HEAD)
          echo "AUTO_FIX_BASE_SHA=$AUTO_FIX_BASE_SHA" >> "$GITHUB_ENV"

          # Configure git for potential commits
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "✅ Workspace setup complete"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: ${{ env.WORK_DIR }}
        run: npm install ajv ajv-formats gray-matter

      - name: Validate submission scope contracts
        working-directory: ${{ env.WORK_DIR }}
        env:
          CI: "true"
        run: |
          node --test \
            scripts/tests/resolve-approved-submission.test.mjs \
            scripts/tests/submission-existing-targets.test.mjs \
            scripts/tests/submission-source-resolution.test.mjs \
            scripts/tests/submission-runtime-workflow.test.mjs \
            scripts/tests/submission-scope-workflows.test.mjs \
            scripts/tests/detect-changed-skills.test.mjs \
            scripts/tests/resolve-manual-skills.test.mjs \
            scripts/tests/materialize-changed-skills.test.mjs \
            scripts/tests/rebind-skill-report-hashes.test.mjs \
            scripts/tests/validate-marketplace-autofix.test.mjs \
            scripts/recovered-skill-reports.test.mjs

      # Download CLI once at start - used by both SKILL.md and skill-report.json auto-fix steps
      - name: Checkout for CLI download action
        if: env.AUTO_FIX_ENABLED == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: marketplace-repo
          persist-credentials: false

      - name: Download skillstore CLI for auto-fix
        if: env.AUTO_FIX_ENABLED == 'true'
        uses: ./marketplace-repo/.github/actions/download-skillstore-cli
        with:
          version: latest
          token: ${{ steps.app-token.outputs.token }}
          cache-dir: /home/runner/_work/_cache/skillstore-cli  # Persistent local cache for self-hosted runners

      - name: Validate SKILL.md files have proper YAML frontmatter
        id: validate-skill-md
        continue-on-error: true
        working-directory: ${{ env.WORK_DIR }}
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const matter = require('gray-matter');

            /**
             * Validate that content has valid SKILL.md structure (YAML frontmatter + required fields)
             * Returns array of error messages, empty if valid
             */
            function validateSkillMdContent(rawContent, dirName) {
              const errors = [];

              // Check for binary content (null bytes)
              if (rawContent.includes('\\x00')) {
                return ['File contains binary content - skipping'];
              }

              // Check for YAML frontmatter delimiters
              if (!rawContent.startsWith('---')) {
                errors.push('Missing YAML frontmatter (must start with ---)');
                return errors;
              }

              // Check for closing delimiter
              const endIndex = rawContent.indexOf('---', 3);
              if (endIndex === -1) {
                errors.push('Missing closing YAML frontmatter delimiter (---)');
                return errors;
              }

              // Check if frontmatter section has content
              const frontmatterContent = rawContent.slice(3, endIndex).trim();
              if (!frontmatterContent) {
                errors.push('Empty YAML frontmatter (no metadata found)');
                return errors;
              }

              // Parse with gray-matter for field validation
              try {
                const { data } = matter(rawContent);

                // Check required field: name
                // Per specification: lowercase alphanumeric + hyphens only, 1-64 chars
                const NAME_PATTERN = /^[a-z0-9]+(-[a-z0-9]+)*$/;
                if (!data.name) {
                  errors.push('Missing required field: name');
                } else if (typeof data.name !== 'string') {
                  errors.push('Field \"name\" must be a string');
                } else if (data.name.length > 64) {
                  errors.push('Field \"name\" exceeds 64 characters');
                } else if (!NAME_PATTERN.test(data.name)) {
                  errors.push(\`Field \"name\" must be lowercase alphanumeric with hyphens (got: \${data.name})\`);
                }

                // Check required field: description
                if (!data.description) {
                  errors.push('Missing required field: description');
                }
              } catch (e) {
                errors.push(\`Failed to parse YAML frontmatter: \${e.message}\`);
              }

              return errors;
            }

            const findSkillMdFiles = (dir) => {
              const files = [];
              if (!fs.existsSync(dir)) return files;
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (const entry of entries) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  files.push(...findSkillMdFiles(fullPath));
                } else if (entry.name === 'SKILL.md') {
                  files.push(fullPath);
                }
              }
              return files;
            };

            const skillMdFiles = [...findSkillMdFiles('skills'), ...findSkillMdFiles('pending')];
            let hasInvalidFiles = false;
            let skippedBinary = 0;

            for (const file of skillMdFiles) {
              try {
                const content = fs.readFileSync(file, 'utf8');

                // Check if content is empty or looks binary
                if (!content.trim()) {
                  console.log(\`Skipping empty file: \${file}\`);
                  skippedBinary++;
                  continue;
                }

                const dirName = path.basename(path.dirname(file));
                const validationErrors = validateSkillMdContent(content, dirName);

                if (validationErrors.length > 0) {
                  // Check if it's just a binary skip
                  if (validationErrors[0].includes('binary content')) {
                    console.log(\`Skipping binary file: \${file}\`);
                    skippedBinary++;
                    continue;
                  }

                  console.error(\`::error file=\${file}::\${validationErrors.join('; ')}\`);
                  console.error(\`  Skill: \${file}\`);
                  for (const err of validationErrors) {
                    console.error(\`    - \${err}\`);
                  }
                  hasInvalidFiles = true;
                }
              } catch (e) {
                console.error(\`::error file=\${file}::Failed to read file: \${e.message}\`);
                hasInvalidFiles = true;
              }
            }

            if (hasInvalidFiles) {
              console.error('\\n❌ Invalid SKILL.md files detected');
              console.error('These skills must have proper YAML frontmatter with name and description fields.');
              process.exit(1);
            }

            console.log(\`✅ All \${skillMdFiles.length - skippedBinary} SKILL.md files are valid (skipped \${skippedBinary} binary/empty files)\`);
          "

      - name: Auto-fix SKILL.md validation errors
        if: steps.validate-skill-md.outcome == 'failure' && env.AUTO_FIX_ENABLED == 'true'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          echo "::notice::SKILL.md validation failed. Attempting AI-powered auto-fix..."

          # First, delete empty SKILL.md files (they can't be fixed)
          echo "🗑️ Checking for empty SKILL.md files to delete..."
          DELETED_COUNT=0
          for dir in skills pending; do
            if [ -d "$dir" ]; then
              while IFS= read -r -d '' file; do
                if [ ! -s "$file" ] || [ -z "$(cat "$file" | tr -d '[:space:]')" ]; then
                  PARENT_DIR=$(dirname "$file")
                  echo "Deleting empty skill directory: $PARENT_DIR"
                  rm -rf "$PARENT_DIR"
                  DELETED_COUNT=$((DELETED_COUNT + 1))
                fi
              done < <(find "$dir" -name "SKILL.md" -print0 2>/dev/null)
            fi
          done
          if [ "$DELETED_COUNT" -gt 0 ]; then
            echo "::notice::Deleted $DELETED_COUNT empty skill directories"
          fi

          echo "Running AI-powered fix-md on skills directory..."
          "$GITHUB_WORKSPACE/skillstore-cli" skill fix-md ./skills || true

          echo "Running AI-powered fix-md on pending directory..."
          "$GITHUB_WORKSPACE/skillstore-cli" skill fix-md ./pending || true

          echo "::notice::SKILL.md auto-fix completed. Re-validating..."

      - name: Rebind reports to auto-fixed SKILL.md artifacts
        if: steps.validate-skill-md.outcome == 'failure' && env.AUTO_FIX_ENABLED == 'true'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -euo pipefail
          CHANGED_SKILLS="$RUNNER_TEMP/auto-fixed-skill-paths-${{ github.run_id }}.bin"
          git diff --name-only -z --diff-filter=ACMRT HEAD -- \
            'skills/**/SKILL.md' 'pending/**/SKILL.md' > "$CHANGED_SKILLS"
          if [ ! -s "$CHANGED_SKILLS" ]; then
            if ! git diff --quiet --diff-filter=D HEAD -- 'skills/**/SKILL.md' 'pending/**/SKILL.md'; then
              echo "::notice::Auto-fix only deleted invalid SKILL.md artifacts; no surviving report hashes to rebind"
              exit 0
            fi
            echo "::error::SKILL.md auto-fix reported success without a changed SKILL.md artifact"
            exit 1
          fi
          node scripts/rebind-skill-report-hashes.mjs \
            --repo-root "$PWD" \
            --skill-paths-file "$CHANGED_SKILLS"

      - name: Re-validate SKILL.md after auto-fix
        if: steps.validate-skill-md.outcome == 'failure' && env.AUTO_FIX_ENABLED == 'true'
        id: revalidate-skill-md
        working-directory: ${{ env.WORK_DIR }}
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const matter = require('gray-matter');

            function validateSkillMdContent(rawContent, dirName) {
              const errors = [];
              if (rawContent.includes('\\x00')) return ['binary'];
              if (!rawContent.startsWith('---')) {
                errors.push('Missing YAML frontmatter');
                return errors;
              }
              const endIndex = rawContent.indexOf('---', 3);
              if (endIndex === -1) {
                errors.push('Missing closing YAML delimiter');
                return errors;
              }
              try {
                const { data } = matter(rawContent);
                const NAME_PATTERN = /^[a-z0-9]+(-[a-z0-9]+)*$/;
                if (!data.name) errors.push('Missing name');
                else if (!NAME_PATTERN.test(data.name)) errors.push('Invalid name format');
                if (!data.description) errors.push('Missing description');
              } catch (e) {
                errors.push('YAML parse error');
              }
              return errors;
            }

            const findSkillMdFiles = (dir) => {
              const files = [];
              if (!fs.existsSync(dir)) return files;
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (const entry of entries) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) files.push(...findSkillMdFiles(fullPath));
                else if (entry.name === 'SKILL.md') files.push(fullPath);
              }
              return files;
            };

            const skillMdFiles = [...findSkillMdFiles('skills'), ...findSkillMdFiles('pending')];
            let hasInvalidFiles = false;
            let fixedCount = 0;

            for (const file of skillMdFiles) {
              try {
                const content = fs.readFileSync(file, 'utf8');
                if (!content.trim()) continue;
                const dirName = path.basename(path.dirname(file));
                const errors = validateSkillMdContent(content, dirName);
                if (errors.length > 0 && errors[0] !== 'binary') {
                  console.error(\`Still invalid: \${file} - \${errors.join(', ')}\`);
                  hasInvalidFiles = true;
                } else {
                  fixedCount++;
                }
              } catch (e) {
                console.error(\`Error reading \${file}: \${e.message}\`);
                hasInvalidFiles = true;
              }
            }

            console.log(\`Validation summary: \${fixedCount}/\${skillMdFiles.length} files valid\`);
            if (hasInvalidFiles) {
              console.error('Some SKILL.md files still have validation errors after auto-fix');
              process.exit(1);
            }
            console.log('All SKILL.md files are now valid after auto-fix');
          "

      - name: Commit auto-fixed SKILL.md artifacts locally
        if: steps.validate-skill-md.outcome == 'failure' && env.AUTO_FIX_ENABLED == 'true' && steps.revalidate-skill-md.outcome == 'success'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -euo pipefail

          # Check if there are any changes (modifications or deletions)
          if git diff --quiet && git status --porcelain | grep -qE '^\s*D|^\?\?'; then
            : # There are deletions or untracked changes
          elif git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Stage all changes (modifications and deletions)
          git add -A

          # Count changes by type
          MODIFIED_COUNT=$(git diff --cached --diff-filter=M --name-only | wc -l | tr -d ' ')
          DELETED_COUNT=$(git diff --cached --diff-filter=D --name-only | wc -l | tr -d ' ')
          TOTAL_COUNT=$((MODIFIED_COUNT + DELETED_COUNT))

          if [ "$TOTAL_COUNT" -eq 0 ]; then
            echo "No changes to commit after staging"
            exit 0
          fi

          # Build commit message
          COMMIT_MSG="fix: auto-fix SKILL.md validation errors

          AI-powered fix applied by GitHub Actions workflow."
          [ "$MODIFIED_COUNT" -gt 0 ] && COMMIT_MSG="$COMMIT_MSG
          Fixed $MODIFIED_COUNT file(s)."
          [ "$DELETED_COUNT" -gt 0 ] && COMMIT_MSG="$COMMIT_MSG
          Deleted $DELETED_COUNT empty skill directory(s)."
          COMMIT_MSG="$COMMIT_MSG

          Co-Authored-By: Claude <noreply@anthropic.com>"

          git commit -m "$COMMIT_MSG"
          echo "::notice::Staged SKILL.md and bound report fixes in a local commit; publishing waits for all validation repairs"

      - name: Fail if SKILL.md errors remain
        if: steps.validate-skill-md.outcome == 'failure' && (env.AUTO_FIX_ENABLED != 'true' || steps.revalidate-skill-md.outcome == 'failure')
        run: |
          echo "::error::SKILL.md validation failed"
          exit 1

      - name: Validate skill-report.json files
        id: validate-skill-reports
        continue-on-error: true
        working-directory: ${{ env.WORK_DIR }}
        run: |
          node -e "
            const Ajv = require('ajv');
            const addFormats = require('ajv-formats');
            const fs = require('fs');
            const path = require('path');

            const ajv = new Ajv({ allErrors: true });
            addFormats(ajv);

            const schema = JSON.parse(fs.readFileSync('schemas/skill-report.schema.json', 'utf8'));
            const validate = ajv.compile(schema);

            let hasErrors = false;

            const findReportFiles = (dir) => {
              const files = [];
              if (!fs.existsSync(dir)) return files;
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (const entry of entries) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  files.push(...findReportFiles(fullPath));
                } else if (entry.name === 'skill-report.json') {
                  files.push(fullPath);
                }
              }
              return files;
            };

            const reportFiles = [...findReportFiles('skills'), ...findReportFiles('pending')];

            let validCount = 0;
            for (const file of reportFiles) {
              try {
                const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                const valid = validate(data);
                if (!valid) {
                  console.error(\`Validation errors in \${file}:\`, JSON.stringify(validate.errors, null, 2));
                  hasErrors = true;
                } else {
                  validCount++;
                }
              } catch (e) {
                console.error(\`Error reading \${file}:\`, e.message);
                hasErrors = true;
              }
            }

            if (hasErrors) process.exit(1);
            if (reportFiles.length === 0) {
              console.log('No skill-report.json files found (OK for empty marketplace)');
            } else {
              console.log(\`Validated \${reportFiles.length} skill-report.json file(s): \${validCount} valid, \${reportFiles.length - validCount} invalid\`);
            }
          "

      - name: Verify changed skill-report hash contracts
        working-directory: ${{ env.WORK_DIR }}
        env:
          VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if ! [[ "$VALIDATION_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || [ "$VALIDATION_BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::No immutable comparison SHA is available; changed report hash verification is not applicable"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$VALIDATION_BASE_SHA"
          CHANGED_ARTIFACTS="$RUNNER_TEMP/changed-report-artifact-paths-${GITHUB_RUN_ID}.bin"
          git diff --no-renames --name-only -z --diff-filter=ACMRT \
            "$VALIDATION_BASE_SHA" HEAD -- \
            'skills/**/SKILL.md' 'skills/**/skill-report.json' \
            'pending/**/SKILL.md' 'pending/**/skill-report.json' > "$CHANGED_ARTIFACTS"

          node --input-type=module - "$CHANGED_ARTIFACTS" <<'NODE'
          import { createHash } from 'node:crypto';
          import { existsSync, readFileSync } from 'node:fs';
          import { dirname } from 'node:path';
          import { calculateCanonicalTreeHash } from './scripts/resolve-approved-submission.mjs';

          const changedPaths = readFileSync(process.argv[2], 'utf8').split('\0').filter(Boolean);
          const reportPaths = [...new Set(changedPaths.map((path) => `${dirname(path)}/skill-report.json`))].sort();
          for (const reportPath of reportPaths) {
            const skillDirectory = dirname(reportPath);
            const skillPath = `${skillDirectory}/SKILL.md`;
            if (!existsSync(skillPath)) throw new Error(`${skillPath} is missing for changed report`);
            const report = JSON.parse(readFileSync(reportPath, 'utf8'));
            const contentHash = createHash('sha256').update(readFileSync(skillPath)).digest('hex');
            const treeHash = calculateCanonicalTreeHash(process.cwd(), skillDirectory);
            if (report?.meta?.content_hash !== contentHash) {
              throw new Error(`${reportPath} content_hash does not match packaged SKILL.md bytes`);
            }
            if (report?.meta?.tree_hash !== treeHash) {
              throw new Error(`${reportPath} tree_hash does not match the packaged skill tree`);
            }
          }
          console.log(`Verified packaged hash contracts for ${reportPaths.length} changed report(s)`);
          NODE

      - name: Auto-fix skill-report.json validation errors (with retry)
        if: steps.validate-skill-reports.outcome == 'failure' && env.AUTO_FIX_ENABLED == 'true'
        id: revalidate
        working-directory: ${{ env.WORK_DIR }}
        run: |
          MAX_ATTEMPTS=3
          ATTEMPT=1
          SUCCESS=false

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo ""
            echo "========================================="
            echo "Auto-fix attempt $ATTEMPT of $MAX_ATTEMPTS"
            echo "========================================="

            echo "Running AI-powered fix on skills directory..."
            "$GITHUB_WORKSPACE/skillstore-cli" skill fix ./skills --schema ./schemas/skill-report.schema.json || true

            echo "Running AI-powered fix on pending directory..."
            "$GITHUB_WORKSPACE/skillstore-cli" skill fix ./pending --schema ./schemas/skill-report.schema.json || true

            echo ""
            echo "Re-validating after auto-fix attempt $ATTEMPT..."

            # Run validation
            if node -e "
              const Ajv = require('ajv');
              const addFormats = require('ajv-formats');
              const fs = require('fs');
              const path = require('path');

              const ajv = new Ajv({ allErrors: true });
              addFormats(ajv);

              const schema = JSON.parse(fs.readFileSync('schemas/skill-report.schema.json', 'utf8'));
              const validate = ajv.compile(schema);

              let hasErrors = false;
              let fixedCount = 0;
              let totalCount = 0;

              const findReportFiles = (dir) => {
                const files = [];
                if (!fs.existsSync(dir)) return files;
                const entries = fs.readdirSync(dir, { withFileTypes: true });
                for (const entry of entries) {
                  const fullPath = path.join(dir, entry.name);
                  if (entry.isDirectory()) {
                    files.push(...findReportFiles(fullPath));
                  } else if (entry.name === 'skill-report.json') {
                    files.push(fullPath);
                  }
                }
                return files;
              };

              const reportFiles = [...findReportFiles('skills'), ...findReportFiles('pending')];
              totalCount = reportFiles.length;

              for (const file of reportFiles) {
                try {
                  const data = JSON.parse(fs.readFileSync(file, 'utf8'));
                  const valid = validate(data);
                  if (!valid) {
                    console.error(\`❌ Still invalid: \${file}\`);
                    hasErrors = true;
                  } else {
                    fixedCount++;
                  }
                } catch (e) {
                  console.error(\`❌ Error reading \${file}:\`, e.message);
                  hasErrors = true;
                }
              }

              console.log(\`\n📊 Validation summary: \${fixedCount}/\${totalCount} files valid\`);

              if (hasErrors) {
                console.error('❌ Some files still have validation errors');
                process.exit(1);
              }
              console.log('✅ All skill-report.json files are now valid!');
            "; then
              echo "::notice::Auto-fix succeeded on attempt $ATTEMPT"
              SUCCESS=true
              break
            else
              echo "::warning::Auto-fix attempt $ATTEMPT failed, validation errors remain"
              ATTEMPT=$((ATTEMPT + 1))

              if [ $ATTEMPT -le $MAX_ATTEMPTS ]; then
                echo "Waiting 5 seconds before next attempt..."
                sleep 5
              fi
            fi
          done

          if [ "$SUCCESS" = "false" ]; then
            echo ""
            echo "::error::Auto-fix failed after $MAX_ATTEMPTS attempts"
            exit 1
          fi

      - name: Rebind reports to auto-fixed skill-report artifacts
        if: steps.validate-skill-reports.outcome == 'failure' && env.AUTO_FIX_ENABLED == 'true' && steps.revalidate.outcome == 'success'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -euo pipefail
          CHANGED_REPORTS="$RUNNER_TEMP/auto-fixed-report-paths-${{ github.run_id }}.bin"
          CHANGED_SKILLS="$RUNNER_TEMP/auto-fixed-report-skill-paths-${{ github.run_id }}.bin"

          if ! git diff --no-renames --quiet --diff-filter=D HEAD -- \
            'skills/**/skill-report.json' 'pending/**/skill-report.json'; then
            echo "::error::skill-report.json auto-fix deleted a report; refusing to publish an unbound artifact"
            exit 1
          fi

          git diff --no-renames --name-only -z --diff-filter=ACMRT HEAD -- \
            'skills/**/skill-report.json' 'pending/**/skill-report.json' > "$CHANGED_REPORTS"
          if [ ! -s "$CHANGED_REPORTS" ]; then
            echo "::error::skill-report.json auto-fix reported success without a changed report artifact"
            exit 1
          fi

          while IFS= read -r -d '' report_path; do
            case "$report_path" in
              skills/*/skill-report.json|pending/*/skill-report.json)
                printf '%s\0' "${report_path%/skill-report.json}/SKILL.md"
                ;;
              *)
                echo "::error::Unexpected auto-fixed report path: $report_path"
                exit 1
                ;;
            esac
          done < "$CHANGED_REPORTS" | LC_ALL=C sort -z -u > "$CHANGED_SKILLS"

          node scripts/rebind-skill-report-hashes.mjs \
            --repo-root "$PWD" \
            --skill-paths-file "$CHANGED_SKILLS"

      - name: Verify skill-report hash contract after auto-fix
        if: steps.validate-skill-reports.outcome == 'failure' && env.AUTO_FIX_ENABLED == 'true' && steps.revalidate.outcome == 'success'
        id: revalidate-report-hash-contract
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -euo pipefail
          CHANGED_SKILLS="$RUNNER_TEMP/auto-fixed-report-skill-paths-${{ github.run_id }}.bin"
          test -s "$CHANGED_SKILLS" || {
            echo "::error::Missing affected SKILL.md list for report hash contract validation"
            exit 1
          }

          node --input-type=module - "$CHANGED_SKILLS" <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { dirname } from 'node:path';
          import { calculateCanonicalTreeHash } from './scripts/resolve-approved-submission.mjs';

          const pathsFile = process.argv[2];
          const skillPaths = [...new Set(readFileSync(pathsFile, 'utf8').split('\0').filter(Boolean))].sort();
          if (skillPaths.length === 0) throw new Error('no affected SKILL.md paths were provided');

          for (const skillPath of skillPaths) {
            const skillDirectory = dirname(skillPath);
            const reportPath = `${skillDirectory}/skill-report.json`;
            const report = JSON.parse(readFileSync(reportPath, 'utf8'));
            const contentHash = createHash('sha256').update(readFileSync(skillPath)).digest('hex');
            const treeHash = calculateCanonicalTreeHash(process.cwd(), skillDirectory);
            if (typeof report?.meta?.source_url !== 'string' || !report.meta.source_url.startsWith('https://github.com/')) {
              throw new Error(`${reportPath} has invalid source_url lineage`);
            }
            if (typeof report?.meta?.source_ref !== 'string' || report.meta.source_ref.trim() === '') {
              throw new Error(`${reportPath} has invalid source_ref lineage`);
            }
            if (report?.meta?.content_hash !== contentHash) throw new Error(`${reportPath} content_hash does not match SKILL.md raw bytes`);
            if (report?.meta?.tree_hash !== treeHash) throw new Error(`${reportPath} tree_hash does not match the canonical skill tree`);
          }
          console.log(`Verified report hash contract for ${skillPaths.length} auto-fixed artifact(s)`);
          NODE

      - name: Commit auto-fixed skill-report.json files locally
        if: steps.validate-skill-reports.outcome == 'failure' && env.AUTO_FIX_ENABLED == 'true' && steps.revalidate.outcome == 'success' && steps.revalidate-report-hash-contract.outcome == 'success'
        working-directory: ${{ env.WORK_DIR }}
        run: |
          set -euo pipefail

          echo "📝 Committing auto-fixed skill-report.json files..."

          # Check if there are any changes
          if git diff --quiet && git diff --cached --quiet; then
            echo "No skill-report.json changes to commit"
            exit 0
          fi

          # Stage all changes
          git add -A

          # Commit changes
          git commit -m "fix: auto-fix skill-report.json validation errors

          AI-powered fix applied by GitHub Actions workflow.

          Co-Authored-By: Claude <noreply@anthropic.com>"
          echo "::notice::Committed report repairs locally; publishing waits for the final validation gate"

      - name: Add summary
        if: always()
        run: |
          echo "## Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # SKILL.md validation results
          echo "### SKILL.md Validation" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.validate-skill-md.outcome }}" == "success" ]; then
            echo "✅ All SKILL.md files passed validation" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.revalidate-skill-md.outcome }}" == "success" ]; then
            echo "🔧 SKILL.md validation errors were automatically fixed by AI" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Validated fixes were pushed back to the original same-repository PR head." >> $GITHUB_STEP_SUMMARY
            else
              echo "A dedicated repair PR was created for the validated fixes." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ SKILL.md validation failed" >> $GITHUB_STEP_SUMMARY
            if [ "${{ env.AUTO_FIX_ENABLED }}" == "true" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Auto-fix was attempted but some errors could not be resolved automatically." >> $GITHUB_STEP_SUMMARY
            fi
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # skill-report.json validation results
          echo "### skill-report.json Validation" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.validate-skill-reports.outcome }}" == "success" ]; then
            echo "✅ All skill-report.json files passed validation" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.revalidate.outcome }}" == "success" ]; then
            echo "🔧 skill-report.json validation errors were automatically fixed by AI" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              echo "The fixes have been committed to this PR. Please review the changes." >> $GITHUB_STEP_SUMMARY
            else
              echo "The fixes have been committed directly to ${{ github.ref_name }}." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ skill-report.json validation failed" >> $GITHUB_STEP_SUMMARY
            if [ "${{ env.AUTO_FIX_ENABLED }}" == "true" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Auto-fix was attempted but some errors could not be resolved automatically." >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Fail if validation errors remain
        if: steps.validate-skill-reports.outcome == 'failure' && (env.AUTO_FIX_ENABLED != 'true' || steps.revalidate.outcome == 'failure')
        run: |
          echo "::error::skill-report.json validation failed"
          exit 1

      - name: Publish validated auto-fixes
        if: success() && env.AUTO_FIX_ENABLED == 'true' && (steps.revalidate-skill-md.outcome == 'success' || (steps.revalidate.outcome == 'success' && steps.revalidate-report-hash-contract.outcome == 'success'))
        working-directory: ${{ env.WORK_DIR }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          git diff --quiet
          git diff --cached --quiet
          git merge-base --is-ancestor "$AUTO_FIX_BASE_SHA" HEAD
          test "$(git rev-parse HEAD)" != "$AUTO_FIX_BASE_SHA" || {
            echo "::error::Auto-fix completed without a final repair commit"
            exit 1
          }

          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${REPOSITORY}.git"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$HEAD_REPOSITORY" = "$REPOSITORY" || {
              echo "::error::Refusing to write auto-fixes to fork pull request $HEAD_REPOSITORY"
              exit 1
            }
            test "$HEAD_REF" = "$BRANCH" || {
              echo "::error::Pull request head branch changed during validation"
              exit 1
            }
            git check-ref-format --branch "$BRANCH" >/dev/null
            [[ "$BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] \
              && [[ "$BRANCH" != *..* ]] \
              && [[ "$BRANCH" != *//* ]] \
              && [[ "$BRANCH" != */ ]] || {
              echo "::error::Refusing unsafe pull request head branch $BRANCH"
              exit 1
            }
            REMOTE_SHA=$(git ls-remote origin "refs/heads/$BRANCH" | awk 'NR == 1 {print $1}')
            test "$REMOTE_SHA" = "$AUTO_FIX_BASE_SHA" || {
              echo "::error::Pull request head advanced during auto-fix: expected $AUTO_FIX_BASE_SHA, found ${REMOTE_SHA:-missing}"
              exit 1
            }
            git push origin "HEAD:refs/heads/$BRANCH"
            echo "::notice::Published validated auto-fixes to original PR head $BRANCH"
          else
            FIX_BRANCH="fix/validated-marketplace-artifacts-${{ github.run_id }}"
            git push origin "HEAD:refs/heads/$FIX_BRANCH"
            gh pr create \
              --base main \
              --head "$FIX_BRANCH" \
              --title "fix: validate Marketplace artifacts" \
              --body "Automated SKILL.md and skill-report.json repairs from workflow run ${{ github.run_id }}."
          fi

      - name: Cleanup temporary workspace
        if: always()
        run: |
          echo "🧹 Cleaning up temporary workspace..."
          rm -rf "${{ env.WORK_DIR }}" 2>/dev/null || true
          echo "✅ Cleanup complete"
