name: Publish Pack Production v4

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful Generate Pack run that ended in review_pending'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-pack-production-v4
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare immutable generation approval
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      generation_id: ${{ steps.approval.outputs.generation_id }}
      pack_slug: ${{ steps.approval.outputs.pack_slug }}
      source_sha: ${{ steps.approval.outputs.source_sha }}
      binding_digest: ${{ steps.approval.outputs.binding_digest }}
      score: ${{ steps.approval.outputs.score }}
      cli_version: ${{ steps.approval.outputs.cli_version }}
      cli_sha256: ${{ steps.approval.outputs.cli_sha256 }}
    steps:
      - name: Checkout the manual publisher from main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: ''
          clean: true
          persist-credentials: false
          sparse-checkout: scripts/pack-production-manual-publish.mjs
          sparse-checkout-cone-mode: false

      - name: Require main and a disabled automatic publish gate
        env:
          AUTO_PUBLISH_ENABLED: ${{ vars.PACK_PRODUCTION_AUTO_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          if [ "${AUTO_PUBLISH_ENABLED:-false}" = true ]; then
            echo '::error::Manual publication is forbidden while PACK_PRODUCTION_AUTO_PUBLISH_ENABLED=true'
            exit 1
          fi

      - name: Resolve the exact source run and final artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{5,19}$ ]]; then
            echo '::error::source_run_id must be a GitHub Actions run id'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pack-manual-source"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            > "$RUNNER_TEMP/pack-manual-source/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/generate-packs.yml" \
            > "$RUNNER_TEMP/pack-manual-source/workflow.json"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?name=pack-production-final&per_page=100" \
            --slurp | jq -e '
              [.[].artifacts[] | select(.name == "pack-production-final")] as $artifacts |
              if ($artifacts | length) == 1 then $artifacts[0]
              else error("expected one exact pack-production-final artifact") end
            ' > "$RUNNER_TEMP/pack-manual-source/artifact.json"
          ARTIFACT_ID=$(jq -er '
            select(.expired == false) |
            select(.digest | test("^sha256:[0-9a-f]{64}$")) |
            select(.size_in_bytes > 0 and .size_in_bytes <= 33554432) |
            .id
          ' "$RUNNER_TEMP/pack-manual-source/artifact.json")
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

      - name: Download, authenticate, and bound the source artifact ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
        run: |
          set -euo pipefail
          EXPECTED=$(jq -er '.digest | sub("^sha256:"; "")' \
            "$RUNNER_TEMP/pack-manual-source/artifact.json")
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/pack-manual-source/source-artifact.zip"
          ACTUAL=$(sha256sum "$RUNNER_TEMP/pack-manual-source/source-artifact.zip" | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo '::error::pack-production-final artifact digest mismatch'
            exit 1
          fi
          COMPRESSED_BYTES=$(stat -c '%s' "$RUNNER_TEMP/pack-manual-source/source-artifact.zip")
          METADATA_BYTES=$(jq -er '.size_in_bytes' "$RUNNER_TEMP/pack-manual-source/artifact.json")
          if [ "$COMPRESSED_BYTES" -ne "$METADATA_BYTES" ] || [ "$COMPRESSED_BYTES" -gt 33554432 ]; then
            echo '::error::pack-production-final compressed size is invalid or exceeds 32 MiB'
            exit 1
          fi
          ZIP_TOTALS=$(LC_ALL=C zipinfo -t "$RUNNER_TEMP/pack-manual-source/source-artifact.zip")
          ENTRY_COUNT=$(awk '{print $1}' <<<"$ZIP_TOTALS")
          UNCOMPRESSED_BYTES=$(awk '{print $3}' <<<"$ZIP_TOTALS")
          if ! [[ "$ENTRY_COUNT" =~ ^[0-9]+$ && "$UNCOMPRESSED_BYTES" =~ ^[0-9]+$ ]]; then
            echo '::error::pack-production-final ZIP totals are invalid'
            exit 1
          fi
          if [ "$ENTRY_COUNT" -lt 1 ] || [ "$ENTRY_COUNT" -gt 1024 ]; then
            echo '::error::pack-production-final entry count exceeds 1024'
            exit 1
          fi
          if [ "$UNCOMPRESSED_BYTES" -lt 1 ] || [ "$UNCOMPRESSED_BYTES" -gt 134217728 ]; then
            echo '::error::pack-production-final uncompressed size exceeds 128 MiB'
            exit 1
          fi
          if unzip -Z1 "$RUNNER_TEMP/pack-manual-source/source-artifact.zip" \
            | grep -Eq '(^/|(^|/)\.\.(/|$)|\\)'; then
            echo '::error::pack-production-final contains an unsafe ZIP path'
            exit 1
          fi
          if LC_ALL=C zipinfo -l "$RUNNER_TEMP/pack-manual-source/source-artifact.zip" \
            | awk '$1 ~ /^l/ { found=1 } END { exit found ? 0 : 1 }'; then
            echo '::error::pack-production-final contains a symbolic-link entry'
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/pack-production-final"
          mkdir -p "$RUNNER_TEMP/pack-production-final"
          unzip -q "$RUNNER_TEMP/pack-manual-source/source-artifact.zip" \
            -d "$RUNNER_TEMP/pack-production-final"
          if [ -n "$(find "$RUNNER_TEMP/pack-production-final" -type l -print -quit)" ]; then
            echo '::error::pack-production-final contains a symbolic link'
            exit 1
          fi

      - name: Validate generation, nonce, source SHA, quality, and binding
        id: approval
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack-manual-ready"
          node scripts/pack-production-manual-publish.mjs prepare \
            --source-dir "$RUNNER_TEMP/pack-production-final" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-file "$RUNNER_TEMP/pack-manual-source/source-run.json" \
            --workflow-file "$RUNNER_TEMP/pack-manual-source/workflow.json" \
            --artifact-file "$RUNNER_TEMP/pack-manual-source/artifact.json" \
            --output "$RUNNER_TEMP/pack-manual-ready/approval.json" \
            > "$RUNNER_TEMP/pack-manual-ready/prepare-result.json"
          cp "$RUNNER_TEMP/pack-production-final/opportunity.json" \
            "$RUNNER_TEMP/pack-production-final/cli-identity.json" \
            "$RUNNER_TEMP/pack-production-final/runtime-acceptance.json" \
            "$RUNNER_TEMP/pack-manual-ready/"
          jq -e --arg run "$SOURCE_RUN_ID" '.sourceRunId == $run' \
            "$RUNNER_TEMP/pack-manual-ready/prepare-result.json" >/dev/null
          echo "generation_id=$(jq -r .generationId "$RUNNER_TEMP/pack-manual-ready/prepare-result.json")" >> "$GITHUB_OUTPUT"
          echo "pack_slug=$(jq -r .packSlug "$RUNNER_TEMP/pack-manual-ready/prepare-result.json")" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(jq -r .sourceSha "$RUNNER_TEMP/pack-manual-ready/prepare-result.json")" >> "$GITHUB_OUTPUT"
          echo "binding_digest=$(jq -r .bindingDigest "$RUNNER_TEMP/pack-manual-ready/prepare-result.json")" >> "$GITHUB_OUTPUT"
          echo "score=$(jq -r .score "$RUNNER_TEMP/pack-manual-ready/prepare-result.json")" >> "$GITHUB_OUTPUT"
          CLI_VERSION=$(jq -er '.runtimeCli.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
            "$RUNNER_TEMP/pack-manual-ready/approval.json")
          echo "cli_version=$CLI_VERSION" >> "$GITHUB_OUTPUT"
          CLI_SHA256=$(jq -er '.runtimeCli.sha256 | select(test("^[0-9a-f]{64}$"))' \
            "$RUNNER_TEMP/pack-manual-ready/approval.json")
          echo "cli_sha256=$CLI_SHA256" >> "$GITHUB_OUTPUT"

      - name: Summarize the approval request without the nonce
        run: |
          {
            echo '## Pack Production v4 manual approval'
            echo
            echo "- Source run: \`${{ inputs.source_run_id }}\`"
            echo "- Source SHA: \`${{ steps.approval.outputs.source_sha }}\`"
            echo "- Generation: \`${{ steps.approval.outputs.generation_id }}\`"
            echo "- Pack: \`${{ steps.approval.outputs.pack_slug }}\`"
            echo "- Binding: \`${{ steps.approval.outputs.binding_digest }}\`"
            echo "- Evaluation score: \`${{ steps.approval.outputs.score }}\`"
            echo '- Quality override: **forbidden**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable approval handoff
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pack-production-manual-approval
          path: |
            ${{ runner.temp }}/pack-manual-ready/approval.json
            ${{ runner.temp }}/pack-manual-ready/opportunity.json
            ${{ runner.temp }}/pack-manual-ready/cli-identity.json
            ${{ runner.temp }}/pack-manual-ready/runtime-acceptance.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  publish:
    name: Publish and prove the exact public generation
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      marketplace_cli_version: ${{ steps.marketplace-cli-preflight.outputs.version }}
      marketplace_cli_integrity: ${{ steps.marketplace-cli-preflight.outputs.integrity }}
    environment:
      name: production
    steps:
      - name: Checkout the manual publisher from main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: ''
          clean: true
          persist-credentials: false
          sparse-checkout: scripts/pack-production-manual-publish.mjs
          sparse-checkout-cone-mode: false

      - name: Preflight the exact public Marketplace CLI release
        id: marketplace-cli-preflight
        env:
          # Exact npm release whose provenance and registry integrity are checked below.
          MARKETPLACE_CLI_VERSION: '0.1.13'
        run: |
          set -euo pipefail
          if ! [[ "$MARKETPLACE_CLI_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::MARKETPLACE_CLI_VERSION must be an exact non-placeholder semver release'
            exit 1
          fi
          npm view --registry=https://registry.npmjs.org "skillstore@$MARKETPLACE_CLI_VERSION" --json \
            > "$RUNNER_TEMP/marketplace-cli-release.json"
          INTEGRITY=$(jq -er --arg version "$MARKETPLACE_CLI_VERSION" '
            select(.name == "skillstore" and .version == $version)
            | .dist.integrity
            | select(test("^sha512-[A-Za-z0-9+/]+={0,2}$"))
          ' "$RUNNER_TEMP/marketplace-cli-release.json")
          echo "version=$MARKETPLACE_CLI_VERSION" >> "$GITHUB_OUTPUT"
          echo "integrity=$INTEGRITY" >> "$GITHUB_OUTPUT"

      - name: Download the reviewed immutable approval handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pack-production-manual-approval
          path: ${{ runner.temp }}/pack-manual-ready

      - name: Publish through the nonce-bound manual API
        id: publish
        env:
          SKILLSTORE_API_URL: https://skillstore.io
          PACK_PRODUCTION_MANUAL_PUBLISH_KEY: ${{ secrets.PACK_PRODUCTION_MANUAL_PUBLISH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack-manual-release"
          node scripts/pack-production-manual-publish.mjs publish \
            --approval "$RUNNER_TEMP/pack-manual-ready/approval.json" \
            --api-url "$SKILLSTORE_API_URL" \
            --token "$PACK_PRODUCTION_MANUAL_PUBLISH_KEY" \
            --output "$RUNNER_TEMP/pack-manual-release/publish-result.json" \
            > "$RUNNER_TEMP/pack-manual-release/publish-command.json"
          PACK_SLUG=$(jq -er .packSlug "$RUNNER_TEMP/pack-manual-release/publish-result.json")
          echo "pack_slug=$PACK_SLUG" >> "$GITHUB_OUTPUT"

      - name: Verify page, API, signatures, binding, and every file hash
        env:
          PACK_PUBLIC_URL: https://skillstore.io
        run: |
          set -euo pipefail
          node scripts/pack-production-manual-publish.mjs public-readback \
            --approval "$RUNNER_TEMP/pack-manual-ready/approval.json" \
            --publish-result "$RUNNER_TEMP/pack-manual-release/publish-result.json" \
            --public-url "$PACK_PUBLIC_URL" \
            --attempts 10 \
            --poll-seconds 30 \
            --output "$RUNNER_TEMP/pack-manual-release/public-readback.json" \
            > "$RUNNER_TEMP/pack-manual-release/public-readback-command.json"

      - name: Upload exact public publication evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pack-production-published-proof
          path: ${{ runner.temp }}/pack-manual-release/
          if-no-files-found: error
          retention-days: 90

  runtime:
    name: Install and execute the exact published Pack
    needs: [prepare, publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment:
      name: pack-production-runtime
    steps:
      - name: Checkout the runtime validators and sandbox policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: ''
          clean: true
          persist-credentials: false
          sparse-checkout: |
            scripts/pack-production-manual-publish.mjs
            scripts/pack-evaluator-proxy.mjs
            scripts/configure-pack-evaluator-bwrap.sh
            scripts/configure-pack-evaluator-egress.sh
            scripts/pack-evaluator-bwrap.apparmor
            .github/actions/download-skillstore-cli/action.yml
          sparse-checkout-cone-mode: false

      - name: Download immutable approval
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pack-production-manual-approval
          path: ${{ runner.temp }}/pack-runtime-input

      - name: Download exact public proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pack-production-published-proof
          path: ${{ runner.temp }}/pack-runtime-input

      - name: Create a read-only token for the private Skillstore CLI release
        id: evaluation-cli-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: marketplace,skillstore
          permission-contents: read

      - name: Download the exact checksum-authenticated evaluation CLI
        id: evaluation-cli
        uses: ./.github/actions/download-skillstore-cli
        with:
          version: ${{ needs.prepare.outputs.cli_version }}
          minimum-version: ${{ needs.prepare.outputs.cli_version }}
          require-checksum: 'true'
          expected-sha256: ${{ needs.prepare.outputs.cli_sha256 }}
          token: ${{ steps.evaluation-cli-token.outputs.token }}

      - name: Install pinned evaluator runtimes before credentials are available
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            apparmor bubblewrap ffmpeg iptables poppler-utils ripgrep util-linux
          sudo install -d -o root -g root -m 0755 /opt/pack-evaluator/runtime
          sudo install -d -o root -g root -m 0755 /opt/pack-evaluator/bin
          sudo npm install --global --ignore-scripts --prefix /opt/pack-evaluator/runtime \
            @anthropic-ai/claude-code@2.1.210 \
            @openai/codex@0.139.0
          sudo install -o root -g root -m 0555 "$(command -v node)" \
            /opt/pack-evaluator/runtime/bin/node
          test "${{ steps.evaluation-cli.outputs.cli-sha256 }}" = \
            "$(jq -er .runtimeCli.sha256 "$RUNNER_TEMP/pack-runtime-input/approval.json")"
          sudo install -o root -g root -m 0555 \
            "${{ steps.evaluation-cli.outputs.cli-path }}" \
            /opt/pack-evaluator/bin/skillstore-cli
          sudo chown -R root:root /opt/pack-evaluator/runtime
          sudo chmod -R a=rX /opt/pack-evaluator/runtime
          test "$(/opt/pack-evaluator/runtime/bin/claude --version | awk '{print $1}')" = 2.1.210
          test "$(/opt/pack-evaluator/runtime/bin/codex --version | awk '{print $2}')" = 0.139.0
          test "$(command -v bwrap)" = /usr/bin/bwrap

      - name: Create fresh evaluator identities and immutable provider configuration
        run: |
          set -euo pipefail
          sudo useradd --system --create-home --home-dir /home/packproxy --shell /usr/sbin/nologin packproxy
          sudo useradd --create-home --home-dir /home/packeval --shell /bin/bash packeval
          sudo install -d -o packeval -g packeval -m 0700 /home/packeval/tmp
          sudo install -d -o root -g root -m 1777 /opt/pack-evaluator/codex-home
          sudo install -d -o packeval -g packeval -m 0700 \
            /opt/pack-evaluator/codex-home/log /opt/pack-evaluator/codex-home/sessions
          printf '%s\n' \
            'model_provider = "pack_evaluator_proxy"' \
            '[model_providers.pack_evaluator_proxy]' \
            'name = "Job-local Pack evaluator proxy"' \
            'base_url = "http://127.0.0.1:18765/v1"' \
            'env_key = "PACK_EVALUATOR_PROXY_TOKEN"' \
            'wire_api = "responses"' \
            'supports_websockets = false' \
            | sudo tee /opt/pack-evaluator/codex-home/config.toml >/dev/null
          sudo chown root:root /opt/pack-evaluator/codex-home/config.toml
          sudo chmod 0444 /opt/pack-evaluator/codex-home/config.toml
          sudo chown root:root scripts/configure-pack-evaluator-bwrap.sh \
            scripts/configure-pack-evaluator-egress.sh scripts/pack-evaluator-bwrap.apparmor
          sudo install -d -o packeval -g packeval -m 0700 \
            /home/packeval/work /home/packeval/evidence
          sudo install -d -o packproxy -g packproxy -m 0700 /home/packproxy/evidence
          sudo install -d -o root -g root -m 0755 /opt/pack-evaluator/input
          sudo install -o root -g root -m 0444 \
            "$RUNNER_TEMP/pack-runtime-input/approval.json" \
            "$RUNNER_TEMP/pack-runtime-input/opportunity.json" \
            /opt/pack-evaluator/input/
          {
            echo 'PACK_RUNTIME_HOME=/home/packeval'
            echo 'PACK_RUNTIME_WORK=/home/packeval/work'
            echo 'PACK_RUNTIME_EVIDENCE=/home/packeval/evidence'
          } >> "$GITHUB_ENV"

      - name: Prove this job has no production write credential
        run: |
          set -euo pipefail
          if env | grep -Eq 'PACK_PRODUCTION_MANUAL_PUBLISH_KEY|PACK_PRODUCTION_AUTOMATION_KEY|SUPABASE_SERVICE|SKILLSTORE_CALLBACK|CACHE_INVALIDATE'; then
            echo '::error::A production write credential reached the self-hosted runtime job'
            exit 1
          fi

      - name: Install the exact registry-authenticated CLI and published Pack before inference credentials
        env:
          PACK_SLUG: ${{ needs.prepare.outputs.pack_slug }}
          MARKETPLACE_CLI_VERSION: ${{ needs.publish.outputs.marketplace_cli_version }}
          MARKETPLACE_CLI_INTEGRITY: ${{ needs.publish.outputs.marketplace_cli_integrity }}
          NPM_CONFIG_UPDATE_NOTIFIER: 'false'
          NO_COLOR: '1'
        run: |
          set -euo pipefail
          sudo -u packeval env -i \
            HOME="$PACK_RUNTIME_HOME" PATH=/usr/bin:/bin PACK_SLUG="$PACK_SLUG" \
            MARKETPLACE_CLI_VERSION="$MARKETPLACE_CLI_VERSION" \
            MARKETPLACE_CLI_INTEGRITY="$MARKETPLACE_CLI_INTEGRITY" \
            PACK_RUNTIME_WORK="$PACK_RUNTIME_WORK" PACK_RUNTIME_EVIDENCE="$PACK_RUNTIME_EVIDENCE" \
            bash -ceu '
              cd "$PACK_RUNTIME_WORK"
              npm view --registry=https://registry.npmjs.org \
                "skillstore@$MARKETPLACE_CLI_VERSION" --json \
                > "$PACK_RUNTIME_EVIDENCE/registry-metadata.json"
              npm init -y >/dev/null
              npm install --ignore-scripts --save-exact "skillstore@$MARKETPLACE_CLI_VERSION"
              npm audit signatures --json > "$PACK_RUNTIME_EVIDENCE/signature-audit.json"
              test "$(node -p "require(\"./node_modules/skillstore/package.json\").version")" \
                = "$MARKETPLACE_CLI_VERSION"
              test "$(node -p "require(\"./package-lock.json\").packages[\"node_modules/skillstore\"].integrity")" \
                = "$MARKETPLACE_CLI_INTEGRITY"
              ./node_modules/.bin/skillstore add "@$PACK_SLUG" --agent codex --overwrite
              ./node_modules/.bin/skillstore check --json \
                > "$PACK_RUNTIME_EVIDENCE/cli-check.json"
            '
          sudo -u packeval env -i HOME="$PACK_RUNTIME_HOME" PATH=/usr/bin:/bin \
            node "$GITHUB_WORKSPACE/scripts/pack-production-manual-publish.mjs" install-readback \
            --approval /opt/pack-evaluator/input/approval.json \
            --home "$PACK_RUNTIME_HOME" \
            --registry-metadata "$PACK_RUNTIME_EVIDENCE/registry-metadata.json" \
            --package-lock "$PACK_RUNTIME_WORK/package-lock.json" \
            --signature-audit "$PACK_RUNTIME_EVIDENCE/signature-audit.json" \
            --cli-check "$PACK_RUNTIME_EVIDENCE/cli-check.json" \
            --output "$PACK_RUNTIME_EVIDENCE/install-readback.json"
          sudo -u packeval env -i HOME="$PACK_RUNTIME_HOME" PATH=/usr/bin:/bin \
            node "$GITHUB_WORKSPACE/scripts/pack-production-manual-publish.mjs" installed-runtime-identities \
            --approval /opt/pack-evaluator/input/approval.json \
            --install-readback "$PACK_RUNTIME_EVIDENCE/install-readback.json" \
            --home "$PACK_RUNTIME_HOME" \
            --output "$PACK_RUNTIME_EVIDENCE/installed-identities.json"

      - name: Prove bubblewrap and restrict evaluator egress before the Helm key exists
        run: |
          set -euo pipefail
          sudo env PACK_EVALUATOR_OUTER_WORKSPACE="$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/scripts/configure-pack-evaluator-bwrap.sh"
          sudo "$GITHUB_WORKSPACE/scripts/configure-pack-evaluator-egress.sh"

      - name: Execute runtime acceptance from the public installed directories
        env:
          PACK_EVALUATOR_HELM_API_KEY: ${{ secrets.PACK_EVALUATOR_HELM_API_KEY }}
        run: |
          set -euo pipefail
          LOCAL_TOKEN=$(openssl rand -hex 32)
          PROXY_LOG=$(mktemp)
          cleanup() {
            sudo pkill -TERM -u packeval 2>/dev/null || true
            sudo pkill -KILL -u packeval 2>/dev/null || true
            sudo pkill -TERM -u packproxy -f pack-evaluator-proxy.mjs 2>/dev/null || true
            sudo pkill -KILL -u packproxy -f pack-evaluator-proxy.mjs 2>/dev/null || true
            if sudo test -f /home/packproxy/evidence/proxy-activity.jsonl; then
              sudo install -o packeval -g packeval -m 0600 \
                /home/packproxy/evidence/proxy-activity.jsonl \
                "$PACK_RUNTIME_EVIDENCE/proxy-activity.jsonl" || true
            fi
            rm -f "$PROXY_LOG"
          }
          trap cleanup EXIT INT TERM
          sudo -u packproxy env -i \
            PATH=/opt/pack-evaluator/runtime/bin:/usr/bin:/bin \
            PACK_EVALUATOR_LOCAL_TOKEN="$LOCAL_TOKEN" \
            PACK_EVALUATOR_UPSTREAM_KEY="$PACK_EVALUATOR_HELM_API_KEY" \
            PACK_EVALUATOR_UPSTREAM_URL=https://helm.easymeta.au \
            PACK_EVALUATOR_PROXY_PORT=18765 \
            PACK_EVALUATOR_ALLOWED_MODELS=claude-sonnet-4.6,claude-sonnet-4-6,claude-sonnet-5,sonnet,gpt-5.5 \
            PACK_EVALUATOR_MAX_REQUESTS=32 \
            PACK_EVALUATOR_MAX_INPUT_TOKENS=120000 \
            PACK_EVALUATOR_MAX_TOTAL_OUTPUT_TOKENS=24000 \
            PACK_EVALUATOR_MAX_COST_USD=10 \
            PACK_EVALUATOR_MAX_INPUT_COST_PER_MILLION_USD=100 \
            PACK_EVALUATOR_MAX_OUTPUT_COST_PER_MILLION_USD=500 \
            PACK_EVALUATOR_MAX_CONCURRENT=1 \
            PACK_EVALUATOR_MAX_OUTPUT_TOKENS=8192 \
            PACK_EVALUATOR_TTL_MS=3600000 \
            PACK_EVALUATOR_REQUEST_TIMEOUT_MS=600000 \
            PACK_EVALUATOR_ACTIVITY_FILE=/home/packproxy/evidence/proxy-activity.jsonl \
            /opt/pack-evaluator/runtime/bin/node "$GITHUB_WORKSPACE/scripts/pack-evaluator-proxy.mjs" \
            > "$PROXY_LOG" 2>&1 &
          unset PACK_EVALUATOR_HELM_API_KEY
          for _ in $(seq 1 30); do
            if curl --fail --silent -H "Authorization: Bearer $LOCAL_TOKEN" \
              http://127.0.0.1:18765/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent -H "Authorization: Bearer $LOCAL_TOKEN" \
            http://127.0.0.1:18765/healthz >/dev/null
          sudo -u packeval env -i \
            PATH=/opt/pack-evaluator/runtime/bin:/usr/bin:/bin \
            HOME="$PACK_RUNTIME_HOME" \
            CODEX_HOME=/opt/pack-evaluator/codex-home \
            TMPDIR=/home/packeval/tmp \
            CI=true NO_COLOR=1 \
            SKILLSTORE_AGENTS=codex,claude \
            SKILLSTORE_AGENT_ENV_MODE=strict \
            SKILLSTORE_AGENT_ENV_ALLOWLIST=CODEX_HOME,PACK_EVALUATOR_PROXY_TOKEN,PACK_EVALUATOR_CHROMIUM_PATH,ANTHROPIC_BASE_URL,ANTHROPIC_AUTH_TOKEN,CLAUDE_CODE_MAX_OUTPUT_TOKENS,NO_PROXY,SKILLSTORE_AGENT_SANDBOX_MODE,SKILLSTORE_AGENT_SANDBOX_RUNTIME_ROOT \
            SKILLSTORE_AGENT_SANDBOX_MODE=bwrap \
            SKILLSTORE_AGENT_SANDBOX_RUNTIME_ROOT=/opt/pack-evaluator/runtime \
            PACK_EVALUATOR_CHROMIUM_PATH=/usr/bin/google-chrome \
            PACK_EVALUATOR_PROXY_TOKEN="$LOCAL_TOKEN" \
            ANTHROPIC_BASE_URL=http://127.0.0.1:18765 \
            ANTHROPIC_AUTH_TOKEN="$LOCAL_TOKEN" \
            CLAUDE_CODE_MAX_OUTPUT_TOKENS=8192 \
            NO_PROXY=127.0.0.1,localhost \
            timeout --signal=TERM --kill-after=30s 20m \
            /opt/pack-evaluator/bin/skillstore-cli pack runtime-accept \
              --opportunity-file /opt/pack-evaluator/input/opportunity.json \
              --identity-file "$PACK_RUNTIME_EVIDENCE/installed-identities.json" \
              --model sonnet --judge-model gpt-5.5 --agent-timeout-ms 360000 \
              --chromium-path /usr/bin/google-chrome \
              --output "$PACK_RUNTIME_EVIDENCE/runtime-acceptance-installed.json"

      - name: Bind the fresh installed execution to the exact public install
        run: |
          set -euo pipefail
          sudo -u packeval env -i HOME="$PACK_RUNTIME_HOME" PATH=/usr/bin:/bin \
            node "$GITHUB_WORKSPACE/scripts/pack-production-manual-publish.mjs" runtime-readback \
            --approval /opt/pack-evaluator/input/approval.json \
            --install-readback "$PACK_RUNTIME_EVIDENCE/install-readback.json" \
            --runtime-evidence "$PACK_RUNTIME_EVIDENCE/runtime-acceptance-installed.json" \
            --output "$PACK_RUNTIME_EVIDENCE/runtime-readback.json"

      - name: Normalize bounded runtime evidence ownership
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$PACK_RUNTIME_EVIDENCE"
          find "$PACK_RUNTIME_EVIDENCE" -type d -exec chmod 0700 {} +
          find "$PACK_RUNTIME_EVIDENCE" -type f -exec chmod 0600 {} +

      - name: Upload bounded runtime evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pack-production-runtime-proof
          path: ${{ env.PACK_RUNTIME_EVIDENCE }}/
          if-no-files-found: error
          retention-days: 90

  complete:
    name: Complete only after public, install, and runtime proof
    needs: [prepare, publish, runtime]
    if: always() && github.ref == 'refs/heads/main' && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout only the completion validator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: ''
          clean: true
          persist-credentials: false
          sparse-checkout: scripts/pack-production-manual-publish.mjs
          sparse-checkout-cone-mode: false

      - name: Download approval
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pack-production-manual-approval
          path: ${{ runner.temp }}/pack-completion

      - name: Download public proof
        id: public-proof
        if: needs.publish.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pack-production-published-proof
          path: ${{ runner.temp }}/pack-completion

      - name: Download runtime proof
        id: runtime-proof
        if: needs.publish.result == 'success' && needs.runtime.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pack-production-runtime-proof
          path: ${{ runner.temp }}/pack-completion

      - name: Record exact production acceptance
        if: >
          needs.publish.result == 'success' &&
          needs.runtime.result == 'success' &&
          steps.public-proof.outcome == 'success' &&
          steps.runtime-proof.outcome == 'success'
        env:
          SKILLSTORE_API_URL: https://skillstore.io
          PACK_PRODUCTION_READBACK_KEY: ${{ secrets.PACK_PRODUCTION_READBACK_KEY }}
        run: |
          set -euo pipefail
          node scripts/pack-production-manual-publish.mjs complete \
            --approval "$RUNNER_TEMP/pack-completion/approval.json" \
            --api-url "$SKILLSTORE_API_URL" \
            --token "$PACK_PRODUCTION_READBACK_KEY" \
            --status succeeded \
            --public-readback "$RUNNER_TEMP/pack-completion/public-readback.json" \
            --install-readback "$RUNNER_TEMP/pack-completion/install-readback.json" \
            --runtime-readback "$RUNNER_TEMP/pack-completion/runtime-readback.json" \
            --output "$RUNNER_TEMP/pack-completion/final-release.json"

      - name: Record terminal publish, proof, or runtime failure without production proof
        if: >
          always() &&
          (needs.publish.result != 'success' ||
           needs.runtime.result != 'success' ||
           steps.public-proof.outcome != 'success' ||
           steps.runtime-proof.outcome != 'success')
        env:
          SKILLSTORE_API_URL: https://skillstore.io
          PACK_PRODUCTION_READBACK_KEY: ${{ secrets.PACK_PRODUCTION_READBACK_KEY }}
        run: |
          set -euo pipefail
          node scripts/pack-production-manual-publish.mjs complete \
            --approval "$RUNNER_TEMP/pack-completion/approval.json" \
            --api-url "$SKILLSTORE_API_URL" \
            --token "$PACK_PRODUCTION_READBACK_KEY" \
            --status failed \
            --error "publish=${{ needs.publish.result }} public_proof=${{ steps.public-proof.outcome }} runtime=${{ needs.runtime.result }} runtime_proof=${{ steps.runtime-proof.outcome }}" \
            --output "$RUNNER_TEMP/pack-completion/final-release.json"

      - name: Upload completed production evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pack-production-manual-release
          path: ${{ runner.temp }}/pack-completion/
          if-no-files-found: error
          retention-days: 90
