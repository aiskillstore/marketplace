name: Download Skillstore CLI
description: Download and setup skillstore-cli binary

inputs:
  version:
    description: 'CLI version (default: latest; accepts 1.50.3 or cli-v1.50.3)'
    required: false
    default: 'latest'
  token:
    description: 'GitHub token with repo access'
    required: true
  cache-dir:
    description: 'Local cache directory for self-hosted runners (optional)'
    required: false
    default: ''
  minimum-version:
    description: 'Fail if the resolved CLI is older than this version (for example, 1.52.2)'
    required: false
    default: ''
  require-checksum:
    description: 'Require and verify checksums.txt from the immutable CLI release'
    required: false
    default: 'false'

outputs:
  cli-path:
    description: 'Path to the CLI binary'
    value: ${{ github.workspace }}/skillstore-cli
  cli-sha256:
    description: 'Verified SHA-256 of the downloaded CLI (empty unless require-checksum=true)'
    value: ${{ steps.checksum.outputs.cli-sha256 }}

runs:
  using: composite
  steps:
    - name: Resolve CLI version
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CLI_VERSION: ${{ inputs.version }}
        CLI_REPO: aiskillstore/skillstore
      run: |
        CLI_VERSION="${CLI_VERSION:-latest}"
        if [ "$CLI_VERSION" = "latest" ]; then
          echo "Fetching latest release tag..."
          RELEASE_TAG=$(gh release view --repo "$CLI_REPO" --json tagName -q '.tagName')
          echo "Latest release: $RELEASE_TAG"
        elif [[ "$CLI_VERSION" == cli-v* ]]; then
          RELEASE_TAG="$CLI_VERSION"
          echo "Using specified release tag: $RELEASE_TAG"
        else
          RELEASE_TAG="cli-v$CLI_VERSION"
          echo "Using specified version: $RELEASE_TAG"
        fi
        echo "release-tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

    - name: Check local cache (self-hosted runners)
      id: local-cache
      if: inputs.cache-dir != ''
      shell: bash
      env:
        CACHE_DIR: ${{ inputs.cache-dir }}
        RELEASE_TAG: ${{ steps.resolve.outputs.release-tag }}
        REQUIRE_CHECKSUM: ${{ inputs.require-checksum }}
      run: |
        # Auto-create cache directory if it doesn't exist
        if [ ! -d "$CACHE_DIR" ]; then
          echo "📁 Cache directory doesn't exist, creating: $CACHE_DIR"
          mkdir -p "$CACHE_DIR" || {
            echo "::warning::Failed to create cache directory $CACHE_DIR, falling back to no cache"
            echo "cache-hit=false" >> $GITHUB_OUTPUT
            echo "cache-disabled=true" >> $GITHUB_OUTPUT
            exit 0
          }
          echo "✅ Cache directory created successfully"
        fi

        CACHE_FILE="$CACHE_DIR/skillstore-cli-$RELEASE_TAG-${{ runner.os }}-${{ runner.arch }}"

        if [ -f "$CACHE_FILE" ]; then
          echo "✅ Found local cache: $CACHE_FILE"
          echo "📋 Cache file size: $(du -h "$CACHE_FILE" | cut -f1)"
          cp "$CACHE_FILE" "$GITHUB_WORKSPACE/skillstore-cli"
          chmod +x "$GITHUB_WORKSPACE/skillstore-cli"

          # Legacy callers do not require a release checksum, so retain their
          # stale-cache self-healing behavior. Checksum-required callers must
          # never execute cache bytes before the checksum gate below.
          if [ "$REQUIRE_CHECKSUM" != "true" ]; then
            EXPECTED_VERSION=${RELEASE_TAG#cli-v}
            CACHED_VERSION=$("$GITHUB_WORKSPACE/skillstore-cli" --version 2>&1 | grep -Eo '[0-9]+([.][0-9]+){1,3}([-+][0-9A-Za-z._-]+)?' | head -n1 || true)
            if [ "$CACHED_VERSION" != "$EXPECTED_VERSION" ]; then
              echo "::warning::Local CLI cache version mismatch: expected $EXPECTED_VERSION, got ${CACHED_VERSION:-unknown}. Invalidating cache entry."
              rm -f "$CACHE_FILE" "$GITHUB_WORKSPACE/skillstore-cli"
              echo "cache-hit=false" >> "$GITHUB_OUTPUT"
              echo "cache-file=$CACHE_FILE" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "cache-hit=true" >> $GITHUB_OUTPUT
        else
          echo "❌ No cached version found for $RELEASE_TAG"
          echo "📂 Cache directory: $CACHE_DIR"

          # List existing cached versions
          EXISTING=$(find "$CACHE_DIR" -name "skillstore-cli-*" -type f 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "📦 Existing cached versions:"
            echo "$EXISTING" | while read -r file; do
              echo "  - $(basename "$file") ($(du -h "$file" | cut -f1))"
            done
          else
            echo "📦 No cached versions found (first run)"
          fi

          echo "cache-hit=false" >> $GITHUB_OUTPUT
          echo "cache-file=$CACHE_FILE" >> $GITHUB_OUTPUT
        fi

    - name: Cache CLI (GitHub-hosted runners)
      id: cache-cli
      if: inputs.cache-dir == ''
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/skillstore-cli
        key: skillstore-cli-${{ steps.resolve.outputs.release-tag }}-${{ runner.os }}-${{ runner.arch }}

    - name: Download CLI
      if: |
        (inputs.cache-dir == '' && steps.cache-cli.outputs.cache-hit != 'true') ||
        (inputs.cache-dir != '' && steps.local-cache.outputs.cache-hit != 'true')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CLI_REPO: aiskillstore/skillstore
        RELEASE_TAG: ${{ steps.resolve.outputs.release-tag }}
      run: |
        echo "Downloading skillstore-cli ($RELEASE_TAG)..."

        gh release download "$RELEASE_TAG" \
          --repo "$CLI_REPO" \
          --pattern "skillstore-cli-linux-x64" \
          --output "$GITHUB_WORKSPACE/skillstore-cli" \
          --clobber

        chmod +x "$GITHUB_WORKSPACE/skillstore-cli"

    - name: Restore executable permissions
      if: inputs.cache-dir == '' && steps.cache-cli.outputs.cache-hit == 'true'
      shell: bash
      run: |
        echo "✅ Using cached CLI (${{ steps.resolve.outputs.release-tag }})"
        chmod +x "$GITHUB_WORKSPACE/skillstore-cli"

    # This must run before the first execution and before a downloaded binary is
    # written to the shared self-hosted cache. A cache hit is untrusted input too.
    - name: Verify release checksum before execution
      id: checksum
      if: inputs.require-checksum == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CLI_REPO: aiskillstore/skillstore
        RELEASE_TAG: ${{ steps.resolve.outputs.release-tag }}
      run: |
        CHECKSUM_DIR=$(mktemp -d)
        trap 'rm -rf "$CHECKSUM_DIR"' EXIT
        gh release download "$RELEASE_TAG" \
          --repo "$CLI_REPO" \
          --pattern checksums.txt \
          --dir "$CHECKSUM_DIR"

        EXPECTED=$(awk '$2 == "skillstore-cli-linux-x64" { print $1 }' "$CHECKSUM_DIR/checksums.txt")
        if ! [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::Release $RELEASE_TAG has no valid checksum for skillstore-cli-linux-x64"
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          ACTUAL=$(sha256sum "$GITHUB_WORKSPACE/skillstore-cli" | awk '{ print $1 }')
        else
          ACTUAL=$(shasum -a 256 "$GITHUB_WORKSPACE/skillstore-cli" | awk '{ print $1 }')
        fi
        if [ "$ACTUAL" != "$EXPECTED" ]; then
          echo "::error::CLI checksum mismatch for $RELEASE_TAG: expected $EXPECTED, got $ACTUAL"
          exit 1
        fi
        echo "cli-sha256=$ACTUAL" >> "$GITHUB_OUTPUT"
        echo "✅ Verified CLI SHA-256 before execution: $ACTUAL"

    - name: Verify CLI
      id: verify
      shell: bash
      env:
        RELEASE_TAG: ${{ steps.resolve.outputs.release-tag }}
        MINIMUM_VERSION: ${{ inputs.minimum-version }}
      run: |
        CLI_PATH="$GITHUB_WORKSPACE/skillstore-cli"

        if [ ! -f "$CLI_PATH" ]; then
          echo "❌ CLI not found at $CLI_PATH"
          exit 1
        fi

        echo "✅ CLI downloaded successfully"
        echo "CLI path: $CLI_PATH"
        echo "CLI version:"
        VERSION_OUTPUT=$("$CLI_PATH" --version 2>&1)
        echo "$VERSION_OUTPUT"

        EXPECTED_VERSION=${RELEASE_TAG#cli-v}
        ACTUAL_VERSION=$(echo "$VERSION_OUTPUT" | grep -Eo '[0-9]+([.][0-9]+){1,3}([-+][0-9A-Za-z._-]+)?' | head -n1 || true)
        echo "cli-version=${ACTUAL_VERSION:-unknown}" >> $GITHUB_OUTPUT
        if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
          if [ -n "$MINIMUM_VERSION" ]; then
            echo "::error::CLI version mismatch: expected $EXPECTED_VERSION from $RELEASE_TAG, got ${ACTUAL_VERSION:-unknown}. Refusing a version-gated writer."
            exit 1
          fi
          echo "::warning::CLI version mismatch: expected $EXPECTED_VERSION from $RELEASE_TAG, got ${ACTUAL_VERSION:-unknown}. Continuing so non-writer workflows can feature-probe CLI capabilities."
        fi

        if [ -n "$MINIMUM_VERSION" ]; then
          if ! [[ "$MINIMUM_VERSION" =~ ^[0-9]+([.][0-9]+){2}$ ]]; then
            echo "::error::Invalid minimum-version '$MINIMUM_VERSION'; expected X.Y.Z."
            exit 1
          fi
          if [ -z "$ACTUAL_VERSION" ]; then
            echo "::error::Cannot enforce minimum CLI version $MINIMUM_VERSION because the downloaded version is unknown."
            exit 1
          fi
          if [[ "$ACTUAL_VERSION" == *-* ]]; then
            echo "::error::Prerelease CLI $ACTUAL_VERSION cannot satisfy the stable writer minimum $MINIMUM_VERSION."
            exit 1
          fi

          LOWEST_VERSION=$(printf '%s\n%s\n' "$MINIMUM_VERSION" "$ACTUAL_VERSION" | sort -V | head -n1)
          if [ "$LOWEST_VERSION" != "$MINIMUM_VERSION" ]; then
            echo "::error::Skill sync requires skillstore-cli >= $MINIMUM_VERSION; downloaded $ACTUAL_VERSION from $RELEASE_TAG."
            exit 1
          fi
          echo "✅ Minimum CLI version satisfied: $ACTUAL_VERSION >= $MINIMUM_VERSION"
        fi

    - name: Save verified CLI to local cache (self-hosted runners)
      if: inputs.cache-dir != '' && steps.local-cache.outputs.cache-hit != 'true' && steps.local-cache.outputs.cache-disabled != 'true'
      shell: bash
      env:
        CACHE_DIR: ${{ inputs.cache-dir }}
      run: |
        CACHE_FILE="${{ steps.local-cache.outputs.cache-file }}"
        mkdir -p "$CACHE_DIR"
        TEMP_CACHE_FILE="${CACHE_FILE}.tmp.$$"
        trap 'rm -f "$TEMP_CACHE_FILE"' EXIT
        cp "$GITHUB_WORKSPACE/skillstore-cli" "$TEMP_CACHE_FILE"
        chmod +x "$TEMP_CACHE_FILE"
        mv -f "$TEMP_CACHE_FILE" "$CACHE_FILE"

        echo "✅ Saved verified CLI atomically: $CACHE_FILE"
        echo "📋 Cache file size: $(du -h "$CACHE_FILE" | cut -f1)"
