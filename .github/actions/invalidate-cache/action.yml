name: Invalidate Cache
description: Batch invalidate cache for skills/packs/plugins/releases

inputs:
  type:
    description: 'Content type (skills, packs, plugins, releases)'
    required: true
  slugs:
    description: 'Space or comma-separated list of slugs to invalidate'
    required: false
    default: ''
  slugs-file:
    description: 'File containing slugs to invalidate, separated by newline, comma, or whitespace'
    required: false
    default: ''
  site-url:
    description: 'Site URL'
    required: false
    default: 'https://skillstore.io'
  secret:
    description: 'Cache invalidation secret'
    required: true
  batch-size:
    description: 'Batch size for API calls'
    required: false
    default: '30'
  concurrency:
    description: 'Maximum concurrent cache invalidation batches (1-4)'
    required: false
    default: '1'
  invalidate-artifacts:
    description: 'Whether immutable ZIP/install artifact keys must also be deleted'
    required: false
    default: 'true'
  invalidate-dependent-packs:
    description: 'Whether dependent Pack cache closure must also be deleted'
    required: false
    default: 'true'
  fail-on-error:
    description: 'Fail the action when one or more cache invalidations fail'
    required: false
    default: 'true'

outputs:
  total_count:
    description: 'Total number of requested cache items'
    value: ${{ steps.invalidate.outputs.total_count }}
  success_count:
    description: 'Number of successfully invalidated cache items'
    value: ${{ steps.invalidate.outputs.success_count }}
  failed_count:
    description: 'Number of cache items that failed invalidation'
    value: ${{ steps.invalidate.outputs.failed_count }}

runs:
  using: composite
  steps:
    - name: Invalidate cache
      id: invalidate
      shell: bash
      env:
        CACHE_SECRET: ${{ inputs.secret }}
        SITE_URL: ${{ inputs['site-url'] }}
        BATCH_SIZE: ${{ inputs['batch-size'] }}
        BATCH_CONCURRENCY: ${{ inputs.concurrency }}
        CONTENT_TYPE: ${{ inputs.type }}
        SLUGS_STR: ${{ inputs.slugs }}
        SLUGS_FILE: ${{ inputs['slugs-file'] }}
        FAIL_ON_ERROR: ${{ inputs['fail-on-error'] }}
        INVALIDATE_ARTIFACTS: ${{ inputs['invalidate-artifacts'] }}
        INVALIDATE_DEPENDENT_PACKS: ${{ inputs['invalidate-dependent-packs'] }}
      run: |
        set -euo pipefail

        if [ "$FAIL_ON_ERROR" != "true" ] && [ "$FAIL_ON_ERROR" != "false" ]; then
          echo "::error::fail-on-error must be true or false"
          exit 1
        fi

        for boolean_name in INVALIDATE_ARTIFACTS INVALIDATE_DEPENDENT_PACKS; do
          boolean_value="${!boolean_name}"
          if [ "$boolean_value" != "true" ] && [ "$boolean_value" != "false" ]; then
            echo "::error::$boolean_name must be true or false"
            exit 1
          fi
        done

        case "$CONTENT_TYPE" in
          skills|packs|plugins|releases) ;;
          *)
            echo "::error::Unsupported cache content type: $CONTENT_TYPE"
            exit 1
            ;;
        esac

        if ! [[ "$BATCH_SIZE" =~ ^[0-9]+$ ]] || [ "$BATCH_SIZE" -lt 1 ]; then
          echo "::error::batch-size must be a positive integer"
          exit 1
        fi

        if ! [[ "$BATCH_CONCURRENCY" =~ ^[1-4]$ ]]; then
          echo "::error::concurrency must be an integer between 1 and 4"
          exit 1
        fi

        if [ -z "$CACHE_SECRET" ]; then
          echo "total_count=0" >> "$GITHUB_OUTPUT"
          echo "success_count=0" >> "$GITHUB_OUTPUT"
          echo "failed_count=0" >> "$GITHUB_OUTPUT"
          if [ "$FAIL_ON_ERROR" = "true" ]; then
            echo "::error::Cache invalidation secret is empty"
            exit 1
          fi
          echo "::warning::Cache invalidation secret is empty; skipping"
          exit 0
        fi

        ITEMS_FILE="$(mktemp)"
        : > "$ITEMS_FILE"

        normalize_items() {
          tr ',[:space:]' '\n' | sed '/^$/d'
        }

        if [ -n "$SLUGS_FILE" ]; then
          if [ ! -f "$SLUGS_FILE" ]; then
            echo "::error::slugs-file does not exist: $SLUGS_FILE"
            exit 1
          fi
          normalize_items < "$SLUGS_FILE" >> "$ITEMS_FILE"
        fi

        if [ -n "$SLUGS_STR" ]; then
          printf '%s\n' "$SLUGS_STR" | normalize_items >> "$ITEMS_FILE"
        fi

        sort -u -o "$ITEMS_FILE" "$ITEMS_FILE"
        mapfile -t SLUGS < "$ITEMS_FILE"
        TOTAL=${#SLUGS[@]}
        echo "total_count=$TOTAL" >> "$GITHUB_OUTPUT"

        if [ "$TOTAL" -eq 0 ]; then
          echo "No items to invalidate"
          echo "success_count=0" >> "$GITHUB_OUTPUT"
          echo "failed_count=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        invalidate_batch_once() {
          local batch_slugs=("$@")
          local json_array
          local body_file
          local response_file
          local status

          json_array=$(printf '%s\n' "${batch_slugs[@]}" | jq -R . | jq -s .)
          body_file="$(mktemp)"
          response_file="$(mktemp)"

          jq -n \
            --arg type "$CONTENT_TYPE" \
            --argjson slugs "$json_array" \
            --argjson invalidateArtifacts "$INVALIDATE_ARTIFACTS" \
            --argjson invalidateDependentPacks "$INVALIDATE_DEPENDENT_PACKS" \
            '{
              type: $type,
              slugs: $slugs,
              invalidateApi: true,
              invalidateArtifacts: $invalidateArtifacts,
              invalidateDependentPacks: $invalidateDependentPacks
            }' > "$body_file"

          status=$(curl -sS -o "$response_file" -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 90 \
            -X POST "$SITE_URL/api/cache/invalidate" \
            -H "Authorization: Bearer $CACHE_SECRET" \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions/SkillstoreBot" \
            -H "X-Skillstore-Callback: true" \
            -d @"$body_file" || true)

          rm -f "$body_file"

          if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
            if ! jq -e \
              --arg type "$CONTENT_TYPE" \
              --argjson requested "$json_array" \
              --argjson invalidateArtifacts "$INVALIDATE_ARTIFACTS" \
              --argjson invalidateDependentPacks "$INVALIDATE_DEPENDENT_PACKS" \
              '.preflight == false
                and (.type == $type or .requestedType == $type)
                and ((.slugs | sort) == ($requested | sort))
                and (.invalidated.total | type == "number")
                and (.invalidated.api | type == "number")
                and (.invalidated.artifacts | type == "number")
                and ($invalidateArtifacts or .invalidated.artifacts == 0)
                and ($invalidateDependentPacks or ((.closure.dependentPacks.all // []) | length) == 0)' \
              "$response_file" >/dev/null; then
              echo "Cache invalidation response violated the requested closure contract" >&2
              sed -n '1,20p' "$response_file" >&2 || true
              rm -f "$response_file"
              return 1
            fi
            cat "$response_file"
            rm -f "$response_file"
            return 0
          fi

          echo "HTTP $status" >&2
          sed -n '1,20p' "$response_file" >&2 || true
          rm -f "$response_file"
          return 1
        }

        invalidate_batch() {
          local batch_slugs=("$@")
          local attempt
          local max_attempts=4

          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            if invalidate_batch_once "${batch_slugs[@]}"; then
              return 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              local sleep_seconds=$((attempt * 5))
              echo "    Attempt $attempt/$max_attempts failed; retrying in ${sleep_seconds}s..." >&2
              sleep "$sleep_seconds"
            fi
          done

          return 1
        }

        BATCHES=$(( (TOTAL + BATCH_SIZE - 1) / BATCH_SIZE ))
        echo "Invalidating $TOTAL $CONTENT_TYPE in $BATCHES batch(es)..."

        WORK_DIR="$(mktemp -d)"
        trap 'rm -rf "$WORK_DIR" "$ITEMS_FILE"' EXIT

        run_batch() {
          local batch_num="$1"
          local batch_file="$2"
          local result_file="$3"
          local failed_file="$4"
          local batch_success=0
          local batch_failed=0
          local batch_slugs=()

          mapfile -t batch_slugs < "$batch_file"
          echo "  Batch $batch_num/$BATCHES (${#batch_slugs[@]} items)..."

          if invalidate_batch "${batch_slugs[@]}"; then
            echo "    ✓"
            batch_success=${#batch_slugs[@]}
          else
            echo "    Batch failed after retries; falling back to single-item invalidation"
            for slug in "${batch_slugs[@]}"; do
              if invalidate_batch "$slug"; then
                echo "      ✓ $slug"
                batch_success=$((batch_success + 1))
              else
                echo "      ✗ $slug"
                printf '%s\n' "$slug" >> "$failed_file"
                batch_failed=$((batch_failed + 1))
              fi
            done
          fi

          printf '%s\t%s\n' "$batch_success" "$batch_failed" > "$result_file"
        }

        # Launch fixed-size waves. Each batch owns its evidence files, and the
        # parent aggregates them later in batch order so logs and counts remain
        # deterministic even though HTTP requests overlap.
        for ((wave_start=0; wave_start<BATCHES; wave_start+=BATCH_CONCURRENCY)); do
          PIDS=()
          BATCH_NUMBERS=()
          for ((slot=0; slot<BATCH_CONCURRENCY; slot++)); do
            BATCH_NUM=$((wave_start + slot + 1))
            if [ "$BATCH_NUM" -gt "$BATCHES" ]; then
              break
            fi

            OFFSET=$(( (BATCH_NUM - 1) * BATCH_SIZE ))
            BATCH=("${SLUGS[@]:OFFSET:BATCH_SIZE}")
            printf '%s\n' "${BATCH[@]}" > "$WORK_DIR/batch-$BATCH_NUM.slugs"
            : > "$WORK_DIR/batch-$BATCH_NUM.failed"

            run_batch \
              "$BATCH_NUM" \
              "$WORK_DIR/batch-$BATCH_NUM.slugs" \
              "$WORK_DIR/batch-$BATCH_NUM.result" \
              "$WORK_DIR/batch-$BATCH_NUM.failed" \
              > "$WORK_DIR/batch-$BATCH_NUM.log" 2>&1 &
            PIDS+=("$!")
            BATCH_NUMBERS+=("$BATCH_NUM")
          done

          for ((slot=0; slot<${#PIDS[@]}; slot++)); do
            if ! wait "${PIDS[$slot]}"; then
              : > "$WORK_DIR/batch-${BATCH_NUMBERS[$slot]}.worker-failed"
            fi
          done
        done

        SUCCESS=0
        FAILED=0
        INTERNAL_FAILURE=0
        FAILED_FILE="$WORK_DIR/failed-slugs.txt"
        : > "$FAILED_FILE"

        for ((BATCH_NUM=1; BATCH_NUM<=BATCHES; BATCH_NUM++)); do
          BATCH_FILE="$WORK_DIR/batch-$BATCH_NUM.slugs"
          RESULT_FILE="$WORK_DIR/batch-$BATCH_NUM.result"
          JOB_FAILED_FILE="$WORK_DIR/batch-$BATCH_NUM.failed"
          cat "$WORK_DIR/batch-$BATCH_NUM.log"
          mapfile -t BATCH < "$BATCH_FILE"

          if [ -f "$WORK_DIR/batch-$BATCH_NUM.worker-failed" ] || \
             [ ! -s "$RESULT_FILE" ]; then
            echo "::error::Batch $BATCH_NUM worker exited without complete evidence"
            printf '%s\n' "${BATCH[@]}" >> "$FAILED_FILE"
            FAILED=$((FAILED + ${#BATCH[@]}))
            INTERNAL_FAILURE=1
            continue
          fi

          IFS=$'\t' read -r BATCH_SUCCESS BATCH_FAILED < "$RESULT_FILE"
          RECORDED_FAILED=$(sed '/^$/d' "$JOB_FAILED_FILE" | wc -l | tr -d ' ')
          if ! [[ "$BATCH_SUCCESS" =~ ^[0-9]+$ ]] || \
             ! [[ "$BATCH_FAILED" =~ ^[0-9]+$ ]] || \
             [ $((BATCH_SUCCESS + BATCH_FAILED)) -ne "${#BATCH[@]}" ] || \
             [ "$RECORDED_FAILED" -ne "$BATCH_FAILED" ]; then
            echo "::error::Batch $BATCH_NUM produced inconsistent completion evidence"
            printf '%s\n' "${BATCH[@]}" >> "$FAILED_FILE"
            FAILED=$((FAILED + ${#BATCH[@]}))
            INTERNAL_FAILURE=1
            continue
          fi

          cat "$JOB_FAILED_FILE" >> "$FAILED_FILE"
          SUCCESS=$((SUCCESS + BATCH_SUCCESS))
          FAILED=$((FAILED + BATCH_FAILED))
        done

        echo "✅ Complete: $SUCCESS succeeded, $FAILED failed"
        echo "success_count=$SUCCESS" >> "$GITHUB_OUTPUT"
        echo "failed_count=$FAILED" >> "$GITHUB_OUTPUT"

        if [ "$INTERNAL_FAILURE" -gt 0 ]; then
          echo "::error::Cache invalidation workers did not produce trustworthy completion evidence"
          sed -n '1,200p' "$FAILED_FILE"
          exit 1
        fi

        if [ "$FAILED" -gt 0 ]; then
          if [ "$FAIL_ON_ERROR" = "true" ]; then
            echo "::error::Failed to invalidate $FAILED item(s):"
          else
            echo "::warning::Failed to invalidate $FAILED item(s):"
          fi
          sed -n '1,200p' "$FAILED_FILE"
          if [ "$FAIL_ON_ERROR" = "true" ]; then
            exit 1
          fi
        fi
