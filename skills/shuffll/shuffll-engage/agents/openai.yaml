interface:
  display_name: "Shuffll Engage"
  short_description: "Video campaigns, creative previews and results"
  default_prompt: "Use $shuffll-engage to inspect my workspace capabilities and help with a video campaign."
dependencies:
  tools:
    - type: "mcp"
      value: "shuffll-engage"
      description: "Authorized Shuffll Engage workspace tools"
      transport: "streamable_http"
      url: "https://engage.shuffll.com/mcp"
policy:
  allow_implicit_invocation: true
