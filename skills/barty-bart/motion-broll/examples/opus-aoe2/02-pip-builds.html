<title>02 PiP builds</title>
<style>
.ml{color:#8A8782}
.lane{position:absolute;left:-510px;width:1020px;height:90px}
.lane .nm{position:absolute;left:0;top:26px;font-size:30px;font-weight:600;letter-spacing:-.01em}
.lane .tr{position:absolute;left:190px;top:38px;width:620px;height:14px;border-radius:7px;background:#E2DFD9}
.lane .fl{position:absolute;left:190px;top:38px;height:14px;border-radius:7px;background:#0B0B0B}
.lane .stt{position:absolute;right:0;top:30px;font-size:22px;color:#8A8782;width:170px;text-align:right}
.col{position:absolute;top:0;width:320px}
.col .hd{position:absolute;left:0;top:0;display:flex;gap:12px;align-items:center;font-size:28px;font-weight:600}
.col .bar{position:absolute;bottom:0;width:52px;border-radius:12px 12px 6px 6px;background:#0B0B0B}
.col .xl{position:absolute;width:80px;text-align:center;font-size:17px;color:#8A8782}
.seg4{position:absolute;width:95px;text-align:center;top:12px;color:#fff;font-size:20px;font-weight:500}
</style>
<div data-slot="world">
  <div class="a" id="tab" style="left:-150px;top:-136px;width:130px;height:44px;border-radius:14px;background:#E14A12"></div>
  <div class="a" id="fname" style="left:-200px;top:132px;width:400px;text-align:center;color:#fff;font-size:30px;font-weight:500"></div>
</div><!--/world-->
<div data-slot="shape">
  <div class="L" id="Lfolder"><div class="a" style="left:-150px;top:-60px;width:300px;height:170px;border-radius:0 0 26px 26px;background:rgba(255,255,255,.14)"></div></div>
  <div class="L" id="Lterm">
    <div class="a" style="left:-506px;top:22px;display:flex;gap:10px"><i style="width:14px;height:14px;border-radius:50%;background:#D6D3CE"></i><i style="width:14px;height:14px;border-radius:50%;background:#D6D3CE"></i><i style="width:14px;height:14px;border-radius:50%;background:#D6D3CE"></i></div>
    <div class="a mono ml" style="left:-200px;top:17px;width:400px;text-align:center;font-size:19px">aoe2-low — claude</div>
    <div class="a" style="left:-530px;top:58px;width:1060px;height:1.5px;background:#E2DFD9"></div>
    <div class="a" style="left:-490px;top:82px;width:980px;height:76px;border:1.5px solid #E2DFD9;border-radius:14px;box-sizing:border-box"></div>
    <div class="row" style="left:-466px;top:104px;gap:12px;font-size:24px;font-weight:500"><span style="color:#FF5A1F;font-size:28px">✻</span>Welcome to Claude Code</div>
    <div class="a mono" style="left:-490px;top:196px;width:960px;font-size:26px;line-height:40px"><span class="ml">&gt;&nbsp;</span><span id="typed"></span><span id="caret" style="display:inline-block;width:12px;height:28px;background:#0B0B0B;vertical-align:-5px;margin-left:2px"></span></div>
    <div class="row" id="building" style="left:-490px;top:356px;gap:12px;font-size:25px;font-weight:500"><span id="star" style="color:#FF5A1F;font-size:30px;display:inline-block">✻</span><span>Building…</span><span class="ml mono" id="elapsed" style="font-size:22px">0:00</span></div>
    <div class="a mono ml" style="left:-490px;top:560px;font-size:21px">Opus 5.5</div>
    <div class="a" id="effort" style="left:120px;top:546px;width:380px;height:52px;border-radius:26px;background:#E9E6E0">
      <div class="a" id="effPill" style="top:4px;height:44px;border-radius:22px;background:#0B0B0B"></div>
      <div class="a blend" style="left:0;top:0;width:380px;height:52px"><div class="seg4" style="left:0">Low</div><div class="seg4" style="left:95px">Med</div><div class="seg4" style="left:190px">High</div><div class="seg4" style="left:285px">Max</div></div>
    </div>
  </div>
  <div class="L" id="Llanes">
    <div class="a ml" style="left:-510px;top:40px;font-size:24px;white-space:nowrap">Same prompt · one build per reasoning level</div>
    <div class="lane" id="ln0" style="top:110px"><div class="nm">Low</div><div class="tr"></div><div class="fl"></div><div class="stt mono"></div></div>
    <div class="lane" id="ln1" style="top:220px"><div class="nm">Medium</div><div class="tr"></div><div class="fl"></div><div class="stt mono"></div></div>
    <div class="lane" id="ln2" style="top:330px"><div class="nm">High</div><div class="tr"></div><div class="fl"></div><div class="stt mono"></div></div>
    <div class="lane" id="ln3" style="top:440px"><div class="nm">Max</div><div class="tr"></div><div class="fl"></div><div class="stt mono"></div></div>
  </div>
  <div class="L" id="Lmet">
    <div class="a ml" style="left:-510px;top:40px;font-size:24px;white-space:nowrap">Measured for every build</div>
    <div class="col" id="c0" style="left:-510px;top:110px"><div class="hd"><span class="ic"></span>Cost</div></div>
    <div class="col" id="c1" style="left:-160px;top:110px"><div class="hd"><span class="ic"></span>Time</div></div>
    <div class="col" id="c2" style="left:190px;top:110px"><div class="hd"><span class="ic"></span>Tokens</div></div>
  </div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
const ACC='#FF5A1F';
// word times (clip-local = video time - 6.75)
const PROMPT='Build a faithful replica of Age of Empires II that runs in the browser: villagers, resources, buildings and an AI opponent.';
const TY0=3.5, TY1=4.75;
// effort control: High -> Low on "low"
const SEGX=i=>i*95;
const eL=M.track(SEGX(2)+4,[[5.75,SEGX(0)+4,M.FAST]]), eR=M.track(SEGX(3)-4,[[5.75,SEGX(1)-4,M.SLOW]]);
// lanes
const DUR=[3.0,4.2,5.4,6.8], LS=7.85;
const prog=(i,t)=>M.clamp((t-LS-0.12*i)/DUR[i]);
const PULSE=[8.75,9.12,9.32,9.73];
// metrics
const COLT=[12.8,13.55,14.65], REL=[[.22,.4,.66,1],[.25,.44,.7,1],[.2,.38,.64,1]];
const ICN=['coin','clock','chip'];
for(let c=0;c<3;c++){
  const col=$('c'+c); col.querySelector('.ic').innerHTML=M.icon(ICN[c],34,'#0B0B0B');
  ['Low','Med','High','Max'].forEach((n,i)=>{col.insertAdjacentHTML('beforeend',`<div class="bar" id="b${c}${i}" style="left:${i*72}px;top:0"></div><div class="xl" style="left:${i*72-14}px;top:420px">${n}</div>`);});
}
const barH=[0,1,2].map(c=>[0,1,2,3].map(i=>M.track(0,[[COLT[c]+0.12+0.07*i,REL[c][i]*300,[13,0.82]]])));

M.scene({
  W:1920,H:1080,bg:null,T:15.75,center:[1220,540],intro:0.31,
  SH:{folder:{w:300,h:220,r:26,bg:'#FF5A1F',cam:1.6}, term:{w:1060,h:640,r:26,bg:'#F4F2EE',cam:1.05},
      lanes:{w:1100,h:600,r:28,bg:'#F4F2EE',cam:1.05}, met:{w:1100,h:620,r:28,bg:'#FFFFFF',cam:1.05}},
  start:'folder', SEQ:[[2.38,'term'],[7.69,'lanes'],[11.25,'met']],
  layers:[
    {el:'Lfolder',tin:0.31,tout:2.38,o:{din:0}},
    {el:'Lterm',tin:2.38,tout:7.69,anchor:'t',update:(t)=>{
      const n=Math.round(M.clamp((t-TY0)/(TY1-TY0))*PROMPT.length); M.setText($('typed'),PROMPT.slice(0,n));
      const typing=t>TY0-0.1&&t<TY1+0.1; $('caret').style.opacity=(typing||t>6.4||Math.floor(t*2.2)%2==0)?(t>6.4?0:1):0;
      const bv=M.vis(t,6.42,null,{din:0,lin:0.2}); $('building').style.opacity=bv.o; $('building').style.filter=bv.blur>0.05?`blur(${bv.blur}px)`:'none';
      $('star').style.transform=`rotate(${(t*240)%360}deg)`; M.setText($('elapsed'),'0:0'+Math.max(0,Math.floor((t-6.45)*2)).toString().slice(-1));
      const L=eL(t),R=eR(t); Object.assign($('effPill').style,{left:L+'px',width:(R-L)+'px'});
    }},
    {el:'Llanes',tin:7.69,tout:11.25,anchor:'t',update:(t)=>{
      for(let i=0;i<4;i++){
        const ln=$('ln'+i), v=M.vis(t,7.69+0.1*i,null,{din:0.12,lin:0.24});
        ln.style.opacity=v.o; ln.style.filter=v.blur>0.05?`blur(${v.blur}px)`:'none'; ln.style.transform=`translateY(${(1-v.a)*14}px)`;
        const p=prog(i,t); ln.querySelector('.fl').style.width=(620*p)+'px';
        M.setText(ln.querySelector('.stt'),p>=1?'done ✓':(p>0?Math.round(p*100)+'%':'queued'));
        const k=Math.exp(-Math.pow((t-PULSE[i]-0.12)/0.16,2)); ln.querySelector('.nm').style.color=`rgb(${Math.round(11+(255-11)*k)},${Math.round(11+(90-11)*k)},${Math.round(11+(31-11)*k)})`;
      }
    }},
    {el:'Lmet',tin:11.25,tout:null,anchor:'t',update:(t)=>{
      for(let c=0;c<3;c++){
        const col=$('c'+c), v=M.vis(t,COLT[c],null,{din:0,lin:0.22});
        col.style.opacity=v.o; col.style.filter=v.blur>0.05?`blur(${v.blur}px)`:'none';
        for(let i=0;i<4;i++){const h=Math.max(0,barH[c][i](t)); Object.assign($('b'+c+i).style,{height:h+'px',top:(400-h)+'px',background:i===0?ACC:'#0B0B0B'});}
      }
    }},
  ],
  cursor:{size:44,clicks:[2.18,2.32,5.75],keys:[[0,456,362],[1.3,456,362],[1.95,40,30],[2.5,40,30],[5.0,60,140],[5.55,172,262],[5.95,172,262],[6.7,380,380]]},
  extra:(t,g)=>{
    const v=M.vis(t,0.31,2.38,{din:0}); const top=g.cy-g.h/2, left=g.cx-g.w/2;
    Object.assign($('tab').style,{display:v.o<0.002?'none':'',opacity:v.o,left:(left+12)+'px',top:(top-34)+'px',transform:`scale(${g.sc})`,transformOrigin:`${g.w/2-12}px ${g.h/2+34}px`});
    const nv=M.vis(t,0.85,2.38,{din:0}); const nm='aoe2-low'; const n=Math.round(M.clamp((t-0.95)/0.5)*nm.length);
    Object.assign($('fname').style,{display:nv.o<0.002?'none':'',opacity:nv.o,top:(g.h/2+26)+'px'}); M.setText($('fname'),nm.slice(0,n)||' ');
  }
});
</script>
