<title>01 Opus drop</title>
<style>
.lvl{position:absolute;top:-18px;width:200px;text-align:center;color:#fff;font-size:30px;font-weight:500}
</style>
<div data-slot="shape">
  <div class="a" id="pill"></div>
  <div class="L" id="Lopus"><div class="row" style="transform:translate(-50%,-50%);gap:16px;color:#fff;font-size:48px;font-weight:600;letter-spacing:-.02em"><span id="icSpark"></span>Opus 5.5<span id="badge" style="display:inline-block;background:#FF5A1F;color:#fff;font-size:22px;font-weight:600;letter-spacing:0;border-radius:999px;padding:6px 14px">New</span></div></div>
  <div class="L" id="Laoe">
    <div class="a" style="left:-358px;top:-98px;width:196px;height:196px;border-radius:38px;background:#FF5A1F"><div class="a" id="icCastle" style="left:38px;top:34px"></div></div>
    <div class="a" style="left:-126px;top:-66px;font-size:54px;font-weight:600;letter-spacing:-.025em;white-space:nowrap">Age of Empires II</div>
    <div class="a" style="left:-124px;top:6px;font-size:25px;color:#8A8782;white-space:nowrap">Browser replica · built by Opus 5.5</div>
  </div>
  <div class="L blend" id="Lseg">
    <div class="lvl" style="left:-436px">Low</div><div class="lvl" style="left:-212px">Medium</div><div class="lvl" style="left:12px">High</div><div class="lvl" style="left:236px">Max</div>
  </div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
$('icSpark').innerHTML=M.icon('sparkle',40,'#FF5A1F');
$('icCastle').innerHTML=M.icon('castle',120,'#fff',4.2);
const badge=M.track(0,[[0.63,1,[16,0.7]]]);
const pL=M.track(-442,[[4.5,-218,M.SLOW],[4.85,6,M.SLOW],[5.3,230,M.SLOW]]);
const pR=M.track(-230,[[4.5,-6,M.FAST],[4.85,218,M.FAST],[5.3,442,M.FAST]]);
M.scene({
  W:1920,H:1080,bg:'#E9E7E2',T:6.2,
  SH:{opus:{w:440,h:120,r:60,bg:'#0B0B0B',cam:1.9}, aoe:{w:840,h:300,r:44,bg:'#FFFFFF',cam:1.45}, seg:{w:920,h:124,r:62,bg:'#FFFFFF',cam:1.55}},
  start:'opus', SEQ:[[2.17,'aoe'],[4.06,'seg']],
  layers:[
    {el:'Lopus',tin:null,tout:2.17,update:(t)=>{const b=badge(t);$('badge').style.transform=`scale(${Math.max(0,b).toFixed(4)})`;$('badge').style.opacity=Math.min(1,b*1.5);}},
    {el:'Laoe',tin:2.17,tout:4.06},
    {el:'Lseg',tin:4.06,tout:null},
  ],
  cursor:{size:44,clicks:[4.5,4.85,5.3],keys:[[0,520,320],[1.2,520,320],[1.9,300,130],[3.7,300,130],[4.36,-102,20],[4.56,-102,20],[4.78,122,20],[4.92,122,20],[5.2,346,20]]},
  extra:(t,g)=>{
    const v=M.vis(t,4.06,null,{din:0.05,lin:0.2}); const ps=$('pill').style;
    if(v.o<0.002){ps.display='none';return;}
    const L=pL(t)+g.w/2, R=pR(t)+g.w/2;
    Object.assign(ps,{display:'',left:L+'px',width:Math.max(0,R-L)+'px',top:'12px',height:(g.h-24)+'px',borderRadius:((g.h-24)/2)+'px',background:'#0B0B0B',opacity:v.o,filter:v.blur>0.05?`blur(${v.blur}px)`:'none'});
  }
});
</script>
