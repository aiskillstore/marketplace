<title>05 Low vs Max</title>
<style>
.inf{position:absolute;left:-310px;width:620px;height:64px;display:flex;align-items:center;gap:16px;font-size:25px;font-weight:500}
.inf .ib{width:40px;height:40px;border-radius:12px;background:#F1EFEB;display:flex;align-items:center;justify-content:center}
.side{position:absolute;top:0;width:440px}
.side .nm{font-size:48px;font-weight:600;letter-spacing:-.025em;white-space:nowrap}
.side .sub{margin-top:8px;font-size:22px;color:#8A8782;white-space:nowrap}
.side .trk{position:absolute;top:170px;left:0;width:440px;height:18px;border-radius:9px;background:#EDEAE5}
.side .fil{position:absolute;top:170px;left:0;height:18px;border-radius:9px;background:#0B0B0B}
.side .lb{position:absolute;top:130px;left:0;font-size:20px;color:#8A8782}
</style>
<div data-slot="shape">
  <div class="L" id="Lsess"><div class="row" style="transform:translate(-50%,-50%);gap:18px;color:#fff;font-size:40px;font-weight:600;letter-spacing:-.02em"><span id="icSpark"></span>Opus 5.5<span style="font-size:26px;font-weight:600;letter-spacing:0;border-radius:999px;padding:6px 16px;background:#FF5A1F">Low</span></div></div>
  <div class="L" id="Lctx">
    <div class="row" style="left:-310px;top:40px;gap:14px;font-size:30px;font-weight:600"><span id="icSpark2"></span>Opus 5.5<span style="font-size:20px;border-radius:999px;padding:4px 12px;background:#FF5A1F;color:#fff">Low</span><span style="font-size:22px;color:#8A8782;font-weight:500">· given up front</span></div>
    <div class="inf" id="i0" style="top:110px"><span class="ib"></span><span class="mono" style="font-size:23px">master-prompt.md</span></div>
    <div class="inf" id="i1" style="top:184px"><span class="ib"></span>What worked</div>
    <div class="inf" id="i2" style="top:258px"><span class="ib"></span>What didn't</div>
    <div class="inf" id="i3" style="top:332px"><span class="ib"></span>What was missing</div>
  </div>
  <div class="L" id="Lvs">
    <div class="side" style="left:-540px;top:80px"><div class="nm">Low</div><div class="sub">+ master prompt</div><div class="lb">Result</div><div class="trk"></div><div class="fil" id="fL" style="background:#FF5A1F"></div></div>
    <div class="side" style="left:100px;top:80px"><div class="nm" id="rn">Max</div><div class="sub">default prompt</div><div class="lb">Result</div><div class="trk"></div><div class="fil" id="fR"></div></div>
    <div class="a" id="vs" style="left:-48px;top:112px;width:96px;height:96px;border-radius:50%;background:#0B0B0B;color:#fff;font-size:34px;font-weight:600;display:flex;align-items:center;justify-content:center"><span id="vsT">vs</span></div>
  </div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
$('icSpark').innerHTML=M.icon('sparkle',38,'#FF5A1F'); $('icSpark2').innerHTML=M.icon('sparkle',30,'#FF5A1F');
['file','check','x','plus'].forEach((n,i)=>$('i'+i).querySelector('.ib').innerHTML=M.icon(n,24,'#0B0B0B'));
const IT=[0.95,1.22,1.5,1.82];
const fR=M.track(0,[[3.2,0.86,[11,0.9]]]), fL=M.track(0,[[4.05,0.5,[11,0.9]],[4.75,0.86,[9,0.86]]]);
const q=M.track(0,[[6.68,1,[16,0.7]]]);
M.scene({
  W:1920,H:1080,bg:'#E9E7E2',T:7.2,intro:0.02,
  SH:{sess:{w:560,h:120,r:60,bg:'#0B0B0B',cam:1.8}, ctx:{w:720,h:440,r:36,bg:'#FFFFFF',cam:1.4}, vs:{w:1240,h:330,r:40,bg:'#FFFFFF',cam:1.2}},
  start:'sess', SEQ:[[0.54,'ctx'],[2.67,'vs']],
  layers:[
    {el:'Lsess',tin:null,tout:0.54},
    {el:'Lctx',tin:0.54,tout:2.67,anchor:'t',update:(t)=>{for(let i=0;i<4;i++){const e=$('i'+i),v=M.vis(t,IT[i],null,{din:0,lin:0.2}); e.style.opacity=v.o; e.style.filter=v.blur>0.05?`blur(${v.blur}px)`:'none'; e.style.transform=`translateX(${(1-v.a)*-18}px)`;}}},
    {el:'Lvs',tin:2.67,tout:null,anchor:'t',update:(t)=>{
      $('fL').style.width=(440*Math.max(0,fL(t)))+'px'; $('fR').style.width=(440*Math.max(0,fR(t)))+'px';
      M.setText($('rn'),t<6.17?'Max':t<6.6?'High':'High / Max');
      const k=q(t); const vs=$('vs').style; vs.background=k>0.5?'#FF5A1F':'#0B0B0B'; M.setText($('vsT'),t<6.68?'vs':'?'); vs.transform=`scale(${1+0.25*Math.sin(Math.PI*M.clamp((t-6.68)/0.35))})`;
    }},
  ],
  cursor:{size:44,keys:[[0,900,520],[5.2,900,520],[6.0,60,160],[7.2,60,160]]},
});
</script>
