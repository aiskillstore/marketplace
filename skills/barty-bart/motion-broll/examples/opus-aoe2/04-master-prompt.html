<title>04 Master prompt</title>
<style>
.sec{position:absolute;left:-330px;width:660px;height:120px}
.sec .bd{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.sec .tt{position:absolute;left:58px;top:4px;font-size:27px;font-weight:600;white-space:nowrap}
.sk{position:absolute;height:14px;border-radius:7px;background:#E6E3DE}
.dl{position:absolute;left:-230px;height:12px;border-radius:6px;background:#DCD8D1}
</style>
<div data-slot="world">
  <div class="a" id="ghost" style="left:10px;top:-60px;width:700px;height:120px;border-radius:60px;border:3px dashed #BDB8B0;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:500;color:#A29E97">Opus 5.5 · Low</div>
</div><!--/world-->
<div data-slot="shape">
  <div class="L" id="Lnotes">
    <div class="row" style="left:-330px;top:40px;gap:14px;font-size:34px;font-weight:600;letter-spacing:-.02em"><span id="icPen"></span>Build notes</div>
    <div class="sec" id="s0" style="top:124px"><div class="bd" style="background:#0B0B0B"></div><div class="tt">Liked</div><div class="sk" style="left:58px;top:56px"></div><div class="sk" style="left:58px;top:84px"></div></div>
    <div class="sec" id="s1" style="top:262px"><div class="bd" style="background:#0B0B0B"></div><div class="tt">Didn't like</div><div class="sk" style="left:58px;top:56px"></div><div class="sk" style="left:58px;top:84px"></div></div>
    <div class="sec" id="s2" style="top:400px"><div class="bd" style="background:#FF5A1F"></div><div class="tt">Missing</div><div class="sk" style="left:58px;top:56px"></div><div class="sk" style="left:58px;top:84px"></div></div>
  </div>
  <div class="L" id="Ldoc">
    <div class="row mono" style="left:-230px;top:38px;gap:12px;font-size:25px"><span id="icFile"></span>master-prompt.md</div>
    <div class="a" style="left:-300px;top:96px;width:600px;height:1.5px;background:#EAE7E2"></div>
    <div id="lines"></div>
  </div>
  <div class="L" id="Lchip"><div class="row mono" style="transform:translate(-50%,-50%);gap:12px;color:#fff;font-size:26px"><span id="icFile2"></span>master-prompt.md</div></div>
  <div class="L" id="Lsess"><div class="row" style="transform:translate(-50%,-50%);gap:18px;color:#fff;font-size:40px;font-weight:600;letter-spacing:-.02em"><span id="icSpark"></span>Opus 5.5<span id="lowChip" style="font-size:26px;font-weight:600;letter-spacing:0;border-radius:999px;padding:6px 16px">Low</span><span style="font-size:22px;font-weight:500;letter-spacing:0;color:#9A9791" class="mono">+ master-prompt.md</span></div></div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
$('icPen').innerHTML=M.icon('pencil',32,'#0B0B0B'); $('icFile').innerHTML=M.icon('file',30,'#0B0B0B'); $('icFile2').innerHTML=M.icon('file',30,'#fff'); $('icSpark').innerHTML=M.icon('sparkle',38,'#FF5A1F');
['check','x','plus'].forEach((n,i)=>$('s'+i).querySelector('.bd').innerHTML=M.icon(n,24,'#fff',3));
const SEC=[1.8,2.12,3.68], SKW=[[520,380],[460,300],[500,340]];
const LW=[430,380,440,300,0,260,420,400,350,0,300,410,240];
$('lines').innerHTML=LW.map((w,i)=>`<div class="dl" id="d${i}" style="top:${130+i*42}px;height:${i==0?20:12}px;${i==0?'background:#FF5A1F;':''}"></div>`).join('');
const KX=[[0,760,460],[1.2,760,460],[1.9,330,250],[6.2,330,250],[6.75,0,30],[6.95,0,30],[7.55,360,20],[7.85,360,20],[8.5,470,170]];
const cur=M.path(KX);
const fxT=M.track(0,[[6.95,180,M.SOFT],[7.6,360,M.SOFT]]);
const lowOn=M.track(0,[[8.31,1,[18,.8]]]);
M.scene({
  W:1920,H:1080,bg:'#E9E7E2',T:10,intro:0.15,
  SH:{notes:{w:780,h:560,r:36,bg:'#FFFFFF',cam:1.3}, doc:{w:600,h:720,r:28,bg:'#FFFFFF',cam:1.2},
      chip:{w:420,h:96,r:48,bg:'#0B0B0B',cam:1.5}, sess:{w:720,h:120,r:60,bg:'#0B0B0B',cam:1.75}},
  start:'notes', SEQ:[[5.1,'doc'],[6.9,'chip'],[7.8,'sess']],
  layers:[
    {el:'Lnotes',tin:0.15,tout:5.1,anchor:'t',o:{din:0.05},update:(t)=>{
      for(let i=0;i<3;i++){const s=$('s'+i),v=M.vis(t,SEC[i],null,{din:0,lin:0.22}); s.style.opacity=v.o; s.style.filter=v.blur>0.05?`blur(${v.blur}px)`:'none'; s.style.transform=`translateY(${(1-v.a)*12}px)`;
        s.querySelectorAll('.sk').forEach((k,j)=>k.style.width=(SKW[i][j]*M.eio((t-SEC[i]-0.15-0.18*j)/0.45))+'px');}
    }},
    {el:'Ldoc',tin:5.1,tout:6.9,anchor:'t',update:(t)=>{LW.forEach((w,i)=>$('d'+i).style.width=(w*M.eio((t-5.35-0.075*i)/0.3))+'px');}},
    {el:'Lchip',tin:6.9,tout:7.8,o:{din:0.04}},
    {el:'Lsess',tin:7.8,tout:null,update:(t)=>{const k=M.clamp(lowOn(t)); const c=$('lowChip').style; c.background=`rgba(255,90,31,${k})`; c.color='#fff'; c.boxShadow=`inset 0 0 0 2px rgba(255,255,255,${0.35*(1-k)})`; c.transform=`scale(${1+0.12*Math.sin(Math.PI*M.clamp((t-8.31)/0.3))})`;}},
  ],
  cursor:{size:44,drags:[[6.9,7.8]],keys:KX},
  geom:(t,g)=>{g.fx=fxT(t); if(t>=6.9){const c=t<7.8?cur(t):cur(7.8); g.cx=c.x; g.cy=c.y-30; if(t>=7.8){g.cx=360; g.cy=M.lerp(c.y-30,0,M.S(t-7.8,15,0.84));}} return g;},
  extra:(t,g)=>{const v=M.vis(t,6.95,7.8,{din:0,lin:0.2,lout:0.15}); const s=$('ghost').style; s.display=v.o<0.002?'none':''; s.opacity=v.o; s.transform=`scale(${v.s})`;}
});
</script>
