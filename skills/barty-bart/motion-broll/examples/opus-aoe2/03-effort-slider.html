<title>03 Effort slider</title>
<style>.blk{position:absolute;background:#0B0B0B;transform-origin:50% 100%}</style>
<div data-slot="shape">
  <div class="L" id="Lcard">
    <div class="a" style="left:-450px;top:40px;font-size:26px;color:#8A8782;white-space:nowrap">Same prompt · different effort</div>
    <div class="a" id="scene" style="left:0;top:0"></div>
    <div class="a" style="left:-330px;top:400px;width:660px;height:2px;background:#E2DFD9"></div>
    <div class="a" style="left:-400px;top:470px;width:800px;height:12px;border-radius:6px;background:#E6E3DE"></div>
    <div class="a" id="sfill" style="left:-400px;top:470px;height:12px;border-radius:6px;background:#0B0B0B"></div>
    <div class="a" id="knob" style="top:458px;width:36px;height:36px;border-radius:50%;background:#fff;border:4px solid #0B0B0B;box-sizing:border-box"></div>
    <div class="a" style="left:-400px;top:506px;font-size:24px;font-weight:500">Low</div>
    <div class="a" style="left:300px;top:506px;width:100px;text-align:right;font-size:24px;font-weight:500">Max</div>
  </div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
// castle parts: [threshold, x0, y0, x1, y1, color, radius]
const P=[[0,-180,300,180,400,'#0B0B0B','6px'],[0.18,-36,336,36,401,'#FFFFFF','36px 36px 0 0'],[0.34,-240,220,-150,400,'#0B0B0B','6px'],[0.48,150,220,240,400,'#0B0B0B','6px'],
 [0.6,-70,190,70,300,'#0B0B0B','6px'],[0.72,-240,196,-218,220,'#0B0B0B','3px'],[0.74,-206,196,-184,220,'#0B0B0B','3px'],[0.76,-172,196,-150,220,'#0B0B0B','3px'],
 [0.78,150,196,172,220,'#0B0B0B','3px'],[0.8,184,196,206,220,'#0B0B0B','3px'],[0.82,218,196,240,220,'#0B0B0B','3px'],
 [0.88,-3,110,3,190,'#0B0B0B','2px'],[0.92,3,112,52,138,'#FF5A1F','2px 8px 8px 2px'],[0.95,-206,260,-184,292,'#FF5A1F','11px 11px 2px 2px'],[0.97,184,260,206,292,'#FF5A1F','11px 11px 2px 2px']];
$('scene').innerHTML=P.map((p,i)=>`<div class="blk" id="p${i}" style="left:${p[1]}px;top:${p[2]}px;width:${p[3]-p[1]}px;height:${p[4]-p[2]}px;background:${p[5]};border-radius:${p[6]}"></div>`).join('');
const KX=[[0,760,470],[0.9,760,470],[1.85,-396,476],[2.2,-396,476],[3.1,400,476],[3.4,400,476],[3.8,470,560]];
const cur=M.path(KX);
const val=t=>t<2.15?0:M.clamp((Math.min(cur(t).x,cur(3.3).x)+400)/800);
const CT=M.crossTimes(val,0,4,P.map(p=>p[0])).map(x=>Math.max(x,0.3));
M.scene({
  W:1920,H:1080,bg:'#E9E7E2',T:3.8,intro:0.05,
  SH:{card:{w:1000,h:600,r:40,bg:'#FFFFFF',cam:1.35}}, start:'card', SEQ:[],
  layers:[{el:'Lcard',tin:0.05,tout:null,anchor:'t',o:{din:0.05},update:(t)=>{
    const v=val(t), kx=-400+800*v;
    $('sfill').style.width=(kx+400)+'px'; $('knob').style.left=(kx-18)+'px';
    $('knob').style.transform=`scale(${1+0.18*M.track(0,[[2.1,1,[30,.8]],[3.3,0,[20,.8]]])(t)})`;
    P.forEach((p,i)=>{const a=M.S(t-CT[i],17,0.62); const el=$('p'+i); el.style.transform=`scaleY(${Math.max(0,a).toFixed(4)})`; el.style.opacity=t<CT[i]?0:1;});
  }}],
  cursor:{size:44,drags:[[2.15,3.3]],keys:KX},
});
</script>
