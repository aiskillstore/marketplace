version: 0.1
project:
  name: "{{PROJECT_NAME}}"
  summary: "{{PROJECT_SUMMARY}}"
cairn:
  knowledge_dir: "cairn"
  # Date of the skill spec this instance was initialized against, or last
  # upgraded to. Stamped automatically by init from references/upgrade.md's
  # "Current spec date" (not a user decision); re-stamped after each instance
  # upgrade. Audit/upgrade drift checks compare it against the upgrade.md
  # changelog. Missing field = instance predates this mechanism: run the full
  # changelog (see references/upgrade.md).
  skill_spec_date: "{{SKILL_SPEC_DATE}}"
  # git_policy: track | ignore | private_sync
  git_policy: "{{GIT_POLICY}}"
  # reference_git_policy (optional): same enum as git_policy, scoped only to
  # cairn/Reference/ (external raw input the project owns but didn't author —
  # a client's PDF, a call transcript). Omit to inherit git_policy above.
  # Set it separately when Reference/ may hold material more sensitive than
  # the project's own authored knowledge, e.g. git_policy: track (cairn/
  # committed/public) but reference_git_policy: ignore or private_sync
  # (raw external material stays out of the repo either way).
  # reference_git_policy: "{{REFERENCE_GIT_POLICY}}"
  # language: en | zh | ... — language used when writing AGENTS.md/LOG.md/ROADMAP.md/topic notes for this project
  language: "{{DOC_LANGUAGE}}"
graduation:
  # One or more graduation providers. Two equivalent forms:
  #
  # (a) Single provider (simplest) — keep these three keys:
  provider: "{{GRADUATION_PROVIDER}}"
  target: "{{GRADUATION_TARGET}}"
  index: "{{KNOWLEDGE_INDEX}}"
  #
  # (b) Multiple providers — replace the three keys above with a `providers:`
  #     list. Each entry carries target + index plus any provider-specific
  #     adapter settings the writer needs (scope, api, link_format, identity).
  #     This is the real shape used when a project graduates to more than one
  #     knowledge base. Example:
  # providers:
  #   - provider: obsidian
  #     target: "<vault-relative knowledge dir>"
  #     index: "<vault-relative INDEX.md>"
  #     link_format: wikilink
  #   - provider: lark-wiki
  #     space_id: "<wiki space id>"
  #     index: "<wiki INDEX node url>"
  #     index_node_token: "<index node token>"
  #     scope: "wiki:wiki"   # coarse scope; covers wiki read + write
  #     api: native          # native wiki resource API, NOT CLI shortcuts
  #     identity: user
  #     link_format: url
  #   - provider: notion
  #     database_id: "<notion database id>"  # the DB is both container and INDEX
  #     index: "<DB human URL>"
  #     parent_page_id: "<page the DB lives under>"
  #     frontmatter_mode: properties   # frontmatter -> DB properties, not YAML
  #     transport: rest        # direct REST via curl (ntn CLI is proxy-unreliable)
  #     api: native
  #     notion_version: "2022-06-28"
  #     identity: integration_token
  #     credential_env: NOTION_API_TOKEN  # value in .env, referenced by name only
  #     link_format: url
  #
  # (c) Deferred — no knowledge base connected yet ("try Cairn first, connect
  #     later"). Replace the three keys in (a) with this single marker; the
  #     provider decisions are collected at the first graduation instead
  #     (see references/graduation.md → Deferred provider):
  # provider: none
history:
  # migration_mode: start_fresh | inventory_only | selective_migrate
  migration_mode: "{{MIGRATION_MODE}}"
