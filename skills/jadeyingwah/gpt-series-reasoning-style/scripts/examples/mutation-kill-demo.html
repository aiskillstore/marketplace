<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>mutation-kill demo artifact</title>
</head>
<body>
<div id="out"></div>
<script>
/* 演示用最小产物：一个"齿轮比"模型 + 一份**故意只查大小、不查符号**的自检。
   它的缺陷形态与真实案例一致——自检对"符号被取反"这一类错误零区分力。
   mutation-kill.py 会注入变异体，跑 window.__audit()，看这份自检能否看出差别。 */

var N1 = 48, N2 = 16;
var RATIO = N1 / N2;          // 3.000

function model() {
  var w1 = 2.0;               // 输入角速度
  return { w1: w1, w2: w1 * RATIO };
}

/* 自带自检：断言全为**绝对值/大小**，不看方向——符号变异体对它透明。 */
function __audit() {
  var s = model();
  var checks = [
    { name: "|w2|/w1 == 3", ok: Math.abs(Math.abs(s.w2) / s.w1 - 3) < 1e-9 },
    { name: "|w2| > 0",     ok: Math.abs(s.w2) > 0 },
    { name: "w1 > 0",       ok: s.w1 > 0 }
  ];
  var pass = checks.every(function (c) { return c.ok; });
  document.getElementById("out").textContent = pass ? "ok" : "fail";
  return { pass: pass, checks: checks };
}
window.__audit = __audit;
</script>
</body>
</html>
