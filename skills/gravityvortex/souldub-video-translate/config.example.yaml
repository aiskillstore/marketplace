# SoulDub Agent API base URL.
# The default points to the current Agent API /api/v1 root.
api_base: "https://api.souldub.ai/api/v1"

# Output directory.
# auto writes to souldub_outputs/<timestamp>-<filename-stem>/ next to the source video.
output_dir: "auto"

# State directory.
# auto uses platformdirs.user_state_dir(".souldub").
state_dir: "auto"

# Maximum task polling interval in seconds.
# API docs recommend at most 30 seconds; the script backs off from 2 seconds to this limit.
max_poll_interval_seconds: 30

# Value sent as allowDynamicDuration when creating a task.
allow_dynamic_duration: true

# Multipart upload part size in MiB.
# Default is 8 MiB; the script keeps the actual part size at or above the common 5 MiB multipart minimum.
upload_part_size_mib: 8

# Number of multipart upload parts to PUT concurrently.
# Accepted range is 1..4. Keep this at 1 for the safest default.
upload_concurrency: 2

# Maximum retries for temporary API/media download failures.
# Values below 1 are treated as 1.
max_api_retries: 5

# Subtitle variants to download after translation completes.
# translated is the target-language subtitle, bilingual is the bilingual subtitle.
download_subtitles:
  - translated
  - bilingual
