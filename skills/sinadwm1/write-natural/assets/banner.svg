<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc"><title id="title">Write Natural</title><desc id="desc">Evidence-led writing in Persian and English. Clarity, voice, integrity.</desc><rect width="1280" height="420" fill="#101b26"/><path d="M900 0v420M0 340h1280" stroke="#33434e"/><circle cx="1100" cy="180" r="92" fill="none" stroke="#9ed8bb" stroke-width="2"/><path d="M1040 210l40-95 40 95m-63-35h46m30 35 28-65" fill="none" stroke="#e5c58b" stroke-width="5"/><text x="72" y="78" fill="#9ed8bb" font-family="sans-serif" font-size="17" letter-spacing="4">PERSIAN + ENGLISH · WRITING SKILL</text><text x="65" y="193" fill="#f5f1e8" font-family="Georgia,serif" font-size="89">Write Natural</text><text x="72" y="258" fill="#c3cbd0" font-family="sans-serif" font-size="25">Keep the meaning. Make every paragraph earn its place.</text><text x="72" y="389" fill="#9ed8bb" font-family="sans-serif" font-size="18" letter-spacing="3">CLARITY / VOICE / INTEGRITY</text></svg>