interface:
  display_name: "乔木大学生简历"
  short_description: "从零访谈、JD 定制、旧简历美化，并生成单份或六风格 PDF"
  default_prompt: "使用 $qiaomu-campus-resume 为大学生、应届生或实习求职者制作可投递简历。先在四种入口中选择最短可靠路径：从 0 问答、旧简历优化、JD 针对性定制、多风格批量生成。从 0 或需要补内容时，读取对话访谈协议，一次只问一个核心问题并附当前判断，沿最强经历深挖个人贡献、行动、结果、证据和面试可解释性；维护 interview-ledger.json，运行 assess_interview.py 并获得本人确认后再生成最终 PDF。用户只要求美化或重排旧简历时，运行 extract_resume.py，复述提取事实并获得一次确认，以 source_resume 标记事实，运行 validate_resume.py；不要强迫用户重新完成两项深度访谈，也不要未经请求改写内容。用户提供 JD 时，建立 JD 要求—已有证据/缺口—简历位置映射，只写有证据的关键词。默认生成一份最合适的单栏 HTML/PDF，并按真实内容量应用 sparse、balanced 或 dense 密度；用户明确要求多种风格时，固定同一份事实并使用 --all-themes 一次生成六套核心主题、清单和验证报告。禁止编造经历和数字；边框声明只允许横向 border-bottom，禁止 border-radius、圆角框、闭合边框、顶边、侧边线和侧边栏。"
  examples:
    - "我上传了旧简历和前端实习 JD，帮我改成一页有细分割线但无圆角框的 Kami 风格 PDF"
    - "我没有简历，访谈我并生成一份后端校招简历"
    - "像 Grill Me 一样每次问我一个问题，把项目聊透后再生成简历"
    - "别发大表格，一问一答收集我的学生经历，事实够了再出 PDF"
    - "把我的中文应届生简历改成适合外企的软件工程英文版"
    - "根据这份 AI 算法岗 JD 定制简历，但不要编造量化结果"
    - "这份简历内容不要改，只帮我美化排版并导出一页 PDF"
    - "用同一份已确认内容，一次生成六种不同风格的简历给我比较"
    - "参考 ResumeCollection 071 的深蓝极简模板重做我的校招简历"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "agent-skills-compatible"
  activation:
    mode: "automatic-or-manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    personal_data: "local-only; never upload unless the user explicitly authorizes a named service"
    generated_claims: "evidence-bound"
  permissions:
    network: "none required for default workflow"
    file_read: "user-provided resume, job description, portfolio or repository files in scope"
    file_write: "a dedicated resume output directory only"
    subprocess: "local text extraction, browser PDF printing, PDF inspection and tests"
  degradation:
    no_browser: "emit validated HTML and explain the local PDF renderer requirement"
    scanned_pdf: "request OCR approval; never silently upload to an OCR service"
    no_job_description: "generate a role-family baseline and label JD match evidence unavailable"
  gates:
    production:
      - "one core interview question per turn with a correctable current hypothesis"
      - "interview ledger passes target, education, two evidence loops, linked skills, uncertainty and explicit confirmation gates"
      - "source facts carry evidence types"
      - "unverified claims and placeholders block rendering"
      - "trigger boundary eval"
      - "deterministic renderer tests"
      - "PDF text and page-count validation"
      - "separator-only borders and zero border-radius declarations"
      - "theme marker, palette and target font match each output"
      - "six-style batch output contains exactly six HTML/PDF pairs"
      - "reference-style batch contains exactly six rc-* outputs with source identifiers"
      - "typography uses Latin/CJK split stacks, print-safe units, zero italics and aligned tabular dates"
      - "content bullets follow evidence-bound A-C-R-E checks and skills link to usage evidence"
      - "adaptive sparse, balanced or dense layout marker matches content volume"
      - "manual visual inspection of every page"
