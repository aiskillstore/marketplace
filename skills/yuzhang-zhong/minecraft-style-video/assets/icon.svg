<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mc-title mc-desc">
  <title id="mc-title">Minecraft Style Video icon</title>
  <desc id="mc-desc">Canonical 8x8x8 Minecraft Steve standing on a 16x16 pixel grass block holding a stepped pixel-art diamond pickaxe with a clean play badge.</desc>
  <defs>
    <linearGradient id="skyBg" x1="256" y1="24" x2="256" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78A7FF"/>
      <stop offset="0.65" stop-color="#BCE0FD"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="drop" x="48" y="44" width="416" height="436" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Clean Minecraft Overworld Daylight Rounded Container (Zero text badges!) -->
  <rect width="512" height="512" rx="108" fill="url(#skyBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.55"/>

  <!-- Subtle Blocky Minecraft Sky Clouds -->
  <rect x="64" y="76" width="84" height="24" fill="#FFFFFF" fill-opacity="0.78"/>
  <rect x="88" y="60" width="44" height="16" fill="#FFFFFF" fill-opacity="0.78"/>
  <rect x="356" y="92" width="92" height="22" fill="#FFFFFF" fill-opacity="0.72"/>

  <g filter="url(#drop)">
    <!-- Canonical 16x16 Grass Block Base (Crisp pixel dirt + stepped green grass overhang) -->
    <rect x="76" y="384" width="360" height="76" fill="#866043"/>
    <!-- Dirt pixel texels -->
    <rect x="98" y="416" width="22" height="22" fill="#68482E"/>
    <rect x="142" y="430" width="22" height="22" fill="#9E724E"/>
    <rect x="186" y="412" width="22" height="22" fill="#68482E"/>
    <rect x="252" y="426" width="22" height="22" fill="#9E724E"/>
    <rect x="318" y="414" width="22" height="22" fill="#68482E"/>
    <rect x="384" y="428" width="22" height="22" fill="#9E724E"/>
    <!-- Lush green top & stepped grass side overhang -->
    <rect x="76" y="368" width="360" height="18" fill="#7CBD46"/>
    <rect x="76" y="386" width="360" height="12" fill="#6DB03B"/>
    <rect x="76" y="398" width="24" height="14" fill="#6DB03B"/>
    <rect x="122" y="398" width="32" height="20" fill="#5EA032"/>
    <rect x="178" y="398" width="24" height="12" fill="#6DB03B"/>
    <rect x="224" y="398" width="36" height="22" fill="#5EA032"/>
    <rect x="284" y="398" width="28" height="14" fill="#6DB03B"/>
    <rect x="336" y="398" width="32" height="18" fill="#5EA032"/>
    <rect x="392" y="398" width="28" height="12" fill="#6DB03B"/>

    <!-- Canonical Mojang Steve (Flush Pixel Grid, Zero Cartoon Outlines) -->
    <!-- Flush 4x12x4 Legs (#3D389C Indigo Jeans + #68686C 2px Grey Shoes) -->
    <rect x="172" y="292" width="52" height="62" fill="#3D389C"/>
    <rect x="224" y="292" width="52" height="62" fill="#332E88"/>
    <rect x="172" y="354" width="52" height="14" fill="#68686C"/>
    <rect x="224" y="354" width="52" height="14" fill="#545458"/>

    <!-- Left 4x12x4 Arm (4px Teal Sleeve + 8px Tan Forearm) -->
    <rect x="120" y="196" width="52" height="34" fill="#0099A0"/>
    <rect x="120" y="230" width="52" height="66" fill="#B98665"/>

    <!-- 8x12x4 Torso (#00A8AF Teal Shirt + Stepped V-Neck + Untucked Right Hem) -->
    <rect x="172" y="196" width="104" height="96" fill="#00A8AF"/>
    <rect x="210" y="196" width="28" height="16" fill="#B98665"/>
    <rect x="210" y="212" width="28" height="10" fill="#057C84"/>
    <rect x="172" y="282" width="38" height="10" fill="#3D389C"/>
    <rect x="236" y="292" width="40" height="8" fill="#057C84"/>

    <!-- Right 4x12x4 Arm (4px Teal Sleeve + 8px Tan Forearm holding Pickaxe) -->
    <rect x="276" y="196" width="52" height="34" fill="#00A8AF"/>
    <rect x="276" y="230" width="52" height="66" fill="#C4906E"/>

    <!-- Exact 8x8 Mojang Steve Head (160, 68, 128x128 -> 1 pixel = 16x16 units!) -->
    <rect x="160" y="68" width="128" height="128" fill="#B98665"/>
    <!-- Hair top 2 rows + 1px sideburns -->
    <rect x="160" y="68" width="128" height="32" fill="#2F2013"/>
    <rect x="160" y="100" width="16" height="16" fill="#2F2013"/>
    <rect x="272" y="100" width="16" height="16" fill="#2F2013"/>
    <!-- Row 4: White Sclera + #4B3D89 Indigo Pupils -->
    <rect x="176" y="132" width="16" height="16" fill="#FFFFFF"/>
    <rect x="192" y="132" width="16" height="16" fill="#4B3D89"/>
    <rect x="240" y="132" width="16" height="16" fill="#4B3D89"/>
    <rect x="256" y="132" width="16" height="16" fill="#FFFFFF"/>
    <!-- Row 5: 2x1 Pixel Nose -->
    <rect x="208" y="148" width="32" height="16" fill="#88563D"/>
    <!-- Row 6 & 7: Iconic U-Shaped Chin Beard Flush at Bottom -->
    <rect x="192" y="164" width="16" height="16" fill="#452514"/>
    <rect x="208" y="164" width="32" height="16" fill="#844C3A"/>
    <rect x="240" y="164" width="16" height="16" fill="#452514"/>
    <rect x="192" y="180" width="64" height="16" fill="#452514"/>

    <!-- Authentic Stepped 16x16 Pixel Diamond Pickaxe Held Squarely in Steve's Right Hand -->
    <g>
      <!-- Pommel peeking below hand + Oak Stick Handle passing cleanly through Right Hand into Pickaxe Head -->
      <rect x="286" y="286" width="16" height="16" fill="#462E14"/>
      <rect x="302" y="270" width="16" height="16" fill="#9C7036"/>
      <rect x="318" y="254" width="16" height="16" fill="#6C4A22"/>
      <rect x="334" y="238" width="16" height="16" fill="#9C7036"/>
      <rect x="350" y="222" width="16" height="16" fill="#6C4A22"/>
      <rect x="366" y="206" width="16" height="16" fill="#9C7036"/>
      <rect x="382" y="190" width="16" height="16" fill="#6C4A22"/>
      <!-- Stepped Diamond Pickaxe Head (#18262A pixel outline + #33E0D0 diamond cyan + #A8FCF4 specular + #14928C bevel) -->
      <rect x="334" y="142" width="80" height="16" fill="#18262A"/>
      <rect x="334" y="158" width="80" height="16" fill="#33E0D0"/>
      <rect x="350" y="158" width="48" height="16" fill="#A8FCF4"/>
      <rect x="318" y="174" width="32" height="16" fill="#33E0D0"/>
      <rect x="382" y="174" width="48" height="16" fill="#33E0D0"/>
      <rect x="414" y="190" width="16" height="48" fill="#33E0D0"/>
      <rect x="430" y="190" width="16" height="48" fill="#18262A"/>
      <rect x="398" y="206" width="16" height="32" fill="#14928C"/>
      <rect x="398" y="174" width="16" height="16" fill="#9C7036"/>
    </g>

    <!-- Crisp Voxel-Cornered Play Emblem -->
    <rect x="356" y="308" width="88" height="88" rx="14" fill="#16A34A" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M388 330L424 352L388 374V330Z" fill="#FFFFFF"/>
  </g>
</svg>
