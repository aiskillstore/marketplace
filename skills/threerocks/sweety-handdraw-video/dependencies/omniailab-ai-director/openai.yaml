interface:
  display_name: "OmniAiLab AI导演完整版 2.3.0"
  short_description: "影视级全流程 AI 导演 Skill，也是一个会引导创作者做判断的决策系统：开工先判定作品形态（剧情片／短剧／动画片／纪录片／宣传片／片头／MV／游戏 PV／UI 动效／达人视频／教育，说不清时只问三个问题收敛），再让创作者指定导演、摄影机、镜头、布光与美学，或交由本 skill 按作品类型给 2–3 个候选并说明理由；随后按影视工业标准从 P0 项目接收、P0A 十项剧本解析与情绪曲线、P1 创作基准、P2 角色与关键道具、P3 场景资产、P4 分镜与首帧、P5 视频提示词与参数，一路做到 P6 在 OmniAiLab 无限画布生成剪辑导出成片；媒介不限（写实／纯动画／2D卡通／3D游戏引擎渲染风格／三维＋手绘混合）、体量不限（30秒短片至上百场次长片）。专业能力不靠形容词：导演视界层以「导演式推理」加载 20 位导演处理空间／机位／光影／时间／潜文本的底层机制，含「反例」纪律与「主导演＋借用维度」混合规则（可单选、可混搭）；机位与布光层给出五维机位坐标（6 机型格式 × 11 镜头性格 × 6 焦段 × 3 景深 × 20 运动）与 33 套布光 × 5 色温变体，并有按作品类型 16 类／场景 22 类／人物 16 类／剧情节点 18 个的调度反查表；提示词层为 16 段固定块序与十一条铁律，资产层为成对资产／统一命名／状态管理／声音锁定。内置 ACTING 表演、EMOTION 情绪、LIRA 图像（含 D/P/C/R/S 视觉语言库）、CINEDANCE 视频提示词四个子技能，并附打斗 COMBAT、站位 BLOCKING、美学配方 AESTHETICS（A01–A07）、提示词教义 PROMPT-DOCTRINE、资产体系 ASSET-SYSTEM、剧本引擎 SCENE-ENGINE、光学 OPTICS、长片工程 FEATURE-PRODUCTION、音乐场景 MUSIC-SCENE、动画／混合媒介 ANIMATION、纪实／纪录片 DOCUMENTARY、入门引导 ONBOARDING、通道选择 CHANNEL-SELECT（宣传片类先判定走生成通道还是代码渲染通道：五判据＋三个提醒节点＋场景全表＋混合接力，素材核验后进分镜前锁定）、宣传片线 PROMO（14 个商业短片方向，统一在 OmniAiLab 画布选 MiniMax H3 生成）与动效工作室 MOTION-STUDIO（代码渲染通道：真实产品界面截图＋代码逐帧渲染，157 张动效镜头卡）；并附实战案例库 examples/case-studies/（6 个商业级案例的成品提示词块与问题解法）、案例配图层 examples/images/（49 张方法示意图＋关键词反查索引）、导演预设库 examples/director-presets/（20 位）与宣传片成品样例库 examples/promo-cases/（7 条真实成片原话输入／成品提示词）、电影艺术知识层 FILM-ART（由电影艺术领域著作梳理成的**判断与来源层**：15 个能力域＋39 张能力卡＋118 本著作书库索引，管"该想什么、为什么、判准在哪"，只产出判断与依据、不写提示词，在 P0A／P1／P4 主动给出判断）；模型口径统一为 OmniAiLab（Seedream 5.0 / Flux / 香蕉Pro / Qwen Image / image2 / image2.5 / Seedance 2.5 / Kling O3 / Vidu / MiniMax H3）"
  author: "OmniAiLab"
  developer: "Mochiball"
  default_prompt: "使用 $omniailab-ai-director 开始影视制作。先判定作品形态（电影／短剧／动画片／纪录片／宣传片等，见 references/ONBOARDING GUIDE.md）。如果用户上传了剧本，读取用户剧本；如果用户没有提供剧本，先问清用户是已有剧本还是只有一句创意——有创意就现写一版定稿剧本给用户确认，不要自动载入内置样例剧本。然后按P0到P6全流程引导制作。若判定为宣传片／广告／产品片／发布视频／功能演示／电视片等商业短片，先按 references/CHANNEL-SELECT GUIDE.md 报出通道倾向（生成通道 vs 代码渲染通道），再定规格。"
policy:
  allow_implicit_invocation: true

