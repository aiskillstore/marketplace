<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手绘口播 · 制作选择</title><style>
*{box-sizing:border-box}#wizard{width:min(1240px,96vw);max-height:94vh;border:0;border-radius:18px;padding:0;background:#f4f2ed}#wizard::backdrop{background:#26372d55}body{margin:0;background:#f4f2ed;color:#283431;font:16px/1.65 system-ui,sans-serif}main{max-width:1180px;margin:38px auto;padding:0 26px}h1{font-size:30px;margin-bottom:4px}p{margin:8px 0}.muted{color:#65736d}nav{display:flex;gap:9px;flex-wrap:wrap;margin:25px 0}nav span{padding:5px 13px;border-radius:20px;background:#e7e9e3}nav .active{color:white;background:#2f6251}section{background:white;border-radius:18px;padding:24px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{border:1px solid #dce2db;border-radius:12px;padding:12px;text-align:left;background:#fff;color:inherit;cursor:pointer}.card img{width:100%;height:170px;object-fit:contain;background:#f5f5f0}.card strong{display:block;margin:8px 0}button{font:inherit;cursor:pointer;border:1px solid #c8d3c9;border-radius:9px;padding:9px 16px;background:#eef3ef;color:#234f40}button:hover{background:#dae7dc}button:disabled{opacity:.5;cursor:default}textarea,input{font:inherit;width:100%;padding:12px;border:1px solid #becac0;border-radius:8px}textarea{min-height:100px}.actions{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap}.error{color:#a23929;min-height:26px}audio{width:100%;margin:8px 0}.note{font-size:14px;color:#60716a}.clock{font-variant-numeric:tabular-nums;color:#285b48}#zoom{border:0;border-radius:14px;max-width:90vw}#zoom img{max-height:75vh;max-width:80vw}.small{font-size:13px;padding:4px 10px}a{color:#346b56}pre{white-space:pre-wrap}#complete{display:none}.step-heading{display:flex;justify-content:space-between;gap:20px;align-items:center}@media(max-width:600px){main{margin:20px auto;padding:0 16px}.grid{grid-template-columns:1fr 1fr}.card{padding:8px}.card img{height:130px}section{padding:17px}h1{font-size:25px}}
</style><dialog id="wizard"><main><h1>开始制作前，按你的偏好选</h1><p class="muted">所有选项都可以跳过。每项最多等待 60 秒，随后采用模型根据内容预先选择的方案，继续下一项。广告和水印留空就是不加。</p><nav id="nav"></nav><section id="panel"><div class="step-heading"><h2 id="heading"></h2><span class="clock" id="clock"></span></div><p class="note" id="rationale"></p><div id="controls"></div><div class="error" id="error" role="alert"></div></section><section id="complete"><h2>选择已保存，继续制作</h2><p>模型将按已选方案完成画风解析、分镜和配音。你在聊天中追加的修改仍可在开始生成前合并。</p><div id="summary"></div></section><dialog id="zoom"><img id="zoomImage"><form method="dialog"><button>关闭大图</button></form></dialog></main></dialog><script>
document.getElementById('wizard').showModal();
document.getElementById('wizard').addEventListener('cancel',e=>e.preventDefault());
const data=__DATA__,token='__TOKEN__',names={style:'手绘风格',hand:'手臂 / 仅画笔',voice:'声音与音色',advertising:'笔杆广告',watermark:'浮动水印',captions:'字幕样式'};let stage=null;
const $=id=>document.getElementById(id);const make=(tag,text,cls)=>{const el=document.createElement(tag);if(text)el.textContent=text;if(cls)el.className=cls;return el};
async function choose(value){$('error').textContent='';const r=await fetch('/choice',{method:'POST',headers:{'Content-Type':'application/json','X-Options-Token':token},body:JSON.stringify({stage,value})});const v=await r.json();if(!r.ok){$('error').textContent=v.error;return}update(v)}
function action(text,value){const b=make('button',text);b.onclick=()=>choose(typeof value==='function'?value():value);return b}
function previewButton(src){const b=make('button','放大看图','small');b.onclick=()=>{$('zoomImage').src=src;$('zoom').showModal()};return b}
function show(next){stage=next;$('controls').replaceChildren();$('error').textContent='';$('heading').textContent=names[stage];$('rationale').textContent=(data.defaults.rationale||{})[stage]||'';
const box=$('controls'),actions=make('div',null,'actions');actions.append(action('采用模型建议，继续',data.defaults[stage]));
if(stage==='style'){const search=make('input');search.placeholder='搜索编号或画风名';box.append(search);const grid=make('div',null,'grid');box.append(grid);function cards(){grid.replaceChildren();data.catalog.styles.filter(s=>(s.id+' '+s.name).includes(search.value)).forEach(s=>{const c=make('div',null,'card'),img=make('img');img.src=s.preview;c.append(img,make('strong',s.id+' · '+s.name),action('选这个画风',{mode:'catalog',catalog_id:s.id}),previewButton(s.preview));grid.append(c)})}search.oninput=cards;cards();box.append(actions);const custom=make('textarea');custom.placeholder='输入你的画风描述';const modes=make('section');modes.append(action('不主动选择，由模型自动匹配',{mode:'catalog_auto'}),make('p'),action('不选择列表中的，模型推理产出',{mode:'inferred'}),make('p'),custom,action('自定义描述风格',()=>({mode:'custom',user_description:custom.value})));box.append(modes)}
else if(stage==='hand'){const grid=make('div',null,'grid');data.hands.forEach(h=>{const c=make('div',null,'card'),img=make('img');img.src='/hands/'+h.id;c.append(img,make('strong',h.name),action('选择',{preset:h.id}));grid.append(c)});box.append(grid,actions)}
else if(stage==='voice'){box.append(make('p','只保留这六款音色。逼真男声和逼真女声播放对应成片节选，其余四款提供同文试听。','note'));const grid=make('div',null,'grid');data.voices.forEach(v=>{const c=make('div',null,'card');c.append(make('strong',v.name),make('p',v.description,'note'));if(v.preview_available){c.append(make('p',v.preview_kind==='film_excerpt'?'成片节选':'同文试听','note'));const a=make('audio');a.controls=true;a.preload='none';a.src='/voices/'+v.id;c.append(a)}if(v.available)c.append(action('选这个声音',{voice:v.id}));else c.append(make('p','需导入对应原片参考后才能生成','note'));grid.append(c)});box.append(grid,actions)}
else if(stage==='advertising'||stage==='watermark'){const input=make(stage==='advertising'?'input':'textarea');input.placeholder=stage==='advertising'?'最多16个字符，例如品牌名或账号':'输入水印文字，可换行；留空不加';const count=make('p',null,'note');input.oninput=()=>{const n=Array.from(input.value).length;count.textContent=n+' 个字符'+(stage==='advertising'?' / 最多16':'');};box.append(input,count);actions.replaceChildren(action('不加，继续',{text:''}),action('使用这段文字',()=>({text:input.value})));box.append(actions)}
else if(stage==='captions'){box.append(make('p','按画面的可读性选择。简洁画面可用无背景字幕，复杂画面可用深色底板。'));actions.prepend(action('简洁文字 · 无背景',{mode:'quiet'}),action('白字 · 深色底板',{mode:'plate'}));box.append(actions)}
}
function describeChoice(k,v){if(k==='style'){if(v.mode==='catalog')return data.catalog.styles.find(s=>s.id===v.catalog_id)?.name||v.catalog_id;return {inferred:'模型独立设计',catalog_auto:'模型从画风库匹配',custom:v.user_description}[v.mode]}if(k==='hand')return data.hands.find(h=>h.id===v.preset)?.name||v.preset;if(k==='voice')return data.voices.find(x=>x.id===v.voice)?.name||v.voice;if(k==='captions')return v.mode==='plate'?'白字与深色底板':'简洁文字，无背景';return v.text||'不加'}
function update(s){$('nav').replaceChildren(...Object.entries(names).map(([k,v],i)=>make('span',(i<s.index?'✓ ':'')+v,k===s.stage?'active':'')));if(s.complete){$('panel').style.display='none';$('complete').style.display='block';$('summary').replaceChildren(...Object.entries(s.choices).map(([k,v])=>make('p',names[k]+'：'+describeChoice(k,v.value)+'（'+(v.reason==='timeout_default'?'等待结束，采用建议':'已选择')+'）')));return}if(stage!==s.stage)show(s.stage);$('clock').textContent=Math.ceil(s.remaining_seconds)+' 秒后继续'}
async function poll(){try{update(await(await fetch('/status')).json())}catch(e){$('error').textContent='等待本地选择服务响应。'}}poll();setInterval(poll,500);
</script></html>
