<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择手绘视频画风</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f4f1eb;color:#292824;font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}dialog{width:min(1180px,96vw);max-height:94vh;border:1px solid #d9d5cc;border-radius:18px;padding:0;box-shadow:0 20px 80px #0003}#picker[open]{display:flex;flex-direction:column;height:94vh}#picker header,#picker footer{flex-shrink:0}#picker .scroll{flex:1;min-height:0;max-height:none}dialog::backdrop{background:#34312e66}header{padding:24px 28px 16px;border-bottom:1px solid #e8e4dc}h1{margin:0;font-size:25px}p{margin:8px 0;color:#666}input[type=search]{padding:12px;width:100%;border:1px solid #cbc5ba;border-radius:8px;font:inherit}.scroll{padding:20px 28px;max-height:65vh;overflow:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{display:flex;flex-direction:column;gap:8px;border:2px solid #e6e1d8;border-radius:12px;padding:10px;cursor:pointer;background:#fff}.card:has(input:checked),.route:has(input:checked){border-color:#a44520;background:#fff9f2}.card img{width:100%;height:145px;object-fit:contain;background:#faf9f6;border-radius:7px}.name{font-size:14px;font-weight:600}.number{color:#a44520;margin-right:6px}.preview{font:inherit;font-size:12px;color:#6b655a;border:0;background:transparent;text-align:right;cursor:pointer}.routes{margin-top:26px;display:grid;gap:10px}.route{border:2px solid #e6e1d8;border-radius:10px;padding:14px;cursor:pointer}.route span{display:block;color:#68635a;font-size:14px;padding-left:24px}textarea{width:100%;min-height:100px;padding:12px;font:inherit;margin-top:10px}footer{padding:16px 28px;background:#faf8f3;display:flex;align-items:center;gap:18px;border-top:1px solid #e8e4dc}button.primary{background:#a44520;border:0;border-radius:8px;color:white;padding:12px 25px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}#status{font-size:14px}#zoom{max-width:94vw;padding:18px}#zoom img{display:block;max-width:85vw;max-height:78vh;object-fit:contain}.rule{font-size:13px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header,.scroll,footer{padding-left:16px;padding-right:16px}.card img{height:135px}h1{font-size:21px}footer{flex-direction:column;align-items:stretch}}
</style>
<dialog id="picker"><header><h1>先选画风，再制作视频</h1><p id="count"></p><input id="search" type="search" placeholder="搜索编号或画风名称" aria-label="搜索画风"></header><div class="scroll"><div id="styles" class="grid"></div><div class="routes">
<label class="route"><input type="radio" name="style" value="catalog_auto"> 不主动选择，由模型自动匹配<span>根据视频内容，从上面的画风中选择最合适的一种。</span></label>
<label class="route"><input type="radio" name="style" value="inferred"> 不选择列表中的，模型推理产出<span>不使用画风库配方，模型根据内容独立设计画风。</span></label>
<label class="route"><input type="radio" name="style" value="custom"> 自定义描述风格<span>画风只以你的描述为依据；内容决定画什么，不改变你指定的画法。</span><textarea id="description" hidden placeholder="描述你想要的线条、颜色、质感、人物或参考气质"></textarea></label>
</div><p class="rule">所有画风都先完成整幅轮廓，再按相同部位顺序填色；每笔独立起落。效果图用于展示画风，实际绘制方式仍须通过代表段检查。</p></div><footer><button id="confirm" class="primary" disabled>确认画风选择</button><span id="status">可选一种画风；60秒未选将由模型匹配后继续。</span></footer></dialog>
<dialog id="zoom"><button id="closeZoom">关闭大图</button><img alt="画风效果大图"></dialog>
<script>
const catalog=__CATALOG__, token="__TOKEN__", picker=document.querySelector('#picker');
document.querySelector('#count').textContent=`共 ${catalog.styles.length} 种画风；含独立编号 3.1。点击效果图下方可放大。`;
const grid=document.querySelector('#styles');
for(const entry of catalog.styles){const card=document.createElement('label');card.className='card';card.dataset.search=entry.id+' '+entry.name;
const image=document.createElement('img');image.src=entry.preview;image.alt=entry.id+' '+entry.name;image.loading='eager';
const line=document.createElement('div');line.className='name';const radio=document.createElement('input');radio.type='radio';radio.name='style';radio.value='catalog:'+entry.id;line.append(radio,document.createTextNode(' '+entry.id+' · '+entry.name));
const enlarge=document.createElement('button');enlarge.className='preview';enlarge.textContent='放大效果图';enlarge.type='button';enlarge.onclick=event=>{event.preventDefault();document.querySelector('#zoom img').src=entry.preview;document.querySelector('#zoom').showModal();};card.append(image,line,enlarge);grid.append(card);}
document.querySelector('#closeZoom').onclick=()=>document.querySelector('#zoom').close();
document.querySelector('#search').oninput=event=>{for(const card of grid.children)card.hidden=!card.dataset.search.toLowerCase().includes(event.target.value.toLowerCase());};
function update(){const chosen=document.querySelector('[name=style]:checked');document.querySelector('#description').hidden=chosen?.value!=='custom';document.querySelector('#confirm').disabled=!chosen||(chosen.value==='custom'&&!document.querySelector('#description').value.trim());}
picker.addEventListener('change',update);document.querySelector('#description').oninput=update;
document.querySelector('#confirm').onclick=async()=>{const value=document.querySelector('[name=style]:checked').value;const selection=value.startsWith('catalog:')?{mode:'catalog',catalog_id:value.slice(8)}:{mode:value};if(value==='custom')selection.user_description=document.querySelector('#description').value.trim();const status=document.querySelector('#status');try{const response=await fetch('/selection',{method:'POST',headers:{'Content-Type':'application/json','X-Picker-Token':token},body:JSON.stringify(selection)});const result=await response.json();if(!response.ok)throw Error(result.error||'保存失败');status.textContent='已保存。模型将按此选择继续制作。';}catch(error){status.textContent=error.message;}};
picker.addEventListener('cancel',event=>event.preventDefault());picker.showModal();
</script></html>
