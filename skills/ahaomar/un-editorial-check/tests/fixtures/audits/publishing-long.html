<!doctype html>
<html lang="en">
<head>
  <title>A page title that is deliberately longer than the sixty characters recommended for a search result</title>
  <meta name="description" content="A meta description that is far longer than the one hundred and sixty characters that any search engine would actually display in its results, so the audit reports it as too long">
  <link rel="canonical" href="https://other.test/page">
</head>
<body>
  <h1>First</h1>
  <h1>Second</h1>
  <p>The organisation publishes the report.</p>
</body>
</html>
