interface:
  display_name: "UN Editorial Check"
  short_description: "Read user-visible copy against United Nations editorial standards"
  default_prompt: "Use $un-editorial-check to read the requested copy the way a United Nations editor would: run its Node.js CLI, address error-severity findings first, work through AGENT REVIEW REQUIRED items, and report deterministic findings separately from editorial judgement."

policy:
  allow_implicit_invocation: true
