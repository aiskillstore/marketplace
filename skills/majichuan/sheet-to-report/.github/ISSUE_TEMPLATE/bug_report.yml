name: Bug report
description: Report a reproducible analysis, export, installation, or layout problem.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic or anonymized evidence only. Do not upload private workbooks, personal data, credentials, or confidential figures.
  - type: dropdown
    id: stage
    attributes:
      label: Affected stage
      options:
        - Installation or environment check
        - Data inspection or analysis
        - HTML report
        - Standard PPT
        - SlideViber-refined PPT
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and reproduction
      description: Include the first failing command or page and a minimal synthetic reproduction when possible.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Node, host AI tool, office software, and sheet format.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private, personal, confidential, and credential data.
          required: true