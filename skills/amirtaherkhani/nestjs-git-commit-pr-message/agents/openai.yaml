interface:
  display_name: "NestJS Git Commit and Pull Request"
  short_description: "Publish verified NestJS changes with safe Git history"
  default_prompt: "Inspect the current NestJS repository changes, verify the intended scope, scan staged content for secrets, and prepare the requested commit, push, pull request, or release text without performing unrequested remote actions."

policy:
  allow_implicit_invocation: true
