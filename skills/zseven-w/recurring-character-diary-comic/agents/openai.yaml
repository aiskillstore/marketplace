interface:
  display_name: "Recurring Character Diary Comic"
  short_description: "Create whole-page recurring-character diary comics"
  default_prompt: "Use $recurring-character-diary-comic to turn this anecdote and my authorized recurring-character reference into one coherent diary-comic page. Compare three structurally different page skeletons, generate the selected page as one image by default, increase prompt and QA attention for risky hands, relations, screens, and paper without silently splitting into panels, and inspect the exact final artifact at original resolution and 25%. Use deterministic lettering only when text alone fails, and disclose panel reconstruction as an explicitly accepted fallback. Do not publish it."
