name: 内容误判 / 限流反馈
description: 提交可复现的误报、漏报、处罚或推荐异常案例
title: "[内容反馈] "
body:
  - type: markdown
    attributes:
      value: |
        低播放不等于违规处置。请尽量提供原始证据；隐私信息可以脱敏，不要提交账号密码、手机号或未公开素材。

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - 抖音
        - 小红书
        - 微信视频号
        - 其他
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: 现象
      options:
        - Skill 误报
        - Skill 漏报
        - 平台明确处罚或删除
        - 只有播放或推荐异常，没有平台通知
        - 其他
    validations:
      required: true

  - type: textarea
    id: notice
    attributes:
      label: 平台通知原文
      description: 没有通知请明确写“无”，不要把自己的推测写成平台结论。
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: 内容与发布设置
      description: 提供标题、正文、封面/画面说明、话题、发布时间，以及 AI/营销/转载等自主声明。可脱敏。
    validations:
      required: true

  - type: textarea
    id: timeline
    attributes:
      label: 数据时间线与对照
      description: 写明发布后各时间点的播放、推荐或处罚变化；如有对照内容，说明除目标变量外还有哪些差异。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 希望本项目改进什么
      description: 例如新增规则、降低误报、补充诊断说明或增加测试案例。
    validations:
      required: true
