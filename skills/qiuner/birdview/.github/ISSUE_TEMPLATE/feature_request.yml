name: Feature request / 功能建议
description: Suggest an improvement / 提出改进建议
body:
  - type: markdown
    attributes:
      value: "A short idea is enough. No technical solution needed. Chinese or English is welcome. / 简单说说想法就行，不用设计技术方案，中英文都可以。"
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve? / 你希望改进什么？
      description: "Describe what you want to do or what feels inconvenient. / 说说你想完成的事，或哪里用起来不方便。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Examples or details (optional) / 示例或补充信息（选填）
      description: "A screenshot, reference or rough idea is welcome. / 可以附截图、参考案例或大致想法。"
