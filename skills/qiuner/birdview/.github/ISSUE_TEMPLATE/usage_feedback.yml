name: Usage feedback / 使用反馈
description: Share your experience without diagnosing the cause / 分享使用体验，不必先查明原因
body:
  - type: markdown
    attributes:
      value: "English or Chinese is welcome. Successful runs, inaccurate maps and installation problems all help. No private source code is needed. / 中英文均可，成功使用、地图不准确和安装问题都欢迎反馈，无需提供私有源码。"
  - type: textarea
    id: experience
    attributes:
      label: How did it go? / 用起来怎么样？
      description: "What did you want to do, and what happened? If it worked, tell us what helped. No diagnosis is needed. / 你想做什么，实际发生了什么？如果使用成功，也欢迎说说哪里有帮助。不需要分析原因。"
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Extra details (optional) / 补充信息（选填）
      description: "Your agent, a screenshot or a prompt can help. Skip this if you have nothing to add. Issues are public; remove secrets, personal information and private source code. / 可以补充使用的 Agent、截图或提示词，没有就留空。Issue 公开可见，请移除密钥、个人信息和私有源码。"
