name: Bug report / 问题反馈
description: Tell us what went wrong; no diagnosis needed / 说说哪里出了问题，不用先排查原因
body:
  - type: markdown
    attributes:
      value: "Just fill in the first box, in Chinese or English. We can ask for details later. Issues are public; omit secrets and private source code. / 只填第一项就能提交，中英文都可以。需要细节时我们再追问。Issue 公开可见，请勿附密钥或私有源码。"
  - type: textarea
    id: reproduction
    attributes:
      label: What went wrong? / 遇到了什么问题？
      description: "What were you trying to do, and what happened? A short description is enough. / 你想做什么，实际发生了什么？简单描述即可。"
      placeholder: "For example: the generated page is blank after I ask for a project map. / 例如：让 AI 画项目图后，生成的页面是空白的。"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra details (optional) / 补充信息（选填）
      description: "Screenshots, a prompt, an error message, your agent or version—share whatever you have. / 截图、提示词、报错、使用的 Agent 或版本，知道什么就补充什么。"
